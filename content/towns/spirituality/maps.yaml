# 엘리아(map.town.spirituality) — 영성의 마을 내부 28×20.
# 위쪽 `+` [1,1]로 대륙에서 들어오고, 남쪽 `<` [1,17]로 대륙(map.over)으로 나간다.
# 건물: 명상당(좌상), 서고(우상), 기숙사(좌하), 부엌(우하).
# 한가운데 뜰에는 면허를 설교하는 주지가 서 있고, 남동쪽 담 끝 [25,18]에 가짜 스님이 숨어 있다.
- id: map.town.spirituality
  rows:
    - "############################"
    - "#+.........................#"
    - "#..###########..#########..#"
    - "#..#.........#..#.......#..#"
    - "#..#.:=:.:=:.#..#.:==:..#..#"
    - "#..#.........#..#.......#..#"
    - "#..#####+#####..####+####..#"
    - "#..T....................T..#"
    - "#......::::::::::::::::....#"
    - "#......::::::::::::::::....#"
    - "#......::::::::L:::::::....#"
    - "#......::::::::::::::::....#"
    - "#..T....................T..#"
    - "#..###########..#########..#"
    - "#..#.........#..#.......#..#"
    - "#..#..:=:..:=#..#.:==:..#..#"
    - "#..#.........#..#.......#..#"
    - "#<.#####+#####..####+####..#"
    - "#.T...T...T...T...T....T...#"
    - "############################"
  exits:
    - { at: [1, 17], to: map.over, arrive: [6, 36] }
  music: music.spirituality
  encounters:
    - { at: [25, 18], id: enc.spirituality.fake-monk }
  enterFlags: [flag.town.spirituality]
  heals: true