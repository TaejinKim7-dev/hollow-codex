# 대륙 오버월드 지도 (map.over) + M2 스켈레톤 마을 스텁 7곳 (Task 22).
# map.over: 64×48 대륙. 지형 비용은 D20의 terrainCost를 따른다.
#   .=1  ,=2  :=2  ~=null  T=3  ^=null  ==1  o=null(고리 진입은 ringStep)  +=1  #=null
# `+` 마을 입구 8곳: 칼라스(map.field) + 미덕 마을 7곳(스텁, M3·M4에서 내부 채움).
# `o` 열석 고리 7개 + 칼라스 안쪽 1개(map.field) = 총 8 (D2).
- id: map.over
  isOverworld: true
  terrainCost:
    ".": 1
    ",": 2
    ":": 2
    "~": null
    T: 3
    "^": null
    "=": 1
    o: null
    "+": 1
    "#": null
