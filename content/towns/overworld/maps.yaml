#   .=1  ,=2  :=2  ~=null  T=3  ^=null  ==1  o=null(고리 진입은 ringStep)    #=null
# 마을 입구 8곳(집 정면 물건 + 문 앞 흙길 칸 p): 칼라스(map.field) + 미덕 마을 7곳(내부는 M3·M4에서 채움).
# `o` 열석 고리 7개 + 칼라스 안쪽 1개(map.field) = 총 8 (D2).
