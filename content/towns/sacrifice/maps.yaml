# 디오네(map.town.sacrifice) — 희생의 마을 내부 28×20.
# 위쪽 `+` [1,1]로 대륙에서 들어오고, 남쪽 `<` [1,17]로 대륙(map.over)으로 나간다.
# 건물: 성소(좌상), 기록실(우상), 치료소(좌하), 빵집(우하). 한가운데 큰 제단은 `=`로,
# 남동쪽 동산(o)과 나무(T) 사이 골목 [23,17]에 고행자 조우가 숨어 있다.
- id: map.town.sacrifice
  rows:
    - "############################"
    - "#+.........................#"
    - "#..########....########....#"
    - "#..#......#....#......#....#"
    - "#..#......#....#......#....#"
    - "#..#......#....#......#....#"
    - "#..###+####....###+####....#"
    - "#.....::::::::::::::::.....#"
    - "#.....::============::.....#"
    - "#.....::============::.....#"
    - "#.....::::::::::::::::.....#"
    - "#.....::::::::::::::::.....#"
    - "#....########....########..#"
    - "#....#......#....#......#..#"
    - "#....#......#....#......#..#"
    - "#....#......#....#......#..#"
    - "#....###+####....###+####..#"
    - "#<..........o.o......T..T..#"
    - "#..........o.o......o.....o#"
    - "############################"
  exits:
    - { at: [1, 17], to: map.over, arrive: [58, 30] }
  music: music.sacrifice
  encounters:
    - { at: [23, 17], id: enc.sacrifice.martyr }
  enterFlags: []
  heals: true