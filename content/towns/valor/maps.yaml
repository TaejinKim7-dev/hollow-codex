# 솔강(map.town.valor) — 용맹의 마을 내부 28×20.
# 위쪽 `+` [1,1]로 대륙에서 들어오고, 남쪽 `<` [1,17]로 대륙(map.over)으로 나간다.
# 건물: 병영(좌상), 주막(우상), 투기장(중앙), 대장간(좌하), 치료소(우하).
# 투기장 동쪽 골목 [25,18]에 떠돌이 결투가 조우가 숨어 있다.
- id: map.town.valor
  rows:
    - "############################"
    - "#+ggggggggggggggggggggggggg#"
    - "#gtg########gggg########ggt#"
    - "#ggg#gggggg#gggg#gggggg#ggg#"
    - "#ggg#gggggg#gggg#gggggg#ggg#"
    - "#ggg#gggggg#gggg#gggggg#ggg#"
    - "#ggg###+####gggg####+###ggg#"
    - "#gggggccccccccccccccccggggg#"
    - "#gggggggg####+#####gggggggg#"
    - "#gggggggg#cccccccc#gggggggg#"
    - "#gggggggg#cccccccc#gggggggg#"
    - "#gggggggg#cccccccc#gggggggg#"
    - "#gggggggg#cccccccc#gggggggg#"
    - "#gggggggg####+#####gggggggg#"
    - "#gggggccccccccccccccccggggg#"
    - "#gg##+###gggggggggg##+###gg#"
    - "#gg#gggg#gggggggggg#gggg#gg#"
    - "#<g#gggg#gggggggggg#gggg#gg#"
    - "#gt######gggggggggg######gt#"
    - "############################"
  exits:
    - { at: [1, 17], to: map.over, arrive: [10, 10] }
  music: music.valor
  encounters:
    - { at: [25, 18], id: enc.valor.duelist }
  enterFlags: [flag.town.valor]
  heals: true
