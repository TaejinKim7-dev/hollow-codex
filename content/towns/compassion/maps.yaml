# 리오나(map.town.compassion) — 연민의 마을 내부 28×20.
# 위쪽 `+` [1,1]로 대륙에서 들어오고, 남쪽 `<` [1,17]로 대륙(map.over)으로 나간다.
# 건물: 자선 관장의 회관(상단), 빵집(좌측), 예배당(우측). 광장은 가운데 `:`.
# 골목 동쪽 끝 작은 안뜰 [17,17]에 도적 조우가 숨어 있다.
- id: map.town.compassion
  rows:
    - "############################"
    - "#+.........................#"
    - "#..........########........#"
    - "#..........#......#........#"
    - "#..........#......#........#"
    - "#..........#......#........#"
    - "#..........##+#+###........#"
    - "#..........................#"
    - "#....########....########..#"
    - "#....#......#....#......#..#"
    - "#....#......#....#......#..#"
    - "#....#......#....#......#..#"
    - "#....##+#####....####+###..#"
    - "#..........................#"
    - "#.....:::::::::::::::......#"
    - "#.....:::::::::::::::......#"
    - "#..............###.#.......#"
    - "#<.............#...#.......#"
    - "#..............#####.......#"
    - "############################"
  exits:
    - { at: [1, 17], to: map.over, arrive: [50, 8] }
  music: music.compassion
  encounters:
    - { at: [17, 17], id: enc.compassion.robbers }
  enterFlags: []
  heals: true
