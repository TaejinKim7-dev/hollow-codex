    job:
      - text: npc.field.hunter.job.t
        grants: [fact.creature.wolf-hungry]
- id: npc.kalas.confessor
  map: map.kalas
  pos: [3, 12]
  name: npc.kalas.confessor.name
  greet: npc.kalas.confessor.greet
  sprite: [town, 84]
  topics:
    name:
      - text: npc.kalas.confessor.name.t
    job:
      - text: npc.kalas.confessor.job.guilty.t
        requiresFlags: [flag.visited-archive]
        excludeFlags: [flag.kalas.archive-asked]
        choice:
          - { id: option.confess-yes, label: option.confess-yes.label, text: option.confess-yes.text, setsFlags: [flag.kalas.archive-asked] }
          - { id: option.confess-no, label: option.confess-no.label, text: option.confess-no.text, deed: { virtue: honesty, deed: deed.lie }, setsFlags: [flag.kalas.archive-asked] }
      - text: npc.kalas.confessor.job.t
        grants: [word.confession, word.duty]
- id: npc.kalas.warden
  map: map.kalas
  pos: [16, 4]
  name: npc.kalas.warden.name
  greet: npc.kalas.warden.greet
  sprite: [town, 84]
  topics:
    name:
      - text: npc.kalas.warden.name.t
    job:
      - text: npc.kalas.warden.job.t
        grants: [word.ledger, word.trial]
    word.lantern:
      - text: npc.kalas.warden.lantern.t
        lie: true
    word.trial:
      - text: npc.kalas.warden.trial.witness.t
        requires: [fact.kalas.brother-witness]
        excludeFlags: [flag.kalas.warden-asked]
        choice:
          - { id: option.tell-warden, label: option.tell-warden.label, text: option.tell-warden.text, setsFlags: [flag.kalas.warden-asked] }
          - { id: option.deny-warden, label: option.deny-warden.label, text: option.deny-warden.text, deed: { virtue: honesty, deed: deed.lie }, setsFlags: [flag.kalas.warden-asked] }
      - text: npc.kalas.warden.trial.t
