# 칼라스 NPC 11명. 대사는 전부 content/strings/ko.yaml의 키로 참조한다.
- id: npc.field.gatekeeper
  map: map.field
  pos: [4, 7]
  name: npc.field.gatekeeper.name
  greet: npc.field.gatekeeper.greet
  sprite: [town, 84]
  topics:
    name:
      - text: npc.field.gatekeeper.name.t
    job:
      - text: npc.field.gatekeeper.job.t
        grants: [word.pilgrim]
    word.pilgrim:
      - text: npc.field.gatekeeper.pilgrim.t
        grants: [word.truth]
    fact.kalas.archive:
      - text: npc.field.gatekeeper.archive.t
- id: npc.field.hunter
  map: map.field
