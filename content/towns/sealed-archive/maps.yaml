# 봉인 서고 (map.sealed-archive) — 16×20, 중앙 제단 + 8쪽 벽감 (M5 Task 42, D2, D10).
# 타일: `#` 벽, `.` 마루, `+` 입구(북쪽), `<` 출구(남쪽), `>` 빈 페이지, `~` 제단.
# 입구는 칼라스 들판(map.field) [7,7]의 봉인석 `S`에서 봉인이 풀린 뒤 [8,1]로 들어선다.
- id: map.sealed-archive
  rows:
    - "########+#######"
    - "####.###.#######"
    - "##>#.#>#.#>##>##"
    - "##.#.#.#.#.##.##"
    - "#..............#"
    - "#..............#"
    - "#..............#"
    - "#....##..##....#"
    - "#....#....#....#"
    - "#....#.~~.#....#"
    - "#....#.~~.#....#"
    - "#....#....#....#"
    - "#....##..##....#"
    - "#..............#"
    - "#..............#"
    - "##.#.#.#.#.##.##"
    - "##>#.#>#.#>##>##"
    - "####.###.#######"
    - "#..............#"
    - "########<#######"
  exits:
    - { at: [8, 19], to: map.over, arrive: [14, 24] }
  music: music.archive
  encounters: []
  enterFlags:
    - flag.sealed-archive-opened
  heals: true
