# 헤론(map.town.humility) — 겸손의 마을 내부 28×20.
# 위쪽 `+` [1,1]로 대륙에서 들어오고, 남쪽 `<` [1,17]로 대륙(map.over)으로 나간다 (오버월드 [32,40] 링크 유지).
# 건물: 침묵 예배당(좌상), 서고(우상), 기숙사(좌하), 소리 없는 숲(우하).
# 한가운데 잔디 광장에 우물 `==`이 있고, 남동쪽 담 끝 [25,18]에 침묵의 파수꾼이 숨어 있다.
- id: map.town.humility
  rows:
    - "############################"
    - "#+.........................#"
    - "#..###########..#########..#"
    - "#..#.........#..#.......#..#"
    - "#..#.:=:.:=:.#..#.:==:..#..#"
    - "#..#.........#..#.......#..#"
    - "#..#####+#####..####+####..#"
    - "#..T....................T..#"
    - "#......::::::::::::::::....#"
    - "#......::::::==::::::::....#"
    - "#......::::::::::::::::....#"
    - "#......::::::::::::::::....#"
    - "#..T....................T..#"
    - "#..###########..#########..#"
    - "#..#.........#..#.T...T.#..#"
    - "#..#..:=:..:=#..#.T...T.#..#"
    - "#..#.........#..#.T...T.#..#"
    - "#<.#####+#####..####+####..#"
    - "#.T...T...T...T...T....T...#"
    - "############################"
  exits:
    - { at: [1, 17], to: map.over, arrive: [32, 40] }
  music: music.humility
  encounters:
    - { at: [25, 18], id: enc.humility.silencer }
  enterFlags: []
  heals: true