# 셀레스(map.town.justice) — 정의의 마을 내부 28×20.
# 위쪽 `+` [1,1]로 대륙에서 들어오고, 남쪽 `<` [1,17]로 대륙(map.over)으로 나간다.
# 건물: 예배소(좌상), 기록소(우상), 법정(중앙 좌), 감옥(중앙 우). 광장은 가운데 `:`.
# 공동묘지(남동)는 울타리 안 `o` 묘비, 입구는 [15,17] `+`. 묘지 안 [17,17]에 조문객 조우가 숨어 있다.
- id: map.town.justice
  rows:
    - "############################"
    - "#+.........................#"
    - "#..########....########....#"
    - "#..#......#....#......#....#"
    - "#..#......#....#......#....#"
    - "#..#......#....#......#....#"
    - "#..###+####....###+####....#"
    - "#..........................#"
    - "#....########....########..#"
    - "#....#......#....#......#..#"
    - "#....#......#....#......#..#"
    - "#....#......#....#......#..#"
    - "#....###+####....###+####..#"
    - "#..........................#"
    - "#.....:::::::::::::::......#"
    - "#.....:::::::::::::::......#"
    - "#..............#o.o#...o...#"
    - "#<.............+...o#..o...#"
    - "#..............#o.o#.......#"
    - "############################"
  exits:
    - { at: [1, 17], to: map.over, arrive: [40, 6] }
  music: music.justice
  encounters:
    - { at: [17, 17], id: enc.justice.mourner }
  enterFlags: []
  heals: true