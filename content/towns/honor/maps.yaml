# 아르곤(map.town.honor) — 명예의 마을 내부 28×20.
# 위쪽 `+` [1,1]로 대륙에서 들어오고, 남쪽 `<` [1,17]로 대륙(map.over)으로 나간다.
# 건물: 가문 저택(좌상), 기록관(우상), 검술 마당(좌하), 주막(우하).
# 한가운데는 서열이 새겨진 광장. 남동쪽 담 끝 [25,18]에 자랑질하는 결투가 조우가 숨어 있다.
- id: map.town.honor
  rows:
    - "############################"
    - "#+.........................#"
    - "#..########....########....#"
    - "#..#......#....#......#....#"
    - "#..#.:==:.#....#.:==:.#....#"
    - "#..#......#....#......#....#"
    - "#..###+####....###+####....#"
    - "#.....::::::::::::::::.....#"
    - "#.....:::::======:::::.....#"
    - "#.....:::::======:::::.....#"
    - "#.....::::::::::::::::.....#"
    - "#.....::::::::::::::::.....#"
    - "#..###+####....###+####....#"
    - "#..#......#....#......#....#"
    - "#..#......#....#......#....#"
    - "#..#......#....#......#....#"
    - "#..###+####....###+####....#"
    - "#<.........................#"
    - "#.T...T...T...T...T....T...#"
    - "############################"
  exits:
    - { at: [1, 17], to: map.over, arrive: [22, 18] }
  music: music.honor
  encounters:
    - { at: [25, 18], id: enc.honor.duelist }
  enterFlags: []
  heals: true