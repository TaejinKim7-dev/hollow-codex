compassion.creature.beggar.name: The Hungry Beggar

# --- Solgang, village of valor (M3 Task 34) ---
town.solgang.name: Solgang
valor.music.title: Solgang's Duelist

valor.npc.champion.name: The Undefeated Champion
valor.npc.champion.greet: I have never lost in this arena. When a challenger comes I stand to meet them — I do not step back.
valor.npc.champion.name.t: I need no name. Undefeated, the one the fighters gave me, is enough. On this sand, you have a name only while you stand.
valor.npc.champion.job.t: My work is standing. When a challenger comes I meet them, and I do not move my feet until one of us falls. That is the valor of this village.
valor.npc.champion.battle.t: Battle begins with not moving your feet. Step back once and everything falls apart. …That is how I was taught.
valor.npc.champion.arena.t: This arena's sand covers the names of the fallen. The crowd shouts only the name of the one still standing, and calls that courage.
valor.npc.champion.retreat-law.t: Retreat? A law that permits retreat? Solgang never had such a law. Cowards made it up to cover their backs.
valor.npc.champion.brother.t: I keep no comrades. Once, long ago, I was carried off a riverbank on someone's back. Since then I have trusted my back to no one.
valor.npc.champion.shield.t: I carry no shield. A spear and two feet are enough. …Carry a shield, and one day you'll have an excuse to turn around.
valor.npc.champion.battle-hymn.t: As for courage, the first lines of that song are enough. The enemy ahead, home behind — so you stand. Whatever comes after is better left unsung.

valor.npc.sergeant.name: Harr the Drillmaster
valor.npc.sergeant.greet: You wear a sword at your hip. But your feet are already stepping back. Here, we correct that stance first.
valor.npc.sergeant.name.t: I am Harr, the drillmaster. On the first day we make the newcomers forget how to fall back.
valor.npc.sergeant.job.t: My work is tending the barracks and making the young stand. …Lately there is more burying than standing.
valor.npc.sergeant.brother.t: A comrade is one who stands in the same line and holds together. When the one who held disappears, those remaining call his name.
valor.npc.sergeant.barracks.t: There are more empty places in the barracks. The armor still hangs on its pegs, but no one comes back from battle to wear it again.
valor.npc.sergeant.retreat.t: Inside the barracks door, I tell each one going out, low in his ear, to come back alive. Outside it, all I can say is don't step back. …Don't ask me which of the two is mine.
valor.npc.sergeant.champion.t: He was the first one I ever made stand. Came to the barracks at seventeen and dug his heels in from the first day. Back then I thought that was courage.
valor.npc.sergeant.retreat-law.t: If you want to speak of courage, you must know that law first. Don't bring it up outside the barracks. I grew up reciting it, and I once gave an order by it. That is exactly why I can't say it aloud.

valor.npc.smith.name: Bran the Blacksmith
valor.npc.smith.greet: Come to have a sword ground, or a shield mended? These days all this forge hears is blades on the wheel.
valor.npc.smith.name.t: Bran. I've been beating iron in this forge for forty years.
valor.npc.smith.job.t: I forge swords and I build shields. But fewer shields are ordered every year. Everyone means to stand facing forward, so nothing that guards the back seems worth having.
valor.npc.smith.shield.t: A shield isn't only for holding your ground. Sling it on your back when you turn, and it carries you all the way home. That's why the young ones now call it a coward's burden.
valor.npc.smith.forge.t: This furnace hasn't gone out in forty years. I used to sit up all night banding shield rims. Now the only things that keep me up are spearheads, and iron pins for the name stones.
valor.npc.smith.champion.t: I forged his spear. Reground the edge three times. He's never once brought me a shield. …He hasn't got one to bring.

valor.npc.brewer.name: Oren the Tavern Keeper
valor.npc.brewer.greet: Ah, you've come. Sit. Leave the cups turned down on that shelf alone—their owners aren't back yet.
valor.npc.brewer.name.t: They call me Oren. I've kept this tavern for thirty years.
valor.npc.brewer.job.t: I brew and I fill cups. Comrades used to pass one cup between them before they marched out. …These days I'd sooner pour for whoever comes home alive than for whoever wins.
valor.npc.brewer.brother.t: A comrade, a brother—there's no difference. You've shared a cup. These days the lads from the barracks are gone before there's time to share one.
valor.npc.brewer.barracks.t: The night before twelve lads from the barracks marched out last year, each turned a cup down here. Only three came back and set theirs upright. The other nine are still on that shelf.
valor.npc.brewer.veteran.t: Old Kel sits in that corner every evening with one cup and hums. He always stops at the same place. Then he drains the cup and goes.

valor.npc.child.name: Rupi, the Square Child
valor.npc.child.greet: Are you a fighter too? Going to be like the Undefeated uncle? I can't — the sword is still too heavy for me.
valor.npc.child.name.t: I'm Rupi. I run the fastest in the square.
valor.npc.child.job.t: My job is hanging on the arena fence and watching. If you don't step back till the end, everyone claps and says that's courage. …But lately none of the challengers win. They all fall.
valor.npc.child.champion.t: They say the Undefeated uncle has never lost. …But where did all his friends go? That's what I want to know.
valor.npc.child.retreat.t: What's retreat? Like running away in tag? …Mum says not to say that word outside.
valor.npc.child.battle-hymn.t: Courage? I know that song! The enemy's ahead, home's behind… but that's where everyone goes quiet. Nobody will teach me the end.

valor.npc.veteran.name: Kel the Old Soldier
valor.npc.veteran.greet: Just an old man with a bent back. These days remembering old songs is more my work than fighting.
valor.npc.veteran.name.t: Call me Kel. Once I carried a spear for this town.
valor.npc.veteran.job.t: Now my work is remembering songs and passing them on. There is a marching song the old soldiers sang — in this village only half of it remains.
valor.npc.veteran.retreat.t: Retreat… here they call it running. But the old song sang it differently—that stepping back to bring a wounded comrade home is courage too.
valor.npc.veteran.champion.t: It was me who carried that boy out of the ford when he was sixteen. He hasn't looked back once since. …My back's been bent since that day, too.
valor.npc.veteran.shield.t: The shield is in the song's first lines too—enemy ahead, home behind, raise your shield. …What it told you to do with that shield after, I just can't bring back.

valor.npc.scout.name: Sai the Scout
valor.npc.scout.greet: A stranger? What did you see outside the village? …These days the road home frightens me more than the road out.
valor.npc.scout.name.t: I'm Sai the scout. I keep watch beyond the walls.
valor.npc.scout.job.t: I ride the roads watching for bandits and beasts, and report to the barracks. …But lately what I find most is our own young, dead. Every wound is in the chest—even where there was a way back.
valor.npc.scout.duelist.t: I've seen the wandering duelist in the back lane. He doesn't fight to win—he fights to show how to stay alive. …This town won't learn it.
valor.npc.scout.retreat.t: A scout's job is to look and then fall back. So the barracks think I'm half a coward. …It's that coward who tells them where not to go.
valor.npc.scout.blood.t: The blood trails on the road always lead outward. It's been a long time since I saw one leading home.

valor.npc.healer.name: Asha the Healer
valor.npc.healer.greet: If you're hurt, show me. …You look whole. That's rare in this town.
valor.npc.healer.name.t: My name is Asha. I stitch wounds and set bones at the infirmary.
valor.npc.healer.job.t: I stitch wounds. This town teaches that a wound in the back is the most shameful kind, but to me it's the most welcome. These days the only ones who come in bleeding from the back are the young who met the wandering duelist in the east lane.
valor.npc.healer.blood.t: Blood can't lie. Blood from the back means someone turned and ran, which means someone was waiting at home. I hear that duelist never fells anyone—he just sends them back.
valor.npc.healer.champion.t: He has never come to this infirmary. Not because he has no wounds—he simply won't show them. He favors his left leg a little, and it looks like a very old wound.
valor.npc.healer.brother.t: They say there was a time when the one carried in and the one who carried him were laid side by side and stitched together. I have never once seen such a pair.

valor.npc.standard.name: Dain the Standard-Bearer
valor.npc.standard.greet: This banner is raised only when we go forward. …When we go back, they say there is no reason to raise it.
valor.npc.standard.name.t: I am Dain the standard-bearer. I plant this banner in the arena.
valor.npc.standard.job.t: I plant the banner in the arena, and when a fighter falls I lay it over him. Harr the drillmaster taught me how to fold it. …One day I'd like to hand this banner back to someone who came home alive.
valor.npc.standard.courage.t: The bearer before me said courage isn't charging with the banner out front. It's keeping the banner safe once the battle is over, and bringing it home.
valor.npc.standard.retreat.t: They say the old bearers raised the banner highest when falling back, so the scattered could find their way home by it. Now people say there's no reason to raise it then.
valor.npc.standard.arena.t: The hole I plant the pole in grows deeper in the arena sand every year. I've planted the same banner in the same spot too many times.

valor.npc.widow.name: Sirin the Widow
valor.npc.widow.greet: …Did you come to speak of my husband, or to see the shield?
valor.npc.widow.name.t: They call me Sirin. I am someone who lost a husband in this village.
valor.npc.widow.job.t: I used to stitch shield leather. Now I live remembering the promise my husband kept to the end—never to take a step back. …And yet they say there was once a law that let a man fall back.
valor.npc.widow.retreat-law.t: On retreat — it held until my husband's father's day—a law that no one who carried a wounded comrade home would be called a coward. After it was erased, my husband went out leaving his shield at home, and it still hangs beside the door.
valor.npc.widow.shield.t: I polish my husband's shield every day. The leather grip is still new. It has never once been carried out the door.
valor.npc.widow.brother.t: One of the three who came back last year stood in the same line as my husband. He still can't meet my eyes. I don't blame him—I'm only grateful he came home.
valor.npc.plasterer.name: Toban the Plasterer
valor.npc.plasterer.greet: Oh, a visitor? Don't touch the wall here—the plaster's still wet. …It's been wet for twenty-five years.
valor.npc.plasterer.name.t: I'm Toban. I've plastered nearly every wall in Solgang. This barracks wall was the first job I was ever given.
valor.npc.plasterer.job.t: I lay plaster. But one patch of this wall I redo every year. After it rains, something like lines shows through underneath.
valor.npc.plasterer.barracks.t: When I first covered it, there were letters carved there. I couldn't read, so I covered it as I was told. …Back then I thought not being able to read was a mercy.
valor.npc.plasterer.sergeant.t: The drillmaster only slows down in front of that spot. When a recruit is heading out, he always stands him before that wall and whispers something.
valor.npc.oldwoman.name: Una of the Lower Village
valor.npc.oldwoman.greet: A stranger, is it. You smell of the river—come by the ford? …There's nothing left there now but stones.
valor.npc.oldwoman.name.t: I'm Una. I used to live in the lower village down by the river. It's twenty-five years since it was gone and I came up here.
valor.npc.oldwoman.job.t: My work? Sitting here on sunny days. When the arena roars, I count—how many cheers, and how many silences.
valor.npc.oldwoman.retreat.t: The night the lower village burned, the boys holding the ford fell back carrying their wounded. In that time the fire crossed the river. …It wasn't their fault—there were just too few to stop it.
valor.npc.oldwoman.champion.t: One of the boys carried up that night is standing in the middle of that arena now. He's never looked us old folk in the face since. And we never once blamed him.
valor.npc.bookie.name: Gos the Bookmaker
valor.npc.bookie.greet: Care for a wager? I don't take bets on the Undefeated winning. You bet on how many breaths the challenger lasts.
valor.npc.bookie.name.t: I'm Gos. I've run my book outside the arena wall for ten years. They won't let me inside—I'm a merchant.
valor.npc.bookie.job.t: I take bets and pay out. One share of every pot always goes to the families of the fallen. …It's the only way I feel I'm allowed to do this.
valor.npc.bookie.arena.t: The number people bet on most goes up every year. The challengers hold out longer. And the longer they hold, the worse they're hurt when they come out.
valor.npc.bookie.blood.t: Some want to bet on whose blood hits the sand first. I won't take those. Even I have a line I keep.
valor.npc.recruit.name: Tan the Recruit
valor.npc.recruit.greet: Excuse me, I'm drilling my stance! If my feet move, I have to start over from the beginning.
valor.npc.recruit.name.t: Tan. I'm seventeen, three months in the barracks. Next month I stand in the arena.
valor.npc.recruit.job.t: Holding is my duty. Never lifting my heels off the ground, even with the soles of my feet split open. …At night my legs shake too much to sleep.
valor.npc.recruit.champion.t: Becoming like him is everyone's dream in the barracks. …To be honest, I've never once seen him smile.
valor.npc.recruit.shield.t: My mother offered to have a shield made for me, and I said no. The others would laugh. …Still, I've seen her lingering outside the forge.
valor.npc.carver.name: Dowin the Stonecutter
valor.npc.carver.greet: Passing through? Mind you don't tread on these stones. Each one has a name on it.
valor.npc.carver.name.t: Dowin. I've grown old carving names into stone.
valor.npc.carver.job.t: The arena sand covers the names of the fallen, but I carve them into stone. Since no one speaks them aloud, the stone at least ought to remember.
valor.npc.carver.barracks.t: I carved nine last year alone. They marched out of the barracks on the same day, so I set them side by side. They stood in one line, after all.
valor.npc.carver.brother.t: Among the old stones are some with two names on one—comrades who fell together, each dragging the other home. The new stones carry one name apiece.

# --- Solgang clues ---
valor.word.courage.label: Courage
valor.word.courage.hint: The song's last line sings this word.
valor.word.retreat.label: Retreat
valor.word.retreat.hint: The old law and the old song call this word differently.
valor.word.shield.label: Shield
valor.word.shield.hint: What those who returned take up again.
valor.word.battle.label: Battle
valor.word.battle.hint: What the undefeated champion has given his life to. He was taught it begins with holding your ground.
valor.word.blood.label: Blood
valor.word.blood.hint: What flows even from a wound on the back. The trace the healer most welcomes.
valor.word.brother.label: Comrade
valor.word.brother.hint: One who stands in the same line and holds. They say it is a bond of shared cups — but now there is no one left to share one with.
valor.fact.solgang.champion.label: The Undefeated Champion
valor.fact.solgang.champion.hint: A man never defeated in the arena. He cries to fallen challengers not to step back.
valor.fact.solgang.sergeant.label: Harr the Drillmaster
valor.fact.solgang.sergeant.hint: One who tends the barracks and makes the young stand. He knows the words he cannot say outside the gate.
valor.fact.solgang.veteran.label: Kel the Old Soldier
valor.fact.solgang.veteran.hint: An old soldier who remembers only half of an old marching song. He lost the last line.
valor.fact.solgang.smith.label: Bran the Blacksmith
valor.fact.solgang.smith.hint: "A maker of swords and armor. They say orders for anything that guards the body have dwindled of late."
valor.fact.solgang.arena.label: Solgang's Arena
valor.fact.solgang.arena.hint: A sand floor that erases the names of the fallen and keeps only the name of the one standing.
valor.fact.solgang.barracks.label: The Barracks
valor.fact.solgang.barracks.hint: Where the armor stays but the ones to fill it dwindle. Last year only three of twelve came home.
valor.fact.solgang.forge.label: The Forge
valor.fact.solgang.forge.hint: A furnace that never dies. What is forged there changes year by year.
valor.fact.solgang.battle-hymn.label: The Old Marching Song
valor.fact.solgang.battle-hymn.hint: An old song Solgang's soldiers once sang on the march. The first lines sing of the enemy ahead, the later ones of home behind. But no one sings the final line anymore.
valor.fact.solgang.retreat-law.label: The Vanished Retreat Law
valor.fact.solgang.retreat-law.hint: An old law that did not call a man a coward for bringing a wounded comrade home. It vanished somewhere along the way.
valor.fact.creature.valor-duelist.label: The Wandering Duelist
valor.fact.creature.valor-duelist.hint: Not evil. He fights not to win, but to show the way to come back alive.

# --- Solgang deduction and crisis ---
valor.deduction.valor.sentence: True {1} is not holding out to the last, but making a {2}, coming home alive, and raising the {3} again
valor.deduction.valor.hint: What the arena shouts is not what the old soldier's half-remembered song and the widow's old law point to.
valor.crisis.challenge.text: People gather in the arena. A young challenger kneels bleeding, and the undefeated champion levels his spear, shouting not to step back. The challenger gasps, tries to rise, and falls again. The crowd holds its breath; the drillmaster turns his head. Then the old soldier begins to sing, low. Now it is your turn to step forward.
valor.option.allow-retreat.label: Sing the old marching song and declare that retreat is also courage
valor.option.allow-retreat.text: You sing the old soldier's song. If the enemy is ahead and your home behind, raise your shield. Then you take up the lost last line. The one who lifts a shield and comes home is the brave one. One by one the crowd joins in, and the undefeated champion slowly lowers his spear. The challenger walks out on his own feet, not dragged. For the first time, the name of one who returned is written in the arena sand. Solgang learns that valor lies not in refusing to step back, but in coming home and standing again.
valor.option.duel-honor.label: Challenge the undefeated champion to a duel yourself
valor.option.duel-honor.text: "You raise a spear and challenge him. The undefeated champion laughs — he has waited long for such a challenger. The spears clash, and you stop the final blow. The moment you draw your spear back from his throat, the crowd stirs. The Undefeated kneels and says: I learned how to win, but never how to stop. You reach out a hand and raise him to his feet. The village sees that the one who lifts others up is honored more than the one who wins."

# --- Solgang abilities and creatures ---
valor.ability.shield.name: Raising the Shield
valor.creature.duelist.name: The Wandering Duelist

# --- Seles, village of justice (M3 Task 35) ---
town.seles.name: Seles
justice.music.title: Seles's Verdict

justice.npc.judge.name: Halden the Judge
justice.npc.judge.greet: This is the court of Seles. Stand in one line. Custom allows no exceptions.
justice.npc.judge.name.t: I am Halden. For thirty years I have handed down this court's verdicts. In Seles, the custom before a grave comes before the name of the living.
justice.npc.judge.job.t: My work is to keep the custom and hand down punishment. During mourning no one may sing, and whoever does takes the lash. Custom guards the village. That is justice.
justice.npc.judge.law.t: Law is rooted in custom. Sing during mourning, and it is the lash. Take anything out from before a grave, and it is exile. Our law has no clause for feeling.
justice.npc.judge.punishment.t: Punishment is the fire that makes people remember custom. Forty lashes, and no sentence is ever lessened. That is what Seles calls justice.
justice.npc.judge.compassion.t: Compassion is a word unfit for this court. If punishments shrink, everyone will try to shake the custom. I am the one who stops that shaking.
justice.npc.judge.lullaby.t: A lullaby? Singing, during mourning? That is an insult to custom. The widow Harin will not escape punishment.
justice.npc.judge.mourner.t: The young man seen at the grave is a thief. The witness has already stood. The punishment is fixed.
justice.npc.judge.graveyard.t: The clause that no one may stay at the graves after dark, I wrote it first. Thirty years ago, one winter, I carried a man down from a grave where he had kept vigil all night. He was already cold.
justice.npc.judge.fairness.t: Fairness is the same punishment for everyone. Had it been my own blood, I would have handed down the same verdict.

justice.npc.clerk.name: Kasel the Court Clerk
justice.npc.clerk.greet: Testimony stays in the record. Speak quietly, and exactly.
justice.npc.clerk.name.t: I'm Kasel, the clerk who takes down testimony and verdicts in this court.
justice.npc.clerk.job.t: I write the trial records. Three sheets of verdicts again today, every one of them the lash or exile. I used to be proud of my hand. Lately I'm afraid of what it counts.
justice.npc.clerk.law.t: The law is already written. The mourning prohibitions, the punishment table, the clause that forbids any lessening. The judge says he only reads the record, but take it from the man who writes it — a record is never that simple.
justice.npc.clerk.punishment.t: There are three punishments. The lash, exile, and kneeling before a grave. Kneeling is the lightest. …The children call it turning your back, since the one kneeling shows his back to the village. That name keeps troubling me.
justice.npc.clerk.harsh.t: Fairness… look at these records. Six people broke the mourning last month. The one who sang, the one who left flowers on a grave, all six took forty lashes. My hand shakes every time I write that number.
justice.npc.clerk.prisoner.t: …The youth in the cell. I didn't write his name. The judge told me to write only 'thief.' A charge passing judgment before the truth does — in twenty years of clerking, I've never seen it.
justice.npc.clerk.judge.t: Twenty years I've taken down the judge's words. His voice has never once shaken reading a verdict. …Except in winter. His winter verdicts always come a little faster.
justice.npc.clerk.truth.t: The truth? My work is to write what I hear, not to sort out the truth from it. …At least, that's what I've always believed.

justice.npc.widow.name: Harin the Widow
justice.npc.widow.greet: …Did you hear a lullaby? I'm sorry, I mustn't sing during mourning. Each night it slips out of my mouth without my meaning to.
justice.npc.widow.name.t: I'm Harin. I buried my husband a month ago. The people of Seles call me the singing widow.
justice.npc.widow.job.t: While my husband lived, I wove cloth. Now… every day I go to the grave, pull the weeds, and sweep the stone. At night the lullaby comes out of me on its own. Mourning isn't something you do. It settles into your body.
justice.npc.widow.compassion.t: Here, even holding someone who weeps breaks the mourning. To ease grief is to honor the dead less, they say. So when people see someone crying, they look away.
justice.npc.widow.lullaby.t: It's the lullaby my husband and I sang to put Iren to sleep. Every mother in Seles knows it, but I sing it with one word changed — grave, instead of window. …Let them flog me. The nights I don't sing frighten me more.
justice.npc.widow.prisoner.t: You mean my son. He went to his father's grave every night. He found a necklace my husband had hidden for me in the stones by the grave, and he was polishing it, I think. A witness saw him and called him a thief. My son tells the truth, but here custom comes before truth.
justice.npc.widow.truth.t: The truth is… the night my husband died, I didn't cry. I kept the rites and said nothing. But the woman who sings now is truer than the woman of that night. That night, mourning had the truth locked away.
justice.npc.widow.mourning-duty.t: As for the law — they say mourning used to mean closing your door for a hundred days. Somewhere along the way it became a list of prohibitions. Don't cry, don't sing, only kneel before the grave. No one will say how it changed.
justice.npc.widow.graveyard.t: My husband laid the border stones around his grave himself, when he was young. A mason shapes his own resting place, he said. I laughed at him then.
justice.npc.widow.mason.t: Duman was my husband's teacher. On the day of the funeral he stood at the stone a long while, holding his chisel. Without a word.
justice.npc.widow.love.t: Love… my husband wasn't a man of many words. Instead he'd carve a pattern into a small stone and leave it on the doorstep without saying anything.

justice.npc.prisoner.name: Iren the Imprisoned Youth
justice.npc.prisoner.greet: …I'm sorry. I'm afraid that anything I say will be written down as a thief's words.
justice.npc.prisoner.name.t: I'm Iren. My mother is Harin, and my father was a stonemason. …After he died so suddenly, keeping watch at his grave by night fell to me.
justice.npc.prisoner.job.t: I learned to work stone in my father's workshop. Now I just sit alone in this cell. Father used to say that if you touch stone, you can see the truth.
justice.npc.prisoner.truth.t: I told them exactly what happened that night. One of the border stones my father laid around the grave was loose, and under it was my mother's necklace, wrapped in cloth. It had tarnished, so I was polishing it, that's all. But the judge made the record say 'thief' first.
justice.npc.prisoner.fairness.t: If it were fairness, my father's work and my mother's song would both be laid on the same scale. But Seles's scale gives the punishment first and weighs afterward.
justice.npc.prisoner.widow.t: My mother sings the lullaby at the grave every night, even after song was forbidden, until her voice gives out. I can hear it through this window. That song keeps me.
justice.npc.prisoner.mourner.t: That mourner? He was my father's old friend. He paces by the grave every night to guard it, and in the dark he didn't know me and shouted thief. Grief covers a person's eyes, I suppose.
justice.npc.prisoner.mason.t: Duman taught my father stone, and my father taught me. Last night he slipped a chisel to me through the bars. Idle hands let the heart spoil first, he said.
justice.npc.prisoner.judge.t: I don't hate the judge. But when he gave the verdict, he never once looked straight at me. That frightened me more.

justice.npc.witness.name: Kain the Witness
justice.npc.witness.greet: I'd stake both my eyes on it. I saw that night clearly.
justice.npc.witness.name.t: Kain. I keep the cobbler's shop here. These days I stand witness in court more and more often.
justice.npc.witness.job.t: I make shoes, and at night I keep watch over the village. Anyone who heads toward the graves, I write down. …I don't know when that became my job.
justice.npc.witness.law.t: Where there is law, there are witnesses. I only tell what I saw. The sound of singing during mourning, the shadows passing in and out of the graves. The law told me to keep an eye on those.
justice.npc.witness.punishment.t: Punishment isn't frightening — it is order. After the lashes, everyone remembers the custom. I believe punishment corrects people.
justice.npc.witness.mourner.t: I saw the youth Iren holding something gleaming at the grave. If he wasn't a thief, what would he be seeking at a grave? …But thinking on it now, it did look like a necklace. If it was his mother's?
justice.npc.witness.graveyard.t: A few years back, the ring I'd left at my wife's stone went missing. Since then I watch the graveyard every night. When something glints by a grave, the first thing I think is that someone took it.
justice.npc.witness.truth.t: The truth? I said what I saw. …Lately, resoling boots, I keep thinking that what you see and what happened aren't always the same.

justice.npc.child.name: Rine the Square Child
justice.npc.child.greet: The adults only ever say be quiet, so I can't sing. But you look okay, don't you?
justice.npc.child.name.t: I'm Rine. A child born in this village. I know more songs than anyone in Seles.
justice.npc.child.job.t: My job is remembering songs! In the square, near the graves, I listen when the grown-ups hum in secret and learn them all. …The grown-ups don't sing anymore, so now all the songs are mine.
justice.npc.child.lullaby.t: The widow's lullaby? I know it! The moon lights the grave, and I sing your lullaby. It used to be window, not grave. The judge mustn't catch her… but I like that song.
justice.npc.child.love.t: Love? That's… singing at a grave. The song my mom sings to put me to sleep and the one the widow sings to her husband are the same song. Singing even when they tell you not to. Is that love?
justice.npc.child.widow.t: The widow is kind, so why does she get punished? If singing is a crime, I'm a criminal too, and nobody punishes me. She keeps getting punished because she's a grown-up.
justice.npc.child.graveyard.t: At night candles get lit in the graveyard. Grandpa Ostan lights them one by one, even on graves nobody visits. He says those are the most.
justice.npc.child.punishment.t: The men who got the lash walk funny for a while. So on the road we don't cut in front of them. We walk slowly behind.

justice.npc.priest.name: Serno the Priest
justice.npc.priest.greet: Peace be with you. This shrine stood before the graveyard did, yet I too live by the rules of mourning.
justice.npc.priest.name.t: I am Serno. I keep this shrine, and the old records of mourning.
justice.npc.priest.job.t: I tend the old records and prepare the words for the mourning rites. …But some year or other, the word forbidden began to multiply in them. Do not weep, do not sing, do not transgress.
justice.npc.priest.mourning-duty.t: On the law — the old records of mourning held no punishment. For a hundred days the family kept its door shut, neighbors brought meals, and at night they sat together and talked. It was no season for punishment.
justice.npc.priest.comfort-widow.t: You mean the widow. Comfort is not teaching. It is sitting beside the grave and hearing out the song being sung. If you hear that song and sit beside her, the punishment will lose its power.
justice.npc.priest.compassion.t: Compassion is thought to lessen punishment, but truly it is suffering together. The old records say that if justice is the scale, compassion is the hand that holds it.
justice.npc.priest.harsh.t: As for punishment — its outweighing custom is a recent thing. Forty lashes for one song — in the old days it wouldn't have earned a scolding. That punishment has frightened people, and now no one weeps at a grave.
justice.npc.priest.judge.t: Halden and I played at the same stream as boys. I remember the winter he wrote his first clause. …I never did find the words to hold him back that day.
justice.npc.priest.court.t: I've been called to the court many times, but never once carried the old records with me. No one asked. …I know that's my excuse.

justice.npc.mason.name: Duman the Mason
justice.npc.mason.greet: I raise gravestones. Stone won't take a lie, which is why my trade still holds in this village.
justice.npc.mason.name.t: I'm Duman. I work the stone for this village's gravestones and house foundations.
justice.npc.mason.job.t: My work was carving the names of the dead. These days I carve one more line beneath them — someone broke the mourning before this grave. The speed at which words pile up on stone frightens me.
justice.npc.mason.law.t: Law… ought to be like stone. It should carry weight, hold fast, and hold no lies. Today's law isn't stone but mud. Rain reshapes it.
justice.npc.mason.harsh.t: Fairness? Last month I carved that line six times. For one who sang, one who left flowers, one who stayed past dark. A law that cuts the living's faults into the stones of the dead. …This village punishes the living with stones meant for the dead.
justice.npc.mason.comfort-widow.t: The widow, you mean. There is still hope. The stone of Harin's husband still reads only 'rests here.' The order came to carve another line beneath it, but I've been telling them my chisel has gone dull.
justice.npc.mason.graveyard.t: The border stones on Harin's family plot, Harin's husband laid them as a young man. As I taught him, he left one stone that could be lifted out. Masons tend to keep something small in such a place.
justice.npc.mason.punishment.t: Punishment… set the chisel wrong and the stone cracks. Once cracked, it can't be filled. The judge doesn't seem to know people are the same.

justice.npc.scribe.name: Bela the Scribe
justice.npc.scribe.greet: I keep the punishment table in the archive. …Between the documents and the spoken word, I can no longer tell which is true.
justice.npc.scribe.name.t: I'm Bela, the scribe who copies the court's verdicts and the mourning records into the archive.
justice.npc.scribe.job.t: Every day I sort the punishment records. Yesterday, forty lashes for one song. Today, a kneeling for nothing more than lingering at a grave after dark. The numbers are honest. The law that sets them is not.
justice.npc.scribe.truth.t: I was taught that records hold the truth. Now the records make it. Write 'thief' and he is a thief; write 'mourner' and he is a mourner. The same night, the same grave, the same youth, and one word decides which man he is.
justice.npc.scribe.prisoner.t: I read the youth's record again. The charge reads 'thief,' but nowhere in the body does it say he stole anything. Only that he was at a grave by night, holding something in his hand.
justice.npc.scribe.harsh.t: As for the numbers of the law — the numbers on the punishment table grow every year. Lashes for breaking mourning, exile for taking anything from a grave. The more they pile up, the quieter the village grows, and the more afraid I am of writing them.
justice.npc.scribe.fairness.t: The punishment table has no column for names. Anyone at all, the same row, the same number. They call that fairness, but sometimes that blank column frightens me.
justice.npc.scribe.court.t: When a verdict comes up from the court, I copy it again upstairs. Kasel's hand is always straight, but lately the last stroke of each letter trembles a little.

justice.npc.gravedigger.name: Ostan the Gravedigger
justice.npc.gravedigger.greet: This is where the dead live. The living should come quietly, and without lies.
justice.npc.gravedigger.name.t: They call me Ostan. I dig and keep the ground of this graveyard.
justice.npc.gravedigger.job.t: I dig graves, light candles, and walk my rounds at night. …But lately the living come by night more often. Afraid of punishment, they come as soundless as the dead.
justice.npc.gravedigger.mourner.t: That mourner… he weeps at a grave every night, and when he sees a stranger he blocks the way, crying thief. Grief blinds a person like that. He isn't wicked. He's someone drowning in mourning.
justice.npc.gravedigger.compassion.t: I learned compassion like this. When I go to dig a grave and find someone keening, I'm the one who should smile first. The dead just lie there and need nothing. It's the living who need comfort.
justice.npc.gravedigger.lullaby.t: That lullaby… I hear it every night, carrying between the graves. The judge forbade it, but as I see it that song harms no one. If anything, it keeps me company.
justice.npc.gravedigger.prisoner.t: Iren is no thief. I saw him every night — kneeling before the grave, polishing the stone, listening to the lullaby. That necklace was what the dead man left his wife, and the son was finding it to return to his mother.
justice.npc.gravedigger.judge.t: The judge comes too. Before sundown, to an old grave at the north end. Leaves no flowers, doesn't kneel. Just stands there a long while, then goes.
justice.npc.gravedigger.law.t: The law says leave the graves at sundown, but night is when the dead are loneliest. That's why I light the candles.
justice.npc.silversmith.name: Niel the Silversmith
justice.npc.silversmith.greet: If you've a clasp to mend, leave it with me. These days everyone just keeps their jewelry in a drawer, so my hands are idle.
justice.npc.silversmith.name.t: I'm Niel. By the square I solder silver clasps and mend broken chains.
justice.npc.silversmith.job.t: I mend small things. Last spring a stonemason brought in a pendant he'd cut from stone himself and asked me to fit it with a silver clasp. When I asked who it was for, he only smiled.
justice.npc.silversmith.love.t: Love? People pick the costly thing, but what lasts is what's made by hand. That mason's pendant had more care in the stone than in the silver.
justice.npc.silversmith.witness.t: Kain suspects anything that glitters. Ever since his late wife's ring went missing. Even when he brings me a clasp to fix, he always asks where I got the silver.
justice.npc.old-neighbor.name: Orma of the Graveyard Wall
justice.npc.old-neighbor.greet: I'm an old woman who doesn't sleep. At night I sit by the window and look out toward the graves.
justice.npc.old-neighbor.name.t: They call me Orma. I've lived beside this graveyard wall for sixty years.
justice.npc.old-neighbor.job.t: I don't sleep, so I keep the night. Every sound from the graves reaches this window. Who weeps, who sits a long while before going.
justice.npc.old-neighbor.witness.t: What Kain saw, I heard. That night, the sound from the graves was not digging. It was something rubbing on stone, and a very low hum.
justice.npc.old-neighbor.graveyard.t: In the old days, for a hundred days the candles stood in rows in that graveyard every night. Halden came too as a boy, holding his elder brother's hand and a candle. …An old woman talks too long.
justice.npc.scale-keeper.name: Haim the Scale Inspector
justice.npc.scale-keeper.greet: I'm Haim, inspector of the market scales. Before anything else, I check that the needle stands in the middle with the pans empty.
justice.npc.scale-keeper.name.t: I'm Haim. Once a month I inspect the scales in the Seles market.
justice.npc.scale-keeper.job.t: I set the weights on, and I look at the empty pans too. A crooked scale fools the merchant before it fools the buyer. He never knows the needle is off, and believes all his life that he sold honestly.
justice.npc.scale-keeper.fairness.t: A fair scale holds no grudge against the heavier side. It only tells the weight. I think verdicts should be the same, but scales are all I look at.
justice.npc.scale-keeper.law.t: There's a painting of a scale on the courthouse wall. But one of its pans has had a weight painted in it from the start. No one finds that strange.
justice.npc.keener.name: Eda the Keener
justice.npc.keener.greet: I used to keen for the dead. Now I scrub the shrine floor. It's work that makes no sound.
justice.npc.keener.name.t: I'm Eda. I was a keener, the one who wept aloud at funerals in place of the family.
justice.npc.keener.job.t: Weeping for those who couldn't was my work. Since keening was forbidden, my voice has nowhere to go. Sometimes in the empty shrine I just open my mouth. Nothing comes out.
justice.npc.keener.punishment.t: When it was first forbidden, I knelt too. Before a grave, without a sound. That's when I learned it. Stop the sound, and the weeping just goes down your throat.
justice.npc.keener.graveyard.t: Keening was never for the dead. It was so the ones left behind wouldn't weep alone. In the graveyard now, everyone weeps alone.
justice.npc.lash-bearer.name: Bor the Lash-Bearer
justice.npc.lash-bearer.greet: …I work for the court. Don't look at my hands.
justice.npc.lash-bearer.name.t: Bor. When a verdict comes down, I'm the one who lifts the lash.
justice.npc.lash-bearer.job.t: Counting forty is my job. I have to count out loud. I count slow. Count fast and the one being struck has no room to breathe.
justice.npc.lash-bearer.punishment.t: Last month there were six. Three of them I carried on my back when they were little. The law doesn't ask about things like that.
justice.npc.lash-bearer.judge.t: The judge always comes to the flogging and stands to the end. Never looks away. Says the one who gives the sentence has to watch it. …That much I respect.

# --- Seles clues ---
justice.word.fairness.label: Fairness
justice.word.fairness.hint: Laying everyone on the same scale. Seles's law gives the punishment first and weighs afterward.
justice.word.law.label: Law
justice.word.law.hint: The mourning prohibitions and punishment clauses rooted in custom. There is no clause for feeling.
justice.word.punishment.label: Punishment
justice.word.punishment.hint: Flogging, exile, kneeling before a grave. The fire that makes custom remembered.
justice.word.compassion.label: Compassion
justice.word.compassion.hint: In Seles, even holding someone who weeps counts as breaking the mourning.
justice.fact.seles.judge.label: Halden the Judge
justice.fact.seles.judge.hint: Seles's judge, who has passed verdicts for thirty years. He believes custom is justice.
justice.fact.seles.widow.label: Harin the Widow
justice.fact.seles.widow.hint: A month since she buried her husband. Every night she sings the forbidden lullaby before the grave.
justice.fact.seles.prisoner.label: Iren the Imprisoned Youth
justice.fact.seles.prisoner.hint: Harin's son. He found his mother's necklace at the grave and was accused of theft.
justice.fact.seles.witness.label: Kain the Witness
justice.fact.seles.witness.hint: The witness who saw something gleaming at the grave. He tells only what he saw and leaves the judgment to the law.
justice.fact.seles.mason.label: Duman the Mason
justice.fact.seles.mason.hint: One who works the stone of gravestones and foundations. Lately, whenever someone breaks mourning, he carves that line on the dead's stone.
justice.fact.seles.court.label: The Court of Seles
justice.fact.seles.court.hint: Where punishment comes before record. Verdicts pile up three sheets a day.
justice.fact.seles.graveyard.label: The Graveyard
justice.fact.seles.graveyard.hint: Where a lullaby carries every night. The living, afraid of punishment, have gone as quiet as the dead.
justice.fact.seles.mourning-lullaby.label: The Mourner's Lullaby
justice.fact.seles.mourning-lullaby.hint: The moon lights the grave, and I sing your lullaby. The song Harin kept for her husband.
justice.fact.seles.mourning-duty.label: The Lost Hundred Days
justice.fact.seles.mourning-duty.hint: The hundred days of mourning in the old records. Not punishment, but a time when neighbors brought meals and sat together.
justice.fact.seles.harsh-punishment.label: The Harsh Punishment
justice.fact.seles.harsh-punishment.hint: Forty lashes for one song, exile for taking anything from a grave. The table's numbers grow every year.
justice.fact.seles.comfort-widow.label: The Hand of Comfort
justice.fact.seles.comfort-widow.hint: "Sitting by the grave and hearing the song out. When comfort stands before punishment, the scale finds its balance."
justice.fact.creature.justice-mourner.label: The Grief-Stricken Mourner
justice.fact.creature.justice-mourner.hint: Not evil. It is grief that makes him mistake a stranger for a thief. He is a person swallowed in mourning.

# --- Seles deduction and crisis ---
justice.deduction.justice.sentence: Justice is not punishment blind to {1}, but a scale of {2} that weighs {3} as well
justice.deduction.justice.hint: What did the judge's punishments close their eyes to? What was Seles's scale meant to be called, and what was missing from its pans? Look to the youth in the cell and the song by the graves.
justice.crisis.mourning.text: Moonlight runs cold before the courthouse. The widow Harin, who sang during mourning, and the youth Iren, who found a necklace at the grave, are dragged before the judge. The judge unfurls the verdict. The song broke custom; the grave yielded a thief. The punishment is fixed. The crowd holds its breath. A child bows her head, and the gravedigger looks toward the graves. Now it is your turn to step forward.
justice.option.comfort-widow.label: Sing the lullaby to show the truth and offer comfort
justice.option.comfort-widow.text: Before the courthouse, you sing the lullaby in a trembling voice. The moon lights the grave, and I sing your lullaby. The crowd stops breathing. The witness bows his head, and the priest takes out the old records and reads. The hundred days of mourning were never punishment, but a time of sitting together. After a long silence, the judge folds the verdict. For the first time, Seles's scale takes up truth and love and finds its balance. Comfort is handed down instead of punishment.
justice.option.strict-law.label: Read out the punishment clauses and rule by the law
justice.option.strict-law.text: You unfold the punishment table and read by the law. Song, forty lashes. Taking from a grave, exile. The judge nods, and the flogging is carried out. The people grow quieter, but somewhere a child's lullaby goes on, low. Seles kept its custom. Yet no one stands before the graves anymore.

# --- Seles abilities and creatures ---
justice.ability.eye.name: The Eye of Justice
justice.creature.mourner.name: The Grief-Stricken Mourner

# --- Dione village (M4 Task 37) ---
town.dione.name: Dione
sacrifice.music.title: Dione's Altar

sacrifice.npc.altar-priest.name: Kreon, Priest of the Altar
sacrifice.npc.altar-priest.greet: Come. Before the altar, everything is lifted away. Lay down all that you carry.
sacrifice.npc.altar-priest.name.t: I am Kreon, the priest who keeps Dione's altar. Today too, the altar swallows someone's offering.
sacrifice.npc.altar-priest.job.t: Before I am a priest, I am this altar's servant. People come here to give their wealth, their bodies, their very last crumb. That is our village's love. Leave something behind before you go.
sacrifice.npc.altar-priest.devotion.t: Devotion is emptying yourself entirely. If something remains, it is not devotion — it is greed. The altar is the fire that burns that greed.
sacrifice.npc.altar-priest.love.t: Love gives without holding back, and gives again, until the giver is gone. A heart that holds back, as yours does, is not called love.
sacrifice.npc.altar-priest.widow-song.t: That song is clinging. Nothing but a lingering hold on the dead. What the widow cannot release at the altar is that clinging.
sacrifice.npc.altar-priest.penitent.t: The penitent? He shows you the road you must walk. Every day now he takes up the whip before the altar. That is the true posture.
sacrifice.npc.altar-priest.altar.t: This altar was raised after the long winter ended. That year my mother put her own bread into the children's pot and did not live to see spring. The altar is stone laid so that such people are never forgotten.
sacrifice.npc.altar-priest.sanctuary.t: I carved the law on the sanctuary wall with my own hands when I was young. My hand shook, and one letter went crooked. Every time I see it, I know I have not yet emptied myself enough.
sacrifice.npc.altar-priest.widow.t: Noeul's husband gave the greatest offering on last year's altar day. His name stands on the top line of the ledger. And still his wife cannot let go of half a loaf.

sacrifice.npc.widow.name: Noeul the Widow
sacrifice.npc.widow.greet: …Come from the altar? Or did you hear about the song?
sacrifice.npc.widow.name.t: I'm Noeul. My husband never came back from the altar. People call me the singing widow.
sacrifice.npc.widow.job.t: Since my husband passed, I set aside half a loaf every evening. It was his share. The altar says to give even that… but that half, and the song we used to sing, are what keep my days.
sacrifice.npc.widow.love.t: Love was not the wound my husband carved, but the evenings we sat and shared. Counting wounds is not love — it is competing.
sacrifice.npc.widow.widow-song.t: By the end it was only ours, my husband's and mine. Before the altar stood, they say all the women of the village sang it while lighting the evening hearth. He was still singing it as he walked to the altar.
sacrifice.npc.widow.altar.t: The altar asks for a person's last thing. My husband laid his hand on it to prove his love, and that wound never let him come back. …I won't say more.
sacrifice.npc.widow.devotion.t: Devotion… that word took my husband. He kept meaning to give more, and in the end gave himself. The altar only knows how to receive.
sacrifice.npc.widow.surgeon.t: Since then, Doctor Sein always bows his head first when he sees me. Sorry he came too late, he says. It wasn't him who was late.
sacrifice.npc.widow.courage.t: Courage… everyone says my husband was brave. I know he sang before the altar because he was afraid.

sacrifice.npc.child.name: Noah the Child
sacrifice.npc.child.greet: Talking to strangers means no supper. It's okay. I'm good at going hungry.
sacrifice.npc.child.name.t: I'm Noah. I'm six, and I'm practicing to be the altar's child. The priest says if you give up a lot while you're little, you can make a big sacrifice later.
sacrifice.npc.child.job.t: My job is skipping one meal a day and never picking anything I like. The priest calls it a holy burden, but I don't know why I have to learn to carry burdens.
sacrifice.npc.child.burden.t: A burden? The priest says the more you carry, the holier you are. But the burden I know is Granny Sera's bread box. It's heavy, but with two of us it gets light.
sacrifice.npc.child.widow-song.t: Auntie Noeul's song! I sing it in the backyard every night, in secret. The priest mustn't hear. But when she sings it with me, I feel warm inside.
sacrifice.npc.child.widow.t: Auntie Noeul always gives me half a loaf. She says eat it, don't give it to the altar. But is that a sacrifice too… no, what's it called. I'm too little to know the word.
sacrifice.npc.child.garden.t: Eating radishes in Grandpa Mano's garden is a secret. They taste like dirt, but sweet. Don't tell the priest.
sacrifice.npc.child.altar.t: If you put your ear on the altar stone, you can hear wind inside. The sanctuary girl says it's the altar breathing. I'm a little scared of it.
sacrifice.npc.child.love.t: Love? It's the face Auntie Noeul makes when she gives me half a loaf. That's what you mean, right?

sacrifice.npc.pilgrim.name: Ion the Pilgrim
sacrifice.npc.pilgrim.greet: I am a pilgrim who wanders from place to place. I walked three years on the rumor of Dione's altar, and I have stayed here a season now.
sacrifice.npc.pilgrim.name.t: My name is Ion. One staff and one notebook are all I own. Wherever I go, I write down the true sacrifices I hear of and see.
sacrifice.npc.pilgrim.job.t: My work is to be a witness. I write down, without taking sides, what happens before the altar and what the villagers look away from. Until I came here, I believed sacrifice was beautiful.
sacrifice.npc.pilgrim.witness.t: A witness is one who remembers what he saw to the end. I have copied this village's ledgers three times over. The priest raises his bound hand over the altar, but once, when the cloth slipped, the hand I saw was whole.
sacrifice.npc.pilgrim.martyr-contest.t: The altar? This village competes before it over who gave more painfully. They measure wounds and count days of fasting, and last year the man who cut off his own finger won. The priest calls it a holy contest. I wrote it down as the martyr contest.
sacrifice.npc.pilgrim.devotion.t: Devotion brought me here, and now I fear the word. Wherever you are told to give everything, there is always someone on the receiving side. I mean to write that side down too.
sacrifice.npc.pilgrim.pilgrim.t: The pilgrim of three hundred years ago? I heard he asked no one to give anything up. He shared his own portion, ate, and went on his way. Where this village came to read that story backwards is what I want to know.
sacrifice.npc.pilgrim.widow.t: Lady Noeul asked me to write nothing of her in my notebook. So when I pass her door, I walk with it closed. The evening song, though, I have learned by heart as I hear it.

sacrifice.npc.surgeon.name: Sein the Surgeon
sacrifice.npc.surgeon.greet: Sit. Show me the wound. …Clean. Good.
sacrifice.npc.surgeon.name.t: Sein. I'm the only surgeon in this village who works with knife and thread. My blade is not for opening flesh, only for closing it.
sacrifice.npc.surgeon.job.t: My work is sewing wounds. But most wounds here are self-made, to stand before the altar, to bear more than the next person. Sewing them day after day, I became a witness without meaning to.
sacrifice.npc.surgeon.witness.t: If it's a witness you want, you won't find a better one. My fingertips know which wound came from a blade and which from the altar stone. But the priest's hand, in all these years, he has never once shown me.
sacrifice.npc.surgeon.martyr-contest.t: The wound contest the priest's altar hosts. Watching the cord-keeper count knots and the recorder write the number down, I can only shake my head. They mean to measure love by the length of a wound.
sacrifice.npc.surgeon.penitent.t: That penitent is my patient. He whipped his back until it festered and came to me. I mend him, and soon he'll be back at the altar. This village opens more wounds than I can close.
sacrifice.npc.surgeon.courage.t: Courage isn't making one more wound. It's looking, to the end, at the face of the one who will hurt. In this village, that's the hardest thing of all.
sacrifice.npc.surgeon.widow.t: I could have saved that woman's husband. If only I'd been three days earlier. …I was the one who kept the law, so my hand is on that ledger too, in its way.
sacrifice.npc.surgeon.altar.t: When altar day draws near, I boil my thread ahead of time. This year, my one wish is to get through without using a single strand.

sacrifice.npc.scribe.name: Mir the Recorder
sacrifice.npc.scribe.greet: They say records are eternal. …If only the records I keep did not frighten me.
sacrifice.npc.scribe.name.t: I am Mir, Dione's recorder — the one who copies the lists of what is offered to the altar.
sacrifice.npc.scribe.job.t: I keep the altar's ledger. Names, offerings, the length of each wound, and the larger the number, the greater the praise. Yesterday, copying out last year's ledger, my hand stopped at one entry. One finger.
sacrifice.npc.scribe.martyr-contest.t: Devotion? Some call it the martyr contest. I only write the numbers. But numbers do not lie. A husband's finger, a child's meal, an old man's knees. The altar is gathering those numbers in.
sacrifice.npc.scribe.burden.t: The old ledger says a burden is not carried alone but carried together. Now each carries only their own and will not take up another's. If that is what the altar teaches, I will not record its teaching.
sacrifice.npc.scribe.widow.t: Lady Noeul's household is on the top line of last year's ledger, the house that gave the most. Beneath it is a line I wrote only in pencil, a widow who sets aside half a loaf every night. I have not yet managed to copy that line into any ledger.
sacrifice.npc.scribe.pilgrim.t: The pilgrim copied my ledger three times over, writing each name back in beside its number. I had forgotten how to write that way.
sacrifice.npc.scribe.witness.t: As a witness, I don't qualify. I write down not what I see, only what is measured. Whatever the cord cannot reach never makes it into the ledger.

sacrifice.npc.mason.name: Damen the Mason
sacrifice.npc.mason.greet: I've spent my life with stone. Stone doesn't lie, and I like that. But that altar stone… it keeps its mouth shut about what lies beneath it.
sacrifice.npc.mason.name.t: Damen. I'm the mason who works the stone of this village's houses and its altar. My grandfather was the mason who built that altar.
sacrifice.npc.mason.job.t: Repairing the altar stone is my work. Tap it with a hammer and it rings hollow underneath. The old shrine's foundation is still down there, and the words carved on it are not the altar's law. I just haven't found the courage to bring them back to light.
sacrifice.npc.mason.altar.t: Lift this altar away and the old shrine's hearth lies beneath it. The words carved there say the fire that kept this village was never the altar, but the hearth relit every evening. It was a place that filled, not a place that stripped away.
sacrifice.npc.mason.courage.t: Courage is not holding up a stone about to fall. It is becoming the stone that holds up a person about to fall. Lately I want to make such a stone, so I am dressing the altar anew.
sacrifice.npc.mason.widow-song.t: I know that song well. When Noeul sings it in the evening, it's as if the hearth fire sings along. The very fire the altar buried.
sacrifice.npc.mason.sanctuary.t: My grandfather laid the sanctuary's threshold stone. Knees have worn a hollow in its middle. If the stone has worn that far, think how far the people have.
sacrifice.npc.mason.devotion.t: My grandfather built that altar with a devoted heart. Even as he covered the old hearth, he said, he set one stone loose on purpose, so that someday someone could open it again.

sacrifice.npc.baker.name: Sera the Bread Baker
sacrifice.npc.baker.greet: Fresh from the oven. …If it's for the altar, go elsewhere. I don't put bread there.
sacrifice.npc.baker.name.t: I'm Sera. At the village bakery I bake bread each morning, and in the evening I share it.
sacrifice.npc.baker.job.t: My work is kneading, keeping the fire, and handing out bread. The priest says I don't know how to sacrifice. Every time I hear it, I stoke the fire harder. He doesn't know what fire it is I keep.
sacrifice.npc.baker.living-love.t: As for devotion, I believe true sacrifice is not offering your life at once, but stoking the fire and handing out bread every morning. The altar takes a moment; this bread keeps a day alive. Sharing — that is the love I know.
sacrifice.npc.baker.love.t: Love lives between the baker and the eater. It does not burn in the fire. Like dough rising, it rises together.
sacrifice.npc.baker.widow.t: I always cut Noeul's loaf a little bigger. She sets half of it aside. I know where that half goes, too. Into Noah's mouth.
sacrifice.npc.baker.garden.t: There's a bread I bake with grated radish from Mano's plot. The priest would call it a greedy, filling bread. The children love it best.

sacrifice.npc.healer.name: Nora the Healer
sacrifice.npc.healer.greet: If you have a wound, show me. In this village, the one with no wounds may be the one who hurts most.
sacrifice.npc.healer.name.t: Nora. I'm the healer who works herbs and salves beside Sein the surgeon. Helping wounds close is my part.
sacrifice.npc.healer.job.t: My work is dressing what Sein has sewn. I tend the wounds on that penitent's back too. However well they close, they split again each time he goes to the altar. Someone should teach this village how to live with a wound, not how to make one.
sacrifice.npc.healer.penitent.t: He isn't wicked. Just a poor soul taught that holiness has to be proven in wounds. I hope one day he learns he can be holy without them.
sacrifice.npc.healer.burden.t: Knowing how to lighten a burden is not the start — knowing how to share one is. That is where healing begins. A wound you can say hurts is already half healed.
sacrifice.npc.healer.surgeon.t: Sein hasn't slept well since last autumn. Every night he boils his thread, and boils it again. Busy hands make thoughts hurt less, he says.
sacrifice.npc.healer.courage.t: Courage… it takes courage just to say it hurts. In this village, say so and your name slides down the ledger.

sacrifice.npc.gardener.name: Mano the Gardener
sacrifice.npc.gardener.greet: A field only grows better with tending. Some say going hungry here is noble… but I know the earth waits for hands.
sacrifice.npc.gardener.name.t: I'm Mano. I keep the vegetable plot behind the village. Pumpkin, carrot, radish, names you can't even say near the altar, they're too filling.
sacrifice.npc.gardener.job.t: My work is sowing seed, pulling weeds, and giving water. Then I share half the harvest with the villagers. The priest tells me to offer even that half.
sacrifice.npc.gardener.garden.t: This plot is the oldest place in the village — older than the altar. The children taught that hunger is holy come here starving, eat a radish, and go. I teach them it is not a burden, it is food.
sacrifice.npc.gardener.martyr-contest.t: The priest's wound contest — on the way back from market I see the quarrels before the altar. Who fasted more, who ached more. Nothing like that grows in a plot. Because nothing like that is ever planted.
sacrifice.npc.gardener.altar.t: My grandmother told me about the long winter. That year every radish from this plot went into the old shrine's pot. Each evening someone lit the fire, and everyone shared a bowl.
sacrifice.npc.gardener.devotion.t: Devotion? I'm devoted to the soil. The soil gives back what it's given. The altar only takes.
sacrifice.npc.acolyte.name: Tessa the Acolyte
sacrifice.npc.acolyte.greet: Please walk softly in the sanctuary. The priest is at prayer.
sacrifice.npc.acolyte.name.t: I am Tessa. Until Noah came, I was the youngest at the priest's side. Now I trim the lamps and scrub the altar stone.
sacrifice.npc.acolyte.job.t: I scrub the altar every dawn. Oddly, when I sweep the cracks between the stones, soot comes out. No fire has ever been lit on that altar.
sacrifice.npc.acolyte.devotion.t: Every night the priest rewraps the cloth on his hand. The cloth he takes off is always white. I have decided to believe that is because his devotion runs so deep.
sacrifice.npc.acolyte.sanctuary.t: Under the law on the sanctuary wall there is a patch painted over. On rainy days, older letters show through. I tried to read them, but they had all run.
sacrifice.npc.cord-keeper.name: Kiro the Cord-Keeper
sacrifice.npc.cord-keeper.greet: If you've come to have a wound measured, find someone else. I'm not measuring this year.
sacrifice.npc.cord-keeper.name.t: I'm Kiro. Every altar day, I was the one who measured the wounds. My cord has a knot at every inch.
sacrifice.npc.cord-keeper.job.t: The recorder writes, and I measure. Of everything I measured last year, one finger was the biggest. Since then I've kept my cord wound up.
sacrifice.npc.cord-keeper.widow.t: I measured Noeul's husband's hand. The altar's law says no one may touch an offered wound for three days, so the surgeon waited outside the door. He went in on the third night… what happened after, I don't know.
sacrifice.npc.cord-keeper.burden.t: My little brother is in the southeast alley right now, whipping his own back. Trying to be longer than any cord his brother ever measured. If you're asking about burdens, that one's mine.
sacrifice.npc.bandage-seller.name: Niko the Bandage Seller
sacrifice.npc.bandage-seller.greet: Bandages, salt, freshly honed knives. Altar day's right around the corner, so everyone stocks up early.
sacrifice.npc.bandage-seller.name.t: Niko. I used to haul salt to the next village over, but here, bandages sell better than salt.
sacrifice.npc.bandage-seller.job.t: Selling clean knives is my trade. If they're going to cut anyway, better clean than rusty, right? …I'm not sure it's honest business either.
sacrifice.npc.bandage-seller.devotion.t: Devotion puts food on my table. Last year I sold forty bolts of bandage. People are buying less this year, and strangely, it's a relief.
sacrifice.npc.bandage-seller.surgeon.t: Doctor Sein won't use my bandages. Only cloth he's boiled and dried himself. He's also the only one who ever told me to stop selling.
sacrifice.npc.old-kneeler.name: Pero, Who Gave His Knees
sacrifice.npc.old-kneeler.greet: Forgive me for greeting you sitting down. I left these knees at the altar.
sacrifice.npc.old-kneeler.name.t: My name is Pero. When I was young, I drove sheep to the farthest pastures this village had.
sacrifice.npc.old-kneeler.job.t: These days my work is sitting here counting the feet that pass. I knelt forty days on the altar stone, and after that I had no more need to stand.
sacrifice.npc.old-kneeler.altar.t: They tell me the ledger records my knees as forty days. But it wasn't forty days I sat. It was the twelve years after.
sacrifice.npc.old-kneeler.love.t: I have no regrets. Only that I never once carried my grandchild on my back. Love was something you did with your knees too.
sacrifice.npc.midwife.name: Hala the Midwife
sacrifice.npc.midwife.greet: Come here, little one. Let me see your hands. …All ten. Good.
sacrifice.npc.midwife.name.t: Hala. I brought half this village into the world with these hands. Every one of them had ten fingers when I caught them.
sacrifice.npc.midwife.job.t: Catching babies was my work. These days more hands go into the ledger than babies come into the world, so I sit here and count them.
sacrifice.npc.midwife.widow.t: I caught Noeul's husband too. Loudest cry in the village. The day he walked toward the altar singing, I was sitting right here, watching.
sacrifice.npc.midwife.burden.t: I caught Noah too. Her mother gave away the whole house and left with empty hands. Said she couldn't carry a child along as one more burden.

# --- Dione clues ---
sacrifice.word.devotion.label: Devotion
sacrifice.word.devotion.hint: The word the altar teaches. The name for emptying and burning the whole self. The word the pilgrim came to fear.
sacrifice.word.burden.label: Burden
sacrifice.word.burden.hint: The altar teaches that more burdens make you holier. But the healer teaches how to share burdens.
sacrifice.word.witness.label: Witness
sacrifice.word.witness.hint: One who remembers what they saw to the very end. The surgeon's fingertips and the pilgrim's notebook do that work.
sacrifice.fact.dione.altar-priest.label: Kreon, Priest of the Altar
sacrifice.fact.dione.altar-priest.hint: The priest who keeps the altar. He teaches emptying the self utterly and stokes the village's martyr contests.
sacrifice.fact.dione.widow.label: Noeul the Widow
sacrifice.fact.dione.widow.hint: A widow who lost her husband to the altar. Each evening she keeps her day with half a loaf and an old song.
sacrifice.fact.dione.pilgrim.label: Ion the Pilgrim
sacrifice.fact.dione.pilgrim.hint: A pilgrim who walked three years to find a true sacrifice. He copied the altar's records three times over.
sacrifice.fact.dione.surgeon.label: Sein the Surgeon
sacrifice.fact.dione.surgeon.hint: The only surgeon who closes wounds. He knows most wounds in this village are self-made.
sacrifice.fact.dione.scribe.label: Mir the Recorder
sacrifice.fact.dione.scribe.hint: The recorder of the altar's ledger. He knows every number has a name.
sacrifice.fact.dione.altar.label: The Altar of Dione
sacrifice.fact.dione.altar.hint: The stone altar at the village's center. Beneath it lies the foundation of an older hearth.
sacrifice.fact.dione.sanctuary.label: The Sanctuary
sacrifice.fact.dione.sanctuary.hint: The sanctuary where the priest lives. The law of renunciation is carved on its walls.
sacrifice.fact.dione.garden.label: The Garden Behind the Village
sacrifice.fact.dione.garden.hint: A garden older than the altar. Starving children sneak there to eat radishes.
sacrifice.fact.dione.widow-song.label: The Widow's Song
sacrifice.fact.dione.widow-song.hint: The evening song Noeul sang with her husband. Once sung by the women as they lit the hearth, it is the last song of Dione never given to the altar.
sacrifice.fact.dione.martyr-contest.label: The Martyr Contest
sacrifice.fact.dione.martyr-contest.hint: The altar's custom of competing over who offered more painfully. Wound lengths and fasting days are written as numbers.
sacrifice.fact.dione.renunciation-law.label: The Law of Renunciation
sacrifice.fact.dione.renunciation-law.hint: "The law the altar commands. What you keep is greed; only empty hands are called a true heart."
sacrifice.fact.dione.living-love.label: The Hearth's Love
sacrifice.fact.dione.living-love.hint: Words carved into the old foundation. The fire was kept not by the place that stripped away, but by the place that filled every day.
sacrifice.fact.creature.sacrifice-penitent.label: The Penitent of Repentance
sacrifice.fact.creature.sacrifice-penitent.hint: Not evil. One taught that holiness must be proven with wounds. He whips his own back before the altar.

# --- Dione deduction and crisis ---
sacrifice.deduction.sacrifice.sentence: Sacrifice is not letting {1} erase the self, but finding {3} through {2}
sacrifice.deduction.sacrifice.hint: The altar teaches you to burn yourself away in the name of something fine-sounding. The widow's evening song and the hearth's foundation point to a sacrifice that does not vanish, but stays and endures.
sacrifice.crisis.altar.text: Villagers gather before the altar. Priest Kreon lifts little Noah's hand and cries out that love is giving without holding back, and that only when the child is emptied entirely is it true sacrifice. Noah kneels, her face frightened. Behind them, the widow Noeul hides half a loaf, and the pilgrim Ion grips his staff. Sein the surgeon bows his head, and Mir the recorder opens the ledger. Now it is your turn to step forward.
sacrifice.option.open-altar.label: Sing the widow's song to show love and courage
sacrifice.option.open-altar.text: You sing the old song before the altar. Noeul and little Noah add their voices. The priest cries out, but Damen the mason shoves the altar stone aside and the old hearth comes to light. Carved in the foundation are the words that the fire which kept this village was never the altar, but the hearth relit every evening. The priest falters, and the villagers lay down the cords they used to measure wounds. Dione understands that sacrifice is not devotion that erases the self, but courage found through love. That evening, a fire is lit in the bakery instead of on the altar.
sacrifice.option.exile-priest.label: Read out the martyr contest records and close the altar
sacrifice.option.exile-priest.text: You take out the pilgrim's notebook and the recorder's ledger and read them aloud. One finger, one meal, one knee. The counts of what the altar received pile up before it. The priest falls silent, and one by one the villagers lift their heads. The priest leaves the altar, and the altar is closed. But the child still skips a meal every evening. Dione stopped competing, but has not yet learned how to live.

# --- Dione abilities and creatures ---
sacrifice.ability.meaning.name: The Meaning of Sacrifice
sacrifice.creature.penitent.name: The Penitent of Repentance

# --- Argon, village of honor (M4 Task 38) ---
town.argon.name: Argon
honor.music.title: Argon's House Song

honor.npc.elder.name: Elder Beron
honor.npc.elder.greet: A guest of Argon. Give me your name. Which line you belong to, which house's sigil you carry.
honor.npc.elder.name.t: I am Beron, the third elder of my line to keep this house's ranks. In this village a name comes from the house. No house, no name.
honor.npc.elder.job.t: My work is counting the ranks and keeping face. Who stands above and who below — if that order wavers, the whole village falls. The ledger that counts names is my law.
honor.npc.elder.honor.t: Honor is the face of a house. When that face cracks, the stain must be washed out, whether the one who made it is living or dead. Keeping honor — that alone is this village's order.
honor.npc.elder.shame.t: Knowing shame is itself honor. An insult weighs more than death. One whose face is trampled is a name already gone, even while alive.
honor.npc.elder.face.t: A broken face cannot be mended. So harden the face you have before it breaks. Kneel once, and you are the one who knelt for the rest of your life.
honor.npc.elder.heir.t: The heir Sion? He shamed this house. He made up a song, called it a lost verse, and insulted the founder with it. Whoever breaks face is struck from the rolls. That is our law.
honor.npc.elder.manor.t: My grandfather hung the sigil in the manor hall. Since then, Argon's gate has never once leaned.
honor.npc.elder.widow.t: Silbi's husband knelt. By the law, his name should have stayed. …When the ledger was copied anew this spring, I did not call it out.
honor.npc.elder.swordmaster.t: Barkan teaches the children to kneel first, I hear. If the hand that holds the sword learns the knee before anything, what will this village stand on?

honor.npc.heir.name: Sion the Heir
honor.npc.heir.greet: …Someone still meets my eyes. This village does not look at a name that is about to be erased. You do not turn away?
honor.npc.heir.name.t: I am Sion. I was the heir of this house. …That 'was' still sits strangely in my mouth.
honor.npc.heir.job.t: An heir's work is to learn words and learn the sword, and one day inherit the house. But I lost all of it over a single verse of a song.
honor.npc.heir.song.t: Do you know the second verse of that song? Our house memorizes only the first — the lord who never knelt. But the second verse sings differently. He was a kneeling lord. Not one who raised a celebrated spear, but one who knelt to save everyone.
honor.npc.heir.truth.t: Truth hurts more than face. I sang that second verse in the square. People heard a song about a founder who knelt from fear, but the verse says he knelt to save the village.
honor.npc.heir.courage.t: I was taught that courage means raising a sword. But the song's second verse says kneeling is courage too. To face the enemy's blade and think of the villagers' lives before your own face — that was the founder's courage.
honor.npc.heir.elder.t: My grandfather taught me my letters from the ledger. His was the hand that first wrote my name. Now that same hand means to erase it.
honor.npc.heir.widow.t: I was ten the day Silbi's husband knelt in the square. No one helped him to his feet. Not even me.
honor.npc.heir.face.t: I was taught that face is my face as others see it. The day I sang, I saw my own face for the first time.

honor.npc.herald.name: Luka the Herald
honor.npc.herald.greet: A herald who carries the house's voice. Whose name shall I cry today?
honor.npc.herald.name.t: I am Luka, the herald who cries the house ranks before duels and at rites.
honor.npc.herald.job.t: My work is calling names — by rank, by house. But lately I cry more names that must be erased. When that name is called, the people bow their heads.
honor.npc.herald.song.t: The whole house song is in the copy I keep, first verse and second. …Yet at the rites we only ever sing the first. Leaving the second unsung is this house's law.
honor.npc.herald.honor.t: Honor — who am I to speak of it. I only call out that the name standing highest is the right one. …But each time I turn the back pages of my copy, I remember there are names this village does not sing.
honor.npc.herald.elder.t: Elder Beron is the master of the ranks. He holds the power to raise names and lower them. He keeps one law. Whoever breaks face must kneel and apologize, or be struck from the rolls. An insult weighs more than death, he says. That is this village's law of shame.
honor.npc.herald.heir.t: I have cried Sion's name a hundred times. If tomorrow they tell me to cry it one last time, I don't know if my voice will obey.
honor.npc.herald.plaza.t: The square's flagstones change color with each line. I know where every line stands with my eyes shut. …Lately there are more days I would like to keep them shut.

honor.npc.scribe.name: Madel the House Recorder
honor.npc.scribe.greet: House recorder. Before I open the ledger — have you come to add a name, or to erase one?
honor.npc.scribe.name.t: I am Madel. I write the names of this house, and I erase them. An erased letter still leaves a mark. The marks keep multiplying.
honor.npc.scribe.job.t: I keep the rank ledger. Who was born in which line, which name rose and which fell. …But the elder reaches into this ledger himself. Those parts I could not write.
honor.npc.scribe.rank.t: To speak of honor, start with the family rank law. The line you are born into becomes the order of your name. But trace the rank ledger back, and there is one erased line. The ledger knows who erased it.
honor.npc.scribe.truth.t: When I try to write the truth, the ledger grows heavy. When the elder moved to erase Sion's name, I felt the weight of that truth. To the very moment a name is erased, it is always face, not truth, that wins.
honor.npc.scribe.heir.t: Sion sang the second verse. What crime is that? But in the name ledger, rank comes before truth. Tomorrow the elder will make Sion kneel in the square and take his apology. Before the erasure.
honor.npc.scribe.elder.t: Every spring the elder has the ledger copied anew. He calls the names, and I write them down. A name left out in the copying does not even leave an erasure mark.
honor.npc.scribe.widow.t: Silbi's husband's name was not erased. The elder simply did not call it, and I only copied the names he called. …I thought saying so would keep my hands clean.

honor.npc.swordmaster.name: Barkan the Swordmaster
honor.npc.swordmaster.greet: Before you draw a sword, tell me what you mean to guard. That decides what I teach.
honor.npc.swordmaster.name.t: Barkan. I teach the sword in this village. But I don't teach winning. Why learn a sword that wins and still leaves you dead?
honor.npc.swordmaster.job.t: I teach the sword. Before the children learn to raise a blade, I teach them to kneel. One who cannot kneel is no swordsman, whatever he holds.
honor.npc.swordmaster.courage.t: Courage… do you know the founder's story? He is remembered as the lord who never once knelt. But the truth is otherwise. He knelt once before a blade, to save the villagers. Kneeling is harder than raising a sword — that is what I teach.
honor.npc.swordmaster.honor.t: A man who takes honor for face uses even his sword to guard his face. True honor… is knowing, before the blade, what to keep and what to lay down.
honor.npc.swordmaster.song.t: The house song holds the story of how the sword came to this village. The first verse says he never knelt; the second says he did. The same blade, the same lord, a different song. Which will you sing?
honor.npc.swordmaster.face.t: I've seen many raise a sword wrongly to keep their face. Carry face on your back and it is a shield; wear it over your eyes and it is a blindfold. Behind a blindfold you cannot even see the fight.
honor.npc.swordmaster.heir.t: Sion learned the sword in my yard. He was the slowest of all to learn to kneel. Now he says he will not kneel in the square. This time, he is right.
honor.npc.swordmaster.shame.t: Shame is the heart that cannot lift its head after losing. I teach the children that the day they lose is the day to lift it first.

honor.npc.brewer.name: Mur the Brewer
honor.npc.brewer.greet: Welcome. Drink doesn't ask your name. After a cup, everyone wears the same face.
honor.npc.brewer.name.t: They call me Mur. I've brewed at this tavern for thirty years — a man of the lowest line in this village, too.
honor.npc.brewer.job.t: I brew and I pour. On the nights after names are called in the square, the high lines get drunk on pride, and the families of erased names empty their cups quietly in the corner. In here, rank and house alike sink into the cup.
honor.npc.brewer.heir.t: The day Sion sang, I watched from the edge of the square with a cup in my hand. In front of everyone he sang the second verse alone, all the way through. A few clapped with their heads down, but most kept their mouths shut and watched the high lines. …I can't forget those faces.
honor.npc.brewer.widow.t: Silbi asks me to keep her husband's corner seat empty. So I leave a cup turned upside down on that table.
honor.npc.brewer.face.t: Customers who mind their face leave their cups half full. I drink the other half. Which makes me the man with the least face in this village.
honor.npc.brewer.elder.t: The elder has never set foot in this tavern. The high lines do not take a cup poured by the low. His grandson came and drank, though.

honor.npc.child.name: Arin the Village Child
honor.npc.child.greet: Hi! Do you want to learn a song? I know the back part of the house song!
honor.npc.child.name.t: I'm Arin! A village kid, and nobody asks my name. Because my line is low. But I know the songs best of all!
honor.npc.child.job.t: My job is singing! In the square, at the tavern, at the rites. The grown-ups sing the founder's boasting song, but I sing his hidden song too. They say the founder was a kneeling lord!
honor.npc.child.song.t: The first verse sings a lord who never knelt, and the second verse sings one who knelt. I like the second better. A song about what really happened is more fun than a boasting one!
honor.npc.child.shame.t: Shame — you know the kneeling in the square, right? That's what the adults call shame. But the founder knelt too, and he's still the founder. So I don't really get what shame is.
honor.npc.child.widow.t: Auntie Silbi cries a lot. Because her husband's name was erased. I remember that name in a song too. You can erase a name, but you can't erase a song!
honor.npc.child.elder.t: The old elder is scary. But when I sing the second verse, he stops and listens. Then he walks off without a word!
honor.npc.child.heir.t: When big brother Sion sang the second verse, I sang along! But my mom covered my mouth with her hand. Her hand was shaking.

honor.npc.widow.name: Silbi the Widow
honor.npc.widow.greet: …Did you come to choose cloth, or to find an erased name?
honor.npc.widow.name.t: My name is Silbi. I sell cloth in the market. My husband's name vanished from the ledger, but I have woven it into the cloth.
honor.npc.widow.job.t: My work is reading the road of cloth with my fingertips. When my husband lived, we spread out bolts together. Now I fold short scraps alone, like nameless fabric.
honor.npc.widow.shame.t: This village calls kneeling shame. But the angle of my husband's elbow was the shape of love I know best. Had he raised his sword, he would have left me that very day.
honor.npc.widow.song.t: The second verse lives only in my ears now. I have written it line by line into the lining of rite robes. Children sing it, widows sing it — in the end the founder was a kneeling lord. He knelt not to flee, but to save.
honor.npc.widow.pride.t: Pride is a cloth as sharp as a blade. My husband tore through it to kneel. I think the torn edge is far more beautiful.
honor.npc.widow.heir.t: The day young master Sion sang that song, I buried my face in cloth and wept. The boy only spoke the truth, yet this village tries to fold that cloth away.
honor.npc.widow.elder.t: I do not resent the elder. But when he stood at our door, I wanted to ask why he did not come in. I know the answer. The cloth called face blocked the way.
honor.npc.widow.plaza.t: Between the square's flagstones is the place where my husband knelt. No one steps there. I have laid a handful of wool on it.

honor.npc.mason.name: Bastin the Mason
honor.npc.mason.greet: I live with my hands on stone. I dress the sigils, but the stone hidden beneath them is older.
honor.npc.mason.name.t: Bastin. I work the stone of this village's manor and square. Stone knows no rank.
honor.npc.mason.job.t: I dress the manors' sigils and lay the square's flagstones. And when I happen to make repairs, I face words carved in old stone. Words people want to forget.
honor.npc.mason.manor.t: The house manor? Its sigil shows a lord who never knelt. But the old hall's wall stone still bears another picture — a kneeling lord. Someone hung the sigil right over it.
honor.npc.mason.rank.t: As for shame — the rank ledger was first carved on a stone pillar in the hall. But the topmost line has been scraped away with a chisel. When the evening light comes in low, the shapes of the letters still show through the scratches.
honor.npc.mason.face.t: Stone has no face, and that's what I like about it. When it cracks, the crack shows. People hide their cracks behind face; stone can't. That's why I trust stone.
honor.npc.mason.plaza.t: The square's flagstones differ line by line. White stone for the high lines, river stone for the low. But the same rain wears them all down together.
honor.npc.mason.elder.t: The elder had me polish the manor sigil again this year. I do it every year, but this time he told me to cover the hall wall more thickly.

honor.npc.seamstress.name: Rian the Seamstress
honor.npc.seamstress.greet: Cloth doesn't ask your name. Whatever line you belong to, it only wraps the body.
honor.npc.seamstress.name.t: They call me Rian. I sew this village's clothes. I have made the rite robes, and even the clothes worn in the shame rite.
honor.npc.seamstress.job.t: I stitch the gold thread of the rite robes and embroider sigils on collars. But for the shame rite I make clothes that cover even the sigil. The face-keeping house dresses its own in clothes that shed face.
honor.npc.seamstress.face.t: You hold your clothes straight to keep face, but on the day you kneel they all crumple anyway. Face should not be a garment you wear but a heart you keep.
honor.npc.seamstress.widow.t: I have mended all of Lady Silbi's clothes of late — even the clothes of her erased husband. Every time I mend them with care, I feel I am stitching in place of an erased name.
honor.npc.seamstress.shame.t: The shame-rite garment has no sleeves, so there is nowhere to hide your hands. That is the only garment that keeps pricking my fingers while I sew.
honor.npc.seamstress.heir.t: Young master Sion sang that song wearing the rite robe I made him. Now the robe is back in my room. They want the sigil unpicked from its collar.
honor.npc.nurse.name: Nelda the Old Nurse
honor.npc.nurse.greet: Have you come to see the young master? In the manor these days, we even soften our footsteps.
honor.npc.nurse.name.t: I'm Nelda. I've raised two generations in this manor. The elder's son, and then his son's son, young master Sion.
honor.npc.nurse.job.t: I keep the manor's house, and at night I go round putting out the lamps. The lamp in the old hall is always the last. Someone stays there late.
honor.npc.nurse.elder.t: Every night the elder stands before the sigil in the old hall with a single lamp. I've never asked what he looks at. It isn't my place to ask.
honor.npc.nurse.heir.t: When the young master was small, there was a song I sang to put him to sleep. I learned it from the elder's own mother. …He only ever fell asleep if I sang it to the very end.
honor.npc.drummer.name: Gale the Drummer
honor.npc.drummer.greet: Mind the drumsticks. I'm drying the skins before the rite.
honor.npc.drummer.name.t: Gale. I beat the drum at the rites. My father did, and his father before him.
honor.npc.drummer.job.t: Three beats before the herald cries the names, one when the song begins. A drum doesn't care about lines. It sounds the same before anyone's name.
honor.npc.drummer.plaza.t: The drum score my grandfather left me runs a whole verse longer than the song. They say he always drummed it to the end. Though no one sang along.
honor.npc.drummer.herald.t: When those leftover beats come, Luka's lips move. No sound comes out. I pretend not to see and just keep drumming.
honor.npc.matchmaker.name: Misha the Matchmaker
honor.npc.matchmaker.greet: Oh, a face I've never seen. Without knowing your line, I can't tell who to match you with.
honor.npc.matchmaker.name.t: I'm Misha. Nearly every marriage in Argon passes through my hands. You can't do this work without knowing the ledger by heart.
honor.npc.matchmaker.job.t: A match begins in the ledger. One line apart is fine. Two, and the elders' faces go red. Three, and no one even brings it up.
honor.npc.matchmaker.face.t: Twelve matches broken over face have passed through my hands alone. I have yet to hear that any of those pairs forgot each other.
honor.npc.matchmaker.heir.t: Three houses were lined up to marry into young master Sion's. After that song, they all quietly backed away. One verse undid three matches.
honor.npc.proxy.name: Rok the Proxy Duelist
honor.npc.proxy.greet: If you came to learn the sword, go to the master. I'm the one who keeps other people's face for them, for a fee.
honor.npc.proxy.name.t: Rok. I'm from a low line, so I never fight under my own name. Always under someone else's.
honor.npc.proxy.job.t: When a high-line son is insulted, his house hires me. If I win, the house keeps its face; if I lose, my arm breaks. Either way, the son's face never gets a scratch.
honor.npc.proxy.pride.t: Pride? That belongs to the house that hired me. All I get to keep are the scars.
honor.npc.proxy.swordmaster.t: The first thing the master taught me was how to kneel. Thanks to that, I get hurt less on the days I lose. I doubt that's what he meant by it.
honor.npc.mourner.name: Sila the Mourner
honor.npc.mourner.greet: Have you come to hire a mourner? The great houses of this village do not weep with their own eyes.
honor.npc.mourner.name.t: I am Sila. For forty years I have wept at other people's funerals. Yet the day I buried my own husband, no tears would come.
honor.npc.mourner.job.t: When a high house has a death, I weep in their place. The chief mourner must stand straight to keep face. Even the price of weeping depends on your line.
honor.npc.mourner.shame.t: Weeping as shame — a strange law. When I wail, the family's shoulders slowly sink. I am not weeping for them; they are weeping behind my voice.
honor.npc.mourner.widow.t: No one hired a mourner for Silbi's husband. A man who knelt in the square is owed no weeping. So that night I went alone and wept for nothing.

# --- Argon clues ---
honor.word.honor.label: Honor
honor.word.honor.hint: "The name this village gives to face and family rank. But the song's second verse sings that same word another way."
honor.word.shame.label: Shame
honor.word.shame.hint: An insult weighs more than death. So what happened was hidden, and the founder's kneeling was cut from the song.
honor.word.pride.label: Pride
honor.word.pride.hint: What swells when it is won by the sword and your name is called in the square. The widow Silbi says her husband's moment of kneeling was greater.
honor.word.face.label: Face
honor.word.face.hint: A house's face that cannot be mended once cracked. This village weighs it heavier than life.
honor.fact.argon.elder.label: Elder Beron
honor.fact.argon.elder.hint: The elder who has kept the rank for three generations. He holds the ledger that raises and lowers names.
honor.fact.argon.heir.label: Sion the Heir
honor.fact.argon.heir.hint: The heir who sang the song's lost second verse. He cracked the house's face and now stands to have his name erased.
honor.fact.argon.herald.label: Luka the Herald
honor.fact.argon.herald.hint: The herald who cries the ranks. He holds the full copy of the house song, but at rites only the front is sung.
honor.fact.argon.swordmaster.label: Barkan the Swordmaster
honor.fact.argon.swordmaster.hint: A master who does not teach winning. He teaches kneeling before the sword.
honor.fact.argon.widow.label: Silbi the Widow
honor.fact.argon.widow.hint: A widow whose husband knelt in the square and was erased anyway. One of the few who keep the second verse woven into rite-robe linings.
honor.fact.argon.manor.label: The House Manor
honor.fact.argon.manor.hint: A manor whose gate bears the ranks. The sigil shows a lord who never knelt, but the old hall's stone says differently.
honor.fact.argon.plaza.label: The Square
honor.fact.argon.plaza.hint: Where names are cried out. Where the shame rite is held, and everyone watches an erased name.
honor.fact.argon.lineage-song.label: The House Song
honor.fact.argon.lineage-song.hint: A proud old song. The first verse sings a lord who never knelt; the lost second verse sings one who did.
honor.fact.argon.family-rank.label: The Family Rank Law
honor.fact.argon.family-rank.hint: The law by which the line you are born into becomes the order of your name. One erased line remains in the ledger.
honor.fact.argon.humiliation-rule.label: The Law of Shame
honor.fact.argon.humiliation-rule.hint: Whoever breaks face must kneel and apologize, or be struck from the rolls. The law that an insult weighs more than death.
honor.fact.argon.kneeling-lord.label: The Kneeling Founder
honor.fact.argon.kneeling-lord.hint: The first lord who knelt before an enemy's blade to save the village. The descendants sing of it turned into a boast.
honor.fact.creature.honor-braggart.label: The Braggart Duelist
honor.fact.creature.honor-braggart.hint: "Evil. One who picks fights over face. Believing that winning is glory, he lunges at anyone who offers a hilt."

# --- Argon deduction and crisis ---
honor.deduction.honor.sentence: True {3} is not a hardened face kept for show, but what is built by the {2} to speak the {1}
honor.deduction.honor.hint: "Argon gives face and family rank one name. Hear the song's second verse and the swordmaster out to the end."
honor.crisis.lineage.text: The villagers gather in the square, ordered by house. Elder Beron raises the rank ledger high and cries out. Here, where the house's name is kept, stands one who has shamed it. The heir Sion made up a song and insulted the founder. Whoever breaks face must kneel and apologize, or be struck from the rolls. Herald Luka opens the ledger, and the people hold their breath. Sion does not kneel — he stands and lifts his head. Now it is your turn to step forward.
honor.option.truth-lineage.label: Sing the second verse of the house song to the end and reveal the truth
honor.option.truth-lineage.text: You break the silence and begin to sing the house song. First the verse everyone knows, the lord who never knelt. Then the lost second verse, the kneeling lord. The founder did not flee. To save them all, he knelt before the enemy's blade. The child Arin sings along, and the widow Silbi adds her voice. The swordmaster nods, and one by one the people of the square learn the second verse. The elder lowers his ledger, and Sion does not apologize. Argon learns that honor lies not in hardening one's face, but in what the courage to speak the truth builds.
honor.option.exile-elder.label: Read out the erased line of the rank ledger and cast out the elder
honor.option.exile-elder.text: You gather the words of the recorder Madel and the mason Bastin and read aloud the erased line of the rank ledger. That topmost line once recorded the day the founder knelt to save the village, and the elder's family covered it over for generations to hide the humiliation. Elder Beron bows his head, and the square stirs. The elder is struck from the rolls and leaves the village. But the rank ledger remains, and the people begin to line up again. Argon has shed its false face, but has not yet learned how to build true honor.

