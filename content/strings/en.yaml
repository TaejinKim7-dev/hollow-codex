spirituality.ability.mind.name: The Quiet Mind
spirituality.creature.fake-monk.name: The False Monk Demanding Donations

# --- Heron, village of humility (M4 Task 40) ---
town.heron.name: Heron
humility.music.title: Heron's Breath

humility.npc.silent-elder.name: The Silent Elder
humility.npc.silent-elder.greet: …Silence.
humility.npc.silent-elder.name.t: I do not ask names. …In a moment. Speak your name. That name will find you.
humility.npc.silent-elder.job.t: I keep the silence.
humility.npc.silent-elder.silence.t: Silence is a place, not a sound.
humility.npc.silent-elder.wordname.t: A name is not spoken — it is kept. …Do you know that name?
humility.npc.silent-elder.chapel.t: The chapel. Built without words.

humility.npc.listener.name: The Listener
humility.npc.listener.greet: …I will listen.
humility.npc.listener.job.t: I do the listening.
humility.npc.listener.listening.t: Listening is not filling — it is emptying.
humility.npc.listener.three.t: Empty, and the three are heard.
humility.npc.listener.silence.t: Quietly.

humility.npc.wellkeeper.name: The Wellkeeper
humility.npc.wellkeeper.greet: The well has no words.
humility.npc.wellkeeper.job.t: I keep the well.
humility.npc.wellkeeper.wordname.t: Water has no name.
humility.npc.wellkeeper.silence-rule.t: It is the rule of giving no name. As water rises without knowing a name.

humility.npc.child.name: Village Child
humility.npc.child.greet: …They tell me to be quiet too.
humility.npc.child.job.t: I memorize songs. Without sounding them.
humility.npc.child.listening.t: Lend your ears, and you hear.
humility.npc.child.silent-chant.t: A song sung on the breath. It is sung even when unheard.

humility.npc.librarian.name: The Archive Keeper
humility.npc.librarian.greet: Books have no words. …Come in.
humility.npc.librarian.job.t: I gather blank pages.
humility.npc.librarian.three.t: There is a page where three are written. Truth, love, courage.
humility.npc.librarian.listening.t: It is listening more than reading.

humility.npc.gardener.name: The Forester
humility.npc.gardener.greet: Trees do not call names.
humility.npc.gardener.job.t: I tend the forest.
humility.npc.gardener.listening.t: The forest speaks not in sound but in breath.
humility.npc.gardener.wordname.t: Name it, and the leaf falls.

humility.npc.cook.name: The Cook
humility.npc.cook.greet: …As quietly as rice.
humility.npc.cook.job.t: I cook. Without sound.
humility.npc.cook.silence.t: Even a boiling pot makes no sound.

humility.npc.novice.name: The Novice
humility.npc.novice.greet: …I am still in training.
humility.npc.novice.job.t: I learn silence.
humility.npc.novice.silence.t: Close the mouth, and the ears open.
humility.npc.novice.wordname.t: I was taught to forget names.

humility.npc.hermit.name: The Hermit
humility.npc.hermit.greet: …Quietly. Do you not hear that sound?
humility.npc.hermit.job.t: I count my breath, hidden.
humility.npc.hermit.silence.t: Silence is not emptiness — it is a place.
humility.npc.hermit.three.t: Humility is the three all emptied.
humility.npc.hermit.listening.t: At the forest's edge stands a quiet warden. Not evil, but it silences sound.

humility.npc.widow.name: The Widow
humility.npc.widow.greet: …I have forgotten even my husband's name.
humility.npc.widow.job.t: I keep the forgotten name.
humility.npc.widow.wordname.t: The name is buried in the grave.
humility.npc.widow.listening.t: I listen quietly.

# --- Heron clues ---
humility.word.listening.label: Listening
humility.word.listening.hint: Emptying rather than filling. Heard only when the ears open in silence.
humility.word.three.label: The Three
humility.word.three.hint: Truth, love, and courage. Humility begins in a place where those three are left empty.
humility.word.name.label: Name
humility.word.name.hint: What Heron forbade. One who does not keep a name is imprisoned in the silence.
humility.fact.heron.silent-elder.label: The Silent Elder
humility.fact.heron.silent-elder.hint: The elder who keeps Heron's law of silence. He asks no names, and he demands names.
humility.fact.heron.listener.label: The Listener
humility.fact.heron.listener.hint: One who sits wordless at the side of the square. The one in Heron who has heard the longest.
humility.fact.heron.novice.label: The Novice
humility.fact.heron.novice.hint: A youth learning the discipline of silence. Learning the way to forget names.
humility.fact.heron.hermit.label: The Hermit
humility.fact.heron.hermit.hint: A hermit hidden in the woods at the village's edge. The only one who calls silence a 'place.'
humility.fact.heron.chapel-of-silence.label: The Chapel of Silence
humility.fact.heron.chapel-of-silence.hint: A chapel built without words. Heron's center, kept by the elder.
humility.fact.heron.library.label: The Empty Archive
humility.fact.heron.library.hint: An archive gathered of blank pages. On one page, three are written.
humility.fact.heron.well.label: The Wordless Well
humility.fact.heron.well.hint: A well that rises without a name. It shows Heron's hidden law.
humility.fact.heron.grove.label: The Nameless Forest
humility.fact.heron.grove.hint: A forest where naming makes the leaf fall. The trees know each other without calling.
humility.fact.heron.silent-chant.label: The Breath Song
humility.fact.heron.silent-chant.hint: A song sung without sounding it. The only song the child and the hermit know.
humility.fact.heron.breathing-rhythm.label: The Rhythm of the Breath
humility.fact.heron.breathing-rhythm.hint: The only rhythm Heron counts. Breathe in, hold, breathe out.
humility.fact.heron.silence-rule.label: The Rule of Silence
humility.fact.heron.silence-rule.hint: Heron's law. No one may speak their own name. The silence swallows all words.
humility.fact.heron.real-name.label: My Lost Name
humility.fact.heron.real-name.hint: "The elder asks: what is your name? Only keeping the name can open the silence."
humility.fact.creature.humility-silencer.label: The Warden of Silence
humility.fact.creature.humility-silencer.hint: Not evil. A being that merely silences sound. Keeping the silence is its work.

# --- Heron deduction and crisis ---
humility.deduction.humility.sentence: Humility is a place where you empty yourself before {1} and hear {3} through {2}
humility.deduction.humility.hint: Heron is a village that left all three principles empty. Before the silence, with what can you hear what? If you kept your name, what remains behind is the emptying.
humility.crisis.name.text: Villagers gather before the Chapel of Silence. The elder stands leaning on a nameless staff. 'I would now take away this village's last law. Long has a lock been kept on names. But the locking imprisoned us more. You, stranger. Speak your name. Then Heron's silence becomes an end, not a beginning.' Everyone holds their breath. Now it is your turn to open your mouth.
humility.option.speak-name.label: Speak your own name and lift the law of silence
humility.option.speak-name.text: You step forward and speak your name. The chapel echoes it. One by one, quietly, the people sing it back. The elder lays down his staff. 'A name is not for holding — it is for calling each other.' Heron's silence is reborn as a courtesy of opening the mouth. Humility is a place where the three are left empty, and after the emptying, a place where names are called again.
humility.option.stay-silent.label: Keep the silence and swallow your name
humility.option.stay-silent.text: You swallow your name and bow your head. The elder looks at you for a long while. '…Your silence too is truthful. But as long as that silence imprisons a name, Heron is still not empty.' The village disperses quietly. The law remains, but only the hermit's breath song circles the village without a sound.

