# --- Epilogue variants (M5 Task 43) ---
epilogue.truth.title: Empty Codex of Truth
epilogue.truth.prologue: You wrote the answers of the eight virtues and chose 'truth' for the last page. The codex is still empty, but the towns are beginning to face one another's truths.
epilogue.truth.honesty.text: Kalas's Office of Denunciation stood open. The ledger was no longer a wall imprisoning neighbors, but a place where people spoke facts to one another.
epilogue.truth.compassion.text: In the streets of Reona, the name of the one who begged was spoken for the first time. Compassion was not hiding — it was recognizing what is, as it is.
epilogue.truth.valor.text: Solgang's arena was quiet. Overcoming fear was no longer a strength that pressed others down, but the act of acknowledging the facts before oneself.
epilogue.truth.justice.text: Seles's courthouse returned to being a place for the living, not a grave. Justice was not covering over, but laying facts upon the scale.
epilogue.truth.sacrifice.text: Dione's altar stood empty. Whatever was offered, it began with telling the truth of what remained of oneself.
epilogue.truth.honor.text: Argon's house sigils were stripped away. Honor was not keeping a name, but revealing what was hidden behind it.
epilogue.truth.spirituality.text: Elia's meditation licenses vanished. Spirituality was not something granted, but facing the truth of this breath as it is.
epilogue.truth.humility.text: Heron's law of silence was lifted. Humility was not closing one's mouth, but a place where one could speak one's own name in truth.
epilogue.love.title: Empty Codex of Love
epilogue.love.prologue: You chose 'love' for the last page. The empty codex was not filled, but the towns find the root of virtue in caring for one another.
epilogue.love.honesty.text: Kalas's Office became a shelter. Telling the facts was no longer a way of wounding each other, but a way of staying near.
epilogue.love.compassion.text: Reona's bowls grew larger. Compassion was sharing, and while they shared, no one was alone.
epilogue.love.valor.text: Solgang's duels stopped and became hands that raised one another. Courage was not standing alone, but standing again together.
epilogue.love.justice.text: In Seles, comfort followed the verdict. Justice was not punishing, but letting live again.
epilogue.love.sacrifice.text: Nothing remained on Dione's altar. Sacrifice was not losing, but using what remains together.
epilogue.love.honor.text: Argon's houses knocked on one another's doors. Honor was not a sigil shining alone, but a name shared with a neighbor.
epilogue.love.spirituality.text: Elia's meditation became breathing together. Spirituality was not realizing alone, but knowing how to hear the breath beside you.
epilogue.love.humility.text: Heron's people called one another's names. Humility was not erasing the self, but making room to hear another's name.
epilogue.courage.title: Empty Codex of Courage
epilogue.courage.prologue: You chose 'courage' for the last page. What remains in the empty codex is the record of one step — the towns begin to walk again, past their fear.
epilogue.courage.honesty.text: Kalas's people opened the ledger themselves. What frightened them was not the records, but the years of living with them covered over.
epilogue.courage.compassion.text: In Reona, the one who begged reached out a hand first. Compassion, too, begins with the courage to offer.
epilogue.courage.valor.text: Solgang's fighters laid down their spears and went to the fields. True courage was not in fighting, but in knowing when to stop.
epilogue.courage.justice.text: Seles's court amended its old custom itself. Justice was not judging others, but the courage to change oneself.
epilogue.courage.sacrifice.text: Dione's priest knelt first before the altar. Sacrifice was not losing something, but not fearing the loss.
epilogue.courage.honor.text: Argon's heir burned the old sigil. Honor was not the courage to keep, but the courage to let go.
epilogue.courage.spirituality.text: Elia's people entered meditation without licenses. Spirituality was not waiting for permission, but the courage to stand alone.
epilogue.courage.humility.text: Heron's elder spoke his own name first. Humility was not hiding, but the courage to step forward even from a low place.