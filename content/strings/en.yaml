# --- Village people ---
npc.field.gatekeeper.name: Stone Gatekeeper
npc.field.gatekeeper.greet: A stranger, all the way to this far field. I am the gatekeeper who watches over these stones.
npc.field.gatekeeper.name.t: I have long forgotten what a name was. Once, everyone asked each other's names. Now the folk of Kalas ask for confession records before names.
npc.field.gatekeeper.job.t: My work is keeping the stones the pilgrims left behind. Three hundred years ago, a pilgrim walked in among these stones. The village has been different ever since.
npc.field.gatekeeper.pilgrim.t: The pilgrim taught not with words but by deeds. One saying he left behind — that no one can write the truth for another.
npc.field.gatekeeper.archive.t: The old archive… a place Kalas sealed away as forbidden ground. Everyone insists they have forgotten it, and yet they probe about it before even passing the gate.

npc.field.hunter.name: The Hunter
npc.field.hunter.greet: Shh, quietly. There are wolves howling across the river.
npc.field.hunter.name.t: A name… nothing comes when you call it, so just call me the Hunter.
npc.field.hunter.job.t: I'm someone who lives with the wolves of the field. At first I nocked arrows at them. They were hard to reach. But the wolves were only hungry, never evil.

npc.kalas.confessor.name: Gate Confessor
npc.kalas.confessor.greet: Before you step past the gate, let me ask one thing first. What wrong have you done today?
npc.kalas.confessor.name.t: I am the one who takes the confessions of those passing the gate. Kalas does not begin with suspicion. It begins with confession.
npc.kalas.confessor.job.guilty.t: But from the look of your clothes, something is weighing on you. Have you entered the forbidden ground? If you have, that is what must be confessed first.
npc.kalas.confessor.job.t: Confession is the work. Ten, twenty times a day people speak the wrongs they have done and I write them down. Those who do not speak must denounce those who do… absurd, and yet it has become this village's way.
option.confess-yes.label: I entered.
option.confess-yes.text: I will take the confession. Kalas punishes no one who admits it, so move freely within the village.
option.confess-no.label: No, I did not enter.
option.confess-no.text: …Hm. There is a blur of ambiguity in that answer. A confession must be clear. I will record today's wavering words.

npc.kalas.warden.name: Chief Denouncer
npc.kalas.warden.greet: This is the Kalas Office of Denunciation. State your identity. No — before that, tell me how you know about last night.
npc.kalas.warden.name.t: Call me the chief, who oversees all the denunciations of this village. Here, records are presented before names; that is the courtesy.
npc.kalas.warden.job.t: The Office's work is to examine every record. Who hid what, and when — it must always remain in the ledgers. Kalas believes records protect the village. Of course, trials are decided by the ledger too.
npc.kalas.warden.lantern.t: The lantern in the square… that night the square was empty. I was sorting scrolls at the office. That is all.
npc.kalas.warden.trial.witness.t: The trial will open five days from now. But the apprentice scribe will not open her mouth. This is a situation that needs testimony. You there — do you know anything about that child?
npc.kalas.warden.trial.t: Kalas's trials proceed by public confession. Without a witness, a verdict rests on a confession alone. That is why confession matters above all.
option.tell-warden.label: Tobi saw that night.
option.tell-warden.text: …My sibling's name comes up. This could make sufficient testimony. I'll put it in the record. It will surely be used in this trial.
option.deny-warden.label: I know nothing about that child.
option.deny-warden.text: Hm, your answer wavers. In court, do not forget that every word you speak becomes a record.

npc.kalas.elin.name: Elin, Apprentice Denouncer
npc.kalas.elin.greet: Well met. I am Elin, apprentice denouncer. I am learning the law of records at the chief's side.
npc.kalas.elin.name.t: I'm Elin. I grew up in the Office since I was small. The people here took me in, so I would become someone who never betrays records.
npc.kalas.elin.job.t: I keep the ledgers. I like copying letters neatly and exactly. But lately I have been watching the ledgers turned to hurting people.
npc.kalas.elin.ledger.t: When the letters of a ledger cover someone's name… I am only an apprentice, so I can say nothing, but I have seen the ledger become a weapon that stabs neighbors.

npc.kalas.nia.name: Nia the Scribe
npc.kalas.nia.greet: …I'm sorry, I can't take a confession right now. I have become someone who must confess too.
npc.kalas.nia.name.t: I'm Nia. I was the scribe who wrote down people's confessions at the Office. …That 'was' tastes bitter.
npc.kalas.nia.job.t: A scribe's work is to copy other people's words most exactly. To keep others' words I had to trim my own, and what I guarded most firmly was… silence.
npc.kalas.nia.lantern.t: I'm the one who broke the lantern. That night, alone in the square, I was careless. That's all.
npc.kalas.nia.ledger.t: If it's about the ledger — I can speak now, now that I believe what Tobi saw. I no longer hate that person. They must have needed someone's record too.

npc.kalas.tobi.name: Tobi, Nia's Brother
npc.kalas.tobi.greet: Oh, hi… are you here to see my big sister? Then that's a relief. No — nothing, nothing.
npc.kalas.tobi.name.t: I'm Tobi. My sister's name is Nia. Nia can't lie, so people trusted her and told her everything. So she spent her whole life keeping those words.
npc.kalas.tobi.nia.t: Nia is in the holding room now. The one who took people's confessions is now waiting on her own. I feel like I'm doing something wrong.
npc.kalas.tobi.lantern.t: …That night, I slept on the roof south of the square. Someone climbed onto the lantern and shattered its glass. That man was the chief of the Office. But because Nia never once spoke my name, I have kept my mouth shut too… until now.

npc.kalas.mira.name: Mira the Weaver
npc.kalas.mira.greet: Come here. I can't make you cloth, but I can spare you a story.
npc.kalas.mira.name.t: I'm Mira. I've worked thread for eight years. Thread is honest — loose or taut, you can feel it all in the fingertips. Thread is the only thing I trust in this village.
npc.kalas.mira.job.t: I weave cloth. I sell it at market, and sometimes I take the wrapping of the Office's scrolls.
npc.kalas.mira.lantern.t: Ah, that story has reached you already. I picked up a piece of the lantern in the square. It was bound tightly in thread. Someone meant to hide the piece. Take it if you need it.
npc.kalas.mira.ledger.t: Every year the Office's scrolls grow a bundle thicker. Last year a neighbor's child's slip of the tongue was recorded, and the family had to leave the village. That ledger does not keep the truth — it piles up suspicion.

npc.kalas.child.name: Village Child
npc.kalas.child.greet: Whoa, a stranger! Do you know the square's song?
npc.kalas.child.name.t: I have lots of names but I forgot them all! Just call me Me. That's how it is for all the kids here.
npc.kalas.child.job.t: My job is singing! When the moon rises, we all gather in the square and sing the lantern song. Then even the adults stop and listen. Want me to sing it for you?

npc.kalas.innkeeper.name: The Innkeeper
npc.kalas.innkeeper.greet: Welcome in! The rooms are all empty, so sleep easy. By Kalas custom, a roof is given free of charge.
npc.kalas.innkeeper.name.t: Just an ordinary innkeeper. But in Kalas even 'ordinary' arouses suspicion, so just call me the innkeeper.
npc.kalas.innkeeper.job.t: I run an inn — trading passing guests for village news. The talk these days is all about Nia the scribe. Such a good-natured girl. There's also a rumor that a trial will be held in five days.
npc.kalas.innkeeper.trial.t: Now that you mention the trial, there's a rumor the Office has hidden away some old document somewhere. The likeliest place is that old archive. But it's forbidden ground, so whoever enters must confess.

npc.kalas.librarian.name: The Old Librarian
npc.kalas.librarian.greet: …Ah, another one who comes down to this cramped place. Welcome. Books you can touch are all that remain now.
npc.kalas.librarian.name.t: I was the librarian who kept the old archive. Now I live hidden deep in this cellar, but a book is not a wall — it is something to hold in your hands.
npc.kalas.librarian.pilgrim.t: If it's the pilgrim's story, look at that letter. Three hundred years ago the pilgrim left it for this village. I have kept it, waiting for the day someone understands its meaning.
npc.kalas.librarian.job.t: My work was teaching the children and keeping the records. Those grave robbers each came with their own tale and broke through this archive's walls. I have watched people fall to greed for so long that I can spot it at a glance now.

# --- Clue labels and hints ---
word.pilgrim.label: Pilgrim
word.pilgrim.hint: The one who came in among the stones three hundred years ago and lived all eight virtues. He left behind that no one can write the truth for another.
word.truth.label: Truth
word.truth.hint: A single line left by the pilgrim. Kalas's ledger is covering something.
word.weapon.label: Weapon
word.weapon.hint: When records hurt people, they are no longer truth.
word.lantern.label: Lantern
word.lantern.hint: Since the night the square's lantern went out, someone's story has begun to go out too.
word.duty.label: Duty
word.duty.hint: In this village confession is a duty. The duty of not being suspected.
word.ledger.label: Ledger
word.ledger.hint: The Office's scrolls. A place where a neighbor's name grows by one line.
word.silence.label: Silence
word.silence.hint: What the scribe kept to the very end. Because keeping is sometimes the falling.
word.confession.label: Confession
word.confession.hint: Not speaking a sin, but laying bare what was left unsaid.
word.trial.label: Trial
word.trial.hint: In five days, the trial of the apprentice scribe will open.
fact.kalas.nia.label: Nia the Scribe
fact.kalas.nia.hint: The scribe who wrote down people's confessions at the Office. Now she waits on her own confession.
fact.kalas.tobi.label: Tobi, Nia's Brother
fact.kalas.tobi.hint: A boy who knows what his sister means to protect. He remembers the night he slept on a rooftop.
fact.kalas.archive.label: The Old Archive
fact.kalas.archive.hint: Forbidden ground sealed by the Office. Whoever enters must confess.
fact.song.lantern-song.label: The Lantern Song
fact.song.lantern-song.hint: A song the children sing in the square. Someone's name is missing from its words.
fact.creature.wolf-hungry.label: The Hungry Wolf
fact.creature.wolf-hungry.hint: The wolf is only hungry, never evil. A frightened beast waits for understanding before the arrow.
fact.creature.robber-greed.label: The Grave Robber
fact.creature.robber-greed.hint: Those who broke through the wall with their own tales. Greed ran ahead of their walking.
fact.kalas.lantern-shard.label: Thread-Wound Lantern Shard
fact.kalas.lantern-shard.hint: A piece fallen from the square's lantern. Someone wound it in thread to hide it.
fact.kalas.brother-witness.label: Tobi's Confession
fact.kalas.brother-witness.hint: What he saw from the roof that night. The child opened his mouth for the first time.
fact.kalas.pilgrim-letter.label: The Pilgrim's Letter
fact.kalas.pilgrim-letter.hint: The letter the pilgrim left for this village, kept all along by the librarian.
fact.kalas.ledger-doubt.label: Doubting the Ledger
fact.kalas.ledger-doubt.hint: Those who believed the ledger kept the truth are beginning, little by little, to show their cracks.
fact.kalas.elin-forgiven.label: Nia's Forgiveness
fact.kalas.elin-forgiven.hint: The place where the scribe at last unbound the silence she kept. It was a letting-go instead of hatred.

# --- Deduction ---
deduction.honesty.sentence: Honesty is writing {1} not as {2} but as {3}
deduction.honesty.hint: Kalas hardened honesty into records. The meaning the pilgrim left lies on the other side of that.

# --- Crisis ---
crisis.kalas.trial.text: People of the square gather before the Office. The trial that has been closed for five days opens. The chief denouncer unrolls a scroll and speaks. 'This scribe, Nia, broke the square's lantern and failed to report it. A confession already exists; testimony is unnecessary.' The crowd stirs. Someone among the people looks at you. Now it is your turn to step forward.
option.truth.label: Produce Tobi's testimony and the lantern shard
option.truth.text: You present Tobi's words and the thread-wound lantern shard. 'Whoever hid this shard is the one who broke the lantern.' In a trembling voice, Tobi tells what he saw from the roof. The people turn to the chief denouncer. Nia's silence is at last understood, and the ledger keeps the truth.
option.lantern.label: Read the pilgrim's letter
option.lantern.text: You take out the pilgrim's letter and read it. 'Do not write the truth as a weapon; light it as a lantern.' The chief's ledger goes into the fire, and the extinguished lantern in the square is lit again. Truth standing before records — that is Kalas's new beginning.

