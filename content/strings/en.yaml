# --- Village people ---
npc.field.gatekeeper.name: Stone Gatekeeper
npc.field.gatekeeper.greet: A stranger, all the way out to this far field. I am the gatekeeper who watches over these stones.
npc.field.gatekeeper.name.t: I have lived so long I forgot what a name was. Once, everyone asked each other's names. These days the people of Kalas ask for your confession record before anything else.
npc.field.gatekeeper.job.t: I keep the standing stones the pilgrim left behind. Three hundred years ago a pilgrim walked in among these stones. Kalas has not been the same since.
npc.field.gatekeeper.pilgrim.t: The pilgrim never taught with words; he showed it by living. He left one saying behind — that no one can write the truth for another.
npc.field.gatekeeper.archive.t: The old archive… Kalas sealed it away as forbidden ground. Everyone swears they have forgotten it. Then why do they ask about it before you even pass the gate?
npc.field.gatekeeper.lantern.t: The lantern in the square — I was told it carries on the first flame the pilgrim lit among these stones. A fire is lit by human hands, and when one goes out, there has always been a hand behind that too. The song about that flame once had a name in it; at some point the children began leaving that place empty.
npc.field.gatekeeper.silence.t: These stones have stood silent for three hundred years and never once told a lie. Silence and lying are different things. People today treat them as the same.

npc.field.hunter.name: The Hunter
npc.field.hunter.greet: Shh, quietly. There are wolves howling across the river.
npc.field.hunter.name.t: A name… nothing comes when you call it anyway. Just call me the Hunter.
npc.field.hunter.job.t: I live out here beside the wolves of the field. At first I aimed arrows at them. Then I saw they were only starving, not evil.
npc.field.hunter.wolf.t: Weapons? I still keep the bow, but I don't use it on the wolves. There's one she-wolf, the thinnest of them. She won't touch her own share; it all goes to the pups. Could you aim at that? A frightened animal calms down once you hold your own breath first.
npc.field.hunter.confession.t: Confession? I haven't crossed Kalas's gate in ages. In there you can't even breathe without owing a confession. Out here the wolves hear mine. They never answer, though.
npc.field.peddler.name: Field Peddler
npc.field.peddler.greet: Hey, traveler! Lighten your heart's load before you reach the gate. I can't carry it for you, but I've got candy.
npc.field.peddler.name.t: I sold my name. Names sell well in Kalas. …Joking. Call me the peddler.
npc.field.peddler.job.t: I carry goods from village to village, not rumors. Rumors are heavy and goods are light. At every village gate they ask the same thing — not your name, but whether you've something to confess.
npc.field.peddler.confession.t: The people of Kalas buy and sell each other's confessions. Not with real money, of course. But there's no doubt a price is set. The worse the confession, the dearer it's counted.
npc.field.peddler.ledger.t: They say this village is stripping a whole mountain bare to feed its ledgers with paper. I don't sell paper myself, but the ones who buy it know.

npc.kalas.confessor.name: Gate Confessor
npc.kalas.confessor.greet: Before you step past the gate, let me ask one thing first. What wrong have you done today?
npc.kalas.confessor.name.t: I am the one who takes the confessions of those passing the gate. Kalas does not begin with suspicion. It begins with confession.
npc.kalas.confessor.job.guilty.t: Judging by your clothes, something is weighing on you. Have you entered the forbidden ground? If you have, that is the first thing you must confess.
npc.kalas.confessor.job.t: Confession is the work. Ten, twenty times a day, people speak their wrongs and I write them down. Those who don't speak must denounce those who do… a ridiculous thing, but it has become this village's work.
npc.kalas.confessor.duty.t: Duty… in the beginning it was a way to set down the weight on your heart. Some year, it became something you must set down or else. The weight is the same; only its name changed.
npc.kalas.confessor.nia.t: Nia is the girl who wrote down every confession I took, without missing a day. Never once did she copy a word wrongly. So this confession too… no. It is not for me to say.
option.confess-yes.label: I entered.
option.confess-yes.text: I will take the confession. Kalas punishes no one who admits it, so move freely within the village.
option.confess-no.label: No, I did not enter.
option.confess-no.text: …Hm. Your answer trails off. A confession must be clear. I will record today's wavering reply.

npc.kalas.warden.name: Chief Denouncer
npc.kalas.warden.greet: This is the Kalas Office of Denunciation. State your identity. …No, first I would hear what you were doing near the square last night.
npc.kalas.warden.name.t: I am the chief of the Office. Here, one gives one's record before one's name; that is the courtesy.
npc.kalas.warden.job.t: The Office's work is to examine every record. Who hid what, and when — it must always remain in the ledger. Kalas believes records protect the village. Trials, too, take the ledger as evidence.
npc.kalas.warden.lantern.t: The lantern in the square… that night the square was empty. I was sorting scrolls at the Office. That is all.
npc.kalas.warden.trial.witness.t: The trial opens in five days. Yet the scribe will not open her mouth. We need testimony. You there — do you know anything about that girl?
npc.kalas.warden.trial.t: Trials in Kalas proceed by public confession. Without a witness, a confession alone decides the verdict. That is why confession matters above all.
npc.kalas.warden.silence.t: Silence is louder than confession. One who does not speak leaves a blank in the ledger, and a blank always invites suspicion. I keep records to cover that suspicion.
npc.kalas.warden.confession.t: Confession is the frame that holds this village up. Before records, a single rumor drove a whole family out of the village. After that we chose to write words down. We believed a ledger was better than a rumor. I still wish to believe it.
npc.kalas.warden.nia.t: That girl has copied at my side for ten years. Never once has she spoken a falsehood. So if there is a confession, it is fact. …Is it not?
npc.kalas.warden.song.t: The ledger… as a boy I sang the lantern song, and the gap in its words bothered me enough that I once searched the ledgers. There was no answer. That something exists in this village without a record still troubles me.
option.tell-warden.label: Tobi saw that night.
option.tell-warden.text: …So the brother's name comes up. That will make sufficient testimony. I shall enter it in the record. It will be used at this trial.
option.deny-warden.label: I know nothing about that child.
option.deny-warden.text: Hm, your answer falters. In court, do not forget that every word you speak becomes a record.

npc.kalas.elin.name: Elin, Apprentice Denouncer
npc.kalas.elin.greet: Pleased to meet you. I am Elin, apprentice at the Office. I am learning the law of records at the chief's side.
npc.kalas.elin.name.t: I'm Elin. I grew up in the Office since I was small. The people here took me in, so I would become someone who never betrays records.
npc.kalas.elin.job.t: I keep the ledgers. I like copying letters neatly and exactly. But lately… I can't stop worrying about whom those letters are aimed at.
npc.kalas.elin.ledger.t: When the letters of a ledger cover someone's name… I am only an apprentice, so I can say nothing, but I have seen the ledger become a weapon that stabs neighbors.
npc.kalas.elin.nia.t: Senior Nia is the one who corrected my handwriting. Instead of striking out a wrong letter, she wrote the right one small beside it. That she would break a lantern and say nothing about it — I know better than anyone that she wouldn't.
npc.kalas.elin.trial.t: The trial is in five days. I'll only be taking the record from behind the gallery. …I only just learned that the one who records can't stop anything.
npc.kalas.elin.archive.t: I once sneaked to the old archive as a child. Dust drifted out through the crack of the door. That day I first thought there might be stories that aren't in the ledgers.

npc.kalas.nia.name: Nia the Scribe
npc.kalas.nia.greet: …I'm sorry, I can't take a confession right now. I have become someone who must confess too.
npc.kalas.nia.name.t: I'm Nia. I was the scribe who wrote down people's confessions at the Office. …That 'was' tastes bitter.
npc.kalas.nia.job.t: A scribe's work is to copy other people's words most exactly. To keep others' words I had to trim my own, and what I guarded most firmly was… silence.
npc.kalas.nia.lantern.t: I'm the one who broke the lantern. That night, alone in the square, I was careless. That's all.
npc.kalas.nia.ledger.t: If it's about the ledger — I can speak now, now that I believe what Tobi saw. I no longer hate that person. They must have needed someone's record too.
npc.kalas.nia.confession.t: A confession… I wish it could take down even the words that were never said. I always leave the last page of a ledger blank, a seat for the words people never managed to say.
npc.kalas.nia.tobi.t: Tobi has a habit of sleeping on rooftops. He says the stars are closer. …Please don't ask about that night. I'm begging you.
npc.kalas.nia.truth.t: I was taught that truth isn't written, it's kept. But no one ever taught me whom it is kept for.
npc.kalas.nia.trial.t: I'm not afraid of the trial. What I'm afraid of is… no. It's nothing.

npc.kalas.tobi.name: Tobi, Nia's Brother
npc.kalas.tobi.greet: Oh, hello… are you here to see my sister? Then that's a relief. …No, it's nothing, really.
npc.kalas.tobi.name.t: I'm Tobi. My sister is Nia. Nia can't lie, so people trusted her and told her everything. She was so busy keeping their words that she never got to say her own.
npc.kalas.tobi.nia.t: Nia is in the holding room now. The one who took people's confessions is now waiting on her own. I feel like I'm doing something wrong.
npc.kalas.tobi.lantern.t: …That night I slept on the roof south of the square. Someone climbed up to the lantern and… smashed the glass. It was the chief. Because my sister never once said my name, I've kept quiet too, until now.
npc.kalas.tobi.silence.t: Keeping quiet — my sister is good at it, but I'm not. The words keep climbing up to my throat. When the lantern song reaches the name, everybody just moves their mouths, and I breathe there. …How does she hold them in?
npc.kalas.tobi.ledger.t: When my sister's name went into the ledger… it felt like I could hear the ledger growing thicker. My kite is made of that paper — the back of a thrown-away scroll. I picked only the side with no writing.
npc.kalas.tobi.archive.t: The archive? Nia told me never to go there. But… she said there's a very old story inside. Her eyes only sparkled when she talked about it.

npc.kalas.mira.name: Mira the Weaver
npc.kalas.mira.greet: Come here. I can't make you cloth, but I can spare you a story.
npc.kalas.mira.name.t: I'm Mira. Eight years at the thread. Thread is honest — loose or taut, you feel it all in your fingertips. In this village, thread is the only thing I trust.
npc.kalas.mira.job.t: I weave cloth. I sell it at market, and sometimes I do the tying of the Office's scrolls.
npc.kalas.mira.lantern.t: Ah, that story has reached you already. I picked up a piece of the lantern in the square. It was wound tight in thread. Someone meant to hide it. I know that thread — it's what ties the Office's scrolls. I twisted it myself. Take the piece if you need it.
npc.kalas.mira.ledger.t: Every year the Office's scrolls grow a bundle thicker. Last year even a neighbor's child's slip of the tongue got recorded, and that family had to leave the village. That ledger doesn't keep the truth. It piles up suspicion.
npc.kalas.mira.silence.t: A person who says nothing is like a taut thread. They look like they can hold forever, but once it snaps, the knot remains when you rejoin it. Nia is that kind of girl.
npc.kalas.mira.nia.t: I wove Nia's apron. Someone from the Office came to order it and said, 'make it a color that says nothing.' So I wove it gray-green. Only now do I think I understand what that meant.
npc.kalas.mira.confession.t: I don't do confessions. If a lie goes into thread, the cloth comes out crooked. That's enough for me.

npc.kalas.child.name: Village Child
npc.kalas.child.greet: Whoa, a stranger! Do you know the square's song?
npc.kalas.child.name.t: I have lots of names but I forgot them all! Just call me 'Hey you.' That's how it is for all the kids here.
npc.kalas.child.job.t: My job is singing! When the moon rises, we all gather in the square and sing the lantern song. Then even the adults stop and listen. Want me to sing it for you?
npc.kalas.child.song.t: Want me to sing the lantern song? 'When the moon rises we light the flame, the flame that ○○ lit. Let it never go out all night.' At the name, everybody shuts their mouths together. I don't know why. It's the rule.
npc.kalas.child.ledger.t: The ledger? That super thick one? They say my name is in there a bunch of times! Because I have lots of names!
npc.kalas.child.trial.t: A trial? All the grown-ups gather? Then can I sing in the square that day? …Oh. I guess not.

npc.kalas.innkeeper.name: The Innkeeper
npc.kalas.innkeeper.greet: Welcome in! The rooms are all empty, so sleep easy. By Kalas custom, a roof is given free of charge.
npc.kalas.innkeeper.name.t: Just an ordinary innkeeper. But in Kalas even 'ordinary' arouses suspicion, so just call me the innkeeper.
npc.kalas.innkeeper.job.t: I run an inn — trading news of the village with passing guests. These days everyone's talk is the scribe Nia. Such a good girl. And there's a rumor going round that a trial opens in five days.
npc.kalas.innkeeper.trial.t: Now that you mention the trial, there's a rumor the Office keeps some hidden old document somewhere. The likeliest place is that old archive. But it's forbidden ground, and whoever goes in must confess.
npc.kalas.innkeeper.lantern.t: A guest was staying here that night, but… no, he says he saw nothing. This inn gives a roof free of charge, but what a person saw is not given away free.
npc.kalas.innkeeper.confession.t: I denounce someone about once a month myself — over something small. If I didn't, that would look suspicious. A shameful thing, but… it's how one lives in this village.
npc.kalas.innkeeper.ledger.t: The thicker the ledger grows, the quieter the inn gets. Guests hold their tongues, so rumors stop going round. Quiet is comfortable, but… now and then I miss a noisy day.
npc.kalas.innkeeper.nia.t: Nia used to sit in the corner of my place now and then, murmuring to herself as she wrote. It was clearly no confession. It was good to see a girl who only ever copied others' words writing her own.

npc.kalas.librarian.name: The Old Librarian
npc.kalas.librarian.greet: …Ah, another one who comes down to this cramped place. Welcome. Books you can touch are all that remain now.
npc.kalas.librarian.name.t: I was the librarian who kept the old archive. Now I live hidden deep in this cellar, but a book is not a wall — it is something to hold in your hands.
npc.kalas.librarian.pilgrim.t: If it's the pilgrim's story, look at that letter. Three hundred years ago the pilgrim left it for this village. I have kept it, waiting for the day someone understands its meaning.
npc.kalas.librarian.job.t: My work was teaching the children and keeping the records. Those tomb-robbers each came with their own tale and broke through this archive's wall. I have watched people fall to greed for so long that I can spot the signs at a glance.
npc.kalas.librarian.archive.t: This is the room left of the old archive. The shelves above were sealed by the Office, and the key was lost long ago. Only grave-robbers ever broke in. Those who came to steal the books and those who wished to hide them — I cannot say which did the archive more harm.
npc.kalas.librarian.truth.t: I have always believed truth is not written in a ledger but read in a book. One person writes it, many read it, and so what is read is less lonely.
npc.kalas.librarian.ledger.t: A ledger is a book in which one person writes down another. A book in the archive is one a person leaves for another. Both are paper, but they point in opposite directions.
npc.kalas.jailer.name: Holding-Room Warder
npc.kalas.jailer.greet: No visitors. …It's the rules. I'm sorry about it myself.
npc.kalas.jailer.name.t: I'm the warder. My name is in the ledger. Here, that counts as a name.
npc.kalas.jailer.job.t: I guard the holding room. Not for fear the prisoners will flee, but for fear someone from outside will come in. People who wish to confess always want to get inside.
npc.kalas.jailer.nia.t: The scribe has never once made a fuss all day. Only at night she writes letters in the air with her finger. I would like to give her paper, but it isn't in the rules.
npc.kalas.jailer.trial.t: On the day of the trial I will bring out two things — the scribe, and the key to this room. It is the first time the key has felt this heavy.
npc.kalas.baker.name: Baker
npc.kalas.baker.greet: Fresh out of the oven. Come before it cools. Bread costs money — custom only covers the roof.
npc.kalas.baker.name.t: Just call me the bread lady. Names are for ledgers.
npc.kalas.baker.job.t: I knead dough from three in the morning. Bread can't hide anything. Underbaked, the middle is raw; burnt, the crust turns black. I wish people were like that.
npc.kalas.baker.tobi.t: That Tobi always folds a piece of bread to carry home for his sister. I don't charge him. I don't put it in the ledger either.
npc.kalas.baker.silence.t: The quiet ones eat the most. They fill their mouths instead of speaking. Nia was like that. …These days she just walks past the bakery.
npc.kalas.patrol-a.name: Young Patrol Guard
npc.kalas.patrol-a.greet: Halt! …Ah, no, please stop there. This is a confession patrol. Do you have anything to confess?
npc.kalas.patrol-a.name.t: Third year on patrol. My name… is still only one line in the ledger.
npc.kalas.patrol-a.job.t: I walk the square and alleys to see that no one has left something unconfessed. If there is no one, my patrol succeeds; if there is… that, too, I was taught, is a success. Strange, isn't it.
npc.kalas.patrol-a.confession.t: To those who have confessed, I show this armband. See? With it, you are safe for today. You must earn it again tomorrow, though.
npc.kalas.patrol-a.lantern.t: That night wasn't my shift. It was my turn to patrol the square, but the chief said he'd stand in for me. He was strangely kind about it, so I remember.
npc.field.patrol.name: Old Patrol Guard
npc.field.patrol.greet: Hey, you. By the way you walk, that's the step of someone with plenty to confess. Joking. Half of it.
npc.field.patrol.name.t: My name? Twenty years on patrol. It wore away in the meantime.
npc.field.patrol.job.t: I keep watch over the night. At first it was to stop thieves. Now it's to stop words from leaking. More words leak than things get stolen.
npc.field.patrol.ledger.t: My name is in the ledger twelve times. All trivial. Wearing mismatched shoes, that sort of thing. Still, twelve lines make a man doubted twelve times.
npc.field.patrol.truth.t: You can't patrol truth away. It climbs over walls and leaks out of windows. My job has been pretending not to see it.
npc.field.herbalist.name: Herb Seller
npc.field.herbalist.greet: Welcome, welcome! Chickweed for a cough, mugwort for sleeplessness, and for the heart… for the heart there's no cure.
npc.field.herbalist.name.t: My name? I remember a hundred herb names but forget my own sometimes. Just call me the herb seller.
npc.field.herbalist.job.t: I pick herbs in the hills and fields, dry them and sell them. A plant says nothing, but its color and smell tell you everything. If only people were like plants, there'd be nothing to confess.
npc.field.herbalist.truth.t: Truth is like an herb — dried and stored, only the bitterness is left. It heals only when used fresh from the stem.
npc.field.herbalist.archive.t: There's one kind of plant at the foot of the old archive wall. It comes up in the same spot every year, even after the door was shut. People may forget, but plants seem not to.
npc.kalas.bellringer.name: Bell-Ringer
npc.kalas.bellringer.greet: Oh, did you hear it? I haven't rung yet today. …Still, there are days when your ears ring on their own.
npc.kalas.bellringer.name.t: I'm just the bell-ringer. A bell doesn't ask for names. You strike it and it sounds, that's all.
npc.kalas.bellringer.job.t: Three times a day, at confession hours, I ring the bell. When it sounds, people open their mouths; when it stops, they close them. I suppose I open and shut the village's mouth.
npc.kalas.bellringer.lantern.t: I didn't ring the bell that night. The moon was too bright. …But in the dead of night I heard glass break. It was clearer than the bell.
npc.kalas.bellringer.song.t: Silence… that makes me think of the empty name in the lantern song. When the song starts my hand goes to the bell rope on its own, but at that empty place even the bell stays still. They say the first note of the song was taken from the bell.
npc.field.aspirant.name: Would-Be Pilgrim
npc.field.aspirant.greet: Are you a pilgrim? You came past the standing stones, didn't you? I'm going to visit all eight villages!
npc.field.aspirant.name.t: If I say my name it might go in the ledger… no, I'm joking. But maybe it really is better not to.
npc.field.aspirant.job.t: I don't do anything yet. Pilgrimage is the job. I want to walk the way the pilgrim walked three hundred years ago.
npc.field.aspirant.pilgrim.t: They say the pilgrim taught by deeds rather than words, and that's the hardest part for me. I always ask before I act. …How was it for you?
npc.field.aspirant.truth.t: I came looking for truth, but in Kalas everyone writes the truth down first and then begins. How do you look for a truth that is already written?
npc.kalas.neighbor.name: Nia's Old Neighbor
npc.kalas.neighbor.greet: Goodness, a new face. Do you have business at Nia's house? There's no one there now.
npc.kalas.neighbor.name.t: Just call me the old neighbor. I've lived next door since Nia was little, so that's older than my name.
npc.kalas.neighbor.job.t: All my life I've done laundry and shelled beans in this alley. In between, Nia went from child to woman and Tobi was born. I raised those two as good as with my own hands.
npc.kalas.neighbor.nia.t: Even as a child she couldn't lie. Even when her mother told her to say she was sick, her face spoke first. …That such a girl confessed — how did that mouth ever say it?
npc.kalas.neighbor.ledger.t: They say my old man's name was in the ledger too. I only found out after he died. I never saw what sin it was. The ledger doesn't seem to erase even a dead man's name.
npc.kalas.clerk.name: Office Clerk
npc.kalas.clerk.greet: Ah, um… if you have business with the chief, he's over there. I'm only someone who copies things down.
npc.kalas.clerk.name.t: I'm a clerk. A clerk doesn't write a name, he writes a line. I am line forty-one.
npc.kalas.clerk.job.t: At night I copy over the ledgers written by day. One wrong letter and I start again from the top. So I'm confident about letters. About the people behind them… I'm not.
npc.kalas.clerk.ledger.t: Copying last night I saw something odd. The writing on the square lantern entry differed from what I'd seen by day. My eyes must have been wrong. I decided to think so.
npc.kalas.clerk.lantern.t: The morning after, the chief came in wearing gloves. He said he'd hurt his hand. …It wasn't mine to record, so I didn't write it down.

# --- Clue labels and hints ---
word.pilgrim.label: Pilgrim
word.pilgrim.hint: The one who came in among the stones three hundred years ago and lived all eight virtues. He left behind that no one can write what is real for another.
word.truth.label: Truth
word.truth.hint: What the pilgrim's single line points to. What the ledger says and what actually happened are not the same.
word.weapon.label: Weapon
word.weapon.hint: "When records hurt people, they no longer keep what is real."
word.lantern.label: Lantern
word.lantern.hint: "Since the night the square's light went out, someone's story has begun to go out too."
word.duty.label: Duty
word.duty.hint: In this village confession is a duty. The duty of not being suspected.
word.ledger.label: Ledger
word.ledger.hint: The Office's scrolls. A place where a neighbor's name grows by one line.
word.silence.label: Silence
word.silence.hint: What the scribe kept to the very end. It was the price of erasing her own words to protect others'.
word.confession.label: Confession
word.confession.hint: Not speaking a sin, but laying bare what was left unsaid.
word.trial.label: Trial
word.trial.hint: In five days, the scribe's trial will open.
fact.kalas.nia.label: Nia the Scribe
fact.kalas.nia.hint: The scribe who wrote down people's confessions at the Office. Now she waits on her own confession.
fact.kalas.tobi.label: Tobi, Nia's Brother
fact.kalas.tobi.hint: A boy who knows what his sister means to protect. He remembers the night he slept on a rooftop.
fact.kalas.archive.label: The Old Archive
fact.kalas.archive.hint: Forbidden ground sealed by the Office. Whoever enters must confess.
fact.song.lantern-song.label: The Lantern Song
fact.song.lantern-song.hint: A song the children sing in the square. Someone's name is missing from its words.
fact.creature.wolf-hungry.label: The Hungry Wolf
fact.creature.wolf-hungry.hint: The wolf is only hungry, never evil. A frightened beast waits for understanding before the arrow.
fact.creature.robber-greed.label: The Grave Robber
fact.creature.robber-greed.hint: Those who broke through the wall with their own tales. Greed ran ahead of their walking.
fact.kalas.lantern-shard.label: Thread-Wound Lantern Shard
fact.kalas.lantern-shard.hint: "A piece fallen from the square's lamp. Someone wound it in thread to hide it."
fact.kalas.brother-witness.label: Tobi's Confession
fact.kalas.brother-witness.hint: What he saw from the roof that night. The child opened his mouth for the first time.
fact.kalas.pilgrim-letter.label: The Pilgrim's Letter
fact.kalas.pilgrim-letter.hint: The letter the pilgrim left for this village, kept all along by the librarian.
fact.kalas.ledger-doubt.label: Doubting the Ledger
fact.kalas.ledger-doubt.hint: "Those who believed the ledger kept the facts are beginning, little by little, to show their cracks."
fact.kalas.elin-forgiven.label: Nia's Forgiveness
fact.kalas.elin-forgiven.hint: "The place where the scribe at last let go of the secret she kept. It was a letting-go instead of hatred."

# --- Deduction ---
deduction.honesty.sentence: Honesty is writing {1} not as {2} but as {3}
deduction.honesty.hint: Kalas hardened honesty into records. The meaning the pilgrim left lies on the other side of that.

# --- Crisis ---
crisis.kalas.trial.text: The people of the square gather before the Office. The trial they have waited five days for opens. The chief unrolls a scroll and speaks. "The scribe Nia broke the square's lantern and did not report it. A confession already exists; testimony is unnecessary." The crowd stirs. Someone among them looks at you. Now it is your turn to step forward.
option.truth.label: Produce Tobi's testimony and the lantern shard
option.truth.text: You present Tobi's words and the thread-wound lantern shard. 'Whoever hid this shard is the one who broke the lantern.' In a trembling voice, Tobi tells what he saw from the roof. The people turn to the chief denouncer. Nia's silence is at last understood, and the ledger keeps the truth.
option.lantern.label: Read the pilgrim's letter
option.lantern.text: You take out the pilgrim's letter and read it. 'Do not write the truth as a weapon; light it as a lantern.' The chief's ledger goes into the fire, and the extinguished lantern in the square is lit again. Truth standing before records — that is Kalas's new beginning.

