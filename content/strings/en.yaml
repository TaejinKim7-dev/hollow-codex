# --- Solgang, village of valor (M3 Task 34) ---
town.solgang.name: Solgang
valor.music.title: Solgang's Duelist

valor.npc.champion.name: The Undefeated Champion
valor.npc.champion.greet: I have never lost in this arena. When a challenger comes I stand to meet them — I do not step back.
valor.npc.champion.name.t: The name Undefeated, given by the fighters, is enough. Here you have a name only while you are standing.
valor.npc.champion.job.t: My work is standing. When a challenger comes I meet them, and I do not move my feet until one of us falls. That is the valor of this village.
valor.npc.champion.battle.t: Battle begins with not moving your feet. Step back once and everything falls apart. …That is how I was taught.
valor.npc.champion.arena.t: This arena's sand covers the names of the fallen. The crowd shouts only the name of the one still standing.
valor.npc.champion.retreat-law.t: A law allowing retreat — that is an excuse for cowards. This village is strong because it never steps back.

valor.npc.sergeant.name: Harr the Drillmaster
valor.npc.sergeant.greet: You wear a sword at your hip. But your feet are already stepping back. Here, we correct that stance first.
valor.npc.sergeant.name.t: I am Harr, the drillmaster. On the first day we make the newcomers forget how to fall back.
valor.npc.sergeant.job.t: My work is tending the barracks and making the young stand. …Lately there is more burying than standing.
valor.npc.sergeant.brother.t: A comrade is one who stands in the same line and holds together. When the one who held disappears, those remaining call his name.
valor.npc.sergeant.barracks.t: The barracks fill with empty places. The armor is still there — there is simply no one to fill it.

valor.npc.smith.name: Bran the Blacksmith
valor.npc.smith.greet: Want to trust us with a sword, or a shield? The folk here carry both on their backs.
valor.npc.smith.name.t: They call me Bran. I have beaten iron in this forge for forty years.
valor.npc.smith.job.t: I make swords, and I make shields. But shield orders have thinned of late. Everyone only wants to stand facing forward.
valor.npc.smith.shield.t: A shield is not a thing to trust with your back. You raise it to guard this side. When there is no one to leave your back to, a shield becomes heavy baggage.

valor.npc.brewer.name: Oren the Tavern Keeper
valor.npc.brewer.greet: You've come. Before a fight or after, here no one sets a cup down.
valor.npc.brewer.name.t: They call me Oren. I've kept this tavern for thirty years.
valor.npc.brewer.job.t: I brew the drink and fill the cups. I pour for the defeated too. …Though I would rather pour more for those who came home alive than for the winners.
valor.npc.brewer.brother.t: A comrade and a brother are no different — they are ones who share a cup. Lately the young march out without even time to share one.

valor.npc.child.name: Rupi, the Square Child
valor.npc.child.greet: Are you a fighter too? Going to be like the Undefeated uncle? I can't — the sword is still too heavy for me.
valor.npc.child.name.t: I'm Rupi. I run the fastest in the square.
valor.npc.child.job.t: My job is hanging on the arena fence and watching. …But lately no one wins. They all fall.
valor.npc.child.champion.t: They say the Undefeated uncle has never lost. …But where did all his friends go? That's what I want to know.

valor.npc.veteran.name: Kel the Old Soldier
valor.npc.veteran.greet: Just an old man with a bent back. Remembering old songs is more my work than fighting these days.
valor.npc.veteran.name.t: Call me Kel. Once I was someone who carried a spear for this village.
valor.npc.veteran.job.t: Now my work is remembering songs and passing them on. There is a marching song the old soldiers sang — in this village only half of it remains.
valor.npc.veteran.retreat.t: Retreat? Here they call it fleeing. But the old song sang it differently. Stepping back to bring a wounded comrade home — that too is courage.

valor.npc.scout.name: Sai the Scout
valor.npc.scout.greet: A stranger? What did you see outside the village? …These days the road home frightens me more than the road out.
valor.npc.scout.name.t: I'm Sai the scout. I keep watch beyond the walls.
valor.npc.scout.job.t: I walk the roads, watching for bandits and beasts. …But lately I meet more of the village's young dead. Bodies that did not die in battle but fell for refusing to step back.
valor.npc.scout.duelist.t: I saw a wandering duelist. He does not fight to win — he fights to show how to stay alive. …This village will not learn that.

valor.npc.healer.name: Mir the Healer
valor.npc.healer.greet: Show me the wound. …The outside is whole, but the inside is wide open to see.
valor.npc.healer.name.t: They call me Mir. I stitch wounds and set bones at the infirmary.
valor.npc.healer.job.t: I treat wounds. In this village I was taught that a wound on the back is the most shameful. Even so, I find it the most welcome.
valor.npc.healer.blood.t: Blood cannot hide even when it wants to. Wherever blood is spilled, there is always someone waiting for that person — that is what it means.

valor.npc.standard.name: Dain the Standard-Bearer
valor.npc.standard.greet: This banner is raised only when we go forward. …When we go back, they say there is no reason to raise it.
valor.npc.standard.name.t: I am Dain the standard-bearer. I plant this banner in the arena.
valor.npc.standard.job.t: I carry the banner. When a fighter falls, I cover them with it. …One day I want to return this banner to someone who comes back alive.
valor.npc.standard.courage.t: I was taught that courage is not charging with the banner at the front. It is keeping the banner to the end and coming home with it.

valor.npc.widow.name: Ren the Widow
valor.npc.widow.greet: …Did you come to speak of my husband, or are you only passing through?
valor.npc.widow.name.t: They call me Ren. I am someone who lost a husband in this village.
valor.npc.widow.job.t: I used to sew clothes. Now my work is remembering a promise that was never broken.
valor.npc.widow.retreat-law.t: Before my husband left, I heard there was such a law. One that did not call a man a coward for bringing a wounded comrade home. …Somewhere along the way the law vanished, and standing on even while abandoning the wounded became honor.

# --- Solgang clues ---
valor.word.courage.label: Courage
valor.word.courage.hint: Not refusing to step back, but coming back. The song's last line sings this word.
valor.word.retreat.label: Retreat
valor.word.retreat.hint: What this village calls fleeing. But the old law and the old song call it differently.
valor.word.shield.label: Shield
valor.word.shield.hint: Not a thing that blocks your back, but one raised to guard this side. What those who returned take up again.
valor.word.battle.label: Battle
valor.word.battle.hint: Where the undefeated champion stands. The reason he never steps back.
valor.word.blood.label: Blood
valor.word.blood.hint: What flows even from a wound on the back. The trace the healer most welcomes.
valor.word.brother.label: Comrade
valor.word.brother.hint: One who stands in the same line and holds. They say it is a bond of shared cups — but now there is no one left to share one with.
valor.fact.solgang.champion.label: The Undefeated Champion
valor.fact.solgang.champion.hint: A man never defeated in the arena. He cries to fallen challengers not to step back.
valor.fact.solgang.sergeant.label: Harr the Drillmaster
valor.fact.solgang.sergeant.hint: One who tends the barracks and makes the young stand. He knows the words he cannot say outside the gate.
valor.fact.solgang.veteran.label: Kel the Old Soldier
valor.fact.solgang.veteran.hint: An old soldier who remembers only half of an old marching song. He lost the last line.
valor.fact.solgang.smith.label: Bran the Blacksmith
valor.fact.solgang.smith.hint: A maker of swords and shields. They say shield orders have dwindled of late.
valor.fact.solgang.arena.label: Solgang's Arena
valor.fact.solgang.arena.hint: A sand floor that erases the names of the fallen and keeps only the name of the one standing.
valor.fact.solgang.barracks.label: The Barracks
valor.fact.solgang.barracks.hint: Where the armor stays but the ones to fill it dwindle. Last year only three of twelve came home.
valor.fact.solgang.forge.label: The Forge
valor.fact.solgang.forge.hint: A furnace that never dies. What is forged there changes year by year.
valor.fact.solgang.battle-hymn.label: The Old Marching Song
valor.fact.solgang.battle-hymn.hint: If the enemy is ahead and your home behind, raise your shield. The last line sings of those who return.
valor.fact.solgang.retreat-law.label: The Vanished Retreat Law
valor.fact.solgang.retreat-law.hint: An old law that did not call a man a coward for bringing a wounded comrade home. It vanished somewhere along the way.
valor.fact.creature.valor-duelist.label: The Wandering Duelist
valor.fact.creature.valor-duelist.hint: Not evil. He fights not to win, but to show the way to come back alive.

# --- Solgang deduction and crisis ---
valor.deduction.valor.sentence: True valor is not in flaunting {1}, but in {2} and coming home to raise {3} again
valor.deduction.valor.hint: The undefeated arena knows no stepping back. The old soldier's marching song and the widow's old law point to a different ending.
valor.crisis.challenge.text: People gather in the arena. A young challenger kneels bleeding, and the undefeated champion levels his spear, shouting not to step back. The challenger gasps, tries to rise, and falls again. The crowd holds its breath; the drillmaster turns his head. Then the old soldier begins to sing, low. Now it is your turn to step forward.
valor.option.allow-retreat.label: Sing the old marching song and declare that retreat is also courage
valor.option.allow-retreat.text: You sing the old soldier's song. If the enemy is ahead and your home behind, raise your shield. Then you take up the lost last line. The one who lifts a shield and comes home is the brave one. One by one the crowd joins in, and the undefeated champion slowly lowers his spear. The challenger walks out on his own feet, not dragged. For the first time, the name of one who returned is written in the arena sand. Solgang learns that valor lies not in refusing to step back, but in coming home and standing again.
valor.option.duel-honor.label: Challenge the undefeated champion to a duel yourself
valor.option.duel-honor.text: "You raise a spear and challenge him. The undefeated champion laughs — he has waited long for such a challenger. The spears clash, and you stop the final blow. The moment you draw your spear back from his throat, the crowd stirs. The Undefeated kneels and says: I learned how to win, but never how to stop. You reach out a hand and raise him to his feet. The village sees that the one who lifts others up is honored more than the one who wins."

# --- Solgang abilities and creatures ---
valor.ability.shield.name: Raising the Shield
valor.creature.duelist.name: The Wandering Duelist

# --- Seles, village of justice (M3 Task 35) ---
town.seles.name: Seles
justice.music.title: Seles's Verdict

justice.npc.judge.name: Arben the Judge
justice.npc.judge.greet: This is the court of Seles. Stand in one line. Custom allows no exceptions.
justice.npc.judge.name.t: I am Arben. For thirty years I have handed down this court's verdicts. In Seles, the custom before a grave comes before the name of the living.
justice.npc.judge.job.t: My work is keeping the custom and giving the punishment. In the month of mourning no one may sing, and those who break it take the lash. Custom guards the village. That is justice.
justice.npc.judge.law.t: Law is rooted in custom. Singing during mourning brings the lash. Taking things out before a grave brings exile. Our law has no item called emotion.
justice.npc.judge.punishment.t: Punishment is the fire that makes people remember custom. Forty lashes — no punishment is ever reduced. That is how Seles calls justice.
justice.npc.judge.compassion.t: Compassion is a word unfit for this court. If punishments shrink, everyone will try to shake the custom. I am the one who stops that shaking.
justice.npc.judge.lullaby.t: A lullaby? Singing, in the month of mourning? That is an offense against custom. The widow Cele cannot escape punishment.
justice.npc.judge.mourner.t: The young man seen at the grave is a thief. The witness has already stood. The punishment is fixed.

justice.npc.clerk.name: Leon the Court Clerk
justice.npc.clerk.greet: Testimony remains in the records. Quietly, and exactly.
justice.npc.clerk.name.t: I am Leon, the court's clerk. The one who copies the verdicts and charges.
justice.npc.clerk.job.t: I write the trial records. Today I wrote three sheets of verdicts. All flogging or exile. I once counted pride in writing letters; lately I am afraid of counting punishments in letters.
justice.npc.clerk.law.t: The law is already written. The mourning prohibition, the punishment table, the no-remission clause. The judge says he only reads the record, but the one who writes it will tell you — it is not that simple.
justice.npc.clerk.punishment.t: There are three kinds of punishment. Flogging, exile, and kneeling before a grave. Kneeling is the lightest. …The children call it the turning-away, and that nickname troubles me.
justice.npc.clerk.harsh.t: Look at these records. Last month, six people broke the mourning. All took forty lashes. Even the one who sang, even the one who laid flowers at a grave. My hands shake every time I write those numbers.
justice.npc.clerk.prisoner.t: …The imprisoned youth. I did not record his name. The judge ordered he be called only 'thief.' The record 'thief' passes judgment before the truth does. That is something I have never seen before.

justice.npc.widow.name: Cele the Widow
justice.npc.widow.greet: …Did you hear a lullaby? I'm sorry, I mustn't sing during mourning. Each night it slips out of my mouth without my meaning to.
justice.npc.widow.name.t: I'm Cele. A widow who buried her husband a month ago. The people of Seles call me the singing widow.
justice.npc.widow.job.t: When my husband was alive I wove thread into cloth. Now… every day I go to the grave, pull up the grass, and touch the stones. That is my work. Mourning is not work — it becomes the body.
justice.npc.widow.compassion.t: People don't call compassion comfort. Feeling compassion itself is said to break the mourning. So no one reaches for the one who weeps. In the month of mourning, song, comfort, and tears are all forbidden.
justice.npc.widow.lullaby.t: That song is the lullaby only the two of us sang when my husband was alive. The song you sing to soothe a child, or an adult in fear. Even after death it seems to keep me, so at the grave I sang it after all. …Let the lashes come. The nights I don't sing frighten me more.
justice.npc.widow.prisoner.t: You speak of my son. He went to his father's grave every night. He found the necklace my husband had hidden somewhere by the grave, and he was polishing it. A witness saw him and called him a thief. My son speaks the truth, but custom comes before truth.
justice.npc.widow.truth.t: The truth is… on the night my husband died I did not weep. Following the rites, I said nothing. But the me who sings now is more truthful than the me of that night. Because mourning imprisoned the truth.
justice.npc.widow.mourning-duty.t: They say mourning used to be a time of closing the door for a hundred days. Somewhere along the way mourning became a prohibition. Don't weep, don't sing, only kneel before the grave. No one knows whose punishment made it so.

justice.npc.prisoner.name: Iren the Imprisoned Youth
justice.npc.prisoner.greet: …I'm sorry. I'm afraid that anything I say will be written down as a thief's words.
justice.npc.prisoner.name.t: I'm Iren. My mother is Cele, and my father was a stonemason. …When my father died suddenly, only I was left before the grave.
justice.npc.prisoner.job.t: I learned to work stone in my father's workshop. Now I only sit alone in this cell. Father said that when you touch stone, you see the truth.
justice.npc.prisoner.truth.t: I told exactly what happened that night at the grave — that I found my mother's necklace, that I was late because I saw an injured fledgling, that I was wiping the necklace at the side of the grave. But the judge made the record 'thief' first.
justice.npc.prisoner.fairness.t: If it were fairness, my father's work and my mother's song would both be laid on the same scale. But Seles's scale gives the punishment first and weighs afterward.
justice.npc.prisoner.widow.t: My mother sings the lullaby before the grave each night — even after the rites forbade song, until her voice gave out. I grew up hearing that song. It keeps me.
justice.npc.prisoner.mourner.t: Do you know that mourner? He was my father's friend. He wandered by the grave every night to guard it, and mistook a stranger for a thief. Grief does that to a person, I suppose.

justice.npc.witness.name: Kain the Witness
justice.npc.witness.greet: I'd sell my two eyes. I saw that night clearly.
justice.npc.witness.name.t: I am Kain. The cobbler of this village. These days I stand as a witness in court more and more often.
justice.npc.witness.job.t: I make shoes, and at night I keep watch over the village. I record anyone who walks toward the grave. …I don't know when that became my work.
justice.npc.witness.law.t: Where there is law, there are witnesses. I only tell what I saw. The sound of singing during mourning, the shadows passing in and out of the graves. The law told me to keep an eye on those.
justice.npc.witness.punishment.t: Punishment isn't frightening — it is order. After the lashes, everyone remembers the custom. I believe punishment corrects people.
justice.npc.witness.mourner.t: I saw the youth Iren holding something gleaming at the grave. If he wasn't a thief, what would he be seeking at a grave? …But thinking on it now, it did look like a necklace. If it was his mother's?

justice.npc.child.name: Rine the Square Child
justice.npc.child.greet: The adults only ever say be quiet, so I can't sing. But you look okay, don't you?
justice.npc.child.name.t: I'm Rine. A child born in this village. I know more songs than anyone in Seles.
justice.npc.child.job.t: My job is remembering songs! In the square, near the graves, I memorize all the sounds the adults make with their throats. …But lately the adults forbid singing, so I'm the keeper of the songs now.
justice.npc.child.lullaby.t: The widow lady's lullaby? I know it too! The moon lights the grave, and I sing your lullaby. She sings it before the grave every night. The judge mustn't catch her… I like that song.
justice.npc.child.love.t: Love? That is… singing before a grave. The song my mother sang to put me to sleep and the one the widow sings to her husband are the same song. Singing even when it's forbidden. Is that love?
justice.npc.child.widow.t: The widow lady is kind — why does she have to be punished? If singing is a crime, I'm a criminal too, and no one punishes me. She gets punished because she's an adult.

justice.npc.priest.name: Serno the Priest
justice.npc.priest.greet: Peace. This shrine is older than the graves, but I too live by the mourning rules.
justice.npc.priest.name.t: I am Serno. As the priest who keeps this village's shrine, I am also the one who keeps the old records of mourning.
justice.npc.priest.job.t: I tend the old records and prepare the words of the mourning rites. …But through the years, the word 'forbidden' has grown in the records. Do not weep, do not sing, do not break the rules.
justice.npc.priest.mourning-duty.t: The old mourning records had no punishment in them. The month of mourning was a time of closing the door for a hundred days, when neighbors brought meals and sat together talking by night. It was no place for punishment.
justice.npc.priest.comfort-widow.t: Comfort is not teaching. It is sitting beside the grave and listening to the song being sung. If you hear that song and sit with her, the punishment will lose its power.
justice.npc.priest.compassion.t: "Compassion is thought to lessen punishment, but truly it is suffering together. The old records say: if justice is the scale, compassion is the hand that holds it."
justice.npc.priest.harsh.t: Punishment outweighing custom is recent. Forty lashes — in the old days it was not even cause for a cell. That punishment has made people afraid, and now no one weeps before a grave.

justice.npc.mason.name: Duman the Mason
justice.npc.mason.greet: I raise gravestones. Stone cannot carve lies, which is why my work survives in this village.
justice.npc.mason.name.t: They call me Duman. A mason who handles the stone of this village's gravestones and house foundations.
justice.npc.mason.job.t: I used to carve the names of the living. Now I carve the punishments of the dead. Inscribing 'defied the mourning' on grave markers, I mean. The pace at which the names on stone grow frightens me.
justice.npc.mason.law.t: Law… should be like stone. It should carry weight, hold fast, and hold no lies. Today's law is not stone but clay. Rain reshapes it.
justice.npc.mason.harsh.t: Last month I cut six inscriptions. All for singing. Look — since when is there a law that carves gravestones for singers? …This village uses the stones meant for the dead to punish the living.
justice.npc.mason.comfort-widow.t: There is still hope, though. I carved the gravestone of Cele the widow's husband, and that stone alone still reads 'rests here.' Her son polishes it every day. While the stone endures, the scale will find its balance someday.

justice.npc.scribe.name: Bela the Scribe
justice.npc.scribe.greet: I write the verdicts. …Between documents and words, I can no longer tell which is the truth.
justice.npc.scribe.name.t: I am Bela, the scribe who copies this village's verdicts and mourning records.
justice.npc.scribe.job.t: Every day I sort the punishment records. Yesterday, forty lashes for one song. Today, one more for merely lingering before a grave. The numbers are honest — it is the law that sets them that isn't.
justice.npc.scribe.truth.t: I was taught that records hold the truth. But now the records make the truth. Write 'thief' and he becomes a thief; write 'mourner' and it changes. The same night, the same grave, the same youth. One word divides a person.
justice.npc.scribe.prisoner.t: I read the youth's record again. The witness's words, the hour of the night, the place of the grave. Nowhere was theft written. Only that he had been before the grave. That single line brought him to this cell.
justice.npc.scribe.harsh.t: The numbers on the punishment table grow every year. Lashes for defying mourning, exile for the graves. As the numbers stack, the villagers grow quieter, and I grow more afraid of writing numbers.

justice.npc.gravedigger.name: Gorno the Gravedigger
justice.npc.gravedigger.greet: This is where the dead live. For the living — be quieter, and more truthful.
justice.npc.gravedigger.name.t: They call me Gorno. I dig and guard the earth of this graveyard.
justice.npc.gravedigger.job.t: I dig graves, light candles, and walk my rounds at night. …But lately the living come by night more often. Afraid of punishment, they've gone as quiet as the dead.
justice.npc.gravedigger.mourner.t: That mourner… he weeps before a grave every night. When he sees a stranger he blocks them, calling thief. Grief can blind a person that way. He is not wicked — he is someone swallowed in mourning.
justice.npc.gravedigger.compassion.t: "I learned compassion like this: when I go to dig a grave and see someone keening, it is I who should smile instead. Even with the dead lying there, it is the living who need comfort."
justice.npc.gravedigger.lullaby.t: That lullaby… I hear it every night. A sound that carries between the graves. The judge forbade it, but as I see it, that song harms no one. Rather, it keeps me.
justice.npc.gravedigger.prisoner.t: Iren is no thief. I saw him every night — kneeling before the grave, polishing the stone, listening to the lullaby. That necklace was what the dead man left his wife, and the son was finding it to return to his mother.

# --- Seles clues ---
justice.word.fairness.label: Fairness
justice.word.fairness.hint: Laying everyone on the same scale. Seles's law gives the punishment first and weighs afterward.
justice.word.law.label: Law
justice.word.law.hint: The mourning prohibitions and punishment clauses rooted in custom. There is no item called emotion.
justice.word.punishment.label: Punishment
justice.word.punishment.hint: Flogging, exile, kneeling before a grave. The fire that makes custom remembered.
justice.word.compassion.label: Compassion
justice.word.compassion.hint: What people forbade in place of comfort. Mourning punishes compassion.
justice.fact.seles.judge.label: Arben the Judge
justice.fact.seles.judge.hint: Seles's judge, who has passed verdicts for thirty years. He believes custom is justice.
justice.fact.seles.widow.label: Cele the Widow
justice.fact.seles.widow.hint: A month since she buried her husband. Every night she sings the forbidden lullaby before the grave.
justice.fact.seles.prisoner.label: Iren the Imprisoned Youth
justice.fact.seles.prisoner.hint: Cele's son. He found his mother's necklace at the grave and was accused of theft.
justice.fact.seles.witness.label: Kain the Witness
justice.fact.seles.witness.hint: The witness who saw something gleaming at the grave. He tells only what he saw and leaves the judgment to the law.
justice.fact.seles.mason.label: Duman the Mason
justice.fact.seles.mason.hint: One who works the stone of gravestones and foundations. Now he carves inscriptions for those who defied mourning.
justice.fact.seles.court.label: The Court of Seles
justice.fact.seles.court.hint: Where punishment comes before record. Verdicts pile up three sheets a day.
justice.fact.seles.graveyard.label: The Graveyard
justice.fact.seles.graveyard.hint: Where a lullaby carries every night. The living, afraid of punishment, have gone as quiet as the dead.
justice.fact.seles.mourning-lullaby.label: The Mourner's Lullaby
justice.fact.seles.mourning-lullaby.hint: The moon lights the grave, and I sing your lullaby. The song Cele kept for her husband.
justice.fact.seles.mourning-duty.label: The Lost Month of Mourning
justice.fact.seles.mourning-duty.hint: The hundred days of the old records. Not punishment — a time when neighbors brought meals and sat together.
justice.fact.seles.harsh-punishment.label: The Harsh Punishment
justice.fact.seles.harsh-punishment.hint: Forty lashes for one song. Exile for entering the graves. The table's numbers grow every year.
justice.fact.seles.comfort-widow.label: The Hand of Comfort
justice.fact.seles.comfort-widow.hint: Sitting by the grave and listening to the song. When comfort stands before punishment, the scale finds its balance.
justice.fact.creature.justice-mourner.label: The Grief-Stricken Mourner
justice.fact.creature.justice-mourner.hint: Not evil. It is grief that makes him mistake a stranger for a thief. He is a person swallowed in mourning.

# --- Seles deduction and crisis ---
justice.deduction.justice.sentence: Justice is not blocking {2} in the name of {1}, but ruling through {3}
justice.deduction.justice.hint: The judge's law keeps custom with punishment. What Seles lost is the balance of the scale. Set the scale with truth and rule with love, and justice is at last achieved.
justice.crisis.mourning.text: Moonlight runs cold before the courthouse. The widow Cele, who sang during mourning, and the youth Iren, who found a necklace at the grave, are dragged before the judge. The judge unfurls the verdict. The song broke custom; the grave yielded a thief. The punishment is fixed. The crowd holds its breath. A child bows her head, and the gravedigger looks toward the graves. Now it is your turn to step forward.
justice.option.comfort-widow.label: Sing the lullaby to show the truth and offer comfort
justice.option.comfort-widow.text: Before the courthouse, you sing the lullaby in a trembling voice. The moon lights the grave, and I sing your lullaby. The crowd stops breathing. The witness bows his head, and the priest takes out the old records and reads them. The month of mourning was not punishment but a time of being together. After a long silence, the judge folds the verdict. For the first time, Seles's scale takes up truth and love and finds its balance. Comfort is handed down instead of punishment.
justice.option.strict-law.label: Read out the punishment clauses and rule by the law
justice.option.strict-law.text: You unfold the punishment table and read by the law. Song — forty lashes; entering the graves — exile. The judge nods, and the flogging is carried out. The people grow quieter, but somewhere a child's lullaby continues, low. Seles kept its custom. Yet no one stands before the graves anymore.

# --- Seles abilities and creatures ---
justice.ability.eye.name: The Eye of Justice
justice.creature.mourner.name: The Grief-Stricken Mourner

# --- Dione village (M4 Task 37) ---
town.dione.name: Dione
sacrifice.music.title: Dione's Altar

sacrifice.npc.altar-priest.name: Kreon, Priest of the Altar
sacrifice.npc.altar-priest.greet: Come in. Stand before the altar and everything is stripped away. Lay down all that you carry.
sacrifice.npc.altar-priest.name.t: I am Kreon, the priest who keeps Dione's altar. Today too, the altar swallows someone's offering.
sacrifice.npc.altar-priest.job.t: Before being a priest, I am the altar's servant. People come here to give their wealth, their bodies, even a last scrap. That is our village's love. Lay down something too before you go.
sacrifice.npc.altar-priest.devotion.t: Devotion is emptying yourself entirely. If something remains, it is not devotion — it is greed. The altar is the fire that burns that greed.
sacrifice.npc.altar-priest.love.t: Love gives without reserve, and gives again until the self disappears. A heart that holds back like yours is not called love.
sacrifice.npc.altar-priest.widow-song.t: That song is clinging. Nothing but a lingering hold on the dead. What the widow cannot release at the altar is that clinging.
sacrifice.npc.altar-priest.penitent.t: That penitent — he shows you the road you must walk. He takes up the whip before the altar every day now. That is the true posture.

sacrifice.npc.widow.name: Leah the Widow
sacrifice.npc.widow.greet: …Did you come from the altar? Or did you come to hear my dead husband's song.
sacrifice.npc.widow.name.t: I'm Leah. My husband did not come back from the altar. People call me the singing widow.
sacrifice.npc.widow.job.t: Since my husband died, I boil a half-loaf of bread every evening. The way he liked it. The altar says to throw even that away… but it keeps my days.
sacrifice.npc.widow.love.t: Love was not the wound my husband carved, but the evenings we sat and shared. Counting wounds is not love — it is competing.
sacrifice.npc.widow.widow-song.t: That song is one only my husband and I sang. Before the altar came, it was the dawn song the women of this village sang. My husband left while singing it. So now the song holds me.
sacrifice.npc.widow.altar.t: The altar demands a person's last possession. My husband laid his hand on the altar to prove his love, and the wound never let him come back. …I'll say no more of it.
sacrifice.npc.widow.devotion.t: Devotion… that word took my husband. He kept meaning to give more, and in the end gave himself. The altar only knows how to receive.

sacrifice.npc.child.name: Rio the Child
sacrifice.npc.child.greet: If you talk to me the punishment is missing dinner. But it's okay — I'm already used to it.
sacrifice.npc.child.name.t: I'm Rio. I'm six, and I'm practicing to be a little handmaid of the altar. The priest says if you strip away a lot when you're small, you can make a great sacrifice later.
sacrifice.npc.child.job.t: My work is skipping one meal a day and not choosing a single thing I like. The priest calls it a holy burden, but I don't see why I'm learning to carry a burden.
sacrifice.npc.child.burden.t: Burden? The priest says the more burdens, the holier. But Granny's bread box looks like the real burden to me. It doesn't look that way for people, though.
sacrifice.npc.child.widow-song.t: Auntie Leah's song! I sing it secretly in the backyard every night. The priest mustn't hear — but when she sings it, my heart grows warm.
sacrifice.npc.child.widow.t: Auntie Leah always shares a half-loaf with me. She says don't offer it to the altar. But is that also a sacrifice… no, what should I call it. I'm too little to know the words.

sacrifice.npc.pilgrim.name: Ion the Pilgrim
sacrifice.npc.pilgrim.greet: I wander from place to place, a pilgrim. I walked three years to answer the rumor of Dione's altar.
sacrifice.npc.pilgrim.name.t: They call me Ion. One staff and one notebook are all my fortune. I record the true sacrifices I hear and see in every place.
sacrifice.npc.pilgrim.job.t: My work is being a witness — recording, without taking sides, what happens before the altar and what the villagers turn their eyes from. Until I came here, I believed sacrifice was beautiful.
sacrifice.npc.pilgrim.witness.t: A witness is one who remembers what they saw to the very end. I copied this village's records three times over. The priest lifts his scarred hand at the altar, but I also remember how whole that hand once was.
sacrifice.npc.pilgrim.martyr-contest.t: This village competes before the altar over who offered more painfully. They measure the length of wounds and count the days of fasting — last year, one who cut his own hand won. The priest calls it holy competition. I record it as the martyr contest.
sacrifice.npc.pilgrim.devotion.t: Devotion brought me here, but now I fear the word. Wherever they tell you to give everything, there is a receiver. I want to record that receiver too.

sacrifice.npc.surgeon.name: Sane the Surgeon
sacrifice.npc.surgeon.greet: Sit. Show me the wound. …Clean. Good.
sacrifice.npc.surgeon.name.t: They call me Sane. The only surgeon in this village who works with knife and thread. My blade never cuts wounds — it only joins them.
sacrifice.npc.surgeon.job.t: My work is sewing wounds. But most wounds in this village are self-made — made to stand before the altar, to lose bigger than the next. I seal them every day, and I keep becoming a witness.
sacrifice.npc.surgeon.witness.t: If you want a witness, I am the best one. My fingertips know which wounds came from a knife and which from the altar's bowl. I haven't seen the priest's hand in years. In a surgeon's record, wounds are the truth.
sacrifice.npc.surgeon.martyr-contest.t: The wound contest — watching the recorder lay his rule to it is truly absurd. It ignores that a wound is not proof of pain but a share of love.
sacrifice.npc.surgeon.penitent.t: That penitent is my patient. He whipped his back and came to me infected. I treat him, but he will be before the altar again soon. The village makes more wounds than I can heal.
sacrifice.npc.surgeon.courage.t: Courage is not adding more wounds. It is not turning from a wound, but looking at the face of the one who will hurt. In this village, that is the hardest thing.

sacrifice.npc.scribe.name: Mir the Recorder
sacrifice.npc.scribe.greet: Records are eternal. …If only the records I write did not frighten me.
sacrifice.npc.scribe.name.t: I am Mir, Dione's recorder — the one who copies the lists of what is offered to the altar.
sacrifice.npc.scribe.job.t: "I keep the altar's ledger. Names, offerings, and the length of wounds. The larger the numbers, the more praise. Yesterday I wrote in one column: one finger. I spent today looking at it."
sacrifice.npc.scribe.martyr-contest.t: Some call it the martyr contest. I only write the numbers. But numbers do not lie. A husband's finger, a child's meal, an old man's knee. The altar is collecting those numbers.
sacrifice.npc.scribe.burden.t: The old ledger says a burden is not carried alone but carried together. Now each carries only their own and will not take up another's. If that is what the altar teaches, I will not record its teaching.
sacrifice.npc.scribe.widow.t: "Lady Leah's affair is in every ledger. The one who gave much, the greatest sacrifice. Beside it stands one short line: a widow who boils a half-loaf every night. That is the line I should truly record, and I have not managed to put it into any ledger yet."

sacrifice.npc.mason.name: Harpa the Mason
sacrifice.npc.mason.greet: I'm someone who has lived touching stone. Stone doesn't lie, which I like. The altar… even stone learned to lie, in shock.
sacrifice.npc.mason.name.t: They call me Harpa. A mason who works the stone of this village's houses and of the altar. I am also a descendant of the altar's builders.
sacrifice.npc.mason.job.t: I repair the altar's stone. But strangely, the stone sways beforehand, knowing whose offering it will burn. It is because the foundation of an old shrine remains underground. Different words were carved on that foundation.
sacrifice.npc.mason.altar.t: "Lift this altar. Beneath it is the hearth of the old shrine. The words carved there mean: the fire that kept this village was not the altar but the hearth relit every evening. It was a place that filled, not a place that stripped away."
sacrifice.npc.mason.courage.t: Courage is not holding up a stone about to fall. It is becoming the stone that holds up a person about to fall. Lately I want to make such a stone, so I am dressing the altar anew.
sacrifice.npc.mason.widow-song.t: That song is familiar to my ears too. When Leah sings in the evening, the hearth fire seems to sing along. It is the flame the altar is trying to put out.

sacrifice.npc.baker.name: Sera the Bread Baker
sacrifice.npc.baker.greet: Fresh bread. …If you mean to offer it at the altar, leave. I don't put bread there.
sacrifice.npc.baker.name.t: I'm Sera. At the village bakery I bake bread each morning, and in the evening I share it.
sacrifice.npc.baker.job.t: My work is kneading flour, keeping the fire, and handing out bread. The priest calls me one who can't sacrifice. Every time I hear it, I stoke the fire harder.
sacrifice.npc.baker.living-love.t: I believe true sacrifice is not offering your life at once, but stoking the fire and handing out bread every morning. The altar takes a moment; this bread keeps a day alive. Sharing — that is the love I know.
sacrifice.npc.baker.love.t: Love lives between the baker and the eater. It does not burn in the fire. Like dough rising, it rises together.

sacrifice.npc.healer.name: Nora the Healer
sacrifice.npc.healer.greet: If you have a wound, show me. One with no wounds may be the most wounded person in this village.
sacrifice.npc.healer.name.t: They call me Nora. A healer who works herbs and medicines beside Sane the surgeon. I make wounds close.
sacrifice.npc.healer.job.t: My work is dressing the wounds Sane has sewn. I also tend the wounds on that penitent's back. However well they heal, they split open again whenever he goes to the altar. Instead of those who make wounds, we should teach how to live with them.
sacrifice.npc.healer.penitent.t: He is not wicked. He is only poor, taught that holiness must be proven with wounds. I hope he learns someday that he can be holy with none.
sacrifice.npc.healer.burden.t: Knowing how to lighten a burden is not the start — knowing how to share one is. That is where healing begins. A wound you can say hurts is already half healed.

sacrifice.npc.gardener.name: Mano the Gardener
sacrifice.npc.gardener.greet: A field only grows better with tending. Some say going hungry here is noble… but I know the earth waits for hands.
sacrifice.npc.gardener.name.t: They call me Mano, the gardener who tends the plot behind the village. Pumpkin, carrot, radish — names the altar has forbidden.
sacrifice.npc.gardener.job.t: My work is sowing seed, pulling weeds, and giving water. Then I share half the harvest with the villagers. The priest tells me to offer even that half.
sacrifice.npc.gardener.garden.t: This plot is the oldest place in the village — older than the altar. The children taught that hunger is holy come here starving, eat a radish, and go. I teach them it is not a burden, it is food.
sacrifice.npc.gardener.martyr-contest.t: A wound contest — on the way back from market I see the quarrels before the altar. Who fasted more, who ached more. Nothing like that grows in a plot. Because nothing like that is ever planted.

# --- Dione clues ---
sacrifice.word.devotion.label: Devotion
sacrifice.word.devotion.hint: The word the altar teaches. The name for emptying and burning the whole self. The word the pilgrim came to fear.
sacrifice.word.burden.label: Burden
sacrifice.word.burden.hint: The altar teaches that more burdens make you holier. But the healer teaches how to share burdens.
sacrifice.word.witness.label: Witness
sacrifice.word.witness.hint: One who remembers what they saw to the very end. The surgeon's fingertips and the pilgrim's notebook do that work.
sacrifice.fact.dione.altar-priest.label: Kreon, Priest of the Altar
sacrifice.fact.dione.altar-priest.hint: The priest who keeps the altar. He teaches emptying the self utterly and stokes the village's martyr contests.
sacrifice.fact.dione.widow.label: Leah the Widow
sacrifice.fact.dione.widow.hint: A widow who lost her husband to the altar. Every night she keeps her days with an evening loaf and an old song.
sacrifice.fact.dione.pilgrim.label: Ion the Pilgrim
sacrifice.fact.dione.pilgrim.hint: A pilgrim who walked three years to find a true sacrifice. He copied the altar's records three times over.
sacrifice.fact.dione.surgeon.label: Sane the Surgeon
sacrifice.fact.dione.surgeon.hint: The only surgeon who closes wounds. He knows most wounds in this village are self-made.
sacrifice.fact.dione.scribe.label: Mir the Recorder
sacrifice.fact.dione.scribe.hint: The recorder of the altar's ledger. He knows every number has a name.
sacrifice.fact.dione.altar.label: The Altar of Dione
sacrifice.fact.dione.altar.hint: The stone altar at the village's center. Beneath it lies the foundation of an older hearth.
sacrifice.fact.dione.sanctuary.label: The Sanctuary
sacrifice.fact.dione.sanctuary.hint: The sanctuary around the altar. On its walls is carved the law of renunciation.
sacrifice.fact.dione.garden.label: The Garden Behind the Village
sacrifice.fact.dione.garden.hint: A garden older than the altar. Starving children sneak there to eat radishes.
sacrifice.fact.dione.widow-song.label: The Widow's Song
sacrifice.fact.dione.widow-song.hint: The dawn song Leah sang with her husband. Dione's last song, never offered at the altar.
sacrifice.fact.dione.martyr-contest.label: The Martyr Contest
sacrifice.fact.dione.martyr-contest.hint: The altar's custom of competing over who offered more painfully. Wound lengths and fasting days are written as numbers.
sacrifice.fact.dione.renunciation-law.label: The Law of Renunciation
sacrifice.fact.dione.renunciation-law.hint: The law the altar commands. What you keep is greed; only empty hands are called love.
sacrifice.fact.dione.living-love.label: The Hearth's Love
sacrifice.fact.dione.living-love.hint: Words carved into the old foundation. The fire was kept not by the place that stripped away, but by the place that filled every day.
sacrifice.fact.creature.sacrifice-penitent.label: The Penitent of Repentance
sacrifice.fact.creature.sacrifice-penitent.hint: Not evil. One taught that holiness must be proven with wounds. He whips his own back before the altar.

# --- Dione deduction and crisis ---
sacrifice.deduction.sacrifice.sentence: Sacrifice is not a {1} that swallows the self, but bearing {3} through {2}
sacrifice.deduction.sacrifice.hint: The altar teaches burning the self in the name of devotion. The widow's song and the hearth's foundation point to a true sacrifice that is borne, not swallowed.
sacrifice.crisis.altar.text: Villagers gather before the altar. Priest Kreon lifts little Rio's hand and cries out. Love is giving without reserve; only when the child is emptied entirely is it true sacrifice. Rio kneels with a frightened face. Behind them, widow Leah hides a half-loaf, and the pilgrim Ion grips his staff. Sane the surgeon bows his head, and Mir the recorder unrolls the ledger. Now it is your turn to step forward.
sacrifice.option.open-altar.label: Sing the widow's song to show love and courage
sacrifice.option.open-altar.text: "You sing the old song before the altar. Leah and little Rio add their voices. The priest shouts, but Harpa the mason pushes the altar stone aside to reveal the old hearth. On the foundation is carved: the fire that kept this village was not the altar but the hearth relit every evening. The priest wavers, and the villagers put down the cords they used to measure wounds. Dione learns that sacrifice is not devotion swallowing the self, but bearing courage in love. That evening, the fire is lit in the bakery instead of at the altar."
sacrifice.option.exile-priest.label: Read out the martyr contest records and close the altar
sacrifice.option.exile-priest.text: You take out the pilgrim's notebook and the recorder's ledger and read them aloud. One finger, one meal, one knee. The counts of what the altar received pile up before it. The priest falls silent, and one by one the villagers lift their heads. The priest leaves the altar, and the altar is closed. But the child still skips a meal every evening. Dione stopped competing, but has not yet learned how to live.

# --- Dione abilities and creatures ---
sacrifice.ability.meaning.name: The Meaning of Sacrifice
sacrifice.creature.penitent.name: The Penitent of Repentance

# --- Argon, village of honor (M4 Task 38) ---
town.argon.name: Argon
honor.music.title: Argon's House Song

honor.npc.elder.name: Elder Beron
honor.npc.elder.greet: A guest of Argon. Give me your name. Which line you belong to, which house's sigil you carry.
honor.npc.elder.name.t: I am Beron, an elder who has kept this house's rank order for three generations. In this village a name comes from the house. No house, no name.
honor.npc.elder.job.t: My work is counting the ranks and keeping face. Who stands above and who below — if that order wavers, the whole village falls. The ledger that counts names is my law.
honor.npc.elder.honor.t: Honor is the face of a house. When that face cracks, whether dead or living, the flaw must be washed clean. Keeping honor — that alone is this village's order.
honor.npc.elder.shame.t: Knowing shame is itself honor. An insult weighs more than death. One whose face is trampled is a name already gone, even while alive.
honor.npc.elder.face.t: A broken face cannot be mended. So before it breaks, harden the face you have now. Rather than lie down, shatter standing.
honor.npc.elder.heir.t: My heir Sion? He dishonored the house. With a song he invented about a lost verse, he insulted the founder. One who breaks face is struck from the name. That is our law.

honor.npc.heir.name: Sion the Heir
honor.npc.heir.greet: …Another who comes face to face with me. To those who avoid a name about to be erased, I am already a stranger. Will you not avoid me?
honor.npc.heir.name.t: They call me Sion. I was this house's heir. …That 'was' is bitter.
honor.npc.heir.job.t: An heir's work is to learn words and learn the sword, and one day inherit the house. But I lost all of it over a single verse of a song.
honor.npc.heir.song.t: Do you know the second verse of that song? Our house memorizes only the first — the lord who never knelt. But the second verse sings differently. He was a kneeling lord. Not one who raised a celebrated spear, but one who knelt to save everyone.
honor.npc.heir.truth.t: Truth hurts more than face. I sang that second verse. The founder knelt from fear? No. He knelt not from fear but to save the village. That is the truth this village hides.
honor.npc.heir.courage.t: I was taught that courage is nothing other than raising a sword. But the song's second verse says kneeling is courage too. Facing the enemy's blade and thinking first of the villagers' lives — that was the founder's courage.

honor.npc.herald.name: Luka the Herald
honor.npc.herald.greet: A herald who carries the house's voice. Whose name shall I cry today?
honor.npc.herald.name.t: Call me Luka. I am the herald who cries the house's ranks before duels and at rites.
honor.npc.herald.job.t: My work is calling names — by rank, by house. But lately I cry more names that must be erased. When that name is called, the people bow their heads.
honor.npc.herald.song.t: The house song is all in the copy I keep — from the first verse to the second. …But at rites we always sing only the front. It is our house's way never to sing the last verse.
honor.npc.herald.honor.t: Honor — how dare I. I only cry out. That the name standing above is the right name. …But every time I turn to the back pages of the songbook, it rises in me that there are names this village does not sing.
honor.npc.herald.elder.t: "Elder Beron is the master of rank. He holds the power to raise and lower names. He set one law: one who breaks face must kneel in apology or be struck from the name. An insult weighs more than death, he says. That is this village's law of shame."

honor.npc.scribe.name: Eli the House Recorder
honor.npc.scribe.greet: House recorder. Before I open the ledger — have you come to add a name, or to erase one?
honor.npc.scribe.name.t: They call me Eli. I write and erase the names of this house. An erased letter leaves a mark. Those marks keep growing.
honor.npc.scribe.job.t: I keep the rank ledger. Who was born in which line, which name rose and which fell. …But the elder reaches into this ledger himself. Those parts I could not write.
honor.npc.scribe.rank.t: The family rank law. The line you are born into becomes the order of your name. But trace the rank ledger back, and there is one erased line. The ledger knows who erased it.
honor.npc.scribe.truth.t: When I try to write the truth, the ledger grows heavy. When the elder moved to erase Sion's name, I felt the weight of that truth. To the very moment a name is erased, it is always face, not truth, that wins.
honor.npc.scribe.heir.t: Sion sang the second verse. What crime is that? But in the name ledger, rank comes before truth. Tomorrow the elder will make Sion kneel in the square and take his apology. Before the erasure.

honor.npc.swordmaster.name: Kaion the Swordmaster
honor.npc.swordmaster.greet: Before you draw a sword, tell me what you mean to guard. That decides what I teach.
honor.npc.swordmaster.name.t: Kaion. I teach swordsmanship in this village. But I don't teach how to win. Why learn a sword that cannot let you live after winning?
honor.npc.swordmaster.job.t: I teach the sword, and before children learn how to raise a blade I teach them how to kneel. One who doesn't know how to kneel is no man with a sword.
honor.npc.swordmaster.courage.t: Courage… do you know the founder's story? He is remembered as the lord who never once knelt. But the truth differs. He knelt once before a blade — to save the villagers. I teach that kneeling is harder than raising a sword.
honor.npc.swordmaster.honor.t: One who knows honor only as face keeps even his sword for face. But true honor… is knowing what to keep and what to abandon, even before a blade.
honor.npc.swordmaster.song.t: The house song carries how swordsmanship began in this village. The first verse sings he never knelt; the second sings he knelt. The same blade, the same lord, a different song. Which side will you sing?
honor.npc.swordmaster.face.t: I've seen many raise a sword wrongly to keep their face. Face carried on your back is a shield; held before your face it is a blindfold. Behind a blindfold you cannot even see the fight.

honor.npc.brewer.name: Mur the Brewer
honor.npc.brewer.greet: Welcome. Drink doesn't ask your name. After a cup, everyone wears the same face.
honor.npc.brewer.name.t: They call me Mur. I've brewed at this tavern for thirty years — a man of the lowest line in this village, too.
honor.npc.brewer.job.t: I brew the drink, fill the cups, toast honorable names, and forget erased ones. In the tavern all names are equal. Rank and house alike — all sink into the cup.
honor.npc.brewer.heir.t: The day Sion sang the song, I watched, cup in hand. Before everyone's eyes, he sang the second verse alone, all the way through. Some bowed their heads and clapped. Most fell silent and only stared at the ranks. …Those faces stay with me.

honor.npc.child.name: Arin the Village Child
honor.npc.child.greet: Hi! Do you want to learn a song? I know the back part of the house song!
honor.npc.child.name.t: I'm Arin! A village kid, and nobody asks my name. Because my line is low. But I know the songs best of all!
honor.npc.child.job.t: My job is singing! In the square, at the tavern, at the rites. The adults sing the founder's boast-song, but I also sing the founder's hidden song. They say the founder was a kneeling lord!
honor.npc.child.song.t: The first verse sings a lord who never knelt, and the second verse sings one who knelt. I like the second better. A song about what really happened is more fun than a boasting one!
honor.npc.child.shame.t: Shame — you know the kneeling in the square, right? That's what the adults call shame. But the founder knelt too, and he's still the founder. So I don't really get what shame is.
honor.npc.child.widow.t: Auntie Serin cries a lot. Because her husband's name was erased. I remember that name in a song too. You can erase a name, but you can't erase a song!

honor.npc.widow.name: Serin the Widow
honor.npc.widow.greet: …Did you come to sing, or to find an erased name?
honor.npc.widow.name.t: They call me Serin. A widow whose name was erased in this village. My husband knelt in the square, and even so his name was erased.
honor.npc.widow.job.t: My work is selling cloth in the market. When my husband lived, we sold it together. Now I stand alone without that name. In a village where face loomed larger than a husband.
honor.npc.widow.shame.t: Do you know what shame is? In this village, kneeling. But I think — my husband's kneeling was not shame but love. He knelt to save everyone.
honor.npc.widow.song.t: The second verse of that song survives in this village as a folk lyric. Sung by children, sung by widows, sung by erased names. The founder was a kneeling lord. Not one who fled — one who knelt to save.
honor.npc.widow.pride.t: Pride is not raised with a sword. My husband meant to fight for pride, but he knelt for my sake. That moment of kneeling — I think it was greater than pride.
honor.npc.widow.heir.t: The day Sion sang that song, I wept. It brought back my husband's affair. The boy only sang the truth, and this village means to punish that truth. Tomorrow, in the square, the elder… .

honor.npc.mason.name: Toben the Mason
honor.npc.mason.greet: I'm someone who lives touching stone. I dress sigils, but the stone hidden beneath them is older.
honor.npc.mason.name.t: They call me Toben. A mason who works the stone of this village's manors and square. Stone knows no rank.
honor.npc.mason.job.t: I dress the manors' sigils and lay the square's flagstones. And when I happen to make repairs, I face words carved in old stone. Words people want to forget.
honor.npc.mason.manor.t: The house manor. Its sigil shows a lord who never knelt. But a different picture remains on the old hall's stone — a picture of a kneeling lord. Someone covered that stone over with the sigil.
honor.npc.mason.rank.t: The rank ledger was originally carved on a stone pillar beneath the ridge beam. One line from hundreds of years ago is erased. The stone I dress long remembers what name was on that erased line.
honor.npc.mason.face.t: Stone has no face, which is good. When it cracks, the crack shows as it is. People hide cracks with face, but stone cannot. That is why I trust that stone is truth.

honor.npc.seamstress.name: Rian the Seamstress
honor.npc.seamstress.greet: Cloth doesn't ask your name. Whatever line you belong to, it only wraps the body.
honor.npc.seamstress.name.t: They call me Rian. I sew this village's clothes. I have made the rite robes, and even the clothes worn in the shame rite.
honor.npc.seamstress.job.t: I stitch the gold thread of the rite robes and embroider sigils on collars. But for the shame rite I make clothes that cover even the sigil. The face-keeping house dresses its own in clothes that shed face.
honor.npc.seamstress.face.t: You hold your clothes straight to keep face, but on the day you kneel they all crumple anyway. Face should not be a garment you wear but a heart you keep.
honor.npc.seamstress.widow.t: I have mended all of Lady Serin's clothes of late — even the clothes of her erased husband. Every time I mend them with care, I feel I am stitching in place of an erased name.

# --- Argon clues ---
honor.word.honor.label: Honor
honor.word.honor.hint: What this village calls face and family rank. But the song's second verse sings a different honor.
honor.word.shame.label: Shame
honor.word.shame.hint: An insult weighs more than death. So the truth is hidden, and the kneeling lord was erased.
honor.word.pride.label: Pride
honor.word.pride.hint: A heart that seems greater not when raised by the sword but in the moment of kneeling.
honor.word.face.label: Face
honor.word.face.hint: A house's face that cannot be mended once cracked. This village weighs it heavier than life.
honor.fact.argon.elder.label: Elder Beron
honor.fact.argon.elder.hint: The elder who has kept the rank for three generations. He holds the ledger that raises and lowers names.
honor.fact.argon.heir.label: Sion the Heir
honor.fact.argon.heir.hint: The heir who sang the lost second verse of the song. He cracked the house's face and now stands at risk of erasure.
honor.fact.argon.herald.label: Luka the Herald
honor.fact.argon.herald.hint: The herald who cries the ranks. He holds the full copy of the house song, but at rites only the front is sung.
honor.fact.argon.swordmaster.label: Kaion the Swordmaster
honor.fact.argon.swordmaster.hint: A master who does not teach winning. He teaches kneeling before the sword.
honor.fact.argon.widow.label: Serin the Widow
honor.fact.argon.widow.hint: A widow whose husband knelt in the square and was erased anyway. One of the few who know the song's second verse.
honor.fact.argon.manor.label: The House Manor
honor.fact.argon.manor.hint: A manor whose gate bears the ranks. The sigil shows a lord who never knelt, but the old hall's stone says differently.
honor.fact.argon.plaza.label: The Square
honor.fact.argon.plaza.hint: Where names are cried out. Where the shame rite is held, and everyone watches an erased name.
honor.fact.argon.lineage-song.label: The House Song
honor.fact.argon.lineage-song.hint: A proud old song. The first verse sings a lord who never knelt; the lost second verse sings one who did.
honor.fact.argon.family-rank.label: The Family Rank Law
honor.fact.argon.family-rank.hint: The law by which the line you are born into becomes the order of your name. One erased line remains in the ledger.
honor.fact.argon.humiliation-rule.label: The Law of Shame
honor.fact.argon.humiliation-rule.hint: One who breaks face must kneel in apology or be struck from the name. The law that an insult weighs more than death.
honor.fact.argon.kneeling-lord.label: The Kneeling Founder
honor.fact.argon.kneeling-lord.hint: The first lord who knelt before an enemy's blade to save the village. The descendants sing of it turned into a boast.
honor.fact.creature.honor-braggart.label: The Braggart Duelist
honor.fact.creature.honor-braggart.hint: Evil. One who picks fights over face. Believing winning is honor, he lunges at anyone who offers a hilt.

# --- Argon deduction and crisis ---
honor.deduction.honor.sentence: Honor is not a hardened face guarding {1}, but building {3} through {2}
honor.deduction.honor.hint: "Argon calls face and family rank honor. But the song's second verse and the swordmaster say: keep the truth, and build honor with courage."
honor.crisis.lineage.text: People of the square gather, ordered by house. Elder Beron raises the rank ledger high and cries out. In a seat meant to keep the house's name sits one who dishonored it. The heir Sion invented a song and insulted the founder. One who breaks face must kneel in apology or be struck from the name. Herald Luka unrolls the ledger, and the people hold their breath. The heir Sion does not kneel — he stands and lifts his head. Now it is your turn to step forward.
honor.option.truth-lineage.label: Sing the second verse of the house song to the end and reveal the truth
honor.option.truth-lineage.text: You break the silence and begin to sing the house song. First the first verse, the lord who never knelt that everyone knows. Then the lost second verse, the kneeling lord. The founder did not flee. To save everyone, he knelt before the enemy's blade. The child Arin joins in, and the widow Serin adds her voice. The swordmaster nods, and one by one the people of the square learn the second verse. The elder's ledger is lowered, and Sion does not apologize. Argon learns that honor lies not in hardening one's face, but in keeping the truth and building with courage.
honor.option.exile-elder.label: Read out the erased line of the rank ledger and cast out the elder
honor.option.exile-elder.text: You gather the words of recorder Eli and mason Toben and read out the erased line of the rank ledger. The founder's name was on that line originally, and someone erased it to hide the humiliation. Elder Beron bows his head, and the square stirs. The elder is struck from the name and leaves the village. But the rank ledger still remains, and the people begin to form ranks again. Argon shed its false face, but has not yet learned how to build true honor.

