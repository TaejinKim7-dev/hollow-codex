# --- Reona, village of compassion (M3 Task 33) ---
town.reona.name: Reona
compassion.music.title: Reona's Almoner

compassion.npc.almoner.name: The Almoner
compassion.npc.almoner.greet: Welcome to Reona. No one in this town goes hungry. So long as they stand in line.
compassion.npc.almoner.name.t: I am the almoner. In Reona a share is called out before a name. One share, half a share, third row second share — like that.
compassion.npc.almoner.job.t: My work is keeping the storehouse and setting the rations. How much to give to whom, who is still qualified. …Charity begins with taking in and ends with giving out.
compassion.npc.almoner.charity.t: Charity is the order by which those who can give look after those who cannot. If that order wavers, everyone goes hungry. So receivers must be grateful, and givers must keep giving.
compassion.npc.almoner.pantry.t: Did you hear that at the chapel? An open storehouse? That is only an old tale. Anyone walking in and taking their fill — what kind of disorder would that be? We share out in good order.
compassion.npc.almoner.tax.t: Dependence? If you mean the paper to lower the tax, I stopped it. Anyone who has lived through one year of a bare storehouse can never let it stand empty again. If the giving hand stops, the receiving hand has nowhere to go.
compassion.npc.almoner.hunger.t: Hunger. I learned it at the very end of a line. That is why, even now, I do not close the door until the last person has their share.
compassion.npc.almoner.plaza.t: The line in the square is straight and quiet. In a straight line, no one gets pushed aside. …Only those who have been pushed aside know what that is worth.

compassion.npc.baker.name: The Baker
compassion.npc.baker.greet: Smelled the bread and came? Sorry, today's share has not come out yet.
compassion.npc.baker.name.t: I'm the baker. I bake each morning and send the loaves to the almoner's storehouse each evening.
compassion.npc.baker.job.t: My work is baking bread. Every loaf goes to the storehouse, but only half of it comes out to the line. Where the other half goes, even I don't know.
compassion.npc.baker.hunger.t: Hunger makes no sound. It dwindles quietly at the end of the alley, and one day it is simply gone. I watch that soundless dwindling every day.
compassion.npc.baker.beggar.t: Do you know the one who lives in the alley? The almoner calls him a lazy hand, but I know him. He falls asleep every night smelling the bread.
compassion.npc.baker.bakery.t: Smoke at night? Dough has to rise overnight. …Please don't ask more than that. The smell of bread always drifts down the alley.
compassion.npc.baker.dependence.t: What I owe the storehouse grows every year. So now even my own child stands in line each morning. A baker's child queuing for bread — funny, isn't it?

compassion.npc.child.name: Piri, the Alley Child
compassion.npc.child.greet: A stranger! Everyone in Reona goes to collect bread — why don't you?
compassion.npc.child.name.t: They call me Piri. I have a real name, but no one ever asks, so I forgot it.
compassion.npc.child.job.t: My job is playing! But Mom's off working, so these days I'm the one who lines up at the storehouse every morning. There's a big word over the door that says 'Sharing' — it's the only word I can read so far.
compassion.npc.child.song.t: Do you know the wanderer's song? Everyone stops at 'close your hand and no one knows,' but he keeps going after that. I like the part after best.
compassion.npc.child.gift.t: The bread for Uncle Halv? I didn't give it to him. I sat next to him and we ate it together. Even half a loaf is too big to eat alone.
compassion.npc.child.almoner.t: The almoner grandpa only ever looks at the very last person in line, with a scary face. But when I'm last, he always counts my bread twice.

compassion.npc.beggar.name: Halv the Beggar
compassion.npc.beggar.greet: …I'm sorry, I have nothing to give you right now. I'm someone who only ever receives.
compassion.npc.beggar.name.t: I lost my name long ago. In the line I'm called by my share number. Halv is what Piri named me, though even the child doesn't know what it means.
compassion.npc.beggar.job.t: My work is standing in line. I stand before the storehouse in the morning and again in the evening. In between, now and then, something is handed to me from outside the line.
compassion.npc.beggar.gift.t: Piri once split his bread in half for me. I nearly called it a gift, then stopped. Because the child didn't hand it over and leave — he sat beside me and ate the other half with me.
compassion.npc.beggar.song.t: Have you heard the wandering singer's song? It says the giving hand is no empty hand. I weep often at that line.
compassion.npc.beggar.hunger.t: You never get used to hunger. It only grows quiet. What's harder is when familiar faces stop showing up in the evening line, one by one.
compassion.npc.beggar.bakery.t: Sometimes a warm loaf is waiting on the stone at the end of the alley. I don't ask who leaves it. The moment I ask, that bread would have a ledger too.

compassion.npc.priest.name: Priest Lien of the Chapel
compassion.npc.priest.greet: Peace be with you. This chapel is open to anyone. …The storehouse, less so.
compassion.npc.priest.name.t: My name is Lien. I keep this chapel. The people of Reona call me the recording priest.
compassion.npc.priest.job.t: I used to write the old customs, as I heard them from elders now gone, on the chapel wall one line at a time. The oldest line says, 'Sit side by side at the same table.' The almoner always quickens his step when he passes that wall.
compassion.npc.priest.pantry.t: On sharing, the old records say Reona's storehouse originally had no door. Even when the hungry went in and took their fill, no one reproached them. Because giving was simply being together.
compassion.npc.priest.love.t: Love does not come down from above. Love is sitting side by side. If charity makes one bow the head, love brings the heads level.
compassion.npc.priest.chapel.t: The chapel wall holds the elders' sayings, one line at a time. Here and there a line has been scraped away. Whoever did it surely meant no harm — but those scraped places are always looking at me.
compassion.npc.priest.charity.t: Charity is a precious thing. But it only works if one side bows its head. In this chapel, the one who gives and the one who receives sit on the same bench. That much, at least, I can keep.

compassion.npc.wanderer.name: Sel the Wandering Singer
compassion.npc.wanderer.greet: I've walked a long road to get here. Songs carry far in this town. Everyone stands in line without a word.
compassion.npc.wanderer.name.t: My name is Sel. A wanderer who leaves one song in each village.
compassion.npc.wanderer.job.t: My work is walking and singing. I carry the songs learned on the road to the next village. In Reona there is one song I have not yet sung through.
compassion.npc.wanderer.song.t: Listen. Lay no gift on top of sharing, it only weighs down the hand that takes. Sit beside in love, and one loaf feeds two. …This town remembers only half of the song.
compassion.npc.wanderer.sharing.t: Sharing is a good thing. But when sharing is all that's left, the giving hand and the taking hand are set above and below for good. That's why the song says not to pile anything more on top.
compassion.npc.wanderer.plaza.t: When I sing in the square, the line wavers for a moment. Someone turns their head, then quickly faces front again, afraid of losing their place. I sing here for that one moment.
compassion.npc.wanderer.charity.t: I've walked through many towns, but never seen charity as orderly as here. Orderly things rarely break. But they rarely bend, either.

compassion.npc.miller.name: Mare the Miller
compassion.npc.miller.greet: A place that smells of flour. Please bear with the rumble of the millstone.
compassion.npc.miller.name.t: They call me Mare. I have ground grain at this mill for thirty years.
compassion.npc.miller.job.t: Grinding grain, that's the work. But lately I count more than I grind. How many sacks go into the almoner's storehouse, who pays how much….
compassion.npc.miller.tax.t: "The almoner? Some years back a young recorder proposed lowering the tax — opening the storehouse to the people. The almoner blocked it. His reason: there must be givers for there to be receivers. After that the village grew poorer."
compassion.npc.miller.dependence.t: Work more and your share shrinks. So young folk these days work the mill for half a day and then go stand in line. I can't blame them — that's how the sums are set.
compassion.npc.miller.bakery.t: The bakery? When you count grain, a measure of flour sometimes slips out of the tally — my eyes aren't what they were. I'd rather you didn't ask where that measure goes.

compassion.npc.seamstress.name: Yuna the Seamstress
compassion.npc.seamstress.greet: Cloth runs short, so I can't make you clothes — but I am rich in stories.
compassion.npc.seamstress.name.t: They call me Yuna. I sew at the east end of the square.
compassion.npc.seamstress.job.t: I make and mend clothes. The people in the square's line all wear out their sleeves in the same spot — where the hand reaches out. I sewed the almoner's robe too, and its cuffs are still like new.
compassion.npc.seamstress.bakery.t: You mean the bakery. That chimney smokes even at night. The day's bread goes to the storehouse; where the night's bread goes, only the chimney knows.
compassion.npc.seamstress.almoner.t: I sewed a key pocket inside the almoner's robe. Just one storehouse key, and the whole robe hangs to one side. His shoulder on that side always droops a little.
compassion.npc.seamstress.love.t: Love? When I mend a torn garment, I don't patch over the top — I join new cloth in from the side. Patch over the top and that spot gets thick, and it tears again soon.

compassion.npc.scribe.name: Teo the Recorder
compassion.npc.scribe.greet: I am the recorder. …Will you leave a statement, or ask me something?
compassion.npc.scribe.name.t: They call me Teo. I keep this village's records.
compassion.npc.scribe.job.t: I keep the ledgers and papers in order. I write the charity ration ledger as well. The numbers are honest — but which column they go in, my hand decides.
compassion.npc.scribe.charity.t: In the ledger, charity always goes in the 'given out' column. A small dot is marked beside the name of whoever received it. The moment that dot goes down, they become someone who must repay forever.
compassion.npc.scribe.tax.t: Speaking of sharing, there is a paper I remember. The tax reform paper is still in my drawer. The almoner told me to burn it, but I couldn't burn with my own hand what my own hand had written.
compassion.npc.scribe.dependence.t: The word dependence isn't in the ledger. Only the same names, written again on the same line every year. I couldn't bear to watch that line grow, so a few years ago I wrote a paper. It's in my drawer now.
compassion.npc.scribe.almoner.t: The almoner reads the ledger backward. From the very last line, the last person. I've never asked him why.

compassion.npc.grandmother.name: Hanna the Old Mother
compassion.npc.grandmother.greet: Come, sit and rest awhile. From here you can see the line before the storehouse well.
compassion.npc.grandmother.name.t: Call me Hanna. I've lived eighty years in this town.
compassion.npc.grandmother.job.t: My work now is only to sit. …No, there is one more. Remembering the songs of my childhood.
compassion.npc.grandmother.song.t: Let me sing you one. Open your hand and bread comes; close your hand and no one knows. But the old words were different — join hands, and everyone is full. …After the empty year everyone sang it the new way, and no one ever said why.
compassion.npc.grandmother.love.t: What is love? Sitting at the table. Whoever eats first, everyone sits and eats together. That is love. What comes down from above is not love — it is alms.
compassion.npc.grandmother.hunger.t: Do you know about the empty year? The storehouse ran bare in three days. Those who came first took everything, and some of the children at the end of the line never saw spring.
compassion.npc.grandmother.almoner.t: The almoner? That boy stood at the end of the line that year too, holding his little sister's hand tight. …By spring he was alone. He grew up and put a door on the storehouse.
compassion.npc.porter.name: Bram the Storehouse Porter
compassion.npc.porter.greet: Out of the way— …no, sorry. The sack's heavy, that's all.
compassion.npc.porter.name.t: Bram. Been a while since anyone asked my name. Everyone just asks how many sacks I hauled.
compassion.npc.porter.job.t: My job's hauling sacks of bread and grain into the storehouse. Twenty years of carrying in. I can count on one hand the times I carried anything out.
compassion.npc.porter.hunger.t: In the back room, grain sacks and dried bread are stacked to the ceiling. Each sack's marked with a year, and the weevils got to the bottom ones first. Outside you hear people going hungry; inside you hear weevils crawling.
compassion.npc.porter.almoner.t: Every night the almoner takes a lamp into the back room alone. Seems like he's counting the sacks, but never out loud. Once, on his way out, I heard him say, still not enough.
compassion.npc.painter.name: Osen the Sign Painter
compassion.npc.painter.greet: Mind the smell of paint. Spring is when I repaint the storehouse sign.
compassion.npc.painter.name.t: Osen. I've painted other people's letters all my life, yet never once painted my own name anywhere.
compassion.npc.painter.job.t: Signs, boards, anything with letters — that's my trade. The board over the storehouse door takes the most care. Every year the almoner asks me to paint it a little brighter.
compassion.npc.painter.sharing.t: That word on the board? Strip the paint and there are old nail holes in the wall. A hand's breadth higher than now, where there wasn't even a doorframe.
compassion.npc.painter.almoner.t: The storehouse's stone walls are over a hundred years old, but the door hinges are maybe forty. The iron hasn't aged enough. That's about the year he became almoner.
compassion.npc.linesitter.name: Dara the Line-Sitter
compassion.npc.linesitter.greet: Want me to hold your place? Half a day for a corner of bread.
compassion.npc.linesitter.name.t: I'm Dara. In the line, though, I'm better known as the one who stands in for you.
compassion.npc.linesitter.job.t: I stand in line for people who have to go to work. When the share comes out I bring it to them and keep a corner as my fee. The longer the line, the fuller my belly — shameful, but true.
compassion.npc.linesitter.charity.t: Charity feeds me. No almoner, no line; no line, no me. So I'm on the almoner's side. Probably.
compassion.npc.linesitter.plaza.t: The square's paving stones are worn where each person stands. I only ever stand in other people's spots, so I don't have one of my own. Sometimes that stings a little.
compassion.npc.laundress.name: Nora the Washerwoman
compassion.npc.laundress.greet: Sorry, my hands are wet. I have to rinse all of this before the sun goes down.
compassion.npc.laundress.name.t: I'm Nora, Piri's mother. Lately I've gotten into the habit of calling him by his share number instead of his name. I shouldn't.
compassion.npc.laundress.job.t: I wash other people's laundry. But whenever I'm paid, my share is cut in half. So I take less work, and send him to stand in line.
compassion.npc.laundress.dependence.t: There's a kind of sum where the more you work, the poorer you get. At first I thought it was strange. Now I live by it. Even the feeling that it's strange wears away.
compassion.npc.laundress.gift.t: Some days the share he brings home is only half. When I ask if he got less, he just smiles. I think I know who he ate it with, so I don't ask more.
compassion.npc.watercarrier.name: Tur the Water Carrier
compassion.npc.watercarrier.greet: Dawn water is cold. Still, the people in line need something to wet their throats.
compassion.npc.watercarrier.name.t: Tur, they call me. In this square, I'd wager only my water jars know my name.
compassion.npc.watercarrier.job.t: Every dawn I draw water from the well and pass a sip down the line. Water isn't written in any ledger. In this town it's the one thing you can give without a second thought.
compassion.npc.watercarrier.hunger.t: Passing the ladle down the line, you count heads without meaning to. When a hand that took water yesterday isn't there today, that patch of stone stays dry for a while.
compassion.npc.watercarrier.wanderer.t: Whenever that singer sings, I find myself setting my jars down. The tail of his song is like the one my mother sang when I was small. I've forgotten what came after.

# --- Reona clues ---
compassion.word.sharing.label: Sharing
compassion.word.sharing.hint: The word on the board above the storehouse door. A good word, but here it has come to divide those who give from those who receive.
compassion.word.gift.label: Gift
compassion.word.gift.hint: Warmer than a ration, yet one hand still gives and the other receives. The name the beggar first reached for when a child handed him half a loaf.
compassion.word.love.label: Love
compassion.word.love.hint: The true principle of compassion. Not alms handed down from above, but sitting side by side and eating together.
compassion.word.charity.label: Charity
compassion.word.charity.hint: What this village calls order. It hardens the divide between giver and receiver.
compassion.word.dependence.label: Dependence
compassion.word.dependence.hint: The relation charity creates. The receiver must be grateful, and repay forever.
compassion.word.hunger.label: Hunger
compassion.word.hunger.hint: What dwindles and disappears without a sound. At the alley's end, where no one sees.
compassion.fact.reona.almoner.label: The Almoner
compassion.fact.reona.almoner.hint: The official who keeps Reona's storehouse and sets the rations. He believes charity is order.
compassion.fact.reona.baker.label: The Baker
compassion.fact.reona.baker.hint: Sends every loaf he bakes to the storehouse. Only half of it ever reaches the line.
compassion.fact.reona.wanderer.label: The Wandering Singer
compassion.fact.reona.wanderer.hint: A wayfarer who leaves one song in each village. In Reona there is a song left half-sung.
compassion.fact.reona.bakery.label: Reona's Bakery
compassion.fact.reona.bakery.hint: A chimney that smokes even at night. The day's bread goes to the storehouse; the night's bread is in no ledger.
compassion.fact.reona.plaza.label: The Square
compassion.fact.reona.plaza.hint: Where people line up before the storehouse. Every morning the same shadows stand in the same places.
compassion.fact.reona.chapel.label: The Chapel
compassion.fact.reona.chapel.hint: Where the records of the old customs remain. It is written that the storehouse once had no door.
compassion.fact.reona.song.label: The Wanderer's Song
compassion.fact.reona.song.hint: "Reona's old song. It sings that compassion is not handed down from above but is staying beside one another. The people of Reona know only half of it."
compassion.fact.reona.open-pantry.label: The Old Custom of the Open Storehouse
compassion.fact.reona.open-pantry.hint: Reona's storehouse once had no door. The hungry walked in and took, and no one reproached them.
compassion.fact.reona.relief-tax.label: The Failed Tax Reform
compassion.fact.reona.relief-tax.hint: An attempt to open the storehouse to the people and lower the tax. The almoner blocked it, and the village grew poorer.
compassion.fact.creature.compassion-beggar.label: The Hungry Beggar
compassion.fact.creature.compassion-beggar.hint: Not evil — only hungry. His hands are not lazy; they are merely empty.

# --- Reona deduction and crisis ---
compassion.deduction.compassion.sentence: Compassion is not laying {2} on top of {1}, but being together through {3}
compassion.deduction.compassion.hint: Every kind word in this town sets one hand above another. Only the song's last verse lays the hands side by side.
compassion.crisis.hoard.text: People gather before the storehouse. The almoner begins handing out bread, and at the end of the line a child falls — no one reaches out a hand. The almoner speaks. If the order wavers, no one receives anything; keep to the line. Then, from across the square, the wanderer's song is heard. Now it is your turn to step forward.
compassion.option.open-pantry.label: Open the storehouse door and let everyone share together
compassion.option.open-pantry.text: You sing along with the wanderer's song and read aloud the old lines on the chapel wall. The storehouse once had no door. The almoner's door swings open, and people pass the bread among themselves. In a square where no place is left for giver or receiver, everyone is full. The village learns that compassion is not laying a gift on top of sharing, but being together in love.
compassion.option.relief-tax.label: Make public the tax reform document
compassion.option.relief-tax.text: You take the tax reform document from the recorder's drawer and reveal it. An old promise to return the storehouse to the people and lower the tax. The almoner bows his head. The village relearns how to feed itself. Where the alms ended, people began to call one another's names.

# --- Reona abilities and creatures ---
