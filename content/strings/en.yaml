honor.ability.truth.name: The Sword of Truth
honor.creature.braggart.name: The Braggart Duelist

# --- Elia, village of spirituality (M4 Task 39) ---
town.elia.name: Elia
spirituality.music.title: Elia's Breath

spirituality.npc.monk.name: Abbot Daru
spirituality.npc.monk.greet: A stranger seeking Elia? Do you wish to meditate? Then show me a license first. Meditation is not free.
spirituality.npc.monk.name.t: I am the abbot of this meditation hall, Daru. In this village, a license number is remembered longer than a name.
spirituality.npc.monk.job.t: My work is keeping the order of the mind. Meditation is not for everyone. Only the qualified enter the hall, and the qualification is proven by a license. If you are caught meditating without one, it is apostasy.
spirituality.npc.monk.ritual.t: Ritual is form. And form must hold firm. Dawn prayers, afternoon sutras, evening incense. If this order wavers, the mind wavers too. So I cannot give a license to one who breaks procedure, however upright the mind.
spirituality.npc.monk.prayer.t: Only license holders may pray. The first stage is the borrowed prayer, the next is the shared prayer, and the last is the solitary prayer. Each stage requires a license, and I sign them all.
spirituality.npc.monk.silent-chant.t: A sacred song? I have heard of none. There is no such song in the meditation hall. If there is a song passing from mouth to mouth, it was invented by those without licenses.
spirituality.npc.monk.truth.t: Truth? Hmph. What place has truth in meditation? Only procedure matters. Keep the procedure, and anyone can become holy. Do not seek truth. One who seeks truth loses their license.

spirituality.npc.novice.name: Ian the Novice
spirituality.npc.novice.greet: Oh, did you come to take the license exam? I'm about to take mine soon too.
spirituality.npc.novice.name.t: They call me Ian. I've been a novice monk for three years. Once I receive a license, I can finally step properly into the meditation hall.
spirituality.npc.novice.job.t: Every morning I scrub the meditation hall floor. I can't meditate yet, but I can scrub beneath the feet of those who do. The abbot calls this work mercy too. I still don't know if it is mercy or license.
spirituality.npc.novice.prayer.t: They say prayer can be learned only after receiving a license. But I have heard the hermit's song. It is a sound without a license, and strangely it felt most like prayer of all.
spirituality.npc.novice.meditation-hall.t: The hall door is always locked. Show a license and it opens; without one, you stand before the door. I have stood before it for three years.
spirituality.npc.novice.silent-chant.t: That song… I've heard it in secret too. The breath-like song the old hermit breathes out in the back garden. It would be trouble if the abbot heard of it. But after hearing it, the mind empties. The fear along with it.

spirituality.npc.scribe.name: Seon, the License Clerk
spirituality.npc.scribe.greet: The license issuance records. Applications on Mondays, renewals at the start of each season. Meditation is by appointment.
spirituality.npc.scribe.name.t: They call me Seon. A clerk who issues and records licenses in the meditation hall's archive.
spirituality.npc.scribe.job.t: This archive holds three hundred years of license records. Names, signatures, renewal dates. Everyone who meditates is written in this ledger. One who meditates outside the ledger — that is spirituality outside the book.
spirituality.npc.scribe.ritual.t: Ritual must be as exact as a ledger. If procedure goes awry, the license is withdrawn; when the license is withdrawn, meditation is prohibited. I am the one who records those withdrawals.
spirituality.npc.scribe.prayer.t: In the old license records, the word 'prayer' appears from the first page. In the new records, the word 'license' appears from the first page. The same ledger, the words turned around.
spirituality.npc.scribe.library.t: This archive is like the heart of the meditation hall. Three hundred years ago, a pilgrim left a sutra on this very spot. Now that sutra lies buried under the license ledgers.

spirituality.npc.healer.name: Rua the Healer
spirituality.npc.healer.greet: The breath first, the credentials after. There is no law of asking the sick for a license.
spirituality.npc.healer.name.t: They call me Rua. A healer who cares for the sick of this village. Because I teach how to rule the breath outside the hall, I have no license.
spirituality.npc.healer.job.t: The sick do not hold out licenses. The one who cannot breathe, the one afflicted by sleeplessness, the one whose chest is tight. I listen to their breath first. That is my prayer.
spirituality.npc.healer.breath.t: Breath needs no license. Breathe in, breathe out — that alone empties the mind. If you hold your breath waiting for a license, the mind only tightens more.
spirituality.npc.healer.breath-song.t: I used to teach the children a breath song at the sick one's bedside. 'The breath lives, the trembling rests.' Now, they say, singing in the hall gets your license withdrawn. This village licenses even its songs.
spirituality.npc.healer.courage.t: Courage is not presenting a license. Courage is taking the sick one's hand and singing one verse of a forbidden song. I want to summon that courage someday.

spirituality.npc.hermit.name: Pella the Hermit
spirituality.npc.hermit.greet: …Shh. I am a person without a name. I erased it myself, so I would not be written into the license ledger. Even so, to one who comes speaking, I owe a quiet answer.
spirituality.npc.hermit.name.t: Pella. Once I was a monk of this hall. There was a time I prayed with song instead of license. Now I live in the archive's shadow, my name erased.
spirituality.npc.hermit.job.t: I meditate. Without a license, without dawn prayers, without ritual. I only count my breath and sing. Here in the archive's depths, where no one knows.
spirituality.npc.hermit.spirit.t: Spirit is not a matter of tomorrow. When it is still, when the breath grows shallow, it comes to rest in the mind without your knowing. The license was a seat for that spirit. But somewhere along the way only the seat remained, and the spirit was driven out.
spirituality.npc.hermit.silent-chant.t: You are listening. This song I do not let out of the mouth. Song is not sung by imitating — it is sung by being sung. One who can truly sing, sings without sound. Truth, love, and courage too vanish when sung aloud. They only come alive when they breathe together in the heart.
spirituality.npc.hermit.truth.t: Truth. I am reluctant now even to let that word out of my mouth. One who speaks truth has their license withdrawn and is forced into silence. But truth cannot be withdrawn with a license. The license lives on paper; the truth lives in the breath.
spirituality.npc.hermit.courage.t: Courage. The scarcest thing in this village. Meditating after throwing away the license, in an age when meditation requires one — that is the only courage I know.

spirituality.npc.gardener.name: Hore the Gardener
spirituality.npc.gardener.greet: The garden needs no license. Bury a seed, and it grows without one.
spirituality.npc.gardener.name.t: They call me Hore. A gardener who tends the herbs and flowers in the garden behind the hall. While the monks empty their minds, I empty the mind of the earth.
spirituality.npc.gardener.job.t: This garden is older than the meditation hall. It is where the pilgrim planted herbs and left them. The breath that mends wounds, the worry worn into furrows — the plants that cure such things. Licenses do not grow here.
spirituality.npc.gardener.breath.t: The breath is like a garden. Tended, it deepens; left alone, it dries up. In spring I level my breath with the hoe. That is my only ritual.
spirituality.npc.gardener.love.t: Love is the garden's water. No one waters a license number. We water people, we water flowers, and sometimes we water a strange traveler too.
spirituality.npc.gardener.courtyard.t: This courtyard runs all the way to the hall's door. Those coming to buy licenses, those who lost theirs — they pass along this path. The grass looks on them all alike.

spirituality.npc.child.name: Rine the Child
spirituality.npc.child.greet: Shh, caught me! …No, I'm teasing. I was singing.
spirituality.npc.child.name.t: I'm Rine! A child who lives in the garden behind the hall. The monks call me 'little noise,' but I grow quietest when I sing.
spirituality.npc.child.job.t: My job is singing! When Grandfather Hore pulls the garden weeds, I sing the breath song. A song without a license — if the abbot hears, I'll be scolded. But singing it makes my heart flutter light.
spirituality.npc.child.silent-chant.t: That's my song! The one the hermit breathes out in the back garden — I hide behind a tree and sing along. He says you mustn't make a sound, so I only mouth it silently. But mouthing it really does clear the mind. Isn't that strange?
spirituality.npc.child.prayer.t: I've never learned to pray. They say you need a license to pray. But to me the breath song feels like prayer, and I don't yet know how to get a license.

spirituality.npc.brewer.name: Ion the Brewmaster
spirituality.npc.brewer.greet: Want a cup of tea that never passed the hall? No, just joking. I'm the one who does the least holy work in this village.
spirituality.npc.brewer.name.t: They call me Ion. A brewmaster who makes barley tea and medicinal wine at the tavern. The monks ask for a license for the tea, but I don't stick licenses on my kettle.
spirituality.npc.brewer.job.t: My work is boiling water, steeping tea, and listening to the villagers' stories. Those worn out from buying licenses at the hall only catch their breath at my tavern.
spirituality.npc.brewer.license-rule.t: The license system. It's been three years since the abbot started selling licenses at the hall door. Before that, anyone could enter the hall and sit quietly. Now, a price has been put on that quiet sitting.
spirituality.npc.brewer.ritual.t: Ritual. At dawn prayers, those without licenses cannot even light incense. But the old records say the pilgrim prayed without incense.

spirituality.npc.gatekeeper.name: Gur the Gatekeeper
spirituality.npc.gatekeeper.greet: Gatekeeper of the meditation hall. Without a license, you do not pass this door. …Of course, that door is not the only one in the hall.
spirituality.npc.gatekeeper.name.t: Call me Gur. A gatekeeper who guards the village entrance and the hall's door. There are two gates, and I bar only one with a license.
spirituality.npc.gatekeeper.job.t: I bar the hall door with a license and leave the village entrance open. But of late a false monk appears at the village gate, seizing people to sell them meditation. Without a license, even. That one is the real danger.
spirituality.npc.gatekeeper.fake-monk.t: That false monk. In a cowl, rapping a wooden fish, telling people to donate for the grace of meditation. Open your purse, another donation; open it again, and he takes the bow and the name too. He is not in the license ledger. Real monks are evil in license; that one is evil in donations.
spirituality.npc.gatekeeper.courtyard.t: If it's the hall's courtyard — as gatekeeper I have something to say. Inside the yard it is quiet; outside it has grown noisy. Those who once sat and leveled their breath without a license must now pay and take exams.

spirituality.npc.widow.name: Ire the Widow
spirituality.npc.widow.greet: I have no license, so I cannot enter the hall. And so I live counting my husband's breath outside the door.
spirituality.npc.widow.name.t: They call me Ire. A widow who lives facing the hall door. My husband, trying to get a license, gave it up for me, who prayed beside him.
spirituality.npc.widow.job.t: What my husband left behind is the breath song. In a village where even calling something prayer requires a license, I count my breath beside him every evening. Because the license is not recorded to the dead.
spirituality.npc.widow.breath-song.t: The breath song is a song the women of old sang. 'The breath lives, the trembling rests.' Before the license system, this was the prayer. We meditated with this song.
spirituality.npc.widow.love.t: Love holds out no license. My husband gave up his license so I would not be left outside meditation. Love lets you breathe deeper than meditation, even without being meditation.
spirituality.npc.widow.courage.t: Courage… lately I want to sing that breath song aloud before the hall door. Let the license be withdrawn. Because what my husband taught me is that true meditation is becoming free of fear.

# --- Elia clues ---
spirituality.word.spirit.label: Spirit
spirituality.word.spirit.hint: What the hermit saw within the breath. The license was the spirit's seat, but now only the seat remains and the spirit is driven out.
spirituality.word.prayer.label: Prayer
spirituality.word.prayer.hint: What only license holders may offer. But the old ledger has records of praying without a license.
spirituality.word.breath.label: Breath
spirituality.word.breath.hint: The only meditation that needs no license. Breathe in, breathe out, and the mind empties.
spirituality.word.ritual.label: Ritual
spirituality.word.ritual.hint: "The dawn prayers and sutra readings reduced to form. The village's law: if procedure goes awry, the license is withdrawn."
spirituality.fact.elia.monk.label: Abbot Daru
spirituality.fact.elia.monk.hint: The abbot who issues meditation licenses. Three years ago meditation became a matter of credentials.
spirituality.fact.elia.novice.label: Ian the Novice
spirituality.fact.elia.novice.hint: A novice preparing for the license exam for three years. He scrubs the hall floor but cannot step inside the door.
spirituality.fact.elia.hermit.label: Pella the Hermit
spirituality.fact.elia.hermit.hint: A former monk meditating without a license in the archive's shadow. The only one who knows the breath song.
spirituality.fact.elia.healer.label: Rua the Healer
spirituality.fact.elia.healer.hint: A healer who teaches how to rule the breath. She does not ask the sick for licenses.
spirituality.fact.elia.widow.label: Ire the Widow
spirituality.fact.elia.widow.hint: A widow counting her husband's breath outside the hall door, without a license. She remembers the old breath song.
spirituality.fact.elia.meditation-hall.label: The Meditation Hall
spirituality.fact.elia.meditation-hall.hint: The house at the village's center that you enter only by showing a license. Its door is always locked.
spirituality.fact.elia.library.label: The Archive
spirituality.fact.elia.library.hint: The hall's archive stacked with three hundred years of license records. The sutra the pilgrim left lies buried under ledgers.
spirituality.fact.elia.courtyard.label: The Hall's Courtyard
spirituality.fact.elia.courtyard.hint: The herb garden and courtyard older than the hall itself. The old place where you leveled your breath without a license.
spirituality.fact.elia.silent-chant.label: The Breath Song
spirituality.fact.elia.silent-chant.hint: An old song sung without sounding it. The hermit breathes it out in the back garden, and the child sings along.
spirituality.fact.elia.breath-song.label: The Dawn Breath Song
spirituality.fact.elia.breath-song.hint: The breath lives, the trembling rests. The early dawn song women sang before the license system.
spirituality.fact.elia.license-rule.label: The Meditation License Law
spirituality.fact.elia.license-rule.hint: Since three years ago meditation requires credentials. The prayers of those without licenses are withdrawn.
spirituality.fact.creature.spirituality-fake-monk.label: The False Monk Demanding Donations
spirituality.fact.creature.spirituality-fake-monk.hint: Evil. One who sells meditation without a license, with cowl and wooden fish. Each time the purse opens, he demands a larger donation.

# --- Elia deduction and crisis ---
spirituality.deduction.spirituality.sentence: Spirituality is hearing {1} and achieving {3} through {2}
spirituality.deduction.spirituality.hint: The abbot's license left only the ritual and locked the mind. The true spirituality the hermit's breath song and the widow's song speak of is achieved when the three principles breathe together.
spirituality.crisis.license.text: Villagers gather in the hall's front courtyard. Abbot Daru unfurls the license ledger and cries out. This village's meditation belongs to the credentialed. One who steps into the hall without a license commits apostasy. Today, the novice Ian takes the license exam. But he cannot pay the exam fee and stands before the door. Clerk Seon unrolls the ledger, healer Rua clenches her hands, and the hermit Pella hears all of it from the archive's shadow. The child Rine holds her breath, and gardener Hore bows his head. Now it is your turn to step forward.
spirituality.option.open-meditation.label: Sing the hermit's breath song in silence and open the hall's door
spirituality.option.open-meditation.text: You step forward and sing, without sound, the breath song you learned from the hermit. Hear the truth, in love, in courage. The novice Ian adds his voice, and the widow Ire continues it. Gardener Hore lays the garden herbs before the door, and healer Rua levels her breath. Clerk Seon draws out the old record that never left the ledger and reads it. True meditation was not in the license but in truth, love, and courage breathing together. Abbot Daru lowers the ledger, and the hall's door opens for the first time without a license. From that day, Elia is a village where anyone may sit quietly.
spirituality.option.exile-monk.label: Read out the ledger's withdrawal records and cast out the abbot
spirituality.option.exile-monk.text: You take out clerk Seon's records and read them aloud. In three years the license fee tripled, and every prayer of the unlicensed was withdrawn. The ledger holds only names, signatures, and renewal dates — not a line of the prayers they offered. Abbot Daru has his licenses withdrawn and leaves the village. The hall's door opens, but the people still fear the song. Elia shed its licenses, but has not yet learned how to build true spirituality.

