# --- Reona, village of compassion (M3 Task 33) ---
town.reona.name: Reona
compassion.music.title: Reona's Almoner

compassion.npc.almoner.name: The Almoner
compassion.npc.almoner.greet: Welcome to Reona. No one goes hungry here. …It is only that you receive your ration the way we have decided.
compassion.npc.almoner.name.t: I am the almoner in charge of charity. In this village, how many shares you receive rises before your name.
compassion.npc.almoner.job.t: My work is keeping the storehouse and setting the rations. How much to give to whom, who is still qualified. …Charity begins with taking in and ends with giving out.
compassion.npc.almoner.charity.t: Charity is the order by which those who can give look after those who cannot. If that order wavers, everyone goes hungry. So receivers must be grateful, and givers must keep giving.
compassion.npc.almoner.pantry.t: An open storehouse? That is only an old tale. Anyone walking in and taking their fill — what kind of disorder would that be? We share out in good order.
compassion.npc.almoner.tax.t: Tax reform… there was talk of opening the storehouse to lower the tax. But that would shrink the share reserved for charity. I opposed it. That way the poor keep receiving help.

compassion.npc.baker.name: The Baker
compassion.npc.baker.greet: Smelled the bread and came? Sorry, today's share has not come out yet.
compassion.npc.baker.name.t: I'm the baker. I bake each morning and send the loaves to the almoner's storehouse each evening.
compassion.npc.baker.job.t: My work is baking bread. But do you know where it goes? Half to the storehouse, half… even I don't know where half goes.
compassion.npc.baker.hunger.t: Hunger makes no sound. It dwindles quietly at the end of the alley, and one day it is simply gone. I watch that soundless dwindling every day.
compassion.npc.baker.beggar.t: Do you know the one who lives in the alley? The almoner calls him a lazy hand, but I know him. He falls asleep every night smelling the bread.

compassion.npc.child.name: Piri, the Alley Child
compassion.npc.child.greet: A stranger! Everyone in Reona goes to collect bread — why don't you?
compassion.npc.child.name.t: They call me Piri. I have a real name, but no one ever asks, so I forgot it.
compassion.npc.child.job.t: My job is playing! But lately there's more lining up than playing. From morning I stand in line before the storehouse. Mom collects my share for me.
compassion.npc.child.song.t: Do you know the song the wanderer sings? Open your hand and bread comes; close your hand and no one knows. I like that one.

compassion.npc.beggar.name: Halv the Beggar
compassion.npc.beggar.greet: …I'm sorry, I have nothing to give you right now. I am only a body that receives.
compassion.npc.beggar.name.t: My name… I lost it long ago. People just call me beggar, so I call myself that too.
compassion.npc.beggar.job.t: My work is standing in line. I stand before the storehouse in the morning and stand again in the evening. Between them, nothing happens. …Sometimes, instead of bread, I receive a song.
compassion.npc.beggar.gift.t: Once a child split his own bread in half and gave it to me. That was not a ration. That was… a gift. Rations come from above; gifts come from beside.
compassion.npc.beggar.song.t: Have you heard the wandering singer's song? It says the giving hand is no empty hand. I weep often at that line.

compassion.npc.priest.name: Priest Lien of the Chapel
compassion.npc.priest.greet: Peace be with you. This chapel is open to anyone. …The storehouse, less so.
compassion.npc.priest.name.t: I am the priest who keeps this chapel. The people of Reona call me the recording priest.
compassion.npc.priest.job.t: I used to record this village's old customs. I wrote down, line by line, the stories I heard from the elders who have passed. Those writings keep falling out of favor with the almoner of late.
compassion.npc.priest.pantry.t: According to the records, Reona's storehouse originally had no door. Even when the hungry went in and took their fill, no one reproached them. Because giving was simply being together.
compassion.npc.priest.love.t: Love does not come down from above. Love is sitting side by side. If charity makes one bow the head, love brings the heads level.

compassion.npc.wanderer.name: Sel the Wandering Singer
compassion.npc.wanderer.greet: I walked a long road to reach here. This is a village where songs carry well. …By good intent, I mean.
compassion.npc.wanderer.name.t: My name is Sel. A wanderer who leaves one song in each village.
compassion.npc.wanderer.job.t: My work is walking and singing. I carry the songs learned on the road to the next village. In Reona there is one song I have not yet sung through.
compassion.npc.wanderer.song.t: Hear this song. Compassion does not lay a gift on top of sharing; it is being together in love. …The people of this village know only half of it.
compassion.npc.wanderer.sharing.t: Sharing is good. But if there is only sharing, the giver and the receiver are parted forever. That is why the song says to stand beside sharing, not on top of it.

compassion.npc.miller.name: Mare the Miller
compassion.npc.miller.greet: A place that smells of flour. Bear with the rattle of the grinding stone.
compassion.npc.miller.name.t: They call me Mare. I have ground grain at this mill for thirty years.
compassion.npc.miller.job.t: Grinding grain, that's the work. But lately I count more than I grind. How many sacks go into the almoner's storehouse, who pays how much….
compassion.npc.miller.tax.t: "Some years back a young recorder proposed lowering the tax — opening the storehouse to the people. The almoner blocked it. His reason: there must be givers for there to be receivers. After that the village grew poorer."

compassion.npc.seamstress.name: Yuna the Seamstress
compassion.npc.seamstress.greet: Cloth runs short, so I can't make you clothes — but I am rich in stories.
compassion.npc.seamstress.name.t: They call me Yuna. I sew south of the square.
compassion.npc.seamstress.job.t: I make and mend clothes. I even sewed the almoner's robes. I know how heavy those hems are.
compassion.npc.seamstress.bakery.t: You speak of the bakery. Smoke rises from its chimney even at night. You could say the chimney knows where the morning bread goes.

compassion.npc.scribe.name: Teo the Recorder
compassion.npc.scribe.greet: I am the recorder. …Will you leave a statement, or ask me something?
compassion.npc.scribe.name.t: They call me Teo. I keep this village's records.
compassion.npc.scribe.job.t: I organize the ledgers and documents. I also write the charity ration ledger. …Numbers are honest; the people who write them are less so.
compassion.npc.scribe.charity.t: The word charity is always written in the expenditure column of the ledger. In some years it was written as 'investment' too. The moment a person is written down as an investment, they become a body that must repay forever.
compassion.npc.scribe.tax.t: The tax reform document is still in my drawer. The almoner ordered it destroyed, but I could not throw it away. It seemed like something someone would need to read someday.

compassion.npc.grandmother.name: Hanna the Old Mother
compassion.npc.grandmother.greet: Come in, sit and rest awhile. From here you can see the line before the storehouse well.
compassion.npc.grandmother.name.t: Call me Hanna. I have lived eighty years in this village.
compassion.npc.grandmother.job.t: My work now is only to sit. …No, there is one more. Remembering the songs of my childhood.
compassion.npc.grandmother.song.t: Let me sing you one. Open your hand and bread comes; close your hand and no one knows. But the old lyrics were different. Open your hand and bread comes; join hands together and everyone is full. …When the lyrics changed, even I couldn't tell you.
compassion.npc.grandmother.love.t: What is love? Sitting at the table. Whoever eats first, everyone sits and eats together. That is love. What comes down from above is not love — it is alms.

# --- Reona clues ---
compassion.word.sharing.label: Sharing
compassion.word.sharing.hint: What the order of charity calls sharing. It keeps the giver and the receiver parted forever.
compassion.word.gift.label: Gift
compassion.word.gift.hint: Rations come from above; gifts come from beside. The half-loaf a beggar received from a child.
compassion.word.love.label: Love
compassion.word.love.hint: The true principle of compassion. Not alms handed down from above, but sitting side by side and eating together.
compassion.word.charity.label: Charity
compassion.word.charity.hint: What this village calls order. It hardens the divide between giver and receiver.
compassion.word.dependence.label: Dependence
compassion.word.dependence.hint: The relation charity creates. The receiver must be grateful, and repay forever.
compassion.word.hunger.label: Hunger
compassion.word.hunger.hint: What dwindles and disappears without a sound. At the alley's end, where no one sees.
compassion.fact.reona.almoner.label: The Almoner
compassion.fact.reona.almoner.hint: The official who keeps Reona's storehouse and sets the rations. He believes charity is order.
compassion.fact.reona.baker.label: The Baker
compassion.fact.reona.baker.hint: Bakes bread every day and sends half to the storehouse. Where the other half goes, no one knows.
compassion.fact.reona.wanderer.label: The Wandering Singer
compassion.fact.reona.wanderer.hint: A wayfarer who leaves one song in each village. In Reona there is a song left half-sung.
compassion.fact.reona.bakery.label: Reona's Bakery
compassion.fact.reona.bakery.hint: A place whose chimney smokes even at night. The chimney knows where half the baked bread goes.
compassion.fact.reona.plaza.label: The Square
compassion.fact.reona.plaza.hint: Where people line up before the storehouse. Every morning the same shadows stand in the same places.
compassion.fact.reona.chapel.label: The Chapel
compassion.fact.reona.chapel.hint: Where the records of the old customs remain. It is written that the storehouse once had no door.
compassion.fact.reona.song.label: The Wanderer's Song
compassion.fact.reona.song.hint: Compassion does not lay a gift on top of sharing; it is being together in love. The people of Reona know only half of it.
compassion.fact.reona.open-pantry.label: The Old Custom of the Open Storehouse
compassion.fact.reona.open-pantry.hint: Reona's storehouse once had no door. The hungry walked in and took, and no one reproached them.
compassion.fact.reona.relief-tax.label: The Failed Tax Reform
compassion.fact.reona.relief-tax.hint: An attempt to open the storehouse to the people and lower the tax. The almoner blocked it, and the village grew poorer.
compassion.fact.creature.compassion-beggar.label: The Hungry Beggar
compassion.fact.creature.compassion-beggar.hint: Not evil — only hungry. His hands are not lazy; they are merely empty.

# --- Reona deduction and crisis ---
compassion.deduction.compassion.sentence: Compassion is not laying {2} on top of {1}, but being together through {3}
compassion.deduction.compassion.hint: The order of charity puts sharing first. The wanderer's song sings love from the other side.
compassion.crisis.hoard.text: People gather before the storehouse. The almoner begins sharing out bread, and when a child falls, no one reaches for them. The almoner speaks. If the order wavers no one receives anything; stand in line. Then, from far across the square, the wanderer's song is heard. Now it is your turn to step forward.
compassion.option.open-pantry.label: Open the storehouse door and let everyone share together
compassion.option.open-pantry.text: You sing along with the wanderer's song and read from the old record. The storehouse once had no door. The almoner's door opens, and people pass the bread among themselves. In a square where no seat of giver or receiver remains, everyone is full. The village learns that compassion is not laid on top of sharing, but kept together in love.
compassion.option.relief-tax.label: Make public the tax reform document
compassion.option.relief-tax.text: You take the tax reform document from the recorder's drawer and reveal it. An old promise to return the storehouse to the people and lower the tax. The almoner bows his head. The village relearns how to feed itself. Where the alms ended, people began to call one another's names.

