# --- Heron, village of humility (M4 Task 40) ---
town.heron.name: Heron
humility.music.title: Heron's Breath

humility.npc.silent-elder.name: The Silent Elder
humility.npc.silent-elder.greet: …Silence.
humility.npc.silent-elder.name.t: In Heron we do not ask names. …I left mine in this chapel long ago. And you, when did you last say your own name aloud?
humility.npc.silent-elder.job.t: I keep this chapel, and the law of silence. In Heron, no one speaks their own name.
humility.npc.silent-elder.silence.t: Silence is a place, not a sound.
humility.npc.silent-elder.wordname.t: A name is not spoken. It is kept. …So I have taught.
humility.npc.silent-elder.chapel.t: The chapel. Built without words.
humility.npc.silent-elder.hermit.t: We came through this chapel door in the same year. He left. I stayed.
humility.npc.silent-elder.listening.t: I never taught anyone to listen. …I should have.

humility.npc.listener.name: The Listener
humility.npc.listener.greet: …I will listen.
humility.npc.listener.job.t: I listen. Without silence, nothing can be heard.
humility.npc.listener.listening.t: Listening is not filling — it is emptying.
humility.npc.listener.three.t: Empty yourself, and you hear the three.
humility.npc.listener.silence.t: Quietly.
humility.npc.listener.elder.t: The elder comes too. He sits without a word, and goes.
humility.npc.listener.wordname.t: No one has ever told me a name.

humility.npc.wellkeeper.name: The Wellkeeper
humility.npc.wellkeeper.greet: The well has no words.
humility.npc.wellkeeper.job.t: I keep the well.
humility.npc.wellkeeper.wordname.t: Water has no name.
humility.npc.wellkeeper.silence-rule.t: It is the rule of giving no name. As water rises without knowing a name.
humility.npc.wellkeeper.listening.t: The sound of the bucket touching water. That much, even the law could not stop.
humility.npc.wellkeeper.silence.t: The bottom of the well is always still, whatever happens above.

humility.npc.child.name: Village Child
humility.npc.child.greet: …They tell me to be quiet too.
humility.npc.child.job.t: I'm learning songs. Not out loud, just with my breath. In, hold, out.
humility.npc.child.listening.t: If you listen hard, you can hear it.
humility.npc.child.silent-chant.t: A song sung on the breath. It is sung even when unheard.
humility.npc.child.wordname.t: My name? Mum told me with just her breath, right in my ear. So I didn't really hear it.
humility.npc.child.hermit.t: The hermit grandpa sometimes dozes off while he's counting breaths. Then he starts over from one.

humility.npc.librarian.name: The Archive Keeper
humility.npc.librarian.greet: Books say nothing. …Come in.
humility.npc.librarian.job.t: I gather blank pages. Only one sheet still has writing on it, and all it says is 'three.'
humility.npc.librarian.three.t: Three of what, it doesn't say. …Other towns read it as truth, love and courage. This village chose to leave all three empty.
humility.npc.librarian.listening.t: Listening, more than reading. A blank page is read with the ears.
humility.npc.librarian.elder.t: The elder comes now and then to look at that one page. For a long time, without a word.
humility.npc.librarian.wordname.t: Not one book here has a name in it. Not the author's, not the borrower's.

humility.npc.gardener.name: The Forester
humility.npc.gardener.greet: Trees do not call names.
humility.npc.gardener.job.t: I tend the nameless forest.
humility.npc.gardener.listening.t: The forest speaks not in sound but in breath.
humility.npc.gardener.wordname.t: Name it, and the leaf falls.
humility.npc.gardener.silence.t: The forest is not quiet. Only the people are.
humility.npc.gardener.grove.t: Every tree had someone who planted it. No one knows their names.

humility.npc.cook.name: The Cook
humility.npc.cook.greet: …Sit. Rice is eaten quietly.
humility.npc.cook.job.t: I cook. No one's name can be called, so each bowl goes where its owner always sits.
humility.npc.cook.silence.t: I lift the lid before the pot boils. Here, even a pot isn't allowed to make a sound.
humility.npc.cook.wordname.t: One bowl has sat empty since winter. I haven't cleared that place yet.
humility.npc.cook.novice.t: The novice eats last, and quietest. Even when hungry.

humility.npc.novice.name: The Novice
humility.npc.novice.greet: …I am still in training.
humility.npc.novice.job.t: I learn silence in the chapel. The first lesson is to scrub the floor without a sound.
humility.npc.novice.silence.t: Close the mouth, and the ears open.
humility.npc.novice.wordname.t: I was taught to forget names.
humility.npc.novice.hermit.t: I heard the hermit once lived in this chapel too. No one says why he left.
humility.npc.novice.listening.t: So far, it's more holding back than listening.

humility.npc.hermit.name: The Hermit
humility.npc.hermit.greet: …Quietly. Do you not hear that sound?
humility.npc.hermit.job.t: I hide, and count my breaths. With each count, a line of a soundless song goes by.
humility.npc.hermit.silence.t: Silence is not emptiness — it is a place.
humility.npc.hermit.three.t: Humility is all three, emptied.
humility.npc.hermit.listening.t: Past the forest, where the south wall ends, stands a quiet warden. Not evil. It only smothers sound.
humility.npc.hermit.elder.t: He used to laugh loudly, once. A post like that makes a man quiet.
humility.npc.hermit.chapel.t: I was inside it once. Silence is heard better from outside.

humility.npc.widow.name: The Widow
humility.npc.widow.greet: …My husband's name keeps fading.
humility.npc.widow.job.t: I keep a name I'm losing. He never once spoke it himself, and I never said it aloud either.
humility.npc.widow.wordname.t: I buried the name with him. Here, the stones are left blank.
humility.npc.widow.listening.t: If someone would listen, I might say it aloud, just once.
humility.npc.widow.chapel.t: He laid the chapel's bricks. One at a time, without a word.
humility.npc.widow.elder.t: I asked the elder for the name. He didn't know it either.
humility.npc.stonecutter.name: The Stonecutter
humility.npc.stonecutter.greet: They say chisel on stone is allowed. It isn't speech.
humility.npc.stonecutter.name.t: A name? You're asking me for something even my stones don't have.
humility.npc.stonecutter.job.t: I cut gravestones. Smooth as water, nothing carved. That's the law here.
humility.npc.stonecutter.wordname.t: In winter the widow came and asked me to carve just one letter. I couldn't. My hands still itch when I see that stone.
humility.npc.stonecutter.elder.t: One spring night the elder stood at that grave a long while. He touched the stone once with his staff and left. Like a man looking for something.
humility.npc.lampkeeper.name: The Lamp-Keeper
humility.npc.lampkeeper.greet: I keep the chapel lamps from going out. Fire burns without a sound, so it suits this place.
humility.npc.lampkeeper.name.t: I was never given a name. Lamp-keeper will do.
humility.npc.lampkeeper.job.t: All night I trim the wicks and pour the oil. The chapel has never once gone dark.
humility.npc.lampkeeper.elder.t: Since winter, the elder has sat before the altar every night. His lips move, but not in the shape of any prayer.
humility.npc.lampkeeper.chapel.t: There are no words in this chapel, but I know each lamp by where it sits. That is how people here know one another, too.
humility.npc.tagcarver.name: The Tag Carver
humility.npc.tagcarver.greet: Take a place-tag. Here, you hang one round your neck instead of a name.
humility.npc.tagcarver.name.t: Names don't sell. Places do.
humility.npc.tagcarver.job.t: I carve place-tags. Wellkeeper, archive keeper, novice… every new place means more work for me.
humility.npc.tagcarver.wordname.t: If names come back, my trade is finished. …Still, if that day comes, the first tag I carve will be my own name.
humility.npc.tagcarver.silence.t: A quiet town is good for business. No haggling. Everyone pays on their fingers.
humility.npc.mother.name: The Mother
humility.npc.mother.greet: …At dusk I clap twice. That's how I call my child home.
humility.npc.mother.name.t: My child doesn't know my name. I never knew my own mother's, either.
humility.npc.mother.job.t: I'm raising a child. A child I can't call by name.
humility.npc.mother.wordname.t: The night my child was born, I breathed the name into that tiny ear. Whether it stuck, I don't know.
humility.npc.mother.listening.t: When the other mothers' claps mix with mine, children wander to the wrong house. So I clap a little slower.
humility.npc.sweeper.name: The Sweeper
humility.npc.sweeper.greet: I knew you by your footsteps. A step I've never heard before.
humility.npc.sweeper.name.t: I don't know names. But I know the footsteps of everyone in this village.
humility.npc.sweeper.job.t: I sweep the square. A broom isn't speech, so no one stops me.
humility.npc.sweeper.elder.t: The elder's step has slowed since winter. The tap of his staff arrives before he does.
humility.npc.sweeper.listener.t: People walk lighter after sitting with the listener. What they set down there, I couldn't say.

# --- Heron clues ---
humility.word.listening.label: Listening
humility.word.listening.hint: "Emptying rather than filling. What happens only when the ears open where words have stopped."
humility.word.three.label: The Three
humility.word.three.hint: "What the empty page in Heron's library points to. Humility begins in a place where all of them are left empty."
humility.word.name.label: Name
humility.word.name.hint: What Heron keeps off the tongue. Left uncalled long enough, it fades even for the one it belongs to.
humility.fact.heron.silent-elder.label: The Silent Elder
humility.fact.heron.silent-elder.hint: The elder who keeps Heron's wordless law. He asks no one's name, yet he demands one.
humility.fact.heron.listener.label: The Listener
humility.fact.heron.listener.hint: One who sits wordless by the well in the square. No one in Heron has lent an ear for longer.
humility.fact.heron.novice.label: The Novice
humility.fact.heron.novice.hint: A youth in the discipline of holding back words. The first lesson is forgetting names.
humility.fact.heron.hermit.label: The Hermit
humility.fact.heron.hermit.hint: A hermit who sits half-hidden in the shade west of the square, counting breaths. He calls the spot where words stop a 'place.'
humility.fact.heron.chapel-of-silence.label: The Chapel of Silence
humility.fact.heron.chapel-of-silence.hint: A chapel built without words. Heron's center, kept by the elder.
humility.fact.heron.library.label: The Empty Archive
humility.fact.heron.library.hint: An archive of blank pages. Only a single sheet still bears any writing.
humility.fact.heron.well.label: The Wordless Well
humility.fact.heron.well.hint: A well that fills without a name. Watching it, Heron came to believe people could live without names too.
humility.fact.heron.grove.label: The Nameless Forest
humility.fact.heron.grove.hint: A forest where naming makes the leaf fall. The trees know each other without calling.
humility.fact.heron.silent-chant.label: The Breath Song
humility.fact.heron.silent-chant.hint: A song sung without sounding it. The only song the child and the hermit know.
humility.fact.heron.breathing-rhythm.label: The Rhythm of the Breath
humility.fact.heron.breathing-rhythm.hint: The only rhythm Heron counts. Breathe in, hold, breathe out.
humility.fact.heron.silence-rule.label: The Rule of Silence
humility.fact.heron.silence-rule.hint: "Heron's law. No one may speak their own name. The hush swallows all words."
humility.fact.heron.real-name.label: My Lost Name
humility.fact.heron.real-name.hint: What the elder asked in return. Called nothing but 'stranger' for so long, you can't recall when you last said your own name aloud.
humility.fact.creature.humility-silencer.label: The Warden of Silence
humility.fact.creature.humility-silencer.hint: "Not evil. A being that merely muffles sound. Keeping the hush is its work."

# --- Heron deduction and crisis ---
humility.deduction.humility.sentence: Humility is the place where you empty yourself before {1} and take in {3} through {2}
humility.deduction.humility.hint: "Heron is a village that left every principle empty. Where words stop, what opens? The empty pages of the library hold a clue."
humility.crisis.name.text: Villagers gather before the Chapel of Silence. The elder stands leaning on a staff from which every carved name has been shaved away. 'I would lift the one law this village has left. Long have we kept our names locked away, and the lock has held us tighter than the names ever did. You, stranger. Speak your name. Someone must speak first, so the rest of us can follow.' Everyone holds their breath. Now it is your turn to open your mouth.
humility.option.speak-name.label: Speak your own name and lift the law of silence
humility.option.speak-name.text: You step forward and speak your name. The chapel rings with it. Quietly, the people say it back, and for the first time a sound leaves the widow's lips. The elder lays down his staff. 'A name is not for keeping. It is for calling one another.' Heron's silence returns to what it was, a courtesy for hearing others out. Humility is a place where the three are left empty, and where, after the emptying, names are called again.
humility.option.stay-silent.label: Keep the silence and swallow your name
humility.option.stay-silent.text: You swallow your name and bow your head. The elder looks at you for a long while. '…Your silence is no lie. But as long as it keeps a name locked away, Heron stays a village with its mouth shut, not one that listens.' The village quietly disperses. The law remains, but the hermit's breath song still circles the village without a sound.

