fact.ring.honesty.label: 빛샘의 고리
fact.ring.honesty.hint: 칼라스 들판 한가운데, 마른 풀 사이로 오래된 노래가 스며 있다.
fact.ring.compassion.label: 온빛의 고리
fact.ring.compassion.hint: 북동 해안의 돌무더기 아래, 목동이 부르는 평온한 노래.
fact.ring.valor.label: 큰바람의 고리
fact.ring.valor.hint: 서쪽 숲 가장자리, 바람이 나뭇가지를 울리는 소리를 곁에 두고.
fact.ring.justice.label: 저울벽의 고리
fact.ring.justice.hint: 북부 고원의 평지, 지평선을 저울대처럼 가르는 노래.
fact.ring.sacrifice.label: 빈손의 고리
fact.ring.sacrifice.hint: 동쪽 해안 바위틈, 아무것도 쥐지 않은 손으로 부르는 노래.
fact.ring.honor.label: 높은봉의 고리
fact.ring.honor.hint: 강 건너 언덕, 봉우리에 오르면 나지막이 들리는 노래.
fact.ring.spirituality.label: 고요샘의 고리
fact.ring.spirituality.hint: 남서 습지, 샘물이 돌을 스치는 소리로 읊는 노래.
fact.ring.humility.label: 낮은꽃의 고리
fact.ring.humility.hint: 남쪽 평원, 풀잎 사이로 꽃잎이 떨어지는 노래.

# --- 연민의 마을 리오나 (M3 Task 33) ---
town.reona.name: 리오나
compassion.music.title: 리오나의 자선가

compassion.npc.almoner.name: 자선 관장
compassion.npc.almoner.greet: 리오나에 오신 것을 환영합니다. 굶는 이는 없습니다. 다만…… 우리가 정한 방식대로 배급받을 뿐이지요.
compassion.npc.almoner.name.t: 저는 자선을 맡은 관장이라 합니다. 이 마을에서는 이름보다 몇 몫을 받는가가 먼저 오르지요.
compassion.npc.almoner.job.t: 제 일은 곳간을 지키고 배급을 정하는 것입니다. 누구에게 얼마를 줄지, 누가 아직 자격이 되는지를요. ……자선은 거두는 것으로 시작해 나누는 것으로 끝납니다.
compassion.npc.almoner.charity.t: 자선이란, 줄 수 있는 자가 줄 수 없는 자를 돌보는 질서입니다. 그 질서가 흔들리면 모두가 굶게 됩니다. 그러니 받는 이는 감사해야 하고, 주는 이는 계속 주어야 하지요.
compassion.npc.almoner.pantry.t: 열린 곳간이요? 옛날이야기일 뿐입니다. 누구나 들어가 마음껏 가져갔다니, 그런 무질서가 어디 있겠습니까. 우리는 질서 있게 나눕니다.
compassion.npc.almoner.tax.t: 세금 개혁이라……. 곳간을 열어 세금을 낮추자는 말이 돌았지요. 하지만 그러면 자선할 몫이 줄어듭니다. 저는 반대했습니다. 그래야 가난한 이들이 계속 도움을 받으니까요.

compassion.npc.baker.name: 빵집 주인
compassion.npc.baker.greet: 빵 냄새를 맡고 오셨습니까? 미안하지만 오늘 몫은 아직 나오지 않았습니다.
compassion.npc.baker.name.t: 빵집 주인입니다. 아침마다 굽고, 저녁마다 관장의 곳간으로 보내지요.
compassion.npc.baker.job.t: 제 일은 빵을 굽는 겁니다. 그런데 이 빵이 어디로 가는지 아십니까? 절반은 곳간으로, 절반은…… 어디로 가는지 저도 모릅니다.
compassion.npc.baker.hunger.t: 배고픔은 소리가 없습니다. 골목 끝에서 조용히 줄어들다가, 어느 날 아예 사라지지요. 저는 그 소리 없는 줄어듦을 매일 봅니다.
compassion.npc.baker.beggar.t: 골목에 사는 이를 아십니까? 관장은 그를 게으른 손이라 부르지만, 저는 압니다. 그는 밤마다 빵 냄새를 맡으며 잠이 듭니다.

compassion.npc.child.name: 골목 아이 피리
compassion.npc.child.greet: 이방인이다! 리오나 사람은 다 빵 받으러 가는데, 넌 왜 안 가?
compassion.npc.child.name.t: 난 피리라고 불려. 진짜 이름은 있는데, 아무도 안 물어봐서 잊어버렸어.
compassion.npc.child.job.t: 내 일은 놀이! 근데 요즘은 놀이보다 줄 서는 일이 더 많아. 아침부터 곳간 앞에 줄을 서. 엄마가 내 몫을 받아 오래.
compassion.npc.child.song.t: 떠돌이 아저씨가 부르는 노래 알아? 손을 펴면 빵이 오고, 손을 접으면 아무도 모른다는 노래. 나 그거 좋아해.

compassion.npc.beggar.name: 거지 할브
compassion.npc.beggar.greet: ……죄송합니다, 지금은 아무것도 드릴 게 없어서요. 받기만 하는 몸이라.
compassion.npc.beggar.name.t: 이름은…… 오래전에 잃었습니다. 사람들이 그냥 거지라고 부르니, 저도 그렇게 부릅니다.
compassion.npc.beggar.job.t: 제 일은 줄을 서는 것입니다. 아침에 곳간 앞에 서고, 저녁에 다시 서지요. 그 사이에는 아무 일도 없습니다. ……가끔은 빵 대신 노래를 받습니다.
compassion.npc.beggar.gift.t: 예전에 한 아이가 자기 빵을 반으로 쪼개 저에게 주더군요. 그건 배급이 아니었습니다. 그건…… 선물이었어요. 배급은 위에서 아래로 오지만, 선물은 옆에서 옵니다.
compassion.npc.beggar.song.t: 떠돌이 노래꾼이 부르는 노래를 들으셨습니까? 나누는 손은 빈손이 아니라고 하지요. 저는 그 구절에서 자주 웁니다.

compassion.npc.priest.name: 예배당 사제 리엔
compassion.npc.priest.greet: 평온하시길. 이 예배당은 누구에게나 열려 있습니다. ……곳간은 그렇지 않지만요.
compassion.npc.priest.name.t: 저는 이 예배당을 지키는 사제입니다. 리오나 사람들은 저를 기록하는 사제라 부르지요.
compassion.npc.priest.job.t: 예전에는 이 마을의 옛 관습을 기록하는 일을 했습니다. 돌아가신 어른들에게서 들은 이야기를 한 줄씩 적어 두었지요. 그 기록이 요즘 자꾸 관장의 눈 밖에 나 있습니다.
compassion.npc.priest.pantry.t: 기록에 따르면, 리오나의 곳간은 원래 문이 없었습니다. 배고픈 이가 들어가 마음껏 가져가도, 아무도 그를 나무라지 않았다고 합니다. 주는 것이 곧 함께 있는 일이었으니까요.
compassion.npc.priest.love.t: 사랑은 위에서 내려오지 않습니다. 사랑은 나란히 앉는 것입니다. 자선이 고개를 숙이게 한다면, 사랑은 고개를 나란히 맞춥니다.

compassion.npc.wanderer.name: 떠돌이 노래꾼 셀
compassion.npc.wanderer.greet: 먼 길을 걸어 여기까지 왔습니다. 이 마을은 노래가 잘 들리는 곳이군요. ……좋은 뜻으로는요.
compassion.npc.wanderer.name.t: 이름은 셀이라 합니다. 마을마다 노래를 하나씩 두고 오는 떠돌이지요.
compassion.npc.wanderer.job.t: 제 일은 걷고 부르는 것입니다. 길에서 배운 노래를 다음 마을에 전하지요. 리오나에는 아직 못 다 부른 노래가 하나 있습니다.
compassion.npc.wanderer.song.t: 이 노래를 들어 보십시오. 연민은 나눔 위에 선물을 얹는 것이 아니라, 사랑으로 함께하는 것이다. ……이 마을 사람들은 이 노래를 반쯤만 알고 있습니다.
compassion.npc.wanderer.sharing.t: 나눔은 좋은 일입니다. 하지만 나눔만 있으면, 나누는 자와 받는 자가 영영 갈라집니다. 그래서 노래는 나눔 위에가 아니라 나눔 곁에 서라고 합니다.

compassion.npc.miller.name: 방앗간 주인 마레
compassion.npc.miller.greet: 밀가루 냄새가 나는 곳입니다. 곡식을 가는 소리가 시끄러워도 양해해 주시게.
compassion.npc.miller.name.t: 마레라고 합니다. 이 방앗간에서 곡식을 갈아 온 지 삼십 년입니다.
compassion.npc.miller.job.t: 곡식을 가는 일이지요. 그런데 요즘은 가는 것보다 세는 일이 더 많습니다. 관장의 곳간에 몇 가마가 들어가는지, 누가 얼마를 내는지…….
compassion.npc.miller.tax.t: 몇 해 전에 젊은 기록관이 세금을 낮추자고 했습니다. 곳간을 백성에게 열자는 말이었지요. 관장이 그걸 막았습니다. 주는 사람이 있어야 받는 사람도 있다는 이유였습니다. 그 뒤로 마을은 더 가난해졌습니다.

compassion.npc.seamstress.name: 바느질꾼 유나
compassion.npc.seamstress.greet: 천이 부족해서 옷은 못 지어 드려도, 이야기는 넉넉히 있지요.
compassion.npc.seamstress.name.t: 유나라고 합니다. 광장 남쪽에서 바느질을 합니다.
compassion.npc.seamstress.job.t: 옷을 짓고 기웁니다. 관장의 옷도 제가 지었지요. 그 옷자락이 얼마나 무거운지, 저는 압니다.
compassion.npc.seamstress.bakery.t: 빵집 이야기를 하시는군요. 저 빵집 굴뚝에서는 밤에도 연기가 납니다. 아침에 구운 빵이 어디로 가는지, 굴뚝이 다 알고 있는 셈이지요.

compassion.npc.scribe.name: 기록관 테오
compassion.npc.scribe.greet: 기록관입니다. ……말씀을 남기시겠습니까, 아니면 물으시겠습니까?
compassion.npc.scribe.name.t: 테오라고 합니다. 이 마을의 기록을 맡고 있습니다.
compassion.npc.scribe.job.t: 장부와 문서를 정리합니다. 자선 배급 장부도 제가 씁니다. ……숫자는 정직한데, 숫자를 쓰는 사람은 그렇지 못하네요.
compassion.npc.scribe.charity.t: 자선이라는 낱말은 장부에서 늘 지출 칸에 적힙니다. 어느 해에는 투자라고도 적혀 있었지요. 사람을 투자로 적는 순간, 그 사람은 영영 갚아야 하는 몸이 됩니다.
compassion.npc.scribe.tax.t: 세금 개혁 문서는 아직 제 서랍에 있습니다. 관장이 폐기하라 했지만, 저는 버리지 못했습니다. 언젠가 누군가 읽어야 할 것 같아서요.

compassion.npc.grandmother.name: 늙은 어머니 한나
compassion.npc.grandmother.greet: 어서 오게. 앉아서 좀 쉬어. 여기 앉으면 곳간 앞 줄이 잘 보여.
compassion.npc.grandmother.name.t: 한나라고 부르게. 이 마을에서 여든 해를 살았어.
compassion.npc.grandmother.job.t: 내 일은 이제 앉아 있는 것뿐이야. ……아니, 하나 더 있지. 어릴 적 노래를 기억하는 일이야.
compassion.npc.grandmother.song.t: 노래를 하나 들려주지. 손을 펴면 빵이 오고, 손을 접으면 아무도 모른다. 그런데 옛 가사는 달랐어. 손을 펴면 빵이 오고, 손을 마주 잡으면 모두가 배부르다. ……언제 이 가사가 바뀌었는지, 나도 모르겠어.
compassion.npc.grandmother.love.t: 사랑이 뭐냐고? 밥상에 앉는 거야. 누가 먼저 먹든, 다 같이 앉아서 먹는 거. 그게 사랑이지. 위에서 내려주는 건 사랑이 아니라, 시혜야.

# --- 리오나 단서 ---
compassion.word.sharing.label: 나눔
compassion.word.sharing.hint: 자선의 질서가 나눔이라 부르는 그것. 나누는 자와 받는 자를 영영 갈라놓는다.
compassion.word.gift.label: 선물
compassion.word.gift.hint: 배급은 위에서 아래로 오지만, 선물은 옆에서 온다. 거지가 아이에게 받은 반쪽 빵.
compassion.word.love.label: 사랑
compassion.word.love.hint: 연민의 참된 원리. 위에서 내려주는 시혜가 아니라, 나란히 앉아 함께 먹는 일.
compassion.word.charity.label: 자선
compassion.word.charity.hint: 이 마을이 질서라 부르는 것. 주는 자와 받는 자를 굳게 나눈다.
compassion.word.dependence.label: 의존
compassion.word.dependence.hint: 자선이 만들어 낸 관계. 받는 이는 감사해야 하고, 영영 갚아야 한다.
compassion.word.hunger.label: 굶주림
compassion.word.hunger.hint: 소리 없이 줄어들다 사라지는 것. 골목 끝에서 아무도 모르게.
compassion.fact.reona.almoner.label: 자선 관장
compassion.fact.reona.almoner.hint: 리오나의 곳간을 지키고 배급을 정하는 관리. 자선이 질서라 믿는다.
compassion.fact.reona.baker.label: 빵집 주인
compassion.fact.reona.baker.hint: 매일 빵을 구워 절반을 곳간으로 보내는 사람. 나머지 절반의 행선지는 모른다.
compassion.fact.reona.wanderer.label: 떠돌이 노래꾼
compassion.fact.reona.wanderer.hint: 마을마다 노래를 하나씩 두고 오는 나그네. 리오나에는 못 다 부른 노래가 있다.
compassion.fact.reona.bakery.label: 리오나 빵집
compassion.fact.reona.bakery.hint: 밤에도 굴뚝에서 연기가 나는 곳. 구운 빵의 절반이 어디로 가는지 굴뚝이 안다.
compassion.fact.reona.plaza.label: 광장
compassion.fact.reona.plaza.hint: 곳간 앞에 사람들이 줄을 서는 곳. 아침마다 같은 자리에 같은 그림자가 선다.
compassion.fact.reona.chapel.label: 예배당
compassion.fact.reona.chapel.hint: 옛 관습을 적은 기록이 남아 있는 곳. 곳간에는 원래 문이 없었다고 적혀 있다.
compassion.fact.reona.song.label: 떠돌이의 노래
compassion.fact.reona.song.hint: 연민은 나눔 위에 선물을 얹는 것이 아니라, 사랑으로 함께하는 것이다. 리오나 사람들은 이 노래를 반쯤만 안다.
compassion.fact.reona.open-pantry.label: 열린 곳간의 옛 관습
compassion.fact.reona.open-pantry.hint: 리오나의 곳간에는 원래 문이 없었다. 배고픈 이가 들어가 가져가도 나무라지 않았다.
compassion.fact.reona.relief-tax.label: 실패한 세금 개혁
compassion.fact.reona.relief-tax.hint: 곳간을 백성에게 열고 세금을 낮추려던 시도. 관장이 막았고, 마을은 더 가난해졌다.
compassion.fact.creature.compassion-beggar.label: 굶주린 거지
compassion.fact.creature.compassion-beggar.hint: 악하지 않다. 굶주렸을 뿐이다. 그의 손은 게으르지 않고, 다만 빈손일 뿐이다.

# --- 리오나 추론·위기 ---
compassion.deduction.compassion.sentence: 연민은 {1} 위에 {2}을 얹는 것이 아니라 {3}(으)로 함께하는 것이다
compassion.deduction.compassion.hint: 자선의 질서가 나눔을 앞세운다. 떠돌이의 노래는 그 반대쪽에서 사랑을 부른다.
compassion.crisis.hoard.text: 곳간 앞에 사람들이 모였다. 자선 관장이 빵을 나누려다가, 한 아이가 넘어져도 아무도 손을 잡지 않는다. 관장이 말한다. 질서가 흐트러지면 아무도 받지 못합니다, 줄을 서십시오. 그때 떠돌이의 노래가 광장 저편에서 들린다. 이제 그대가 나설 차례다.
compassion.option.open-pantry.label: 곳간의 문을 열어 모두 함께 나누게 한다
compassion.option.open-pantry.text: 그대가 떠돌이의 노래를 따라 부르고, 옛 기록을 꺼내 읽는다. 곳간에는 원래 문이 없었다. 관장의 곳간 문이 열리고, 사람들이 서로 빵을 나눠 든다. 주는 자와 받는 자의 자리가 사라진 광장에서 모두가 배부르다. 연민은 나눔 위에 얹는 것이 아니라 사랑으로 함께하는 것임을 마을이 알았다.
compassion.option.relief-tax.label: 세금 개혁 문서를 공개한다
compassion.option.relief-tax.text: 그대가 기록관의 서랍에서 세금 개혁 문서를 꺼내 공개한다. 곳간을 백성에게 돌리고 세금을 낮추자는 오래된 약속. 관장은 고개를 떨군다. 마을은 스스로를 먹이는 법을 다시 배운다. 시혜가 끝난 자리에서 사람들은 서로의 이름을 부르기 시작했다.

# --- 리오나 능력·생물 ---
compassion.ability.persuade.name: 공감으로 풀어주기
compassion.creature.beggar.name: 굶주린 거지

# --- 용맹의 마을 솔강 (M3 Task 34) ---
town.solgang.name: 솔강
valor.music.title: 솔강의 결투가

valor.npc.champion.name: 무패의 투사
valor.npc.champion.greet: 나는 이 투기장에서 진 적이 없다. 도전자가 오면 맞설 뿐, 물러서지 않는다.
valor.npc.champion.name.t: 이름은 투사들이 붙여 준 무패로 충분하다. 여기서는 서 있는 동안만 이름이 있다.
valor.npc.champion.job.t: 내 일은 서는 것이다. 도전자가 오면 맞서고, 쓰러질 때까지 발을 떼지 않는다. 그것이 이 마을의 용맹이다.
valor.npc.champion.battle.t: 싸움은 발을 떼지 않는 것에서 시작한다. 한 발 물러서면 전부 무너진다. ……그렇게 배웠다.
valor.npc.champion.arena.t: 이 투기장의 모래는 쓰러진 자의 이름을 덮는다. 관중은 선 자의 이름만 외치지.
valor.npc.champion.retreat-law.t: 후퇴를 허하는 법이라니. 그런 것은 겁쟁이들의 변명이다. 이 마을이 강한 것은 물러서지 않아서다.

valor.npc.sergeant.name: 훈련관 하르
valor.npc.sergeant.greet: 허리에 칼을 찼군. 그런데 발은 벌써 뒤로 빠져 있지. 여기서는 그 자세부터 고친다.
valor.npc.sergeant.name.t: 훈련관 하르다. 새로 온 이들은 첫날에 물러서는 법부터 잊게 만든다.
valor.npc.sergeant.job.t: 내 일은 병영을 돌보고 젊은이를 세우는 것이다. ……요즘은 세운 만큼 묻는 일이 많아졌지만.
valor.npc.sergeant.brother.t: 전우란 같은 줄에 서서 함께 버티는 사이다. 버틴 자가 사라지면, 남은 자가 그 이름을 부른다.
valor.npc.sergeant.barracks.t: 병영에는 빈 자리가 늘고 있다. 갑옷은 그대로인데, 그 갑옷을 채울 이가 없다.

valor.npc.smith.name: 대장장이 브란
valor.npc.smith.greet: 칼을 맡기려는가, 방패를 맡기려는가. 여기 사람들은 둘 다 이고 온다만.
valor.npc.smith.name.t: 브란이라 한다. 이 대장간에서 쇠를 두드린 지 사십 년이다.
valor.npc.smith.job.t: 칼도 만들고 방패도 만든다. 그런데 요즘은 방패 주문이 부쩍 줄었지. 다들 앞만 보고 서려 하니.
valor.npc.smith.shield.t: 방패는 등을 맡기는 물건이 아니다. 이쪽을 지키려고 드는 것이지. 등을 맡길 사람이 없으면 방패는 무거운 짐이 된다.

valor.npc.brewer.name: 주막 주인 오렌
valor.npc.brewer.greet: 자네 왔나. 싸움 전이든 후든, 여기서는 잔을 내려놓는 법이 없지.
valor.npc.brewer.name.t: 오렌이라 하네. 이 주막을 삼십 년째 지키고 있지.
valor.npc.brewer.job.t: 술을 빚고 잔을 채우는 일이지. 패한 자에게도 잔을 준다. ……이긴 자보다 살아 돌아온 자에게 더 많이 주고 싶지만.
valor.npc.brewer.brother.t: 전우와 형제는 다르지 않다. 잔을 나누는 사이지. 요즘 젊은이들은 잔을 나눌 겨를도 없이 나가 버린다.

valor.npc.child.name: 광장 아이 루피
valor.npc.child.greet: 너도 투사야? 무패 아저씨처럼 될 거야? 나는 아직 칼이 무거워서 못 드는데.
valor.npc.child.name.t: 난 루피라고 해. 광장에서 제일 빨리 달려.
valor.npc.child.job.t: 내 일은 투기장 담장에 매달려 구경하는 거야. ……그런데 요즘은 아무도 안 이겨. 다 쓰러져.
valor.npc.child.champion.t: 무패 아저씨는 한 번도 안 졌대. ……그런데 아저씨 친구들은 다 어디 갔지? 나는 그게 궁금해.

valor.npc.veteran.name: 노병 켈
valor.npc.veteran.greet: 허리 굽은 늙은일세. 싸우는 것보다 지나간 노래를 기억하는 것이 요즘 내 일이지.
valor.npc.veteran.name.t: 켈이라고 부르게. 한때는 이 마을에서 창을 들던 사람이야.
valor.npc.veteran.job.t: 지금은 노래를 기억하고 옮기는 일을 하네. 옛 병사들이 행군하며 부르던 노래가 하나 있는데, 이 마을에서는 반절만 남았지.
valor.npc.veteran.retreat.t: 후퇴? 여기서는 도망이라 부르지. 하지만 옛 노래는 달리 불렀어. 한 발 물러나 다친 전우를 데리고 돌아오는 것도 용기라고.

valor.npc.scout.name: 정찰병 사이
valor.npc.scout.greet: 이방인? 마을 밖에서 뭘 봤어? ……요즘은 나가는 길보다 돌아오는 길이 무서워.
valor.npc.scout.name.t: 정찰병 사이야. 성벽 밖을 살피는 일을 해.
valor.npc.scout.job.t: 길을 다니며 산적과 야수를 살핀다. ……그런데 요즘은 마을 젊은이들의 시신을 더 자주 만나. 전투에서 죽은 게 아니라 물러서지 못해서 쓰러진 몸이야.
valor.npc.scout.duelist.t: 떠돌이 결투가를 봤어. 그자는 이기려고 싸우지 않아. 살아 남는 법을 보여 주려고 싸우지. ……이 마을은 그걸 배우려 하질 않아.

valor.npc.healer.name: 치료사 미르
valor.npc.healer.greet: 다친 데를 보여 주게. ……겉은 멀쩡한데 속은 훤히 보이는군.
valor.npc.healer.name.t: 미르라 합니다. 치료소에서 상처를 꿰매고 뼈를 맞춥니다.
valor.npc.healer.job.t: 상처를 치료합니다. 이 마을에서는 등에 난 상처가 가장 부끄러운 상처라고 배웠지. 그래도 저는 그 상처가 가장 반갑습니다.
valor.npc.healer.blood.t: 피는 숨고 싶어도 숨지 않습니다. 피를 흘린 자리에는 꼭 그를 기다리는 사람이 있다는 뜻이지요.

valor.npc.standard.name: 기수 다인
valor.npc.standard.greet: 이 깃발은 앞으로 나아갈 때만 듭니다. ……뒤로 갈 때는 들 이유가 없다고들 하지요.
valor.npc.standard.name.t: 기수 다인이라 합니다. 이 깃발을 투기장에 세우는 사람입니다.
valor.npc.standard.job.t: 저는 깃발을 듭니다. 투사가 쓰러지면 그 위에 덮지요. ……언젠가는 살아 돌아온 이에게 이 깃발을 돌려주고 싶습니다.
valor.npc.standard.courage.t: 용기란 깃발을 앞세워 돌진하는 것이 아니라고 배웠습니다. 마지막까지 깃발을 지키고 돌아오는 것이라고요.

valor.npc.widow.name: 과부 렌
valor.npc.widow.greet: ……남편 이야기를 하러 오셨습니까, 아니면 그저 지나가는 길입니까.
valor.npc.widow.name.t: 렌이라고 합니다. 이 마을에서 남편을 잃은 사람입니다.
valor.npc.widow.job.t: 예전에는 옷을 지었습니다. 지금은 깨어지지 않은 약속을 기억하는 일을 합니다.
valor.npc.widow.retreat-law.t: 남편이 떠나기 전에 이런 법이 있었다고 들었습니다. 다친 전우를 데리고 돌아온 자를 겁쟁이라 부르지 않는다는 법이요. ……어느새 그 법은 사라지고, 다친 전우를 버리고도 계속 서는 것이 명예가 되었습니다.

# --- 솔강 단서 ---
valor.word.courage.label: 용기
valor.word.courage.hint: 물러서지 않는 것이 아니라 돌아오는 것. 노래의 마지막 소절이 이 낱말을 부른다.
valor.word.retreat.label: 후퇴
valor.word.retreat.hint: 이 마을이 도망이라 부르는 것. 그러나 옛 법과 옛 노래는 다르게 부른다.
valor.word.shield.label: 방패
valor.word.shield.hint: 등을 막는 물건이 아니라 이쪽을 지키려 드는 것. 돌아온 자가 다시 드는 것.
valor.word.battle.label: 전투
valor.word.battle.hint: 무패의 투사가 서 있는 곳. 그가 물러서지 않는 이유.
valor.word.blood.label: 피
valor.word.blood.hint: 등에 난 상처에서도 흐르는 것. 치료사가 가장 반가워하는 흔적.
valor.word.brother.label: 전우
valor.word.brother.hint: 같은 줄에 서서 버티는 사이. 잔을 나누는 사이라지만, 지금은 잔을 나눌 이가 없다.
valor.fact.solgang.champion.label: 무패의 투사
valor.fact.solgang.champion.hint: 투기장에서 진 적 없는 사내. 도전자가 쓰러져도 물러서지 말라고 외친다.
valor.fact.solgang.sergeant.label: 훈련관 하르
valor.fact.solgang.sergeant.hint: 병영을 돌보며 젊은이를 세우는 사람. 문 밖에서는 하지 못하는 말을 안다.
valor.fact.solgang.veteran.label: 노병 켈
valor.fact.solgang.veteran.hint: 옛 군가를 반절만 기억하는 늙은 병사. 마지막 소절을 잃어버렸다.
valor.fact.solgang.smith.label: 대장장이 브란
valor.fact.solgang.smith.hint: 칼과 방패를 만드는 사람. 요즘은 방패 주문이 줄었다고 한다.
valor.fact.solgang.arena.label: 솔강 투기장
valor.fact.solgang.arena.hint: 쓰러진 자의 이름은 지우고 선 자의 이름만 남기는 모래바닥.
valor.fact.solgang.barracks.label: 병영
valor.fact.solgang.barracks.hint: 갑옷은 그대로인데 채울 이가 줄어드는 곳. 지난해 열둘 중 셋만 돌아왔다.
valor.fact.solgang.forge.label: 대장간
valor.fact.solgang.forge.hint: 꺼지지 않는 용광로. 무엇을 벼리는지가 해마다 달라진다.
valor.fact.solgang.battle-hymn.label: 옛 행군가
valor.fact.solgang.battle-hymn.hint: 앞에 적이 있고 뒤에 고향이 있다면 방패를 들어라. 마지막 소절은 돌아오는 자를 노래한다.
valor.fact.solgang.retreat-law.label: 사라진 후퇴법
valor.fact.solgang.retreat-law.hint: 다친 전우를 데리고 돌아온 자를 겁쟁이라 부르지 않는다는 옛 법. 어느새 사라졌다.
valor.fact.creature.valor-duelist.label: 떠돌이 결투가
valor.fact.creature.valor-duelist.hint: 악하지 않다. 이기려 싸우지 않고, 살아 돌아오는 법을 보여 주려는 자.

# --- 솔강 추론·위기 ---
valor.deduction.valor.sentence: 참된 용맹은 {1}을 뽐내는 데 있지 않고, {2}해 돌아와 {3}을 다시 드는 데 있다
valor.deduction.valor.hint: 무패의 투기장은 물러섬을 모른다. 노병의 옛 군가와 과부의 옛 법이 다른 결말을 가리킨다.
valor.crisis.challenge.text: 투기장에 사람들이 모였다. 젊은 도전자가 피를 흘리며 무릎을 꿇었는데, 무패의 투사가 물러서지 말라며 창을 겨눈다. 도전자는 숨을 몰아쉬며 일어서려다 다시 쓰러진다. 관중은 숨을 죽이고, 훈련관은 고개를 돌린다. 그때 노병이 낮게 노래를 부르기 시작한다. 이제 그대가 나설 차례다.
valor.option.allow-retreat.label: 옛 군가를 따라 불러 물러남도 용기임을 알린다
valor.option.allow-retreat.text: 그대가 노병의 노래를 따라 부른다. 앞에 적이 있고 뒤에 고향이 있다면 방패를 들어라. 그리고 잃어버린 마지막 소절을 잇는다. 방패를 들고 돌아오는 자가 용기다. 관중이 하나둘 따라 부르고, 무패의 투사는 겨눈 창을 천천히 내린다. 도전자는 끌려 나가지 않고 스스로 걸어 나온다. 투기장의 모래 위에 처음으로 돌아온 자의 이름이 적힌다. 용기는 물러서지 않는 데 있지 않고 돌아와 다시 서는 데 있음을 솔강이 알았다.
valor.option.duel-honor.label: 무패의 투사에게 직접 결투를 청한다
valor.option.duel-honor.text: 그대가 창을 들어 결투를 청한다. 무패의 투사가 웃는다. 오래도록 그런 도전자를 기다렸다고. 창이 부딪히고, 그대가 마지막 일격을 멈춘다. 목 앞에서 창을 거두는 순간 관중이 술렁인다. 무패는 무릎을 꿇고 말한다. 나는 이기는 법만 배웠지 멈추는 법은 배우지 못했다고. 그대가 손을 내밀어 그를 일으킨다. 이긴 자가 아니라 세운 자가 명예롭다는 것을 마을이 보았다.

# --- 솔강 능력·생물 ---
valor.ability.shield.name: 방패 들기
valor.creature.duelist.name: 떠돌이 결투가

# --- 정의의 마을 셀레스 (M3 Task 35) ---
town.seles.name: 셀레스
justice.music.title: 셀레스의 판결

justice.npc.judge.name: 재판관 아르벤
justice.npc.judge.greet: 셀레스의 법정이다. 한 줄로 서라. 관례는 예외를 두지 않는다.
justice.npc.judge.name.t: 나는 아르벤. 삼십 년 동안 이 법정의 판결을 내려 왔다. 셀레스에서는 살아 있는 자의 이름보다 무덤 앞의 관례가 먼저다.
justice.npc.judge.job.t: 내 일은 관례를 지키고 벌을 내리는 것이다. 조문의 달에는 노래를 부르지 못하고, 어긴 자는 매를 맞는다. 관례가 마을을 지킨다. 그것이 정의다.
justice.npc.judge.law.t: 법은 관례에 뿌리를 둔다. 조문 기간에 노래를 부르면 매질. 무덤 앞에서 물건을 꺼내면 추방. 우리 법에는 감정이라는 항목이 없다.
justice.npc.judge.punishment.t: 형벌은 사람이 관례를 기억하게 하는 불이다. 매질은 사십 대로, 어떤 벌도 감면하지 않는다. 그게 셀레스가 정의라고 부르는 방식이다.
justice.npc.judge.compassion.t: 연민은 법정에 어울리지 않는 말이다. 벌을 줄이면 모두가 관례를 흔들려 할 것이다. 나는 그 흔들림을 막는 자다.
justice.npc.judge.lullaby.t: 자장가라니. 조문 기간에 노래라니. 그것은 관례에 대한 모독이다. 과부 셀레는 벌을 피할 수 없다.
justice.npc.judge.mourner.t: 무덤에서 본 젊은이는 도둑이다. 증인이 이미 섰다. 벌은 정해져 있다.

justice.npc.clerk.name: 법정 서기 레온
justice.npc.clerk.greet: 증언은 기록으로 남는다. 조용히, 그리고 정확히.
justice.npc.clerk.name.t: 나는 법정의 서기 레온이라 한다. 판결문과 죄명을 옮겨 적는 사람이다.
justice.npc.clerk.job.t: 재판 기록을 쓰는 일을 한다. 오늘 판결문도 세 장을 썼다. 모두 매질 또는 추방이지. 나는 글자를 쓰는 일을 자랑으로 여겼는데, 요즘은 글자로 형벌을 세는 것이 두렵다.
justice.npc.clerk.law.t: 법은 이미 적혀 있다. 조문 관례 금지 조항, 형벌 표, 면죄 불가 조항. 재판관은 기록을 읽을 뿐이라고 말하지만, 기록을 쓰는 자가 말해 주지. 기록은 그리 간단하지 않아.
justice.npc.clerk.punishment.t: 형벌의 종류는 셋이다. 매질, 추방, 그리고 무덤 앞에 무릎 꿇기. 무릎 꿇기는 가장 가벼운 벌이다. ……아이들은 그 벌을 돌아서기라고 부르는데, 그 별명이 마음에 걸린다.
justice.npc.clerk.harsh.t: 이 기록들을 보게. 지난달에 조문을 어긴 사람이 여섯 명. 모두 사십 대의 매를 맞았어. 노래를 부른 사람에게도, 무덤에 꽃을 두고 온 사람에게도 말이지. 나는 그 숫자를 적을 때마다 손이 떨려.
justice.npc.clerk.prisoner.t: ……갇힌 청년이라. 그의 이름은 기록하지 않았어. 재판관이 도둑이라고만 부르라고 했거든. 도둑이라는 기록이 진실보다 먼저 판결을 내린다. 그것은 처음 겪는 일이라.

justice.npc.widow.name: 과부 셀레
justice.npc.widow.greet: ……자장가를 들으셨나요? 미안해요, 조문 중에는 부르지 말아야 하는데. 밤마다 저도 모르게 입에서 새어 나와요.
justice.npc.widow.name.t: 셀레라고 해요. 이제 한 달 전에 남편을 묻은 과부예요. 셀레스 사람들은 나를 노래하는 과부라 부르지요.
justice.npc.widow.job.t: 남편이 살아 있을 때는 실을 엮어 옷감을 만들었어요. 지금은…… 매일 무덤에 가서 풀을 뽑고 돌을 만져요. 그것이 내 일이에요. 조문은 일이 아니라 몸이 되는 거예요.
justice.npc.widow.compassion.t: 사람들은 연민을 달램이라고 부르지 않아요. 연민을 느끼는 것 자체가 조문을 어기는 것이라고요. 그래서 아무도 우는 사람을 붙잡지 않아요. 조문의 달에는 노래도, 위로도, 눈물도 금지예요.
justice.npc.widow.lullaby.t: 그 노래는 남편이 살아 있을 때 우리 둘만 부르던 자장가예요. 아이를 달랠 때, 어른이라도 두려울 때 부르는 노래. 죽은 뒤에도 그 노래가 나를 지키는 것 같아서, 무덤 앞에서 부르고 말았어요. ……매를 맞아도 좋아요. 노래를 부르지 않는 밤이 더 두려워요.
justice.npc.widow.prisoner.t: 내 아들 이야기를 하셨군요. 아들은 아버지의 무덤에 밤마다 갔어요. 남편이 숨겨 둔 나의 목걸이를 무덤 쪽에서 찾아서, 그것을 닦고 있었나 봐요. 그걸 본 목격자가 아들을 도둑이라 했어요. 아들은 진실을 말하지만, 관례가 진실보다 먼저야요.
justice.npc.widow.truth.t: 진실은…… 남편이 죽은 밤에 나는 울지 않았어요. 상례에 따라 아무 말도 하지 않았지요. 그런데 노래를 부르는 지금의 나는, 그날 밤보다 진실해져 있어요. 조문이 진실을 가두었으니까요.
justice.npc.widow.mourning-duty.t: 예전의 조문은 백 일 동안 문을 닫고 지내는 때였다고 해요. 그런데 언제부터인가 조문이 금지가 되었어요. 울지 말고, 부르지 말고, 무덤 앞에 무릎만 꿇으라고. 누구의 벌로 그렇게 되었는지 아무도 몰라요.

justice.npc.prisoner.name: 갇힌 청년 이렌
justice.npc.prisoner.greet: ……죄송해요, 무슨 말이라도 하면 도둑의 말로 기록될까 봐 무서워요.
justice.npc.prisoner.name.t: 이렌이에요. 어머니는 셀레, 아버지는 석공이었어요. ……아버지가 갑자기 돌아가시면서, 무덤 앞에는 저만 남았어요.
justice.npc.prisoner.job.t: 아버지의 공방에서 돌을 다루는 일을 배웠어요. 지금은 이 감옥에서 혼자 있을 뿐이지요. 돌을 만지면 진실이 보인다고 아버지가 말씀하셨어요.
justice.npc.prisoner.truth.t: 나는 무덤에 있던 그 밤의 일을 진실 그대로 말했어요. 어머니의 목걸이를 찾아, 새끼 새가 다친 것을 보고 늦었고, 무덤 옆에서 그 목걸이를 닦고 있었을 뿐이라고요. 하지만 재판관은 도둑이라는 기록을 먼저 만들었어요.
justice.npc.prisoner.fairness.t: 공정이라면 아버지의 일도, 어머니의 노래도 같은 저울에 올려져야 해요. 그런데 셀레스의 저울은 먼저 벌을 내리고 나서 무게를 재요.
justice.npc.prisoner.widow.t: 어머니는 밤마다 무덤 앞에서 자장가를 부르세요. 상례가 노래를 금한 뒤로도, 목이 쉴 때까지요. 나는 그 노래를 들으며 자랐어요. 그 노래가 나를 지켜요.
justice.npc.prisoner.mourner.t: 그 조문객을 아세요? 아버지의 벗이에요. 무덤을 지키려고 밤마다 서성이다가, 낯선 이를 도둑으로 오인한 거예요. 슬픔이 사람을 그렇게 만드나 봐요.

justice.npc.witness.name: 목격자 카인
justice.npc.witness.greet: 내 두 눈은 팔아도 된다. 그날 밤을 똑똑히 봤으니.
justice.npc.witness.name.t: 나는 카인이라 한다. 이 마을의 구둣방 주인이지. 법정에 증인으로 서는 일이 이제는 잦아졌어.
justice.npc.witness.job.t: 구두를 만들고, 밤에는 마을을 지켜봐. 무덤 쪽으로 가는 사람은 다 기록해 두지. ……그게 언제부터 내 일이 되었는지는 모르겠다.
justice.npc.witness.law.t: 법이 있으니 증인이 있는 것이야. 나는 본 것을 말할 뿐이지. 조문 기간에 노래를 부르는 소리, 무덤에 드나드는 그림자. 법이 그것들을 눈여겨보라고 했어.
justice.npc.witness.punishment.t: 벌은 무서운 것이 아니야, 질서야. 매질을 맞고 나면 다들 관례를 기억하지. 나는 벌이 사람을 고친다고 믿어.
justice.npc.witness.mourner.t: 청년 이렌이 무덤에서 무언가 번득이는 것을 들고 있더군. 도둑이 아니고서야 무덤에서 무엇을 찾을까. ……그런데 지금 생각하면, 그게 목걸이처럼 보이기도 했어. 어머니의 목걸이였다면?

justice.npc.child.name: 광장 아이 리네
justice.npc.child.greet: 어른들이 조용히라고만 해서 노래를 못 불러. 근데 넌 괜찮아 보이는데?
justice.npc.child.name.t: 나는 리네야. 이 마을에서 태어난 아이야. 내가 아는 노래가 셀레스에서 제일 많아.
justice.npc.child.job.t: 내 일은 노래 기억하기! 광장에서, 무덤 가까이에서, 어른들이 목을 축이는 소리를 듣고 다 외워. ……하지만 요즘은 어른들이 노래를 금지해서, 노래의 주인은 나야.
justice.npc.child.lullaby.t: 과부 아주머니의 자장가? 나도 알아! 달은 무덤을 비추고, 나는 당신의 자장가를 부른다. 아주머니는 밤마다 무덤 앞에서 불러. 판사 아저씨한테 걸리면 안 되는데…… 나는 그 노래가 좋아.
justice.npc.child.love.t: 사랑? 그건…… 무덤 앞에서 노래하는 거지. 어머니가 나를 재울 때 부르는 것도, 과부 아주머니가 남편에게 부르는 것도 같은 노래야. 금지돼도 부르는 것. 그게 사랑이야?
justice.npc.child.widow.t: 과부 아주머니는 착한데 왜 벌을 받아야 해? 노래를 부른 게 죄라면 나도 죄인인데, 나는 누가 벌을 안 줘. 아주머니는 어른이라서 자꾸 벌을 받아.

justice.npc.priest.name: 사제 세르노
justice.npc.priest.greet: 평안하십시오. 이 예배소는 무덤보다 이른 곳이지만, 조문의 규칙은 나도 따르며 삽니다.
justice.npc.priest.name.t: 나는 세르노라 한다. 이 마을의 예배소를 지키는 사제로서, 옛 조문의 기록을 보관하는 사람이기도 하지.
justice.npc.priest.job.t: 옛 기록을 다듬고, 조문 예식의 말씀을 준비하는 일을 하네. ……그런데 어느 해부터인가 기록에 금지라는 낱말이 늘어났어. 울지 말 것, 부르지 말 것, 어기지 말 것.
justice.npc.priest.mourning-duty.t: 옛 조문 기록에는 형벌이 없었네. 조문의 달은 백 일 동안 문을 닫고, 이웃이 밥을 가져다주고, 밤이면 함께 앉아 이야기를 나누는 때였어. 벌을 세우는 자리가 아니었지.
justice.npc.priest.comfort-widow.t: 위로는 가르치는 것이 아니야. 무덤 앞에 함께 앉아, 부르는 노래를 같이 들어 주는 것이지. 그대가 그 노래를 듣고 함께 앉으면, 그 벌은 힘을 잃을 걸세.
justice.npc.priest.compassion.t: 연민은 벌을 줄이는 것이라 여겨지지만, 사실은 함께 아파하는 것이지. 옛 기록은 말하네. 정의가 저울이라면, 연민은 그 저울을 잡는 손이라고.
justice.npc.priest.harsh.t: 벌이 관례보다 무거워진 것은 최근의 일일세. 사십 대의 매는 옛날이라면 감옥에 갇힐 일조차 아니었어. 그 벌이 사람을 두렵게 만들어, 이제 아무도 무덤 앞에서 울지 않네.

justice.npc.mason.name: 석공 두만
justice.npc.mason.greet: 묘비를 세우는 사람이야. 돌에는 거짓을 새길 수 없어서, 이 마을에서 내 일이 버티고 있지.
justice.npc.mason.name.t: 두만이라 한다. 이 마을의 묘비와 집터의 돌을 다루는 석공일세.
justice.npc.mason.job.t: 산 자의 이름을 새기는 일을 했는데, 이제는 죽은 자의 형벌까지 새기는구려. 조문을 어긴 자라는 글귀를 비석에 새기는 것이 말이지. 돌 위의 이름이 늘어나는 속도가 나를 겁먹게 해.
justice.npc.mason.law.t: 법이라는 것이…… 돌과 같아야 하는데. 무게가 있고, 버티고, 거짓이 없어야지. 지금의 법은 돌이 아니라 흙이야. 비가 오면 모양이 바뀌어.
justice.npc.mason.harsh.t: 지난달에 내가 새긴 비문이 여섯 개야. 모두 노래를 부른 자였지. 보게, 노래를 부른 자를 위해 묘비를 새기는 법이 언제 생겼는지. ……이 마을은 죽은 자를 위한 돌을, 살아 있는 자를 벌하는 데 쓰고 있어.
justice.npc.mason.comfort-widow.t: 그래도 아직 희망이 있어. 과부 셀레의 남편 묘비는 내가 새겼는데, 그 돌만은 여기 잠들다로 남았어. 아들의 손이 그 비석을 매일 닦지. 돌이 참고 있으니 저울도 언젠가 균형을 찾겠지.

justice.npc.scribe.name: 필경사 벨라
justice.npc.scribe.greet: 판결문을 쓰는 사람입니다. ……문서와 말, 어느 쪽이 진실인지 이제 알 수 없게 되었네요.
justice.npc.scribe.name.t: 벨라입니다. 이 마을의 판결문과 조문 기록을 옮겨 적는 필경사지요.
justice.npc.scribe.job.t: 매일 벌칙 기록을 정리합니다. 어제는 노래 한 곡에 매질 사십 대. 오늘은 무덤 앞에 머문 것만으로 하나 더. 숫자는 정직한데, 숫자를 정하는 법이 정직하지 않습니다.
justice.npc.scribe.truth.t: 기록은 진실을 담는다고 배웠습니다. 그런데 이제 기록이 진실을 만들어 내요. 도둑이라고 적으면 도둑이 되고, 상주라고 적으면 달라지지요. 같은 밤, 같은 무덤, 같은 청년. 낱말 하나가 사람을 갈라요.
justice.npc.scribe.prisoner.t: 청년의 기록을 다시 읽어 봤습니다. 목격자의 말, 밤의 시각, 무덤의 위치. 어디에도 도둑질은 적혀 있지 않았어요. 다만 무덤 앞에 있었음만. 그 한 줄이 그를 이 감옥으로 데려왔습니다.
justice.npc.scribe.harsh.t: 형벌 표의 숫자가 해마다 늘어납니다. 조문 어김에 매질, 무덤 출입에 추방. 숫자가 쌓일수록 마을 사람들은 더 조용해지고, 저는 숫자를 쓰는 것이 더 두려워집니다.

justice.npc.gravedigger.name: 묘지기 고르노
justice.npc.gravedigger.greet: 여기는 죽은 사람들이 사는 곳이야. 살아 있는 사람에게는 더 조용히, 더 진실하게.
justice.npc.gravedigger.name.t: 고르노라 한다. 이 묘지 땅을 파고 지키는 묘지기일세.
justice.npc.gravedigger.job.t: 무덤을 파고, 초를 밝히고, 밤마다 순찰을 돌아. ……그런데 요즘은 살아 있는 이들이 밤에 더 자주 오는구먼. 벌을 두려워해서 죽은 이들처럼 조용해졌어.
justice.npc.gravedigger.mourner.t: 저 조문객…… 저이는 매일 밤 무덤 앞에서 웁니다. 낯선 사람을 보면 도둑이라며 막아서지. 슬픔이 사람을 그렇게 눈멀게 하는 법이야. 악한 게 아니라, 애도에 잠긴 사람이지.
justice.npc.gravedigger.compassion.t: 연민이라는 것을 나는 이렇게 배웠어. 무덤을 파러 갔는데 곡하는 사람을 보면, 내가 도리어 웃어 주어야 한다는 것. 죽은 자가 누워 있는데도 위로가 필요한 것은 산 자니까.
justice.npc.gravedigger.lullaby.t: 그 자장가…… 나는 밤마다 듣지. 무덤 사이로 울려 퍼지는 소리. 판사가 금지했다지만, 내가 보기에 저 노래는 누구에게도 해롭지 않아. 오히려 그 노래가 나를 지켜.
justice.npc.gravedigger.prisoner.t: 청년 이렌은 도둑이 아니야. 나는 밤마다 봤어. 무덤 앞에 무릎 꿇고, 비석을 닦고, 자장가를 듣고 있었어. 그 목걸이는 죽은 이가 아내에게 남긴 것이고, 아들은 그것을 찾아 어머니에게 돌려주려던 것이지.

# --- 셀레스 단서 ---
justice.word.fairness.label: 공정
justice.word.fairness.hint: 모든 이를 같은 저울에 올리는 일. 셀레스의 법은 벌을 먼저 내리고 무게를 잰다.
justice.word.law.label: 법
justice.word.law.hint: 관례에 뿌리를 둔 조문 금지와 형벌 조항. 감정이라는 항목은 없다.
justice.word.punishment.label: 형벌
justice.word.punishment.hint: 매질과 추방, 무덤 앞 무릎 꿇기. 관례를 기억시키는 불.
justice.word.compassion.label: 연민
justice.word.compassion.hint: 사람들이 달램 대신 금지한 것. 조문이 연민을 벌한다.
justice.fact.seles.judge.label: 재판관 아르벤
justice.fact.seles.judge.hint: 삼십 년간 판결을 내려 온 셀레스의 재판관. 관례가 곧 정의라 믿는다.
justice.fact.seles.widow.label: 과부 셀레
justice.fact.seles.widow.hint: 남편을 묻은 지 한 달. 밤마다 무덤 앞에서 금지된 자장가를 부른다.
justice.fact.seles.prisoner.label: 갇힌 청년 이렌
justice.fact.seles.prisoner.hint: 셀레의 아들. 무덤에서 어머니의 목걸이를 찾았다가 도둑으로 몰렸다.
justice.fact.seles.witness.label: 목격자 카인
justice.fact.seles.witness.hint: 무덤에서 번득이는 것을 본 증인. 본 것을 말할 뿐, 판단은 법에 맡긴다.
justice.fact.seles.mason.label: 석공 두만
justice.fact.seles.mason.hint: 묘비와 집터의 돌을 다루는 사람. 이제는 조문을 어긴 자라는 비문을 새긴다.
justice.fact.seles.court.label: 셀레스 법정
justice.fact.seles.court.hint: 벌이 기록보다 먼저 내려지는 곳. 판결문이 매일 세 장씩 쌓인다.
justice.fact.seles.graveyard.label: 공동묘지
justice.fact.seles.graveyard.hint: 밤마다 자장가가 울려 퍼지는 무덤. 벌을 두려워한 산 자가 죽은 자처럼 조용해졌다.
justice.fact.seles.mourning-lullaby.label: 상주 자장가
justice.fact.seles.mourning-lullaby.hint: 달은 무덤을 비추고, 나는 당신의 자장가를 부른다. 셀레가 남편에게 남겨 둔 노래.
justice.fact.seles.mourning-duty.label: 사라진 조문의 달
justice.fact.seles.mourning-duty.hint: 옛 기록의 백 일. 형벌이 아니라 이웃이 밥을 가져다주고 함께 앉는 때였다.
justice.fact.seles.harsh-punishment.label: 가혹한 형벌
justice.fact.seles.harsh-punishment.hint: 노래 한 곡에 사십 대. 무덤 출입에 추방. 형벌 표의 숫자가 해마다 늘어난다.
justice.fact.seles.comfort-widow.label: 위로의 손길
justice.fact.seles.comfort-widow.hint: 무덤 앞에 함께 앉아 노래를 들어 주는 일. 벌보다 먼저 위로가 서면 저울이 균형을 찾는다.
justice.fact.creature.justice-mourner.label: 슬픔에 잠긴 조문객
justice.fact.creature.justice-mourner.hint: 악하지 않다. 낯선 이를 도둑으로 오인하는 것은 슬픔 때문이다. 애도에 잠긴 사람이다.

# --- 셀레스 추론·위기 ---
justice.deduction.justice.sentence: 정의는 {1}(이)라 {2}을 막는 것이 아니라 {3}(으)로 다스리는 것이다
justice.deduction.justice.hint: 재판관의 법은 형벌로 관례를 지킨다. 셀레스가 잃어버린 것은 저울의 균형. 진실로 저울을 세우고 사랑으로 다스릴 때 비로소 정의를 이룬다.
justice.crisis.mourning.text: 법정 앞에 달빛이 서늘하다. 조문 기간에 노래를 부른 과부 셀레와, 무덤에서 목걸이를 찾은 청년 이렌이 재판관 앞에 끌려 나왔다. 재판관이 판결문을 펼친다. 노래는 관례를 어겼고, 무덤은 도둑을 냈다. 벌은 정해져 있다. 관중은 숨을 죽인다. 아이가 고개를 숙이고, 묘지기가 무덤 쪽을 바라본다. 이제 그대가 나설 차례다.
justice.option.comfort-widow.label: 자장가를 불러 진실과 위로를 보인다
justice.option.comfort-widow.text: 그대가 법정 앞에서 떨리는 목소리로 자장가를 부른다. 달은 무덤을 비추고, 나는 당신의 자장가를 부른다. 관중이 숨을 멈춘다. 목격자가 고개를 숙이고, 사제가 옛 기록을 꺼내 읽는다. 조문의 달은 형벌이 아니라 함께하는 때였다. 재판관은 긴 침묵 끝에 판결문을 접는다. 셀레스의 저울이 처음으로 진실과 사랑을 올려놓고 균형을 찾는다. 형벌 대신 위로가 내려진다.
justice.option.strict-law.label: 형벌 조항을 낭독해 법대로 다스린다
justice.option.strict-law.text: 그대가 형벌 표를 펼쳐 법대로 읽는다. 노래는 사십 대, 무덤 출입은 추방. 재판관은 고개를 끄덕이고, 매질이 집행된다. 사람들은 더 조용해지지만, 어딘가에서 아이의 자장가가 낮게 이어진다. 셀레스는 관례를 지켰다. 그러나 무덤 앞에는 아무도 서지 않게 되었다.

