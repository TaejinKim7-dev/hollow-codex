npc.default.unknown: ……(고개를 젓는다.)
topic.name: 이름
topic.job: 일

# --- 마을 사람들 ---
npc.field.gatekeeper.name: 열석 문지기
npc.field.gatekeeper.greet: 이방인이 이 먼 들판까지 오다니. 나는 이 돌들을 지키는 문지기라오.
npc.field.gatekeeper.name.t: 나는 이름 자체를 오래 잊고 살았소. 한때는 모두가 서로의 이름을 물었다오. 지금 칼라스 사람들은 이름 대신 고백 기록부터 묻더구려.
npc.field.gatekeeper.job.t: 나는 순례자가 남긴 열석을 지키는 일을 하오. 삼백 년 전, 이 돌들 사이로 한 순례자가 들어왔다오. 그때부터 칼라스는 달라졌소.
npc.field.gatekeeper.pilgrim.t: 순례자는 말로 가르치지 않고 스스로 행해 보였소. 그가 남긴 글귀가 하나 있소. 진실은 누구도 대신 써 줄 수 없다는 말이었다오.
npc.field.gatekeeper.archive.t: 옛 서고라…… 칼라스에서 금지 구역으로 봉인된 곳이오. 사람들은 저마다 그곳을 잊어버렸다고 입을 모으지만, 그렇다면 왜 성문에 들어서기 전에 그곳부터 캐묻는단 말이오.
npc.field.gatekeeper.lantern.t: 광장의 등불이라면, 순례자가 이 돌들 사이에서 처음 켠 불에서 이어진 것이라 들었소. 불은 사람 손으로 켜지지만, 꺼질 때에도 늘 누군가의 손이 있었다오. 그 불을 노래한 가락에도 원래 이름이 하나 들어 있었는데, 아이들이 언제부턴가 그 자리를 비워 두고 부른다오.
npc.field.gatekeeper.silence.t: 돌은 삼백 년을 말없이 서 있었어도 거짓을 말한 적은 없소. 침묵과 거짓은 다른 것이라오. 요즘 사람들은 그 둘을 같은 것으로 여기더구려.

npc.field.hunter.name: 사냥꾼
npc.field.hunter.greet: 쉿, 조용히. 강 건너에서 늑대가 울고 있으니까.
npc.field.hunter.name.t: 이름이라…… 부른다고 와 주는 것도 없으니, 그냥 사냥꾼이라 불러.
npc.field.hunter.job.t: 나는 들판의 늑대들 곁에서 사는 사람이야. 처음엔 화살을 겨눴지. 그런데 알고 보니 저놈들은 굶주렸을 뿐, 악한 게 아니었어.
npc.field.hunter.wolf.t: 무기? 활은 아직 있지만 늑대한테는 안 써. 제일 마른 암늑대가 하나 있는데, 새끼한테 먹이느라 제 몫은 입에도 안 대. 그런 놈한테 화살을 겨눌 수 있겠어? 겁먹은 짐승은 이쪽이 먼저 숨을 죽이면, 저쪽도 숨을 돌려.
npc.field.hunter.confession.t: 고백? 나는 칼라스 성문을 안 넘은 지 오래야. 거기선 숨만 쉬어도 고백할 게 생기거든. 여기선 늑대가 내 고백을 들어 줘. 대답은 안 하지만.
npc.field.peddler.name: 들판 행상인
npc.field.peddler.greet: 어이, 길손! 성문 가기 전에 마음의 짐 좀 덜고 가. 짐 대신 들어 줄 건 못 되고, 사탕은 있지.
npc.field.peddler.name.t: 이름은 팔았어. 칼라스에선 이름이 잘 팔리거든. ……농담이야. 행상인이라 해.
npc.field.peddler.job.t: 마을에서 마을로 소문 말고 물건을 날라. 소문은 무겁고 물건은 가볍거든. 어느 마을이든 성문 앞에서 똑같이 물어. 이름이 아니라, 고백할 게 있느냐고.
npc.field.peddler.confession.t: 칼라스 사람들은 서로의 고백을 사고팔아. 진짜로 돈을 주고받는 건 아니야. 하지만 값이 매겨지는 건 분명해. 나쁜 고백일수록 비싸게 치더라.
npc.field.peddler.ledger.t: 장부 종이 대느라 이 마을이 산 하나를 다 벗겨 먹는다는 소문도 있어. 나는 종이를 팔지는 않지만, 산 사람은 알겠지.

npc.kalas.confessor.name: 성문 고백관
npc.kalas.confessor.greet: 성문을 나서기 전에, 한 가지 먼저 묻겠네. 그대는 오늘 무슨 죄를 지었나?
npc.kalas.confessor.name.t: 나는 성문에서 지나가는 자들의 고백을 받는 사람일세. 칼라스는 의심으로 시작하는 곳이 아니라네. 고백으로 시작하는 곳이라네.
npc.kalas.confessor.job.guilty.t: 그대의 옷차림을 보니, 무언가 곱씹을 일이 있었던 모양이로군. 혹시 금지 구역에 들어갔는가? 들어갔다면 그 일부터 고백해야 하네.
npc.kalas.confessor.job.t: 고백이 곧 일이지. 하루에 열 번, 스무 번, 사람들이 저지른 잘못을 말하고 나는 적네. 말하지 않는 사람은 말하는 사람을 고발해야 하고…… 우스운 일이지만, 그것이 우리 마을의 일이 되었네.
npc.kalas.confessor.duty.t: 의무라…… 처음에는 마음의 짐을 덜어 놓는 일이었다네. 어느 해부터인가 덜어 놓지 않으면 안 되는 일이 되었지. 짐은 그대로인데 이름만 바뀌었다네.
npc.kalas.confessor.nia.t: 니아라면 내가 받은 고백을 하루도 빠짐없이 받아 적던 아이일세. 말 한마디 틀리게 옮긴 적이 없지. 그러니 이번 자백도…… 아니, 내가 할 말이 아니군.
option.confess-yes.label: 들어갔다.
option.confess-yes.text: 고백을 받아 두지. 인정하는 자에게 칼라스는 벌을 내리지 않으니, 마을 안은 편히 다니게나.
option.confess-no.label: 아니, 들어가지 않았다.
option.confess-no.text: ……음. 말끝이 흐리군. 고백은 분명해야 하는 법일세. 오늘의 흔들린 대답은 기록해 두겠네.

npc.kalas.warden.name: 고발관장
npc.kalas.warden.greet: 칼라스 고발청일세. 신분부터 밝히게. ……그보다 먼저, 지난밤 광장 근처에서 무엇을 했는지 듣고 싶군.
npc.kalas.warden.name.t: 고발청의 관장일세. 이곳에서는 이름보다 기록을 먼저 대는 것이 예절이지.
npc.kalas.warden.job.t: 고발청의 일은 모든 기록을 살피는 것일세. 누가 언제 무엇을 숨겼는지, 장부에는 반드시 남아야 하지. 칼라스는 기록이 마을을 지킨다고 믿네. 재판도 장부를 증거로 삼지.
npc.kalas.warden.lantern.t: 광장의 등불이라…… 그날 밤 광장엔 아무도 없었다네. 나는 사무소에서 두루마리를 정리하고 있었지. 그것이 전부일세.
npc.kalas.warden.trial.witness.t: 재판은 닷새 뒤에 열릴 예정일세. 그런데 필경사는 끝내 입을 열지 않고 있네. 증언이 필요한 상황이지. 여보게, 그 아이에 대해 아는 게 있나?
npc.kalas.warden.trial.t: 칼라스의 재판은 공개 고백으로 진행되네. 증인이 없으면 자백 하나만으로 판결이 나지. 그래서 자백이 무엇보다 중요한 것일세.
npc.kalas.warden.silence.t: 침묵은 자백보다 시끄러운 법일세. 말하지 않는 자는 장부에 빈칸을 남기고, 빈칸은 언제나 의심을 부르지. 나는 그 의심을 덮으려고 기록하는 것이네.
npc.kalas.warden.confession.t: 고백은 마을을 지탱하는 뼈대일세. 기록이 없던 시절, 소문 하나가 한 가족을 마을 밖으로 내쫓은 일이 있었지. 그 뒤로 우리는 말을 적어 두기로 했네. 소문보다는 장부가 낫다고 믿었어. 지금도 그렇게 믿고 싶네.
npc.kalas.warden.nia.t: 그 아이는 십 년을 내 곁에서 받아 적었네. 한 번도 거짓을 입에 올린 적이 없지. 그러니 자백이 있다면 그것이 곧 사실일세. ……그렇지 않은가?
npc.kalas.warden.song.t: 장부라면…… 어릴 적 부르던 등불 노래의 빈자리가 마음에 걸려, 장부를 뒤져 본 적이 있네. 답은 없었네. 기록에 없는 것이 이 마을에 있다는 게, 나는 아직도 불편하네.
option.tell-warden.label: 토비가 그 밤을 보았다.
option.tell-warden.text: ……동생의 이름이 나오는군. 충분한 증언이 되겠어. 기록에 남기겠네. 이번 재판에 쓰일 걸세.
option.deny-warden.label: 그 아이에 대해서는 아무것도 모른다.
option.deny-warden.text: 흠, 대답이 흐트러지는군. 법정에서는 자네의 말 한마디 한마디가 기록이 된다는 걸 잊지 말게.

npc.kalas.elin.name: 고발관 견습 엘린
npc.kalas.elin.greet: 처음 뵙겠습니다. 고발관 견습 엘린입니다. 관장님 곁에서 기록의 법을 배우고 있습니다.
npc.kalas.elin.name.t: 엘린이라고 해요. 어릴 적부터 고발청에서 자랐어요. 기록을 어기지 않는 사람이 되라고, 여기 사람들이 저를 거두어 주었거든요.
npc.kalas.elin.job.t: 저는 장부를 관리해요. 글자를 또박또박 옮기는 건 좋아해요. 그런데 요즘은…… 그 글자가 누구를 향하는지가 자꾸 마음에 걸려요.
npc.kalas.elin.ledger.t: 장부라는 글자가 누군가의 이름을 덮어 갈 때…… 저는 견습이라 아무 말도 못 하지만, 장부가 이웃을 찌르는 무기가 된 것을 봤어요.
npc.kalas.elin.nia.t: 니아 선배는 제 글씨를 고쳐 주던 분이에요. 틀린 글자에 줄을 긋는 대신, 옆에 맞는 글자를 작게 적어 주셨어요. 그런 분이 등불을 깨고도 말없이 숨길 사람이 아니라는 건, 제가 제일 잘 알아요.
npc.kalas.elin.trial.t: 재판은 닷새 뒤예요. 저는 방청석 뒤에서 기록만 맡게 돼요. ……기록하는 사람은 아무것도 말릴 수 없다는 걸, 요즘에야 알았어요.
npc.kalas.elin.archive.t: 옛 서고에는 어릴 때 한 번 몰래 가 본 적이 있어요. 문틈으로 먼지 냄새가 났어요. 그날 처음으로, 장부에 없는 이야기가 있을지도 모른다고 생각했어요.

npc.kalas.nia.name: 필경사 니아
npc.kalas.nia.greet: ……죄송해요, 지금은 고백을 받을 수 없어요. 저도 고백해야 하는 몸이 되어서요.
npc.kalas.nia.name.t: 니아예요. 고발청에서 사람들의 자백을 받아 적는 필경사였어요. ……'였'이라는 말이 씁쓸하네요.
npc.kalas.nia.job.t: 필경사의 일은 다른 사람의 말을 가장 정확하게 옮기는 것이에요. 남의 말을 지키기 위해서는 내 말을 줄여야 했고, 그렇게 가장 단단히 지킨 것이…… 침묵이었어요.
npc.kalas.nia.lantern.t: 등불을 깬 사람은 저예요. 그날 밤, 광장에서 저 혼자 조심하지 못했어요. 그게 전부예요.
npc.kalas.nia.ledger.t: 장부 이야기라면, 이제야 말할 수 있게 됐어요. 토비가 본 것을 믿게 된 지금이라면요. 저는 더 이상 그 사람을 미워하지 않아요. 그 사람도 누군가의 기록이 필요했을 테니까.
npc.kalas.nia.confession.t: 고백은…… 하지 않은 말까지 받아 적을 수 있다면 좋겠어요. 저는 장부 마지막 장을 늘 비워 둬요. 사람들이 끝내 하지 못한 말이 앉을 자리요.
npc.kalas.nia.tobi.t: 토비는 지붕 위에서 자는 버릇이 있어요. 별이 가까워서 좋대요. ……그날 밤 일은 묻지 말아 주세요. 부탁이에요.
npc.kalas.nia.truth.t: 진실은 쓰는 게 아니라 지키는 거라고 배웠어요. 그런데 지킨다는 게 누구를 위한 건지는, 배운 적이 없어요.
npc.kalas.nia.trial.t: 재판이 무섭지는 않아요. 무서운 건…… 아니에요. 아무것도 아니에요.

npc.kalas.tobi.name: 니아의 동생 토비
npc.kalas.tobi.greet: 아, 안녕하세요…… 혹시 누나 만나러 오셨어요? 그럼 다행인데. ……아니에요, 아무것도 아니에요.
npc.kalas.tobi.name.t: 토비예요. 누나는 니아라고 해요. 누나는 거짓말을 못 해서, 사람들이 오히려 그걸 믿고 모든 말을 누나에게 했어요. 그래서 누나는 그 말들을 지키느라 자기 말은 아무것도 못 했어요.
npc.kalas.tobi.nia.t: 누나는 지금 구금실에 있어요. 남의 자백을 받는 사람이, 이제 자기 자백을 기다리는 처지예요. 내가 뭔가 잘못하고 있는 것만 같아요.
npc.kalas.tobi.lantern.t: ……그날 밤에 저, 광장 남쪽 지붕에서 잤어요. 누가 등불 위로 올라가서…… 유리를 내리쳤어요. 고발관장님이었어요. 누나가 끝까지 제 이름을 말하지 않아서, 저도 지금까지 입을 다물고 있었어요.
npc.kalas.tobi.silence.t: 입을 다무는 거, 누나는 잘하는데 저는 못해요. 자꾸 말이 목까지 올라와요. 등불 노래에서 이름 자리가 오면 다들 입만 벙긋하는데, 저는 그때 숨을 쉬어요. ……누나는 어떻게 참는 걸까요.
npc.kalas.tobi.ledger.t: 누나 이름이 장부에 적힐 때…… 장부가 두꺼워지는 소리가 나는 것 같았어요. 제 연도 그 종이로 만든 거예요. 버려진 두루마리 뒷면이요. 글자가 없는 쪽만 골랐어요.
npc.kalas.tobi.archive.t: 서고요? 거기 가면 안 된다고 누나가 그랬어요. 근데…… 거기에 아주 오래된 이야기가 있대요. 누나가 그 얘기 할 때만 눈이 반짝였어요.

npc.kalas.mira.name: 직조공 미라
npc.kalas.mira.greet: 이리 와 봐. 옷감은 못 만들어 주지만, 이야기쯤은 풀어 줄 수 있어.
npc.kalas.mira.name.t: 미라야. 팔 년째 실을 다루고 있어. 실은 정직해. 늘어진 것, 조인 것, 다 손끝으로 느껴지거든. 이 마을에서 내가 믿는 건 실뿐이야.
npc.kalas.mira.job.t: 천을 짜는 일이지. 시장에 내다 팔기도 하고, 가끔 고발청의 두루마리 묶는 일도 맡아.
npc.kalas.mira.lantern.t: 아, 그 이야기가 벌써 닿았구나. 광장에서 등불 조각을 하나 주웠어. 실에 단단히 감겨 있었지. 누가 숨기려 한 모양이야. 그 실이 낯익어. 고발청 두루마리를 묶는 실이거든. 내가 꼬아 준 거라 알아. 쓸 것 같으면 가져가.
npc.kalas.mira.ledger.t: 해마다 고발청 두루마리가 한 뭉치씩 두꺼워져. 작년엔 옆집 아이가 말실수한 것까지 기록되어 그 집이 마을을 떠나야 했어. 그 장부는 진실을 지키는 게 아니라, 의심을 쌓아 두는 것 같아.
npc.kalas.mira.silence.t: 말 없는 사람은 팽팽한 실 같아. 오래 버티는 것 같아도, 한 번 끊어지면 다시 이을 때 매듭이 남지. 니아가 그런 애야.
npc.kalas.mira.nia.t: 니아 앞치마는 내가 짠 거야. 고발청 사람이 맞추러 와서 '말이 없는 색으로 해 달라'더군. 그래서 회녹색으로 짰어. 이제야 그 말이 무슨 뜻이었는지 알 것 같아.
npc.kalas.mira.confession.t: 나는 고백 같은 거 안 해. 실에 거짓이 들어가면 천이 비뚤어지거든. 그걸로 족해.

npc.kalas.child.name: 마을 아이
npc.kalas.child.greet: 와, 낯선 사람이다! 혹시 광장 노래를 아는 사람이야?
npc.kalas.child.name.t: 이름은 여러 개 있는데 다 잊어버렸어! 그냥 '얘'라고 불러. 여기 애들은 다 그래.
npc.kalas.child.job.t: 내 일은 노래 부르기야! 달이 뜨면 광장에 모여서 등불 노래를 불러. 그러면 어른들도 다 멈추고 들어줘. 나도 따라 불러 줄까?
npc.kalas.child.song.t: 등불 노래 불러 줄까? '달이 뜨면 불을 켜네, ○○가 켠 불을. 밤새 꺼지지 않게.' 이름 자리는 다 같이 입을 다무는 거야. 왜 그런지는 몰라. 규칙이야.
npc.kalas.child.ledger.t: 장부? 그 두꺼운 거? 거기 내 이름도 많이 적혀 있대! 이름이 여러 개라서!
npc.kalas.child.trial.t: 재판? 어른들이 다 모이는 거야? 그럼 그날은 광장에서 노래해도 돼? ……아, 안 되는 거구나.

npc.kalas.innkeeper.name: 여관 주인
npc.kalas.innkeeper.greet: 어서 오시게! 방은 다 비어 있으니 편히 주무시게. 지붕 밑은 칼라스 관례상 값없이 내주지.
npc.kalas.innkeeper.name.t: 평범한 여관 주인일세. 하지만 칼라스에서는 '평범하다'는 말도 의심을 사니까, 그냥 여관 주인이라 불러 주게.
npc.kalas.innkeeper.job.t: 여관을 하는 일이지. 지나는 손님과 마을 소식을 나누는 일. 요즘 화제라면 다들 필경사 니아를 말해. 참 착한 아이인데. 그리고 닷새 뒤 재판이 열린다는 소문도 돌고 있네.
npc.kalas.innkeeper.trial.t: 재판 이야기가 나왔으니 말인데, 고발청이 감춘 옛 문서가 어딘가 보관되어 있다는 소문이 있네. 유력한 곳은 바로 그 옛 서고일세. 하지만 그곳은 금지 구역이라, 들어가는 자는 반드시 고백하게 되어 있지.
npc.kalas.innkeeper.lantern.t: 그날 밤 우리 집에 손님이 하나 묵었는데…… 아니, 아무것도 못 봤다고 하더군. 우리 집은 지붕은 값없이 내주지만, 본 것은 값없이 내주지 않는다네.
npc.kalas.innkeeper.confession.t: 나도 한 달에 한 번쯤은 누군가를 고발해 두네. 별것 아닌 걸로 말일세. 안 하면 오히려 수상하게 보이니까. 부끄러운 일이지만…… 이 마을에서 사는 법이야.
npc.kalas.innkeeper.ledger.t: 장부가 두꺼워질수록 여관은 조용해지지. 손님이 말을 아끼니 소문도 안 도네. 조용한 건 편하지만…… 가끔은 시끄러운 날이 그립다네.
npc.kalas.innkeeper.nia.t: 니아는 우리 집 구석 자리에서 가끔 혼자 중얼거리며 뭘 적었지. 고백서는 아닌 게 분명했네. 남의 말만 받아 적던 아이가 제 말을 적는 모습이 보기 좋았는데.

npc.kalas.librarian.name: 늙은 사서
npc.kalas.librarian.greet: ……아, 이 좁은 곳까지 내려오는 사람이 또 있나. 반갑네. 만질 수 있는 책이 이제는 이것뿐이라서.
npc.kalas.librarian.name.t: 나는 예전 서고를 지키던 사서라네. 지금은 이 지하 방에 깊이 숨어 살지만, 책은 벽이 아니라 손에 쥐어지는 것이라네.
npc.kalas.librarian.pilgrim.t: 순례자의 이야기라면 그 편지를 보게. 삼백 년 전, 순례자가 이 마을에 남긴 편지야. 언젠가 누군가가 그 뜻을 이해하게 될 때를 위해 내가 간직해 왔네.
npc.kalas.librarian.job.t: 내 일은 아이들을 가르치고 기록을 지키는 것이었지. 그 도굴꾼들은 저마다 자기 사연을 대며 이 서고의 벽을 뚫고 들어오더군. 탐욕으로 무너지는 사람을 오래 보아 와서, 이제 그 낌새를 단번에 알아보네.
npc.kalas.librarian.archive.t: 이곳은 옛 서고에 남은 방일세. 위쪽 서가는 고발청이 봉인했고, 열쇠는 오래전에 사라졌네. 벽을 뚫고 들어온 건 도굴꾼뿐이었지. 책을 훔치러 온 자들과 책을 숨기려는 자들, 어느 쪽이 서고를 더 해쳤는지는 모르겠네.
npc.kalas.librarian.truth.t: 진실은 장부에 적히는 게 아니라 책에서 읽히는 것이라고 나는 믿어 왔네. 적는 사람은 하나지만 읽는 사람은 여럿이고, 그래서 읽히는 쪽이 덜 외롭지.
npc.kalas.librarian.ledger.t: 장부는 한 사람이 다른 사람을 적는 책이고, 서고의 책은 사람이 사람에게 남기는 책일세. 둘 다 종이지만 쓰이는 방향이 정반대지.
npc.kalas.jailer.name: 구금실 간수
npc.kalas.jailer.greet: 면회는 안 됩니다. ……규정입니다. 저도 아쉽습니다만.
npc.kalas.jailer.name.t: 간수입니다. 이름은 장부에 있습니다. 여기서는 그게 이름입니다.
npc.kalas.jailer.job.t: 구금실을 지킵니다. 갇힌 사람이 달아날까 봐서가 아니라, 밖에서 누가 들어올까 봐서입니다. 고백하려는 사람은 늘 안으로 들어오고 싶어 합니다.
npc.kalas.jailer.nia.t: 필경사 님은 하루 종일 한 번도 소란을 피우지 않으십니다. 다만 밤마다 손가락으로 허공에 글자를 쓰십니다. 종이를 드리고 싶지만, 규정에 없는 일이라서 그리 못 합니다.
npc.kalas.jailer.trial.t: 재판 날이 되면 저는 두 가지를 데리고 나갑니다. 필경사 님과, 이 구금실의 열쇠입니다. 열쇠가 이렇게 무겁게 느껴지는 건 처음입니다.
npc.kalas.baker.name: 제빵사
npc.kalas.baker.greet: 갓 구웠어. 식기 전에 와. 빵은 값을 받아, 관례는 지붕까지만이거든.
npc.kalas.baker.name.t: 빵집 아줌마라고 불러. 이름은 장부에서나 쓰는 거지.
npc.kalas.baker.job.t: 새벽 세 시부터 반죽을 쳐. 빵은 속이길 못해. 덜 구우면 속이 설고, 태우면 겉이 까매져. 사람도 이랬으면 좋겠는데.
npc.kalas.baker.tobi.t: 토비 걔는 빵 한 쪽을 꼭 접어서 누나 몫으로 챙겨 가. 그 애한테는 값 안 받아. 장부에도 안 적어.
npc.kalas.baker.silence.t: 조용한 애들이 제일 많이 먹어. 말 대신 입에 뭘 넣어 두는 거지. 니아가 그랬어. ……요즘은 빵집 앞을 그냥 지나가기만 해.
npc.kalas.patrol-a.name: 젊은 순찰 경비
npc.kalas.patrol-a.greet: 정지! ……아, 아니, 거기 서 주십시오. 고백 순찰 중입니다. 혹시 고백하실 것이 있으십니까?
npc.kalas.patrol-a.name.t: 순찰 3년 차입니다. 이름은…… 아직 장부에 한 줄밖에 없습니다.
npc.kalas.patrol-a.job.t: 광장과 골목을 돌며 고백하지 않은 사람이 없는지 봅니다. 없으면 제 순찰은 성공이고, 있으면…… 그것도 성공이라고 배웠습니다. 이상하지요.
npc.kalas.patrol-a.confession.t: 고백을 마친 분께는 이 완장을 보여 드립니다. 보이시지요? 이게 있으면 오늘은 안전합니다. 내일 다시 받아야 하지만요.
npc.kalas.patrol-a.lantern.t: 그날 밤은 제 순번이 아니었습니다. 원래 제가 광장을 돌 차례였는데, 관장님이 대신 서 주겠다고 하셨습니다. 이상하게 친절하셔서 기억에 남습니다.
npc.field.patrol.name: 늙은 순찰 경비
npc.field.patrol.greet: 이봐, 거기. 걷는 걸 보니 고백할 게 많은 걸음이야. 농담이야. 반쯤은.
npc.field.patrol.name.t: 이름? 순찰 이십 년 차. 이름은 그동안 닳아 없어졌어.
npc.field.patrol.job.t: 밤을 지키는 일이야. 처음엔 도둑을 막으려고 시작했지. 지금은 말 새는 걸 막는 일이 됐어. 도둑보다 말이 더 많이 새거든.
npc.field.patrol.ledger.t: 내 이름도 장부에 열두 번 올랐어. 전부 사소한 거야. 신발을 짝짝이로 신었다든가. 그래도 열두 줄이면 열두 번 의심받은 사람이 되지.
npc.field.patrol.truth.t: 진실은 순찰로 막을 수 없어. 담을 넘어 들어오고 창문으로 새어 나가지. 나는 그걸 못 본 척하는 게 일이었고.
npc.field.herbalist.name: 약초 장수
npc.field.herbalist.greet: 어서 와, 어서 와! 기침엔 별꽃, 불면엔 쑥, 마음엔…… 마음엔 약이 없어.
npc.field.herbalist.name.t: 이름? 약초 이름은 백 개를 외우는데 내 이름은 가끔 까먹어. 그냥 약초 장수라 불러.
npc.field.herbalist.job.t: 산과 들판에서 풀을 뜯어다 말려 팔지. 풀은 말은 안 해도 색과 냄새로 다 알려 줘. 사람이 풀만 같아도 고백할 일이 없을 텐데.
npc.field.herbalist.truth.t: 진실도 약초 같아서, 말려 두면 쓴맛만 남아. 갓 딴 걸 바로 써야 약이 되는 법이야.
npc.field.herbalist.archive.t: 옛 서고 담벼락 밑에 풀이 한 종류 있어. 서고 문이 닫힌 뒤로도 해마다 같은 자리에 나지. 사람은 잊어도 풀은 안 잊나 봐.
npc.kalas.bellringer.name: 종지기
npc.kalas.bellringer.greet: 아, 소리가 들리셨어요? 오늘은 아직 안 쳤는데. ……그래도 귀가 울리는 날이 있죠.
npc.kalas.bellringer.name.t: 그냥 종지기예요. 종은 이름을 안 물어봐요. 치면 소리가 나는 것뿐이에요.
npc.kalas.bellringer.job.t: 하루 세 번, 고백 시간에 종을 쳐요. 종소리가 나면 사람들이 입을 열고, 멈추면 입을 닫아요. 제가 마을의 입을 여닫는 셈이죠.
npc.kalas.bellringer.lantern.t: 그날 밤엔 종을 안 쳤어요. 달이 너무 밝아서요. ……그런데 한밤중에 유리 깨지는 소리가 들렸어요. 종소리보다 맑았어요.
npc.kalas.bellringer.song.t: 침묵이라면…… 등불 노래의 이름 자리가 떠오르네요. 노래가 시작되면 저도 모르게 종줄을 만지는데, 그 빈 자리에서는 종도 가만히 있어요. 노래의 첫 음은 종소리에서 따왔대요.
npc.field.aspirant.name: 순례 지망생
npc.field.aspirant.greet: 혹시 순례자세요? 열석을 지나 오셨죠? 저, 여덟 마을을 다 돌 거예요!
npc.field.aspirant.name.t: 이름 말하면 장부에 올라갈까 봐…… 아니, 농담이에요. 근데 정말 안 말하는 게 좋을지도요.
npc.field.aspirant.job.t: 아직 아무 일도 안 해요. 순례가 일이에요. 삼백 년 전 순례자가 어떻게 걸었는지, 그 걸음을 따라가 보려고요.
npc.field.aspirant.pilgrim.t: 순례자는 말보다 행동으로 가르쳤다던데, 그게 제일 어려워요. 저는 행동하기 전에 먼저 물어봐 버리거든요. ……당신은 어땠어요?
npc.field.aspirant.truth.t: 진실을 찾으러 왔는데, 칼라스에서는 다들 진실을 먼저 적어 두고 시작하더라고요. 이미 적힌 진실을 어떻게 찾아요?
npc.kalas.neighbor.name: 니아네 이웃 할머니
npc.kalas.neighbor.greet: 아이고, 낯선 얼굴이네. 니아네 집에 볼일이 있어요? 지금은 비었는데.
npc.kalas.neighbor.name.t: 그냥 이웃 할멈이라고 해요. 니아 어릴 때부터 옆집이었으니, 이름보다 그게 더 길어요.
npc.kalas.neighbor.job.t: 평생 이 골목에서 빨래하고 콩 까고 살았죠. 그 사이 니아가 아이였다가 어른이 되고, 토비가 태어났어요. 그 둘은 제 손으로 키운 거나 다름없어요.
npc.kalas.neighbor.nia.t: 그 애는 어릴 때도 거짓말을 못 했어요. 엄마가 아프다고 거짓말하라고 시켜도 얼굴이 먼저 말했죠. ……그런 애가 자백을 했다니, 그 입이 어떻게 그런 말을 했을까.
npc.kalas.neighbor.ledger.t: 장부에 우리 영감 이름도 있었대요. 죽고 나서야 알았죠. 무슨 죄인지는 끝내 못 봤고. 장부는 죽은 사람 이름도 안 지워 주나 봐요.
npc.kalas.clerk.name: 고발청 서기
npc.kalas.clerk.greet: 아, 저…… 관장님께 용건이시면 저쪽입니다. 저는 그냥 옮겨 적는 사람입니다.
npc.kalas.clerk.name.t: 서기입니다. 서기는 이름을 쓰지 않고 줄을 씁니다. 저는 사십일 번째 줄입니다.
npc.kalas.clerk.job.t: 낮에 쓰인 장부를 밤에 한 번 더 옮겨 적습니다. 틀린 글자가 하나라도 있으면 처음부터 다시 옮깁니다. 그래서 글자에는 자신이 있습니다. 글자 뒤의 사람은…… 자신이 없습니다.
npc.kalas.clerk.ledger.t: 어젯밤 옮겨 적다가 이상한 걸 봤습니다. 광장 등불 건에 적힌 글씨가 낮에 본 것과 달랐습니다. 제 눈이 틀렸을 겁니다. 그렇게 생각하기로 했습니다.
npc.kalas.clerk.lantern.t: 관장님은 그 다음 날 아침 장갑을 끼고 오셨습니다. 손에 상처가 나셨다고 하셨습니다. ……제가 기록할 일은 아니라서 적지 않았습니다.

# --- 단서 라벨과 힌트 ---
word.pilgrim.label: 순례자
word.pilgrim.hint: 삼백 년 전, 열석 사이로 들어와 여덟 미덕을 몸소 보인 이. 있는 그대로의 사실은 누구도 대신 써 줄 수 없다고 남겼다.
word.truth.label: 진실
word.truth.hint: 순례자가 남긴 한 줄이 가리키는 것. 장부에 적힌 말과 실제로 일어난 일은 같지 않다.
word.weapon.label: 무기
word.weapon.hint: "기록이 사람을 다치게 할 때, 그것은 더 이상 사실을 지키는 일이 아니다."
word.lantern.label: 등불
word.lantern.hint: "광장의 불이 꺼진 날 밤부터, 누군가의 이야기가 꺼지기 시작했다."
word.duty.label: 의무
word.duty.hint: 이 마을에서 고백은 의무다. 의심받지 않으려는 의무.
word.ledger.label: 장부
word.ledger.hint: 고발청의 두루마리. 이웃의 이름이 한 줄씩 늘어나는 곳.
word.silence.label: 침묵
word.silence.hint: 필경사가 끝까지 지킨 것. 남의 말을 지키려고 제 말을 지운 대가였다.
word.confession.label: 고백
word.confession.hint: 죄를 말하는 일이 아니라, 말하지 않은 것을 털어놓는 일.
word.trial.label: 재판
word.trial.hint: 닷새 뒤, 필경사의 재판이 열린다.
fact.kalas.nia.label: 필경사 니아
fact.kalas.nia.hint: 고발청에서 사람들의 자백을 받아 적는 필경사. 지금은 그 자신이 고백을 기다리는 처지다.
fact.kalas.tobi.label: 니아의 동생 토비
fact.kalas.tobi.hint: 누나가 무엇을 지키려 하는지 아는 소년. 어느 지붕 위에서 잠들었던 밤을 기억한다.
fact.kalas.archive.label: 옛 서고
fact.kalas.archive.hint: 고발청이 봉인한 금지 구역. 들어가는 자는 고백해야 한다.
fact.song.lantern-song.label: 등불 노래
fact.song.lantern-song.hint: 아이들이 광장에서 부르는 노래. 가사에는 누군가의 이름이 빠져 있다.
fact.creature.wolf-hungry.label: 굶주린 늑대
fact.creature.wolf-hungry.hint: 늑대는 굶주렸을 뿐, 악하지 않다. 겁먹은 짐승은 화살보다 먼저 이해를 기다린다.
fact.creature.robber-greed.label: 도굴꾼
fact.creature.robber-greed.hint: 자기 사연을 대며 벽을 뚫고 들어온 자들. 탐욕이 그들의 걷는 길을 앞질렀다.
fact.kalas.lantern-shard.label: 연실이 감긴 등불 조각
fact.kalas.lantern-shard.hint: "광장 불빛에서 떨어져 나온 조각. 누군가가 실에 감아 숨겨 두었다."
fact.kalas.brother-witness.label: 토비의 고백
fact.kalas.brother-witness.hint: 그날 밤 지붕에서 본 것. 아이가 처음으로 입을 열었다.
fact.kalas.pilgrim-letter.label: 순례자의 편지
fact.kalas.pilgrim-letter.hint: 사서가 간직해 온, 순례자가 이 마을에 남긴 편지.
fact.kalas.ledger-doubt.label: 장부에 대한 의심
fact.kalas.ledger-doubt.hint: "장부가 사실을 지킨다고 믿던 사람들이, 조금씩 틈을 보이기 시작한다."
fact.kalas.elin-forgiven.label: 니아의 용서
fact.kalas.elin-forgiven.hint: "필경사가 지켜 온 비밀을 마침내 푼 자리. 미움 대신 놓아 주는 일이었다."

# --- 추론 ---
deduction.honesty.sentence: 정직은 {1}을 {2}가 아니라 {3}(으)로 쓰는 것이다
deduction.honesty.hint: 칼라스 사람들은 정직을 기록으로 굳혔다. 순례자가 남긴 뜻은 그 반대쪽에 있다.

# --- 위기 ---
crisis.kalas.trial.text: 고발청 앞에 광장 사람들이 모였다. 닷새를 기다린 재판이 열린다. 고발관장이 두루마리를 펼치며 말한다. "필경사 니아는 광장의 등불을 깨뜨리고도 신고하지 않았다. 자백이 이미 있으니 증언은 필요 없다." 관중이 술렁인다. 사람들 사이에서 누군가 그대를 바라본다. 이제 그대가 나설 차례다.
option.truth.label: 토비의 증언과 등불 조각을 꺼낸다
option.truth.text: 그대가 토비의 말과 연실에 감긴 등불 조각을 내민다. "이 조각을 숨긴 자는, 등불을 깬 자입니다." 토비가 지붕에서 본 것을 떨리는 목소리로 말한다. 사람들이 고발관장을 바라본다. 니아의 침묵은 마침내 해석되고, 장부는 진실을 담아 남는다.
option.lantern.label: 순례자의 편지를 읽는다
option.lantern.text: 그대가 순례자의 편지를 꺼내 읽는다. "진실은 무기로 기록하지 말고, 등불로 비추어라." 고발관장의 장부가 불 속으로 들어가고, 꺼져 있던 광장의 등불에 다시 불이 붙는다. 기록보다 먼저 진실이 선 자리. 그것이 칼라스의 새로운 시작이다.

