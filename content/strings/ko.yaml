npc.arena.trainer.name: 훈련 교관
npc.arena.trainer.greet: 연습장이다. 함께 싸워 보고 싶으면 말만 해라. 적 옆에 둘이 서면 칼이 한 번 더 들어간다.
npc.arena.trainer.name.t: 이곳 연습장을 보는 교관일세. 이름은 칼날에 묻어 두었지.
npc.arena.trainer.job.t: 적의 옆구리나 등 뒤로 돌아가 쳐 보게. 같은 편이 적 옆에 서 있으면 연달아 한 번 더 들어간다네.
