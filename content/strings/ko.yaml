npc.default.unknown: …글쎄, 그건 잘 모르겠네.
topic.name: 이름
topic.job: 일

# --- 마을 사람들 ---
npc.field.gatekeeper.name: 열석 문지기
npc.field.gatekeeper.greet: 이방인이 이 먼 들판까지 오다니. 나는 이 돌무더기를 지키는 문지기라오.
npc.field.gatekeeper.name.t: 나는 이름 자체를 오래 잊고 살았소. 한때는 모두가 서로의 이름을 물었지. 지금 칼라스 사람들은 이름 대신 고백 기록부터 묻는구나.
npc.field.gatekeeper.job.t: 나는 순례자가 남긴 열석을 지키는 일을 하오. 삼백 년 전, 이 돌들 사이로 한 순례자가 들어왔지. 그때부터 이 마을은 달라졌소.
npc.field.gatekeeper.pilgrim.t: 순례자는 말로 가르치지 않고 스스로 행해 보였소. 그가 남긴 글귀가 하나 있지. 진실은 누구도 대신 써 줄 수 없다는 말이었지.
npc.field.gatekeeper.archive.t: 옛 서고라…… 칼라스에서 금지 구역으로 봉인된 곳이지. 사람들은 저마다 그곳을 잊어버렸다고 입을 모으지만, 그렇다면 왜 성문에 들어서기 전에 그곳을 캐물을까.

npc.field.hunter.name: 사냥꾼
npc.field.hunter.greet: 쉿, 조용히. 강 건너에서 늑대가 울고 있으니까.
npc.field.hunter.name.t: 이름이라…… 부르면 와 주는 것은 없다만, 그냥 사냥꾼이라 불러 줘.
npc.field.hunter.job.t: 나는 들판의 늑대들과 함께 사는 사람이야. 처음에는 화살을 겨누었지. 좀처럼 다가가기가 어렵더군. 그런데 늑대는 굶주렸을 뿐, 악한 것은 아니야.

npc.kalas.confessor.name: 성문 고백관
npc.kalas.confessor.greet: 성문을 나서기 전에, 한 가지 먼저 묻겠네. 그대는 오늘 무슨 죄를 지었나?
npc.kalas.confessor.name.t: 나는 성문에서 지나가는 자들의 고백을 받는 사람일세. 칼라스는 의심으로 시작하는 곳이 아니야. 고백으로 시작하는 곳이라네.
npc.kalas.confessor.job.guilty.t: 그런데 그대의 옷차림을 보니, 무언가 곱씹을 일이 있었던 것 같구려. 혹시 금지 구역에 들어갔는가? 들어갔다면, 그 일부터 고백해야 하네.
npc.kalas.confessor.job.t: 고백이 곧 일이지. 하루에 열 번, 스무 번, 사람들이 저지른 잘못을 말하고 나는 적네. 말하지 않는 사람은 말하는 사람을 고발해야 하고…… 웃기지만, 그게 우리 마을의 일이 되었어.
option.confess-yes.label: 들어갔다.
option.confess-yes.text: 고백을 받아 두지. 인정하는 자에게 칼라스는 벌을 내리지 않으니, 마을 안은 편히 다니게나.
option.confess-no.label: 아니, 들어가지 않았다.
option.confess-no.text: ……음. 그 대상에 애매함이 섞여 있구려. 고백은 분명해야 하는 것일세. 오늘의 흔들린 대답은 기록해 두지.

npc.kalas.warden.name: 고발관장
npc.kalas.warden.greet: 칼라스 고발청이다. 신분부터 대라. 아니다, 그보다 먼저—— 지난밤의 일을 어떻게 아는지부터 밝히겠다.
npc.kalas.warden.name.t: 나는 이 마을의 고발을 두루 맡은 관장이라 부르게. 여기서는 이름보다 기록을 먼저 대는 것이 예절이지.
npc.kalas.warden.job.t: 고발청의 일은 모든 기록을 살피는 것. 누가 언제 무엇을 숨겼는지, 장부에는 반드시 남아 있게 되어 있지. 칼라스는 기록이 마을을 지킨다 믿네. 물론 재판도 장부가 증거가 되지.
npc.kalas.warden.lantern.t: 광장의 등불이라…… 그날 밤 광장엔 아무도 없었다네. 나는 사무소에서 두루마리를 정리하고 있었어. 그것이 전부인 걸.
npc.kalas.warden.trial.witness.t: 재판은 닷새 뒤에 열릴 예정이야. 그런데 견습 필경사는 끝내 입을 열지 않고 있어. 증언이 필요한 상황이지. 여보게, 그 아이에 대해 아는 게 있나?
npc.kalas.warden.trial.t: 칼라스의 재판은 공개 고백으로 진행되네. 증인이 없으면 자백 하나만으로 판결이 나지. 그래서 자백이 무엇보다 중요한 것이야.
option.tell-warden.label: 토비가 그 밤을 보았다.
option.tell-warden.text: ……동생의 이름이 나오는군. 충분한 증언이 될 수 있겠어. 기록에 남기지. 이번 재판에는 꼭 쓰일 것이야.
option.deny-warden.label: 그 아이에 대해서는 아무것도 모른다.
option.deny-warden.text: 흠, 대답이 좀 흐트러져 있구먼. 법정에서는 자네의 말 한마디 한마디가 기록이 된다는 걸 잊지 말게.

npc.kalas.elin.name: 고발관 견습 엘린
npc.kalas.elin.greet: 동향하십니까, 고발관 견습 엘린입니다. 관장님 곁에서 기록의 법을 배우고 있습니다.
npc.kalas.elin.name.t: 엘린이라고 해요. 어릴 적부터 고발청에서 자랐어요. 기록을 어기지 않는 사람이 되라고, 여기 사람들이 저를 거두어 주었거든요.
npc.kalas.elin.job.t: 저는 장부를 관리해요. 글자를 또박또박, 정확히 옮기는 것은 좋아해요. 그런데 최근 들어 장부가 사람을 다치게 하는 쪽으로 쓰이는 걸 보고 있어요.
npc.kalas.elin.ledger.t: 장부라는 글자가 누군가의 이름을 덮어 갈 때…… 저는 견습이라 아무 말도 못 하지만, 장부가 이웃을 찌르는 무기가 된 것을 봤어요.

npc.kalas.nia.name: 필경사 니아
npc.kalas.nia.greet: ……죄송해요, 지금은 고백을 받을 수 없어요. 저도 고백해야 하는 몸이 되어서요.
npc.kalas.nia.name.t: 니아예요. 고발청에서 사람들의 자백을 받아 적는 필경사였어요. ……'였'이라는 말이 씁쓸하네요.
npc.kalas.nia.job.t: 필경사의 일은 다른 사람의 말을 가장 정확하게 옮기는 것이에요. 남의 말을 지키기 위해서는 내 말을 줄여야 했고, 그렇게 가장 단단히 지킨 것이…… 침묵이었어요.
npc.kalas.nia.lantern.t: 등불을 깬 사람은 저예요. 그날 밤, 광장에서 저 혼자 조심하지 못했어요. 그게 전부예요.
npc.kalas.nia.ledger.t: 장부 이야기라면, 이제야 말할 수 있게 됐어요. 토비가 본 것을 믿게 된 지금이라면요. 저는 더 이상 그 사람을 미워하지 않아요. 그 사람도 누군가의 기록이 필요했을 테니까.

npc.kalas.tobi.name: 니아의 동생 토비
npc.kalas.tobi.greet: 아, 안녕…… 혹시 큰누나 만나러 온 사람? 그럼 다행인데. 아냐, 아무것도 아냐.
npc.kalas.tobi.name.t: 토비예요. 누나는 니아라고 해요. 누나는 거짓말을 못 해서, 사람들이 오히려 그걸 믿고 모든 말을 누나에게 했어요. 그래서 누나는 그 말을 지키는 데 평생을 썼어요.
npc.kalas.tobi.nia.t: 누나는 지금 구금실에 있어요. 남의 자백을 받는 사람이, 이제 자기 자백을 기다리는 처지예요. 내가 뭔가 잘못하고 있는 것만 같아요.
npc.kalas.tobi.lantern.t: ……그날 밤, 나는 광장 남쪽 지붕에서 잤어요. 누군가 등불 위에 올라가 유리를 내리쳤죠. 그 사람은 고발청 관장이었어요. 하지만 누나가 끝까지 내 이름을 말하지 않아서, 나도 지금까지…… 입을 다물고 있었어요.

npc.kalas.mira.name: 직조공 미라
npc.kalas.mira.greet: 이리 와 보게. 옷감은 못 만들어 주지만, 이야기쯤이야 풀어 놓지.
npc.kalas.mira.name.t: 미라야. 팔 년째 실을 다루고 있어. 실은 정직해. 늘어진 것, 조인 것, 다 손끝으로 느껴지거든. 이 마을에서 내가 믿는 것은 실뿐이야.
npc.kalas.mira.job.t: 천을 짜는 일이지. 시장에 내다 팔기도 하고, 가끔 고발청의 두루마리 포장도 맡아.
npc.kalas.mira.lantern.t: 아, 그 이야기가 벌써 닿았구나. 광장에서 등불 조각을 하나 주웠어. 실에 단단히 감겨 있었지. 누군가 조각을 숨겨 두려고 했던 모양이야. 쓸 것 같으면 가져가.
npc.kalas.mira.ledger.t: 해마다 고발청 두루마리가 한 뭉치씩 두꺼워져. 작년엔 옆집 아이가 말 실수한 것까지 기록되어 마을을 떠나야 했어. 그 장부는 진실을 지키는 것이 아니라, 의심을 쌓아 두는 것 같아.

npc.kalas.child.name: 마을 아이
npc.kalas.child.greet: 와, 낯선 사람이다! 혹시 광장 노래를 아는 사람이야?
npc.kalas.child.name.t: 이름은 여러 개 있는데 다 잊어버렸어! 그냥 내라고 불러. 여기 애들은 다 그래.
npc.kalas.child.job.t: 내 일은 노래 부르기야! 달이 뜨면 광장에 모여서 등불 노래를 불러. 그러면 어른들도 다 멈추고 들어줘. 나도 따라 불러 줄까?

npc.kalas.innkeeper.name: 여관 주인
npc.kalas.innkeeper.greet: 어서 오시게! 방은 다 비어 있으니 편히 주무시게. 지붕 밑은 칼라스 관례상 값없이 내주지.
npc.kalas.innkeeper.name.t: 평범한 여관 주인일세. 하지만 칼라스에서는 '평범하다'는 말도 의심을 사니까, 그냥 여관 주인이라 불러 주게.
npc.kalas.innkeeper.job.t: 여관을 하는 일이지. 지나는 손님과 마을 소식을 나누는 일. 요즘 화제라면 다들 필경사 니아를 말해. 참 착한 아인데. 그리고 닷새 뒤 재판이 열린다는 소문도 돌고 있네.
npc.kalas.innkeeper.trial.t: 재판 이야기가 나왔으니 말인데, 고발청이 감춘 옛 문서가 어딘가 보관되어 있다는 소문이 있네. 유력한 곳은 바로 그 옛 서고야. 하지만 그곳은 금지 구역이라, 들어가는 자는 반드시 고백하게 되어 있지.

npc.kalas.librarian.name: 늙은 사서
npc.kalas.librarian.greet: ……아, 이 좁은 곳까지 내려오는 사람이 또 있나. 반갑네. 만질 수 있는 책이 이제는 이것뿐이라서.
npc.kalas.librarian.name.t: 나는 예전 서고를 지키던 사서라네. 지금은 이 지하 방에 깊이 숨어 살지만, 책은 벽이 아니라 손에 쥐어지는 것이라네.
npc.kalas.librarian.pilgrim.t: 순례자의 이야기라면 그 편지를 보게. 삼백 년 전, 순례자가 이 마을에 남긴 편지야. 언젠가 누군가가 그 뜻을 이해하게 될 때를 위해 내가 간직해 왔네.
npc.kalas.librarian.job.t: 내 일은 아이들을 가르치고 기록을 지키는 것이었지. 그 도굴꾼들은 저마다 자기 사연을 대며 이 서고의 벽을 뚫고 들어오더군. 탐욕으로 무너지는 사람을 오래 보아와서, 이제 그 눈치를 단번에 알아채네.

# --- 단서 라벨과 힌트 ---
word.pilgrim.label: 순례자
word.pilgrim.hint: 삼백 년 전, 열석 사이로 들어와 여덟 미덕을 몸소 보인 이. 진실은 누구도 대신 써 줄 수 없다고 남겼다.
word.truth.label: 진실
word.truth.hint: 순례자가 남긴 한 줄. 칼라스의 장부가 무언가를 덮고 있다.
word.weapon.label: 무기
word.weapon.hint: 기록이 사람을 다치게 할 때, 그것은 더 이상 진실이 아니다.
word.lantern.label: 등불
word.lantern.hint: 광장의 등불이 꺼진 날 밤부터, 누군가의 이야기가 꺼지기 시작했다.
word.duty.label: 의무
word.duty.hint: 이 마을에서 고백은 의무다. 의심받지 않으려는 의무.
word.ledger.label: 장부
word.ledger.hint: 고발청의 두루마리. 이웃의 이름이 한 줄씩 늘어나는 곳.
word.silence.label: 침묵
word.silence.hint: 필경사가 마지막까지 지킨 것. 지키는 것이 때로는 무너지는 것이기에.
word.confession.label: 고백
word.confession.hint: 죄를 말하는 일이 아니라, 말하지 않은 것을 털어놓는 일.
word.trial.label: 재판
word.trial.hint: 닷새 뒤, 견습 필경사의 재판이 열린다.
fact.kalas.nia.label: 필경사 니아
fact.kalas.nia.hint: 고발청에서 사람들의 자백을 받아 적는 필경사. 지금은 그 자신이 고백을 기다리는 처지다.
fact.kalas.tobi.label: 니아의 동생 토비
fact.kalas.tobi.hint: 누나가 무엇을 지키려 하는지 아는 소년. 어느 지붕 위에서 잠들었던 밤을 기억한다.
fact.kalas.archive.label: 옛 서고
fact.kalas.archive.hint: 고발청이 봉인한 금지 구역. 들어가는 자는 고백해야 한다.
fact.song.lantern-song.label: 등불 노래
fact.song.lantern-song.hint: 아이들이 광장에서 부르는 노래. 가사에는 누군가의 이름이 빠져 있다.
fact.creature.wolf-hungry.label: 굶주린 늑대
fact.creature.wolf-hungry.hint: 늑대는 굶주렸을 뿐, 악하지 않다. 겁먹은 짐승은 화살보다 먼저 이해를 기다린다.
fact.creature.robber-greed.label: 도굴꾼
fact.creature.robber-greed.hint: 자기 사연을 대며 벽을 뚫고 들어온 자들. 탐욕이 그들의 걷는 길을 앞질렀다.
fact.kalas.lantern-shard.label: 연실이 감긴 등불 조각
fact.kalas.lantern-shard.hint: 광장 등불에서 떨어져 나온 조각. 누군가가 실에 감아 숨겨 두었다.
fact.kalas.brother-witness.label: 토비의 고백
fact.kalas.brother-witness.hint: 그날 밤 지붕에서 본 것. 아이가 처음으로 입을 열었다.
fact.kalas.pilgrim-letter.label: 순례자의 편지
fact.kalas.pilgrim-letter.hint: 사서가 간직해 온, 순례자가 이 마을에 남긴 편지.
fact.kalas.ledger-doubt.label: 장부에 대한 의심
fact.kalas.ledger-doubt.hint: 장부가 진실을 지킨다고 믿던 사람들이, 조금씩 틈을 보이기 시작한다.
fact.kalas.elin-forgiven.label: 니아의 용서
fact.kalas.elin-forgiven.hint: 필경사가 지킨 침묵을 마침내 푼 자리. 미움 대신 놓아 주는 일이었다.

# --- 추론 ---
deduction.honesty.sentence: 정직은 {1}을 {2}가 아니라 {3}(으)로 쓰는 것이다
deduction.honesty.hint: 칼라스 사람들은 정직을 기록으로 굳혔다. 순례자가 남긴 뜻은 그 반대쪽에 있다.

# --- 위기 ---
crisis.kalas.trial.text: 고발청 앞에 광장 사람들이 모였다. 닷새 동안 닫혀 있던 재판이 열린다. 고발관장이 두루마리를 펼치며 말한다. "이 필경사 니아는, 광장의 등불을 깨뜨리고도 신고하지 아니하였느니라. 자백이 이미 있으니 증언은 필요 없다." 관중이 술렁인다. 사람들 사이에서 누군가 그대를 바라본다. 이제 그대가 나설 차례다.
option.truth.label: 토비의 증언과 등불 조각을 꺼낸다
option.truth.text: 그대가 토비의 말과 연실에 감긴 등불 조각을 내민다. "이 조각을 숨긴 자는, 등불을 깬 자입니다." 토비가 지붕에서 본 것을 떨리는 목소리로 말한다. 사람들이 고발관장을 바라본다. 니아의 침묵은 마침내 해석되고, 장부는 진실을 담아 남는다.
option.lantern.label: 순례자의 편지를 읽는다
option.lantern.text: 그대가 순례자의 편지를 꺼내 읽는다. "진실은 무기로 기록하지 말고, 등불로 비추어라." 고발관장의 장부가 불 속으로 들어가고, 꺼져 있던 광장의 등불에 다시 불이 붙는다. 기록보다 먼저 진실이 선 자리. 그것이 칼라스의 새로운 시작이다.

