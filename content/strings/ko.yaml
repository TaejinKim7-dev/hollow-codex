fact.ring.honesty.label: 빛샘의 고리
fact.ring.honesty.hint: 칼라스 들판 한가운데, 마른 풀 사이로 오래된 노래가 스며 있다.
fact.ring.compassion.label: 온빛의 고리
fact.ring.compassion.hint: 북동 해안의 돌무더기 아래, 목동이 부르는 평온한 노래.
fact.ring.valor.label: 큰바람의 고리
fact.ring.valor.hint: 서쪽 숲 가장자리, 바람이 나뭇가지를 울리는 소리를 곁에 두고.
fact.ring.justice.label: 저울벽의 고리
fact.ring.justice.hint: 북부 고원의 평지, 지평선을 저울대처럼 가르는 노래.
fact.ring.sacrifice.label: 빈손의 고리
fact.ring.sacrifice.hint: 동쪽 해안 바위틈, 아무것도 쥐지 않은 손으로 부르는 노래.
fact.ring.honor.label: 높은봉의 고리
fact.ring.honor.hint: 강 건너 언덕, 봉우리에 오르면 나지막이 들리는 노래.
fact.ring.spirituality.label: 고요샘의 고리
fact.ring.spirituality.hint: 남서 습지, 샘물이 돌을 스치는 소리로 읊는 노래.
fact.ring.humility.label: 낮은꽃의 고리
fact.ring.humility.hint: 남쪽 평원, 풀잎 사이로 꽃잎이 떨어지는 노래.

# --- 연민의 마을 리오나 (M3 Task 33) ---
town.reona.name: 리오나
compassion.music.title: 리오나의 자선가

compassion.npc.almoner.name: 자선 관장
compassion.npc.almoner.greet: 리오나에 오신 것을 환영합니다. 이 마을에 굶는 사람은 없습니다. 줄을 서기만 하면 말입니다.
compassion.npc.almoner.name.t: 자선 관장입니다. 리오나에서는 이름보다 몫이 먼저 불리지요. 한 몫, 반 몫, 셋째 줄 둘째 몫, 그렇게 부릅니다.
compassion.npc.almoner.job.t: 제 일은 곳간을 지키고 배급을 정하는 것입니다. 누구에게 얼마를 줄지, 누가 아직 자격이 되는지를 정합니다. ……자선은 거두는 것으로 시작해 나누는 것으로 끝납니다.
compassion.npc.almoner.charity.t: 자선이란, 줄 수 있는 자가 줄 수 없는 자를 돌보는 질서입니다. 그 질서가 흔들리면 모두가 굶게 됩니다. 그러니 받는 이는 감사해야 하고, 주는 이는 계속 주어야 하지요.
compassion.npc.almoner.pantry.t: 예배당에서 그런 말을 들으셨습니까? 열린 곳간 말입니까. 옛날이야기일 뿐입니다. 누구나 들어가 마음껏 가져갔다니, 그런 무질서가 어디 있겠습니까. 우리는 질서 있게 나눕니다.
compassion.npc.almoner.tax.t: 의존 말씀이십니까. 세금을 낮추자는 문서라면 제가 막았습니다. 곳간이 바닥나는 해를 한 번 겪은 사람은 다시는 곳간을 비워 둘 수 없습니다. 주는 손이 끊기면, 받는 손은 갈 곳이 없습니다.
compassion.npc.almoner.hunger.t: 배고픔입니다. 저는 그것을 줄 맨 끝에서 배웠습니다. 그래서 지금도 마지막 사람이 몫을 받기 전에는 문을 닫지 않습니다.
compassion.npc.almoner.plaza.t: 광장의 줄은 곧고 조용합니다. 곧은 줄에서는 아무도 밀려나지 않지요. ……밀려나 본 사람만 그게 얼마나 귀한지 압니다.

compassion.npc.baker.name: 빵집 주인
compassion.npc.baker.greet: 빵 냄새를 맡고 오셨습니까? 미안하지만 오늘 몫은 아직 나오지 않았습니다.
compassion.npc.baker.name.t: 빵집 주인입니다. 아침마다 굽고, 저녁마다 관장의 곳간으로 보내지요.
compassion.npc.baker.job.t: 제 일은 빵을 굽는 겁니다. 구운 빵은 모두 곳간으로 가는데, 줄 앞에 나오는 건 절반뿐이지요. 나머지 절반이 어디로 가는지는 저도 모릅니다.
compassion.npc.baker.hunger.t: 배고픔은 소리가 없습니다. 골목 끝에서 조용히 줄어들다가, 어느 날 아예 사라지지요. 저는 그 소리 없는 줄어듦을 매일 봅니다.
compassion.npc.baker.beggar.t: 골목에 사는 이를 아십니까? 관장은 그를 게으른 손이라 부르지만, 저는 압니다. 그는 밤마다 빵 냄새를 맡으며 잠이 듭니다.
compassion.npc.baker.bakery.t: 밤에 굴뚝 연기 말씀이십니까? 반죽은 밤새 부풀어야 합니다. ……더는 묻지 말아 주십시오, 빵 냄새는 원래 골목으로 흘러가는 법입니다.
compassion.npc.baker.dependence.t: 곳간에 내는 몫이 해마다 늘었습니다. 그러다 보니 저희 집 아이도 이제 아침이면 줄에 섭니다. 빵 굽는 집 아이가 빵 받으러 줄을 서다니, 우습지요.

compassion.npc.child.name: 골목 아이 피리
compassion.npc.child.greet: 이방인이다! 리오나 사람은 다 빵 받으러 가는데, 넌 왜 안 가?
compassion.npc.child.name.t: 난 피리라고 불려. 진짜 이름은 있는데, 아무도 안 물어봐서 잊어버렸어.
compassion.npc.child.job.t: 내 일은 놀이! 근데 엄마가 일하러 가서, 요즘은 내가 아침마다 곳간 앞에 줄을 서. 문 위에 '나눔'이라고 크게 써 있는데, 난 아직 그 글자밖에 못 읽어.
compassion.npc.child.song.t: 떠돌이 아저씨 노래 알아? 다들 '손을 접으면 아무도 모른다'에서 끝내는데, 아저씨는 거기서 안 끝내고 더 불러. 난 그 뒷부분이 제일 좋아.
compassion.npc.child.gift.t: 할브 아저씨한테 빵 준 거? 그거 준 거 아니야. 옆에 앉아서 같이 먹은 거야, 혼자 먹기엔 반쪽도 너무 커.
compassion.npc.child.almoner.t: 관장 할아버지는 무서운 얼굴로 줄 맨 끝 사람만 봐. 근데 내가 마지막이면 꼭 내 빵을 두 번 세 봐.

compassion.npc.beggar.name: 거지 할브
compassion.npc.beggar.greet: ……죄송합니다, 지금은 아무것도 드릴 게 없습니다. 받기만 하는 몸이라서요.
compassion.npc.beggar.name.t: 이름은 오래전에 잃었습니다. 줄에서는 몫 번호로 불리지요. 할브는 피리가 붙여 준 이름인데, 무슨 뜻인지는 그 아이도 모른답니다.
compassion.npc.beggar.job.t: 제 일은 줄을 서는 것입니다. 아침에 곳간 앞에 서고, 저녁에 다시 서지요. 그 사이에 가끔, 줄 밖에서 무언가를 건네받는 날이 있습니다.
compassion.npc.beggar.gift.t: 피리가 제 빵을 반으로 쪼개 준 적이 있습니다. 선물이라 부르려다 그만두었지요. 그 아이는 주고 떠나지 않고, 제 옆에 앉아 남은 반쪽을 같이 먹었습니다.
compassion.npc.beggar.song.t: 떠돌이 노래꾼이 부르는 노래를 들으셨습니까? 나누는 손은 빈손이 아니라고 하지요. 저는 그 구절에서 자주 웁니다.
compassion.npc.beggar.hunger.t: 배고픔에는 익숙해지지 않습니다. 다만 조용해지지요. 저녁 줄에서 아는 얼굴이 하나씩 안 보이게 되는 것, 그게 더 견디기 어렵습니다.
compassion.npc.beggar.bakery.t: 골목 끝 돌 위에 가끔 따뜻한 빵이 놓여 있습니다. 누가 두고 가는지는 묻지 않습니다. 묻는 순간 그 빵에도 장부가 생길 테니 말입니다.

compassion.npc.priest.name: 예배당 사제 리엔
compassion.npc.priest.greet: 평온하시길. 이 예배당은 누구에게나 열려 있습니다. ……곳간은 그렇지 않지만요.
compassion.npc.priest.name.t: 리엔이라 합니다. 이 예배당을 지키는 사제지요. 리오나 사람들은 저를 기록하는 사제라 부릅니다.
compassion.npc.priest.job.t: 예전에는 돌아가신 어른들에게서 들은 옛 관습을 예배당 벽에 한 줄씩 적었습니다. 가장 오래된 줄은 '같은 상에 나란히 앉으라'는 말이지요. 관장님은 그 벽 앞을 지나실 때마다 걸음을 서두르십니다.
compassion.npc.priest.pantry.t: 나눔이라면 옛 기록이 말해 줍니다. 리오나의 곳간은 원래 문이 없었습니다. 배고픈 이가 들어가 마음껏 가져가도, 아무도 그를 나무라지 않았다고 합니다. 주는 것이 곧 함께 있는 일이었으니까요.
compassion.npc.priest.love.t: 사랑은 위에서 내려오지 않습니다. 사랑은 나란히 앉는 것입니다. 자선이 고개를 숙이게 한다면, 사랑은 고개를 나란히 맞춥니다.
compassion.npc.priest.chapel.t: 예배당 벽에는 어른들의 말이 한 줄씩 적혀 있습니다. 군데군데 긁혀 나간 줄이 있지요. 지운 손도 나쁜 뜻은 아니었을 겁니다만, 그 긁힌 자리가 늘 저를 봅니다.
compassion.npc.priest.charity.t: 자선은 귀한 일입니다. 다만 늘 한쪽이 고개를 숙여야 성립하지요. 이 예배당에서는 주는 이도 받는 이도 같은 의자에 앉게 합니다, 제가 지킬 수 있는 것은 그것뿐입니다.

compassion.npc.wanderer.name: 떠돌이 노래꾼 셀
compassion.npc.wanderer.greet: 먼 길을 걸어 여기까지 왔습니다. 이 마을은 노래가 멀리까지 들립니다. 다들 줄에 서서 말이 없으니 말입니다.
compassion.npc.wanderer.name.t: 이름은 셀이라 합니다. 마을마다 노래를 하나씩 두고 오는 떠돌이지요.
compassion.npc.wanderer.job.t: 제 일은 걷고 부르는 것입니다. 길에서 배운 노래를 다음 마을에 전하지요. 리오나에는 아직 못 다 부른 노래가 하나 있습니다.
compassion.npc.wanderer.song.t: 들어 보십시오. 나눔 위에 선물을 얹지 마라, 받는 손만 무거워진다. 사랑으로 곁에 앉아라, 빵 한 덩이가 둘을 먹인다. ……이 마을은 이 노래를 반쯤만 기억합니다.
compassion.npc.wanderer.sharing.t: 나눔은 좋은 일입니다. 다만 나눔만 남으면, 나누는 손과 받는 손이 영영 위아래로 갈리지요. 노래가 그 위에 무엇을 더 얹지 말라고 하는 것도 그래서입니다.
compassion.npc.wanderer.plaza.t: 광장에서 노래를 부르면 줄이 잠깐 흔들립니다. 누군가 고개를 돌렸다가, 자리를 뺏길까 봐 얼른 앞을 보지요. 그 잠깐을 보려고 여기서 부릅니다.
compassion.npc.wanderer.charity.t: 여러 마을을 다녀 봤지만, 자선이 이렇게 반듯한 곳은 처음입니다. 반듯한 것은 잘 부러지지 않지만, 잘 휘지도 않지요.

compassion.npc.miller.name: 방앗간 주인 마레
compassion.npc.miller.greet: 밀가루 냄새가 나는 곳입니다. 맷돌 소리가 시끄러워도 양해해 주십시오.
compassion.npc.miller.name.t: 마레라고 합니다. 이 방앗간에서 곡식을 갈아 온 지 삼십 년입니다.
compassion.npc.miller.job.t: 곡식을 가는 일이지요. 그런데 요즘은 가는 것보다 세는 일이 더 많습니다. 관장의 곳간에 몇 가마가 들어가는지, 누가 얼마를 내는지…….
compassion.npc.miller.tax.t: 관장님 말씀이십니까. 몇 해 전에 젊은 기록관이 세금을 낮추자고 했습니다. 곳간을 백성에게 열자는 말이었지요. 관장이 그걸 막았습니다. 주는 사람이 있어야 받는 사람도 있다는 이유였습니다. 그 뒤로 마을은 더 가난해졌습니다.
compassion.npc.miller.dependence.t: 일을 더 하면 몫이 줄어듭니다. 그래서 요즘 젊은이들은 방아를 반나절만 찧고 줄에 섭니다. 나무랄 수가 없지요, 셈이 그렇게 되어 있으니.
compassion.npc.miller.bakery.t: 빵집 말입니까. 곡식을 세다 보면 가루 한 됫박쯤은 셈에서 빠지기도 합니다, 제 눈이 침침해서요. 그 한 됫박이 어디로 가는지는 묻지 않으셨으면 합니다.

compassion.npc.seamstress.name: 바느질꾼 유나
compassion.npc.seamstress.greet: 천이 부족해서 옷은 못 지어 드려도, 이야기는 넉넉히 있지요.
compassion.npc.seamstress.name.t: 유나라고 합니다. 광장 동쪽 끝에서 바느질을 합니다.
compassion.npc.seamstress.job.t: 옷을 짓고 기웁니다. 광장 줄에 서는 사람들은 소매가 다 같은 자리에서 해집니다. 손을 내미는 자리입니다. 관장님 옷도 제가 지었는데, 그 소매 끝은 아직 새것입니다.
compassion.npc.seamstress.bakery.t: 빵집 말씀이십니까. 저 굴뚝은 밤에도 연기를 올립니다. 낮에 구운 빵은 곳간으로 가는데, 밤에 구운 빵이 어디로 가는지는 굴뚝만 알겠지요.
compassion.npc.seamstress.almoner.t: 관장님 옷자락 안쪽에 열쇠 주머니를 달아 드렸습니다. 곳간 열쇠 하나 넣었을 뿐인데 옷이 한쪽으로 기울었습니다. 그분은 늘 그쪽 어깨가 조금 처져 있습니다.
compassion.npc.seamstress.love.t: 사랑 말씀이십니까? 해진 옷을 기울 때 저는 천을 위에 덧대지 않고 옆에서 이어 붙입니다. 위에 덧대면 거기만 두꺼워져서 금방 또 터집니다.

compassion.npc.scribe.name: 기록관 테오
compassion.npc.scribe.greet: 기록관입니다. ……말씀을 남기시겠습니까, 아니면 물으시겠습니까?
compassion.npc.scribe.name.t: 테오라고 합니다. 이 마을의 기록을 맡고 있습니다.
compassion.npc.scribe.job.t: 장부와 문서를 정리합니다. 자선 배급 장부도 제가 씁니다. 숫자는 정직합니다만, 어느 칸에 적을지는 제 손이 정하지요.
compassion.npc.scribe.charity.t: 장부에서 자선은 늘 '내준 것' 칸에 적힙니다. 받은 사람 이름 옆에는 작은 점이 하나 찍히지요. 그 점이 찍히는 순간, 그 사람은 영영 갚아야 하는 몸이 됩니다.
compassion.npc.scribe.tax.t: 나눔을 말씀하시니 생각나는 문서가 있습니다. 세금 개혁 문서는 아직 제 서랍에 있습니다. 관장님은 태우라 하셨지만, 제 손으로 쓴 것을 제 손으로 태울 수는 없었습니다.
compassion.npc.scribe.dependence.t: 의존이라는 말은 장부에 없습니다. 다만 같은 이름이 해마다 같은 줄에 다시 적힐 뿐이지요. 그 줄이 길어지는 것을 보다 못해 몇 해 전 문서 하나를 썼는데, 지금은 제 서랍 속에 있습니다.
compassion.npc.scribe.almoner.t: 관장님은 장부를 거꾸로 읽으십니다. 맨 마지막 줄, 마지막 사람부터요. 왜 그렇게 읽으시냐고 여쭌 적은 없습니다.

compassion.npc.grandmother.name: 늙은 어머니 한나
compassion.npc.grandmother.greet: 어서 와. 앉아서 좀 쉬어. 여기 앉으면 곳간 앞 줄이 잘 보여.
compassion.npc.grandmother.name.t: 한나라고 불러. 이 마을에서 여든 해를 살았어.
compassion.npc.grandmother.job.t: 내 일은 이제 앉아 있는 것뿐이야. ……아니, 하나 더 있지. 어릴 적 노래를 기억하는 일이야.
compassion.npc.grandmother.song.t: 노래를 하나 들려주지. 손을 펴면 빵이 오고, 손을 접으면 아무도 모른다. 그런데 옛 가사는 달랐어, 손을 마주 잡으면 모두가 배부르다. ……빈 해가 지나고부터 다들 바꿔 불렀는데, 왜인지는 아무도 말하지 않았어.
compassion.npc.grandmother.love.t: 사랑이 뭐냐고? 밥상에 앉는 거야. 누가 먼저 먹든, 다 같이 앉아서 먹는 거. 그게 사랑이지. 위에서 내려주는 건 사랑이 아니라, 시혜야.
compassion.npc.grandmother.hunger.t: 빈 해를 알아? 곳간이 사흘 만에 바닥난 해야. 먼저 온 사람들이 다 가져갔고, 줄 끝에 선 아이들 중 몇은 봄을 못 봤어.
compassion.npc.grandmother.almoner.t: 관장? 그 애도 그해 줄 끝에 서 있었어, 동생 손을 꼭 잡고. ……봄에는 혼자였지. 그 애가 자라서 곳간에 문을 달았어.
compassion.npc.porter.name: 곳간 짐꾼 브람
compassion.npc.porter.greet: 비켜, 비켜. ……아니, 미안. 자루가 무거워서 그래.
compassion.npc.porter.name.t: 브람이야. 이름 물어본 사람은 오랜만이네. 다들 자루 몇 개 날랐냐고만 묻거든.
compassion.npc.porter.job.t: 빵이랑 곡식 자루를 곳간에 들이는 게 내 일이야. 이십 년째 들이기만 했어. 내가 이 문으로 뭘 내간 건 손에 꼽아.
compassion.npc.porter.hunger.t: 안쪽 방에 곡식 자루랑 말린 빵이 천장까지 쌓여 있어. 자루마다 해가 적혀 있는데, 맨 밑에 깔린 건 벌레가 먼저 먹었어. 밖에선 배곯는 소리가 나고, 안에선 바구미 기어다니는 소리가 나.
compassion.npc.porter.almoner.t: 관장님은 밤마다 등잔 들고 안쪽 방에 혼자 들어가. 자루를 세는 것 같은데, 소리 내서 세진 않아. 한 번은 나오면서 아직 모자라, 그러시더라.
compassion.npc.painter.name: 현판 칠장이 오센
compassion.npc.painter.greet: 물감 냄새가 나도 참아 주게. 봄마다 곳간 현판을 새로 칠하는 철이라네.
compassion.npc.painter.name.t: 오센일세. 남의 글자는 평생 칠했는데, 내 이름은 어디에도 칠해 본 적이 없군.
compassion.npc.painter.job.t: 간판이며 현판이며, 글자를 칠하는 게 내 일일세. 그중 곳간 문 위 현판이 제일 공이 들지. 관장님이 해마다 조금 더 밝게 칠해 달라고 하시니 말일세.
compassion.npc.painter.sharing.t: 현판의 그 글자 말인가. 칠을 벗겨 보면 벽에 옛 못 자국이 있네. 지금보다 한 뼘 높은 데, 문틀도 없던 자리에 박혀 있던 자국일세.
compassion.npc.painter.almoner.t: 곳간 돌벽은 백 년이 넘었는데, 문 경첩은 마흔 해쯤 됐을 걸세. 쇠가 아직 덜 늙었다네. 관장님이 관장이 되던 해와 얼추 맞지.
compassion.npc.linesitter.name: 줄꾼 다라
compassion.npc.linesitter.greet: 자리 맡아 드릴까요? 반나절에 빵 한 귀퉁이면 돼요.
compassion.npc.linesitter.name.t: 다라예요. 줄에서는 대신 서는 애로 더 잘 통하지만요.
compassion.npc.linesitter.job.t: 일하러 가야 하는 사람들 대신 줄을 서 줘요. 몫이 나오면 갖다주고, 수고비로 한 귀퉁이를 떼어 받고요. 줄이 길수록 제 배가 불러요, 부끄럽지만 사실이에요.
compassion.npc.linesitter.charity.t: 자선 덕에 먹고살아요. 관장님이 없으면 줄도 없고, 줄이 없으면 저도 없죠. 그러니까 저는 관장님 편이에요, 아마도요.
compassion.npc.linesitter.plaza.t: 광장 돌바닥에는 사람마다 서는 자리가 닳아 있어요. 저는 남의 자리에만 서서 제 자리가 없고요. 가끔은 그게 좀 서운해요.
compassion.npc.laundress.name: 빨래꾼 노라
compassion.npc.laundress.greet: 젖은 손이라 미안해요. 해 지기 전에 이걸 다 헹궈야 해서요.
compassion.npc.laundress.name.t: 노라예요, 피리 엄마고요. 요즘은 그 애를 이름 대신 몫 번호로 부르는 게 버릇이 됐어요. 그러면 안 되는데요.
compassion.npc.laundress.job.t: 남의 빨래를 해요. 그런데 품삯을 받으면 제 몫이 반으로 깎여요. 그래서 일을 줄이고, 그 애를 줄에 세워요.
compassion.npc.laundress.dependence.t: 일할수록 가난해지는 셈이 있어요. 처음엔 이상하다고 생각했는데, 이제는 그 셈에 맞춰 살아요. 이상하다는 생각도 닳더라고요.
compassion.npc.laundress.gift.t: 그 애가 받아 온 몫이 반쪽인 날이 있어요. 덜 받았냐고 물으면 웃기만 하고요. 누구랑 먹었는지는 알 것 같아서, 저도 더 묻지 않아요.
compassion.npc.watercarrier.name: 물지기 투르
compassion.npc.watercarrier.greet: 새벽 물은 차갑소. 그래도 줄 선 사람들 목은 축여야 하지 않겠소.
compassion.npc.watercarrier.name.t: 투르라 하오. 이 광장에서 내 이름을 아는 건 물동이뿐일 거요.
compassion.npc.watercarrier.job.t: 새벽마다 우물에서 물을 길어 줄 선 사람들에게 한 모금씩 돌리오. 물은 장부에 안 적히니, 이 마을에서 마음 놓고 줄 수 있는 건 이것뿐이오.
compassion.npc.watercarrier.hunger.t: 한 바가지씩 돌리다 보면 머릿수를 저절로 세게 되오. 어제 물을 받던 손이 오늘 없으면, 그 자리 돌바닥은 한동안 젖지 않은 채로 남소.
compassion.npc.watercarrier.wanderer.t: 그 노래꾼이 부를 때면 나도 모르게 물동이를 내려놓게 되오. 노래 끝자락이 어릴 적 우리 어머니가 부르던 것과 닮았소. 그 뒷소절은 나도 잊었지만.

# --- 리오나 단서 ---
compassion.word.sharing.label: 나눔
compassion.word.sharing.hint: 곳간 문 위 현판에 새겨진 말. 좋은 말이지만, 이 마을에서는 주는 쪽과 받는 쪽을 가르는 말이 되었다.
compassion.word.gift.label: 선물
compassion.word.gift.hint: 배급보다 따뜻하지만, 여전히 한 손이 주고 한 손이 받는다. 거지가 아이의 반쪽 빵을 처음 부르려던 이름.
compassion.word.love.label: 사랑
compassion.word.love.hint: 연민의 참된 원리. 위에서 내려주는 시혜가 아니라, 나란히 앉아 함께 먹는 일.
compassion.word.charity.label: 자선
compassion.word.charity.hint: 이 마을이 질서라 부르는 것. 주는 자와 받는 자를 굳게 나눈다.
compassion.word.dependence.label: 의존
compassion.word.dependence.hint: 자선이 만들어 낸 관계. 받는 이는 감사해야 하고, 영영 갚아야 한다.
compassion.word.hunger.label: 굶주림
compassion.word.hunger.hint: 소리 없이 줄어들다 사라지는 것. 골목 끝에서 아무도 모르게.
compassion.fact.reona.almoner.label: 자선 관장
compassion.fact.reona.almoner.hint: 리오나의 곳간을 지키고 배급을 정하는 관리. 자선이 질서라 믿는다.
compassion.fact.reona.baker.label: 빵집 주인
compassion.fact.reona.baker.hint: 구운 빵을 모두 곳간으로 보내는 사람. 줄 앞에 나오는 것은 그 절반뿐이다.
compassion.fact.reona.wanderer.label: 떠돌이 노래꾼
compassion.fact.reona.wanderer.hint: 마을마다 노래를 하나씩 두고 오는 나그네. 리오나에는 못 다 부른 노래가 있다.
compassion.fact.reona.bakery.label: 리오나 빵집
compassion.fact.reona.bakery.hint: 밤에도 굴뚝에서 연기가 나는 곳. 낮에 구운 빵은 곳간으로 가지만, 밤에 구운 빵은 어느 장부에도 없다.
compassion.fact.reona.plaza.label: 광장
compassion.fact.reona.plaza.hint: 곳간 앞에 사람들이 줄을 서는 곳. 아침마다 같은 자리에 같은 그림자가 선다.
compassion.fact.reona.chapel.label: 예배당
compassion.fact.reona.chapel.hint: 옛 관습을 적은 기록이 남아 있는 곳. 곳간에는 원래 문이 없었다고 적혀 있다.
compassion.fact.reona.song.label: 떠돌이의 노래
compassion.fact.reona.song.hint: "리오나의 오래된 노래. 연민은 위에서 내려 주는 것이 아니라 곁에 함께 있는 것이라고 노래한다. 사람들은 이 노래를 반쯤만 안다."
compassion.fact.reona.open-pantry.label: 열린 곳간의 옛 관습
compassion.fact.reona.open-pantry.hint: 리오나의 곳간에는 원래 문이 없었다. 배고픈 이가 들어가 가져가도 나무라지 않았다.
compassion.fact.reona.relief-tax.label: 실패한 세금 개혁
compassion.fact.reona.relief-tax.hint: 곳간을 백성에게 열고 세금을 낮추려던 시도. 관장이 막았고, 마을은 더 가난해졌다.
compassion.fact.creature.compassion-beggar.label: 굶주린 거지
compassion.fact.creature.compassion-beggar.hint: 악하지 않다. 굶주렸을 뿐이다. 그의 손은 게으르지 않고, 다만 빈손일 뿐이다.

# --- 리오나 추론·위기 ---
compassion.deduction.compassion.sentence: 연민은 {1} 위에 {2}을(를) 얹는 것이 아니라 {3}(으)로 함께하는 것이다
compassion.deduction.compassion.hint: 이 마을의 좋은 말들은 모두 한 손을 다른 손 위에 둔다. 노래의 마지막 소절만이 손을 옆에 둔다.
compassion.crisis.hoard.text: 곳간 앞에 사람들이 모였다. 자선 관장이 빵을 나누기 시작하는데, 줄 끝에서 한 아이가 넘어져도 아무도 손을 내밀지 않는다. 관장이 말한다. 질서가 흐트러지면 아무도 받지 못합니다, 줄을 서십시오. 그때 광장 저편에서 떠돌이의 노래가 들린다. 이제 그대가 나설 차례다.
compassion.option.open-pantry.label: 곳간의 문을 열어 모두 함께 나누게 한다
compassion.option.open-pantry.text: 그대가 떠돌이의 노래를 따라 부르고, 예배당 벽의 옛 줄을 소리 내어 읽는다. 곳간에는 원래 문이 없었다. 관장의 곳간 문이 열리고, 사람들이 서로 빵을 나눠 든다. 주는 자와 받는 자의 자리가 사라진 광장에서 모두가 배부르다. 연민은 나눔 위에 선물을 얹는 것이 아니라 사랑으로 함께하는 것임을 마을이 알았다.
compassion.option.relief-tax.label: 세금 개혁 문서를 공개한다
compassion.option.relief-tax.text: 그대가 기록관의 서랍에서 세금 개혁 문서를 꺼내 공개한다. 곳간을 백성에게 돌리고 세금을 낮추자는 오래된 약속. 관장은 고개를 떨군다. 마을은 스스로를 먹이는 법을 다시 배운다. 시혜가 끝난 자리에서 사람들은 서로의 이름을 부르기 시작했다.

# --- 리오나 능력·생물 ---
compassion.ability.persuade.name: 공감으로 풀어주기
compassion.creature.beggar.name: 굶주린 거지

# --- 용맹의 마을 솔강 (M3 Task 34) ---
town.solgang.name: 솔강
valor.music.title: 솔강의 결투가

valor.npc.champion.name: 무패의 투사
valor.npc.champion.greet: 나는 이 투기장에서 진 적이 없다. 도전자가 오면 맞설 뿐, 물러서지 않는다.
valor.npc.champion.name.t: 이름은 필요 없다. 투사들이 붙여 준 무패면 충분하다. 이 모래 위에서는 서 있는 동안만 이름이 있다.
valor.npc.champion.job.t: 내 일은 서는 것이다. 도전자가 오면 맞서고, 쓰러질 때까지 발을 떼지 않는다. 그것이 이 마을의 용맹이다.
valor.npc.champion.battle.t: 싸움은 발을 떼지 않는 것에서 시작한다. 한 발 물러서면 전부 무너진다. ……그렇게 배웠다.
valor.npc.champion.arena.t: 이 투기장의 모래는 쓰러진 자의 이름을 덮는다. 관중은 선 자의 이름만 외치고, 그것을 용기라 부르지.
valor.npc.champion.retreat-law.t: 후퇴 말인가. 후퇴를 허하는 법이라니. 그런 법은 솔강에 있어 본 적이 없다. 겁쟁이들이 제 등을 가리려고 지어낸 말이지.
valor.npc.champion.brother.t: 전우는 두지 않는다. 오래전 한 번, 누군가의 등에 업혀 물가를 빠져나온 적이 있다. 그 뒤로는 누구에게도 등을 맡기지 않는다.
valor.npc.champion.shield.t: 방패는 들지 않는다. 창 하나와 두 발이면 된다. ……방패를 들면, 언젠가 돌아설 핑계가 생긴다.
valor.npc.champion.battle-hymn.t: 용기라면 그 노래의 앞소절이면 충분하다. 앞에 적이 있고 뒤에 고향이 있으니, 서는 수밖에 없다. 그 뒤는 부르지 않는 편이 낫다.

valor.npc.sergeant.name: 훈련관 하르
valor.npc.sergeant.greet: 허리에 칼을 찼군. 그런데 발은 벌써 뒤로 빠져 있지. 여기서는 그 자세부터 고친다.
valor.npc.sergeant.name.t: 훈련관 하르다. 새로 온 이들은 첫날에 물러서는 법부터 잊게 만든다.
valor.npc.sergeant.job.t: 내 일은 병영을 돌보고 젊은이를 세우는 것이다. ……요즘은 세운 만큼 묻는 일이 많아졌지만.
valor.npc.sergeant.brother.t: 전우란 같은 줄에 서서 함께 버티는 사이다. 버틴 자가 사라지면, 남은 자가 그 이름을 부른다.
valor.npc.sergeant.barracks.t: 병영에는 빈 자리가 늘고 있다. 갑옷은 걸이에 그대로인데, 전투에서 돌아와 그것을 다시 입을 이가 없다.
valor.npc.sergeant.retreat.t: 병영 문 안에서는 나가는 녀석들 귀에 대고 살아서 오라고 한다. 문을 나서면 물러서지 말라는 말밖에 할 수 없다. ……둘 중 어느 쪽이 내 말인지는 묻지 마라.
valor.npc.sergeant.champion.t: 그 녀석은 내가 처음으로 세운 아이다. 열일곱에 병영에 들어와 첫날부터 뒤꿈치를 땅에 박았지. 그때 나는 그게 용기인 줄 알았다.
valor.npc.sergeant.retreat-law.t: 용기를 말하려면 그 법부터 알아야 하지. 병영 밖에서 꺼낼 얘기가 아니다. 나도 그 법을 외우며 컸고, 그 법대로 명령을 내린 적도 있다. 그래서 더 입에 올릴 수 없다.

valor.npc.smith.name: 대장장이 브란
valor.npc.smith.greet: 칼을 갈러 왔나, 방패를 고치러 왔나. 요즘 이 대장간에서는 칼 가는 소리만 나네.
valor.npc.smith.name.t: 브란일세. 이 대장간에서 쇠를 두드린 지 사십 년이네.
valor.npc.smith.job.t: 칼도 벼리고 방패도 짜네. 그런데 방패 주문은 해마다 줄고 있지. 다들 앞만 보고 서겠다니, 등 뒤를 지켜 줄 물건은 쓸모없다는 게지.
valor.npc.smith.shield.t: 방패는 버티라고만 드는 물건이 아닐세. 돌아설 때 등에 메면, 그게 사람을 집까지 데려다주지. 그래서 요즘 젊은 것들은 방패를 겁쟁이의 짐이라 부르네.
valor.npc.smith.forge.t: 이 용광로는 사십 년 동안 꺼진 적이 없네. 예전엔 방패 테두리를 두르느라 밤을 새웠지. 요즘 밤을 새우게 하는 건 창날과, 이름 돌에 박을 쇠못뿐일세.
valor.npc.smith.champion.t: 그 사람 창은 내가 벼렸네, 날을 세 번 갈아 줬지. 방패는 한 번도 맡긴 적이 없네. ……애초에 가져올 방패가 없는 게지.

valor.npc.brewer.name: 주막 주인 오렌
valor.npc.brewer.greet: 자네 왔나, 앉게. 선반에 엎어 둔 잔은 건드리지 말고. 주인들이 아직 안 돌아왔거든.
valor.npc.brewer.name.t: 오렌이라 하네. 이 주막을 삼십 년째 지키고 있지.
valor.npc.brewer.job.t: 술을 빚고 잔을 채우는 일이지. 예전엔 전우끼리 한 잔을 돌려 마시고 나갔네. ……지금은 이긴 사람보다 살아 돌아온 사람에게 더 따라 주고 싶네.
valor.npc.brewer.brother.t: 전우나 형제나 다를 게 없네. 한 잔을 나눠 마신 사이지. 요즘 병영 젊은이들은 그 잔을 나눌 겨를도 없이 나가 버리네.
valor.npc.brewer.barracks.t: 지난해 병영 젊은이 열둘이 나가기 전날, 여기서 잔을 하나씩 엎어 두고 갔네. 돌아와서 다시 세운 잔은 셋뿐일세. 나머지 아홉 개는 아직 저 선반에 있지.
valor.npc.brewer.veteran.t: 켈 영감은 저녁마다 저 구석에서 잔 하나를 앞에 두고 노래를 흥얼거리네. 늘 같은 데서 멈추지. 그러고는 잔을 비우고 나가네.

valor.npc.child.name: 광장 아이 루피
valor.npc.child.greet: 너도 투사야? 무패 아저씨처럼 될 거야? 나는 아직 칼이 무거워서 못 드는데.
valor.npc.child.name.t: 난 루피라고 해. 광장에서 제일 빨리 달려.
valor.npc.child.job.t: 내 일은 투기장 담장에 매달려 구경하는 거야. 끝까지 안 물러서면 다들 용기 있다고 손뼉을 쳐. ……근데 요즘 도전하는 형들은 아무도 못 이겨, 다 쓰러져.
valor.npc.child.champion.t: 무패 아저씨는 한 번도 안 졌대. ……그런데 아저씨 친구들은 다 어디 갔지? 나는 그게 궁금해.
valor.npc.child.retreat.t: 후퇴가 뭐야? 술래잡기에서 도망가는 거? ……엄마가 그 말은 밖에서 하지 말래.
valor.npc.child.battle-hymn.t: 용기? 그 노래 나도 알아! 앞에 적이 있고, 뒤에 고향이 있고…… 근데 거기서 다들 입을 다물어. 끝은 아무도 안 가르쳐 줘.

valor.npc.veteran.name: 노병 켈
valor.npc.veteran.greet: 허리 굽은 늙은이일세. 요즘은 싸우는 것보다 지나간 노래를 기억하는 게 내 일이지.
valor.npc.veteran.name.t: 켈이라고 부르게. 한때는 이 마을에서 창을 들던 사람일세.
valor.npc.veteran.job.t: 지금은 노래를 기억하고 옮기는 일을 하네. 옛 병사들이 행군하며 부르던 노래가 하나 있는데, 이 마을에서는 반절만 남았지.
valor.npc.veteran.retreat.t: 후퇴라…… 여기서는 도망이라 부르지. 하지만 옛 노래는 달리 불렀네. 한 발 물러나 다친 전우를 데리고 돌아오는 것도 용기라고.
valor.npc.veteran.champion.t: 열여섯이던 그 아이를 여울목에서 업고 나온 게 나일세. 그 뒤로 그 아이는 한 번도 뒤를 돌아보지 않았네. ……내 허리가 굽은 것도 그날부터지.
valor.npc.veteran.shield.t: 노래 앞소절에도 방패가 나오네. 앞에 적이 있고 뒤에 고향이 있다면 방패를 들라고. ……그다음에 그 방패를 어쩌라고 했는지, 영 떠오르지 않는군.

valor.npc.scout.name: 정찰병 사이
valor.npc.scout.greet: 이방인? 마을 밖에서 뭘 봤어? ……요즘은 나가는 길보다 돌아오는 길이 무서워.
valor.npc.scout.name.t: 정찰병 사이야. 성벽 밖을 살피는 일을 해.
valor.npc.scout.job.t: 길을 돌며 산적과 짐승을 살피고, 본 것을 병영에 알려. ……그런데 요즘은 우리 젊은이들 시신을 더 자주 만나. 상처가 전부 가슴에만 있어, 물러설 길이 있었는데도.
valor.npc.scout.duelist.t: 골목의 떠돌이 결투가를 봤어. 그자는 이기려고 싸우지 않아, 살아남는 법을 보여 주려고 싸우지. ……이 마을은 그걸 배우려 하질 않아.
valor.npc.scout.retreat.t: 정찰병은 보고 물러나는 게 일이야. 그래서 병영에서는 나를 반쯤 겁쟁이로 봐. ……그 겁쟁이 덕에 다들 어디로 가면 안 되는지 아는 건데.
valor.npc.scout.blood.t: 길에 남은 핏자국은 늘 바깥쪽을 향해 있어. 집 쪽으로 이어진 핏자국을 본 지가 오래야.

valor.npc.healer.name: 치료사 아샤
valor.npc.healer.greet: 다친 데가 있으면 보여 주십시오. ……겉은 멀쩡하시군요. 이 마을에서는 드문 일입니다.
valor.npc.healer.name.t: 아샤라고 합니다. 치료소에서 상처를 꿰매고 뼈를 맞춥니다.
valor.npc.healer.job.t: 상처를 꿰맵니다. 이 마을은 등에 난 상처를 가장 부끄러운 상처라 가르치지만, 저는 그 상처가 제일 반갑습니다. 요즘 등에 피를 묻혀 오는 이는 동쪽 골목에서 떠돌이 결투가를 만난 젊은이들뿐입니다.
valor.npc.healer.blood.t: 피는 거짓말을 못 합니다. 등에서 흐른 피는 돌아서 뛰었다는 뜻이고, 집에 기다리는 사람이 있었다는 뜻입니다. 그 결투가는 사람을 쓰러뜨리지 않고 돌려보낸다고 들었습니다.
valor.npc.healer.champion.t: 그분은 이 치료소에 온 적이 없습니다. 상처가 없어서가 아니라, 보여 주지 않으시는 겁니다. 왼쪽 다리를 조금 끄시는데, 아주 오래된 상처 같습니다.
valor.npc.healer.brother.t: 예전에는 업혀 온 사람과 업고 온 사람을 나란히 눕혀 꿰맸다고 합니다. 저는 아직 그런 두 사람을 한 번도 본 적이 없습니다.

valor.npc.standard.name: 기수 다인
valor.npc.standard.greet: 이 깃발은 앞으로 나아갈 때만 듭니다. ……뒤로 갈 때는 들 이유가 없다고들 하지요.
valor.npc.standard.name.t: 기수 다인이라 합니다. 이 깃발을 투기장에 세우는 사람입니다.
valor.npc.standard.job.t: 저는 투기장에 깃발을 세우고, 투사가 쓰러지면 그 위에 덮습니다. 깃발 접는 법은 훈련관 하르께 배웠지요. ……언젠가는 살아 돌아온 이에게 이 깃발을 돌려주고 싶습니다.
valor.npc.standard.courage.t: 제 앞의 기수께서는, 용기란 깃발을 앞세워 돌진하는 것이 아니라고 하셨습니다. 전투가 끝난 뒤 깃발을 지켜 집으로 가져오는 것이라고 하셨습니다.
valor.npc.standard.retreat.t: 옛 기수들은 물러날 때 오히려 깃발을 더 높이 들었다고 합니다. 흩어진 이들이 그 깃발을 보고 돌아올 길을 찾았다고 합니다. 지금은 물러날 때 들 이유가 없다고들 하지만.
valor.npc.standard.arena.t: 투기장 모래에 깃대를 꽂는 구멍이 해마다 깊어집니다. 같은 자리에 같은 깃발을 너무 자주 꽂았습니다.

valor.npc.widow.name: 과부 렌
valor.npc.widow.greet: ……남편 이야기를 하러 오셨습니까, 아니면 그저 지나가는 길입니까.
valor.npc.widow.name.t: 렌이라고 합니다. 이 마을에서 남편을 잃은 사람입니다.
valor.npc.widow.job.t: 예전에는 옷을 지었습니다. 지금은 남편이 끝내 지킨 약속, 한 발도 물러서지 않겠다는 약속을 기억하며 삽니다. ……한때는 물러나도 되는 법이 있었다는데 말입니다.
valor.npc.widow.retreat-law.t: 후퇴라면, 시아버님 때까지는 있던 법입니다. 다친 전우를 업고 돌아온 사람을 겁쟁이라 부르지 않는다는 법이요. 그 법이 지워진 뒤로 남편은 방패를 집에 두고 나갔고, 그 방패는 아직 문 옆에 걸려 있습니다.
valor.npc.widow.shield.t: 남편 방패는 제가 날마다 닦습니다. 손잡이 가죽이 아직 새것입니다. 한 번도 들려 나가 본 적이 없으니까요.
valor.npc.widow.brother.t: 지난해 돌아온 셋 가운데 한 사람이 남편과 같은 줄에 섰습니다. 그 사람은 아직 제 눈을 못 봅니다. 저는 탓하지 않습니다, 살아와 준 것이 고마울 뿐입니다.
valor.npc.plasterer.name: 미장이 토반
valor.npc.plasterer.greet: 아, 손님이세요? 여기 벽은 만지지 마세요, 회가 아직 덜 말랐어요. ……스물다섯 해째 덜 말라요.
valor.npc.plasterer.name.t: 토반이에요. 솔강의 벽은 거의 다 제가 발랐어요. 이 병영 안벽은 제가 처음 맡은 일이었고요.
valor.npc.plasterer.job.t: 회를 바르는 일이에요. 그런데 이 벽 한 군데만은 해마다 다시 발라요. 비가 오고 나면 회 밑에서 무슨 줄 같은 게 비쳐 나오거든요.
valor.npc.plasterer.barracks.t: 처음 덮을 때 거기 글자가 새겨져 있었어요. 저는 글을 몰라서, 덮으라는 대로 덮었어요. ……그때는 글을 모르는 게 다행인 줄 알았어요.
valor.npc.plasterer.sergeant.t: 훈련관님은 그 자리 앞에서만 걸음이 느려지세요. 신병이 나갈 때면 꼭 그 벽 앞에 세워 놓고 뭐라고 속삭이시고요.
valor.npc.oldwoman.name: 아랫마을 노파 우나
valor.npc.oldwoman.greet: 이방인이구먼. 강 냄새가 나네, 여울목 쪽으로 왔어? ……거긴 이제 돌밖에 없을 텐데.
valor.npc.oldwoman.name.t: 우나라고 해. 원래는 강가 아랫마을에 살았어. 그 마을이 없어지고 여기 올라와 산 지 스물다섯 해야.
valor.npc.oldwoman.job.t: 하는 일? 볕 좋은 날 여기 앉아 있는 거지. 투기장에서 함성이 나면 세어 봐, 몇 번 외치고 몇 번 조용해지는지.
valor.npc.oldwoman.retreat.t: 아랫마을이 타던 밤, 여울목을 지키던 애들이 다친 애들을 업고 물러났어. 그새 불이 강을 건너왔지. ……그 애들 탓이 아니야, 막을 사람이 너무 적었을 뿐이지.
valor.npc.oldwoman.champion.t: 그날 밤 업혀 올라온 애들 중에 하나가 지금 저 투기장 한가운데 서 있어. 그 애는 그 뒤로 우리 늙은이들 얼굴을 똑바로 못 봐. 우린 원망한 적이 없는데.
valor.npc.bookie.name: 내기꾼 고스
valor.npc.bookie.greet: 한 판 거실래요? 무패가 이기는 데 거는 건 안 받아요. 도전자가 몇 숨이나 버티는지에 거는 거예요.
valor.npc.bookie.name.t: 고스예요. 투기장 담 밖에서 판을 벌인 지 십 년 됐어요. 담 안에는 못 들어가요, 장사꾼이라서요.
valor.npc.bookie.job.t: 내기를 받고 돈을 나눠요. 판돈 한 몫은 꼭 떼어서 쓰러진 사람들 집에 보내고요. ……그래야 제가 이 장사를 해도 될 것 같아서요.
valor.npc.bookie.arena.t: 사람들이 제일 많이 거는 숫자가 해마다 올라가요. 도전자들이 더 오래 버티거든요. 오래 버틸수록 더 크게 다쳐서 나오고요.
valor.npc.bookie.blood.t: 누구 피가 먼저 모래에 떨어지나에 걸겠다는 사람도 있어요. 그건 안 받아요. 저한테도 지키는 선은 있어요.
valor.npc.recruit.name: 신병 탄
valor.npc.recruit.greet: 실례합니다, 지금 자세 연습 중입니다! 발을 떼면 처음부터 다시 서야 합니다.
valor.npc.recruit.name.t: 탄입니다. 열일곱이고, 병영에 들어온 지 석 달 되었습니다. 다음 달에 투기장에 섭니다.
valor.npc.recruit.job.t: 버티는 것이 제 일입니다. 발바닥이 다 터져도 뒤꿈치를 땅에서 떼지 않는 것입니다. ……밤에는 다리가 떨려서 잠이 안 옵니다.
valor.npc.recruit.champion.t: 저분처럼 되는 것이 병영 모두의 꿈입니다. ……솔직히 말씀드리면, 저는 저분이 웃는 걸 한 번도 못 봤습니다.
valor.npc.recruit.shield.t: 어머니가 방패를 하나 맞춰 주시겠다고 했는데, 거절했습니다. 동기들이 웃을 테니까요. ……그래도 어머니가 대장간 앞을 서성이시는 걸 봤습니다.
valor.npc.carver.name: 석수 도윈
valor.npc.carver.greet: 지나가는 길이오? 이 돌들은 밟지 마시오. 하나하나에 이름이 있소.
valor.npc.carver.name.t: 도윈이라 하오. 돌에 이름을 새기는 일로 늙었소.
valor.npc.carver.job.t: 투기장 모래는 쓰러진 이의 이름을 덮지만, 나는 그 이름을 돌에 새기오. 아무도 소리 내어 부르지 않으니, 돌이라도 기억해야 하지 않겠소.
valor.npc.carver.barracks.t: 지난해에만 아홉 개를 새겼소. 병영에서 같은 날 나간 이름들이라 나란히 세워 두었다오. 같은 줄에 섰던 사람들이니.
valor.npc.carver.brother.t: 옛 돌 가운데는 한 돌에 이름 둘을 새긴 것이 있소. 서로를 끌고 오다 함께 쓰러진 전우들이라오. 요즘 돌에는 이름이 하나씩뿐이오.

# --- 솔강 단서 ---
valor.word.courage.label: 용기
valor.word.courage.hint: 노래의 마지막 소절이 이 낱말을 부른다.
valor.word.retreat.label: 후퇴
valor.word.retreat.hint: 옛 법과 옛 노래가 이 낱말을 다르게 부른다.
valor.word.shield.label: 방패
valor.word.shield.hint: 돌아온 자가 다시 드는 것.
valor.word.battle.label: 전투
valor.word.battle.hint: 무패의 투사가 평생을 바친 것. 그는 그 첫걸음이 버티는 데 있다고 배웠다.
valor.word.blood.label: 피
valor.word.blood.hint: 등에 난 상처에서도 흐르는 것. 치료사가 가장 반가워하는 흔적.
valor.word.brother.label: 전우
valor.word.brother.hint: 같은 줄에 서서 버티는 사이. 잔을 나누는 사이라지만, 지금은 잔을 나눌 이가 없다.
valor.fact.solgang.champion.label: 무패의 투사
valor.fact.solgang.champion.hint: 투기장에서 진 적 없는 사내. 도전자가 쓰러져도 물러서지 말라고 외친다.
valor.fact.solgang.sergeant.label: 훈련관 하르
valor.fact.solgang.sergeant.hint: 병영을 돌보며 젊은이를 세우는 사람. 문 밖에서는 하지 못하는 말을 안다.
valor.fact.solgang.veteran.label: 노병 켈
valor.fact.solgang.veteran.hint: 옛 군가를 반절만 기억하는 늙은 병사. 마지막 소절을 잃어버렸다.
valor.fact.solgang.smith.label: 대장장이 브란
valor.fact.solgang.smith.hint: "칼과 갑주를 만드는 사람. 요즘은 몸을 가리는 물건 주문이 줄었다고 한다."
valor.fact.solgang.arena.label: 솔강 투기장
valor.fact.solgang.arena.hint: 쓰러진 자의 이름은 지우고 선 자의 이름만 남기는 모래바닥.
valor.fact.solgang.barracks.label: 병영
valor.fact.solgang.barracks.hint: "갑옷은 그대로인데 채울 이가 줄어드는 곳. 지난해 열둘 중 세 명만 돌아왔다."
valor.fact.solgang.forge.label: 대장간
valor.fact.solgang.forge.hint: 꺼지지 않는 용광로. 무엇을 벼리는지가 해마다 달라진다.
valor.fact.solgang.battle-hymn.label: 옛 행군가
valor.fact.solgang.battle-hymn.hint: 솔강 병사들이 행군하며 부르던 오래된 노래. 앞소절은 앞의 적을, 뒷소절은 뒤의 고향을 노래한다. 그런데 끝 소절은 이제 아무도 부르지 않는다.
valor.fact.solgang.retreat-law.label: 사라진 후퇴법
valor.fact.solgang.retreat-law.hint: 다친 전우를 데리고 돌아온 자를 겁쟁이라 부르지 않는다는 옛 법. 어느새 사라졌다.
valor.fact.creature.valor-duelist.label: 떠돌이 결투가
valor.fact.creature.valor-duelist.hint: 악하지 않다. 이기려 싸우지 않고, 살아 돌아오는 법을 보여 주려는 자.

# --- 솔강 추론·위기 ---
valor.deduction.valor.sentence: 참된 {1}는 끝까지 버티는 데 있지 않고, {2}해 살아 돌아와 다시 {3}를 드는 데 있다
valor.deduction.valor.hint: 투기장이 외치는 것과, 노병의 반쪽 노래와 과부가 기억하는 옛 법이 가리키는 것은 서로 다르다.
valor.crisis.challenge.text: 투기장에 사람들이 모였다. 젊은 도전자가 피를 흘리며 무릎을 꿇었는데, 무패의 투사가 물러서지 말라며 창을 겨눈다. 도전자는 숨을 몰아쉬며 일어서려다 다시 쓰러진다. 관중은 숨을 죽이고, 훈련관은 고개를 돌린다. 그때 노병이 낮게 노래를 부르기 시작한다. 이제 그대가 나설 차례다.
valor.option.allow-retreat.label: 옛 군가를 따라 불러 물러남도 용기임을 알린다
valor.option.allow-retreat.text: 그대가 노병의 노래를 따라 부른다. 앞에 적이 있고 뒤에 고향이 있다면 방패를 들어라. 그리고 잃어버린 마지막 소절을 잇는다. 방패를 들고 돌아오는 자가 용기다. 관중이 하나둘 따라 부르고, 무패의 투사는 겨눈 창을 천천히 내린다. 도전자는 끌려 나가지 않고 스스로 걸어 나온다. 투기장의 모래 위에 처음으로 돌아온 자의 이름이 적힌다. 용기는 물러서지 않는 데 있지 않고 돌아와 다시 서는 데 있음을 솔강이 알았다.
valor.option.duel-honor.label: 무패의 투사에게 직접 결투를 청한다
valor.option.duel-honor.text: 그대가 창을 들어 결투를 청한다. 무패의 투사가 웃는다. 오래도록 그런 도전자를 기다렸다고. 창이 부딪히고, 그대가 마지막 일격을 멈춘다. 목 앞에서 창을 거두는 순간 관중이 술렁인다. 무패는 무릎을 꿇고 말한다. 나는 이기는 법만 배웠지 멈추는 법은 배우지 못했다고. 그대가 손을 내밀어 그를 일으킨다. 이긴 자가 아니라 세운 자가 명예롭다는 것을 마을이 보았다.

# --- 솔강 능력·생물 ---
valor.ability.shield.name: 방패 들기
valor.creature.duelist.name: 떠돌이 결투가

# --- 정의의 마을 셀레스 (M3 Task 35) ---
town.seles.name: 셀레스
justice.music.title: 셀레스의 판결

justice.npc.judge.name: 재판관 할덴
justice.npc.judge.greet: 셀레스의 법정이다. 한 줄로 서라. 관례는 예외를 두지 않는다.
justice.npc.judge.name.t: 나는 할덴. 삼십 년 동안 이 법정의 판결을 내려 왔다. 셀레스에서는 살아 있는 자의 이름보다 무덤 앞의 관례가 먼저다.
justice.npc.judge.job.t: 내 일은 관례를 지키고 벌을 내리는 것이다. 조문 기간에는 누구도 노래하지 못하고, 어긴 자는 매를 맞는다. 관례가 마을을 지킨다. 그것이 정의다.
justice.npc.judge.law.t: 법은 관례에 뿌리를 둔다. 조문 기간에 노래하면 매질. 무덤 앞에서 물건을 꺼내면 추방. 우리 법에는 감정이라는 항목이 없다.
justice.npc.judge.punishment.t: 형벌은 사람이 관례를 기억하게 하는 불이다. 매질은 사십 대, 어떤 벌도 감면하지 않는다. 셀레스는 그것을 정의라 부른다.
justice.npc.judge.compassion.t: 연민은 법정에 어울리지 않는 말이다. 벌을 줄이면 모두가 관례를 흔들려 할 것이다. 나는 그 흔들림을 막는 자다.
justice.npc.judge.lullaby.t: 자장가라니. 조문 기간에 노래라니. 그것은 관례에 대한 모독이다. 과부 하린은 벌을 피할 수 없다.
justice.npc.judge.witness.t: 목격자가 본 것은 분명하다. 묘둠에서 반짝이는 것을 쥔 젊은이는 도둑이다. 증인은 이미 섰다.
justice.npc.judge.graveyard.t: 해가 지면 묘지에 머물지 말라는 조항은 내가 처음 쓴 것이다. 삼십 년 전 겨울, 무덤 앞에서 밤을 새운 사람을 내 손으로 업고 내려왔다. 그는 이미 차가웠다.
justice.npc.judge.fairness.t: 공정이란 누구에게나 같은 벌을 내리는 것이다. 내 피붙이였어도 나는 같은 판결을 내렸을 것이다.

justice.npc.clerk.name: 법정 서기 카셀
justice.npc.clerk.greet: 증언은 기록으로 남네. 조용히, 그리고 정확히 말하게.
justice.npc.clerk.name.t: 카셀이라 하네. 이 법정에서 증언과 판결문을 받아 적는 서기일세.
justice.npc.clerk.job.t: 재판 기록을 쓰네. 오늘도 판결문을 세 장 썼지, 모두 매질 아니면 추방이었네. 한때는 내 글씨가 자랑이었는데, 요즘은 그 글씨로 형벌을 세는 게 두렵네.
justice.npc.clerk.law.t: 법은 이미 적혀 있네. 조문 금지 조항, 형벌 표, 감면 불가 조항. 재판관님은 기록을 읽을 뿐이라 하시지만, 기록을 쓰는 내가 말해 주지. 기록은 그리 간단하지 않다네.
justice.npc.clerk.punishment.t: 형벌은 세 가지일세. 매질, 추방, 그리고 무덤 앞에 무릎 꿇기. 무릎 꿇기가 가장 가볍지. ……아이들은 그 벌을 등 돌리기라 부르네, 무릎 꿇은 사람이 마을에 등을 보이니까. 그 말이 자꾸 마음에 걸리네.
justice.npc.clerk.harsh.t: 공정이라…… 이 기록을 보게. 지난달 조문을 어긴 사람이 여섯이네. 노래한 사람도, 무덤에 꽃을 두고 온 사람도, 모두 사십 대를 맞았지. 그 숫자를 적을 때마다 손이 떨리네.
justice.npc.clerk.prisoner.t: ……갇힌 청년 말인가. 그의 이름은 적지 않았네. 재판관님이 도둑이라고만 쓰라 하셨거든. 죄명이 진실보다 먼저 판결을 내리는 건, 서기 노릇 이십 년에 처음 보네.
justice.npc.clerk.judge.t: 재판관님 밑에서 이십 년을 받아 적었네. 판결문을 읽으실 때 목소리가 떨린 적이 한 번도 없으시지. ……겨울만 빼고. 겨울 판결은 늘 조금 빠르시네.
justice.npc.clerk.truth.t: 진실 말인가. 내 일은 들은 대로 적는 것이지, 진실을 가려 적는 게 아닐세. ……적어도 그렇게 믿어 왔네.

justice.npc.widow.name: 과부 하린
justice.npc.widow.greet: ……자장가를 들으셨나요? 미안해요, 조문 중에는 부르지 말아야 하는데. 밤마다 저도 모르게 입에서 새어 나와요.
justice.npc.widow.name.t: 하린이라고 해요. 한 달 전에 남편을 묻었어요. 셀레스 사람들은 저를 노래하는 과부라고 불러요.
justice.npc.widow.job.t: 남편이 살아 있을 때는 실을 엮어 옷감을 짰어요. 지금은…… 날마다 무덤에 가서 풀을 뽑고 돌을 쓸어요. 밤이면 그 자장가가 저도 모르게 나오고요. 조문은 하는 일이 아니라, 몸에 배는 거더라고요.
justice.npc.widow.compassion.t: 여기서는 우는 사람을 붙잡아 주는 것도 조문을 어기는 일이에요. 슬픔을 덜어 주면 죽은 이를 덜 기리는 거라고요. 그래서 다들, 우는 사람을 보면 고개를 돌려요.
justice.npc.widow.lullaby.t: 남편과 둘이서 이렌을 재울 때 부르던 자장가예요. 셀레스 엄마들은 다 아는 노래인데, 저는 한 낱말을 바꿔 불러요, 창 대신 무덤으로. ……매를 맞아도 좋아요. 노래하지 않는 밤이 더 무서워요.
justice.npc.widow.prisoner.t: 제 아들 이야기군요. 그 애는 밤마다 아버지 무덤에 갔어요. 남편이 저 주려고 무덤가 돌 틈에 숨겨 둔 목걸이를 찾아서, 닦고 있었나 봐요. 그걸 본 목격자가 도둑이라 했고요. 아들은 진실을 말하는데, 여기서는 관례가 진실보다 먼저예요.
justice.npc.widow.truth.t: 진실은요…… 남편이 죽던 밤, 저는 울지 않았어요. 상례대로 아무 말도 하지 않았죠. 그런데 노래하는 지금의 제가 그날 밤의 저보다 더 진실해요. 그날은 조문이 진실을 가두었으니까요.
justice.npc.widow.mourning-duty.t: 법 이야기라면요, 옛날에는 조문 백 일 동안 문을 닫고 지냈대요. 그런데 언제부턴가 조문이 금지가 됐어요. 울지 말고, 부르지 말고, 무덤 앞에 무릎만 꿇으라고. 어떻게 그렇게 바뀌었는지는 아무도 말하지 않아요.
justice.npc.widow.graveyard.t: 남편 무덤 둘레돌은 그이가 젊을 때 손수 쌓은 거예요. 석공은 제 자리를 제 손으로 다듬는 거라면서요. 그때는 웃었는데.
justice.npc.widow.mason.t: 두만 아저씨는 남편의 스승이었어요. 장례 날 비석 앞에서 끌을 오래 쥐고 계셨어요. 아무 말도 없이.
justice.npc.widow.love.t: 사랑이요…… 남편은 말이 적은 사람이었어요. 대신 작은 돌에 무늬를 새겨서 말없이 문간에 두고 가곤 했죠.

justice.npc.prisoner.name: 갇힌 청년 이렌
justice.npc.prisoner.greet: ……죄송해요, 무슨 말이라도 하면 도둑의 말로 기록될까 봐 무서워요.
justice.npc.prisoner.name.t: 이렌이에요. 어머니는 하린, 아버지는 석공이었어요. ……아버지가 갑자기 돌아가신 뒤로, 밤에 무덤을 지키는 건 제 몫이었어요.
justice.npc.prisoner.job.t: 아버지 공방에서 돌 다루는 일을 배웠어요. 지금은 이 감옥에 혼자 있을 뿐이고요. 돌을 만지면 진실이 보인다고, 아버지가 그러셨어요.
justice.npc.prisoner.truth.t: 그 밤의 일은 있는 그대로 말했어요. 아버지가 쌓은 무덤 둘레돌 하나가 흔들려서 들춰 보니, 천에 싸인 어머니 목걸이가 있었다고요. 녹이 슬어서 닦고 있었을 뿐이에요. 그런데 재판관님은 도둑이라는 기록부터 만드셨어요.
justice.npc.prisoner.fairness.t: 공정이라면 아버지의 일도, 어머니의 노래도 같은 저울에 올려져야 해요. 그런데 셀레스의 저울은 먼저 벌을 내리고 나서 무게를 재요.
justice.npc.prisoner.widow.t: 어머니는 밤마다 무덤 앞에서 자장가를 부르세요. 노래가 금지된 뒤로도, 목이 쉴 때까지요. 여기 창으로도 들려요. 그 노래가 저를 지켜요.
justice.npc.prisoner.mourner.t: 그 조문객 말이에요? 아버지의 옛 벗이에요. 무덤을 지킨다고 밤마다 서성이다가, 어둠 속에서 저를 못 알아보고 도둑이라 소리쳤어요. 슬픔이 사람 눈을 가리나 봐요.
justice.npc.prisoner.mason.t: 두만 아저씨가 아버지에게 돌을 가르쳤고, 아버지가 저에게 가르쳤어요. 어젯밤 창살 사이로 끌 하나를 넣어 주고 가셨어요. 손이 놀면 마음이 먼저 상한다고요.
justice.npc.prisoner.judge.t: 재판관님을 미워하지는 않아요. 다만 판결을 내리실 때, 저를 한 번도 똑바로 보지 않으셨어요. 그게 더 무서웠어요.

justice.npc.witness.name: 목격자 카인
justice.npc.witness.greet: 내 두 눈을 걸지. 그날 밤 일은 똑똑히 봤으니까.
justice.npc.witness.name.t: 카인이야. 이 마을에서 구둣방을 하지. 요즘은 법정에 증인으로 서는 일이 잦아졌어.
justice.npc.witness.job.t: 구두를 만들고, 밤에는 마을을 지켜봐. 무덤 쪽으로 가는 사람은 다 적어 두지. ……그게 언제부터 내 일이 됐는지는 모르겠어.
justice.npc.witness.law.t: 법이 있으니 증인이 있는 것이야. 나는 본 것을 말할 뿐이지. 조문 기간에 노래를 부르는 소리, 무덤에 드나드는 그림자. 법이 그것들을 눈여겨보라고 했어.
justice.npc.witness.punishment.t: 벌은 무서운 것이 아니야, 질서야. 매질을 맞고 나면 다들 관례를 기억하지. 나는 벌이 사람을 고친다고 믿어.
justice.npc.witness.mourner.t: 청년 이렌이 무덤에서 무언가 번득이는 것을 들고 있더군. 도둑이 아니고서야 무덤에서 무엇을 찾을까. ……그런데 지금 생각하면, 그게 목걸이처럼 보이기도 했어. 어머니의 목걸이였다면?
justice.npc.witness.graveyard.t: 몇 해 전, 아내 비석 앞에 놓아 둔 반지가 없어졌어. 그때부터 밤마다 묘지를 봐. 무덤가에서 뭔가 반짝이면, 누가 꺼냈다는 생각부터 들어.
justice.npc.witness.truth.t: 진실? 난 본 걸 말했어. ……본 거랑 있었던 일이 꼭 같은 건 아니라는 걸, 요즘 밑창을 갈다가 자꾸 생각해.

justice.npc.child.name: 광장 아이 리네
justice.npc.child.greet: 어른들이 조용히라고만 해서 노래를 못 불러. 근데 넌 괜찮아 보이는데?
justice.npc.child.name.t: 나는 리네야. 이 마을에서 태어난 아이야. 내가 아는 노래가 셀레스에서 제일 많아.
justice.npc.child.job.t: 내 일은 노래 외우기! 광장에서, 무덤 근처에서, 어른들이 몰래 흥얼거리는 걸 듣고 다 외워. ……요즘은 어른들이 노래를 안 하니까, 노래는 이제 다 내 거야.
justice.npc.child.lullaby.t: 과부 아주머니 자장가? 나도 알아! 달은 무덤을 비추고, 나는 당신의 자장가를 부른다. 원래는 무덤이 아니라 창이래. 재판관 아저씨한테 걸리면 안 되는데…… 나는 그 노래가 좋아.
justice.npc.child.love.t: 사랑? 그건…… 무덤 앞에서 노래하는 거지. 엄마가 나 재울 때 부르는 노래도, 과부 아주머니가 아저씨한테 부르는 노래도 같은 노래야. 하지 말래도 부르는 거. 그게 사랑이야?
justice.npc.child.widow.t: 과부 아주머니는 착한데 왜 벌을 받아? 노래한 게 죄면 나도 죄인인데, 나한텐 아무도 벌을 안 줘. 아주머니는 어른이라서 자꾸 벌을 받는 거야.
justice.npc.child.graveyard.t: 묘지에선 밤에 초가 켜져. 오스탄 할아버지가 하나씩 켜는데, 아무도 안 찾아오는 무덤에도 켜 줘. 그런 무덤이 제일 많대.
justice.npc.child.punishment.t: 매 맞은 아저씨들은 한동안 걸음이 이상해. 그래서 우리는 길에서 그 아저씨들 앞으로 안 지나가. 뒤에서 천천히 걸어 줘.

justice.npc.priest.name: 사제 세르노
justice.npc.priest.greet: 평안하시게. 이 예배소는 묘지보다 먼저 세워졌지만, 나 역시 조문의 규칙을 따르며 사네.
justice.npc.priest.name.t: 세르노일세. 이 예배소를 지키고, 옛 조문 기록을 맡아 두는 사제라네.
justice.npc.priest.job.t: 옛 기록을 다듬고, 조문 예식의 말씀을 준비하네. ……그런데 어느 해부터인가 기록에 금지라는 낱말이 늘어났네. 울지 말 것, 부르지 말 것, 어기지 말 것.
justice.npc.priest.mourning-duty.t: 법이라면 옛 조문 기록에는 형벌이 없었네. 백 일 동안 문을 닫고 지내면 이웃이 밥을 가져다주고, 밤이면 함께 앉아 이야기를 나누었지. 벌을 세우는 때가 아니었네.
justice.npc.priest.comfort-widow.t: 과부 말이로군. 위로는 가르치는 것이 아닐세. 무덤 앞에 함께 앉아, 부르는 노래를 같이 들어 주는 것이지. 그대가 그 노래를 듣고 곁에 앉으면, 그 벌은 힘을 잃을 걸세.
justice.npc.priest.compassion.t: 연민은 벌을 줄이는 것이라 여겨지지만, 사실은 함께 아파하는 것이지. 옛 기록은 말하네. 정의가 저울이라면, 연민은 그 저울을 잡는 손이라고.
justice.npc.priest.harsh.t: 형벌이라면, 벌이 관례보다 무거워진 건 근래의 일일세. 노래 한 곡에 사십 대라니, 옛날 같으면 꾸중 들을 일도 아니었네. 그 벌이 사람들을 겁먹게 해서, 이제는 아무도 무덤 앞에서 울지 않네.
justice.npc.priest.judge.t: 할덴과는 어릴 적 같은 냇가에서 놀았네. 그가 첫 조항을 쓴 겨울을 나는 기억하지. ……그날 그를 붙잡아 줄 말을, 나는 끝내 찾지 못했네.
justice.npc.priest.court.t: 법정에 불려 간 적은 많지만, 옛 기록을 들고 간 적은 없네. 아무도 묻지 않았으니까. ……그것이 내 핑계라는 것도 아네.

justice.npc.mason.name: 석공 두만
justice.npc.mason.greet: 묘비를 세우는 사람일세. 돌에는 거짓을 새길 수 없으니, 이 마을에서 내 일이 아직 버티고 있지.
justice.npc.mason.name.t: 두만일세. 이 마을의 묘비와 집터 돌을 다루는 석공이지.
justice.npc.mason.job.t: 죽은 이의 이름을 새기는 게 내 일이었네. 요즘은 그 밑에 한 줄을 더 새기지, 이 무덤 앞에서 조문을 어긴 자 있음. 돌 위에 글자가 늘어나는 속도가 겁이 나네.
justice.npc.mason.law.t: 법이라는 것은…… 돌과 같아야 하네. 무게가 있고, 버티고, 거짓이 없어야지. 지금의 법은 돌이 아니라 흙일세. 비가 오면 모양이 바뀌지.
justice.npc.mason.harsh.t: 공정이라니, 지난달에 내가 새긴 그 한 줄이 여섯일세. 노래한 이, 꽃을 둔 이, 해 진 뒤에 머문 이. 산 사람의 잘못을 죽은 이의 돌에 새기는 법이라니. ……이 마을은 죽은 이를 위한 돌로 산 사람을 벌하고 있네.
justice.npc.mason.comfort-widow.t: 과부 말이지. 그래도 희망은 있네. 하린 남편의 비석은 아직 여기 잠들다 한 줄뿐일세. 그 밑에 한 줄을 더 새기라는 명이 내려왔지만, 나는 끌이 무뎌졌다며 버티고 있지.
justice.npc.mason.graveyard.t: 하린네 묘 둘레돌은 하린 남편이 젊을 적에 쌓은 걸세. 내가 가르친 대로, 돌 하나는 빼낼 수 있게 남겨 두었지. 석공들은 거기에 작은 것을 넣어 두곤 하네.
justice.npc.mason.punishment.t: 벌이라…… 끌을 잘못 대면 돌에 금이 가네. 한 번 간 금은 메우지 못하지. 사람도 그렇다는 걸, 재판관은 모르는 것 같네.

justice.npc.scribe.name: 필경사 벨라
justice.npc.scribe.greet: 기록소에서 형벌 표를 정리하는 사람입니다. ……문서와 말, 어느 쪽이 진실인지 이제는 알 수 없게 되었습니다.
justice.npc.scribe.name.t: 벨라입니다. 법정에서 올라온 판결문과 조문 기록을 기록소에 옮겨 적는 필경사입니다.
justice.npc.scribe.job.t: 날마다 벌칙 기록을 정리합니다. 어제는 노래 한 곡에 매질 사십 대. 오늘은 해 진 뒤 무덤 앞에 머물렀다는 것만으로 무릎 꿇기 한 번. 숫자는 정직한데, 숫자를 정하는 법은 정직하지 않습니다.
justice.npc.scribe.truth.t: 기록은 진실을 담는다고 배웠습니다. 그런데 이제는 기록이 진실을 만들어 냅니다. 도둑이라 적으면 도둑이 되고, 상주라 적으면 상주가 됩니다. 같은 밤, 같은 무덤, 같은 청년인데, 낱말 하나가 사람을 가릅니다.
justice.npc.scribe.prisoner.t: 청년의 기록을 다시 읽어 보았습니다. 죄명 칸에는 도둑이라 적혀 있지만, 본문 어디에도 훔쳤다는 말은 없습니다. 밤에 무덤 앞에 있었다는 것, 손에 무언가를 쥐고 있었다는 것뿐입니다.
justice.npc.scribe.harsh.t: 법의 숫자라면, 형벌 표의 숫자가 해마다 늘어납니다. 조문을 어기면 매질, 무덤에서 물건을 꺼내면 추방. 숫자가 쌓일수록 마을은 더 조용해지고, 저는 숫자를 쓰는 것이 더 두려워집니다.
justice.npc.scribe.fairness.t: 형벌 표에는 이름 칸이 없습니다. 누구든 같은 줄에 같은 숫자. 그것을 공정이라 부르는데, 저는 가끔 그 빈칸이 무섭습니다.
justice.npc.scribe.court.t: 법정에서 판결문이 올라오면 저는 위층에서 그것을 다시 씁니다. 카셀 씨의 글씨는 반듯한데, 요즘은 끝 획이 조금씩 떨립니다.

justice.npc.gravedigger.name: 묘지기 오스탄
justice.npc.gravedigger.greet: 여긴 죽은 이들이 사는 곳이야. 산 사람은 조용히, 거짓 없이 다녀가.
justice.npc.gravedigger.name.t: 오스탄이라고 해. 이 묘지 땅을 파고 지키는 묘지기야.
justice.npc.gravedigger.job.t: 무덤을 파고, 초를 켜고, 밤마다 한 바퀴씩 돌지. ……근데 요즘은 산 사람들이 밤에 더 자주 와. 벌이 무서워서, 죽은 이들처럼 소리도 없이.
justice.npc.gravedigger.mourner.t: 저 조문객 말이지…… 밤마다 무덤 앞에서 울어. 낯선 사람만 보면 도둑이라며 막아서고. 슬픔이 사람 눈을 그렇게 가리는 거야. 악한 게 아니라, 애도에 빠진 사람이지.
justice.npc.gravedigger.compassion.t: 연민을 나는 이렇게 배웠어. 무덤 파러 갔다가 곡하는 사람을 보면, 내가 먼저 웃어 줘야 한다는 거. 죽은 이는 누워 있으면 그만이지만, 위로가 필요한 건 산 사람이니까.
justice.npc.gravedigger.lullaby.t: 그 자장가…… 밤마다 들어. 무덤 사이로 울려 퍼지는 소리. 재판관이 금지했다지만, 내가 보기엔 저 노래는 누구도 해치지 않아. 오히려 나를 지켜 주지.
justice.npc.gravedigger.prisoner.t: 청년 이렌은 도둑이 아니야. 나는 밤마다 봤어. 무덤 앞에 무릎 꿇고, 비석을 닦고, 자장가를 듣고 있었어. 그 목걸이는 죽은 이가 아내에게 남긴 것이고, 아들은 그것을 찾아 어머니에게 돌려주려던 것이지.
justice.npc.gravedigger.judge.t: 재판관도 와. 해 지기 전에, 북쪽 끝 오래된 무덤에. 꽃도 안 두고, 무릎도 안 꿇고, 그냥 한참 서 있다 가.
justice.npc.gravedigger.law.t: 법은 해 지면 무덤에서 나가라는데, 죽은 이들은 밤이 제일 외로워. 그래서 내가 초를 켜는 거야.
justice.npc.silversmith.name: 은세공인 니엘
justice.npc.silversmith.greet: 고칠 고리가 있으면 맡기세요. 요즘은 다들 장신구를 서랍에 넣어 두기만 해서, 손이 한가해요.
justice.npc.silversmith.name.t: 니엘이에요. 광장 가에서 은고리를 땜질하고 끊어진 줄을 잇는 일을 해요.
justice.npc.silversmith.job.t: 작은 걸 고쳐요. 지난봄에 석공 한 분이 손수 깎은 돌 펜던트를 들고 와서, 은고리를 달아 달라고 하셨어요. 누구 줄 거냐고 물었더니 웃기만 하시더라고요.
justice.npc.silversmith.love.t: 사랑이요? 사람들은 비싼 걸 고르지만, 오래 남는 건 손으로 만든 거예요. 그 석공분 펜던트도 은보다 돌 쪽에 공이 더 들어 있었어요.
justice.npc.silversmith.witness.t: 카인 아저씨는 반짝이는 걸 보면 의심부터 하세요. 돌아가신 아주머니 반지 일 이후로요. 고리를 맡기러 와서도, 이게 어디서 났느냐고 꼭 물으세요.
justice.npc.old-neighbor.name: 묘지 옆 노파 오르마
justice.npc.old-neighbor.greet: 잠이 없는 늙은이라오. 밤이면 창가에 앉아 묘지 쪽을 내다본다오.
justice.npc.old-neighbor.name.t: 오르마라 하오. 이 묘지 담 옆에서 예순 해를 살았소.
justice.npc.old-neighbor.job.t: 잠이 없으니 밤을 지키오. 묘지 쪽 소리는 이 창으로 다 들린다오. 누가 우는지, 누가 오래 앉았다 가는지.
justice.npc.old-neighbor.witness.t: 카인이 본 것을 나는 들었소. 그 밤 무덤 쪽에서 난 건 삽질 소리가 아니었다오. 돌을 문지르는 소리, 그리고 아주 낮은 콧노래였소.
justice.npc.old-neighbor.graveyard.t: 옛날에는 백 일 동안 저 묘지에 밤마다 초가 줄지어 섰다오. 할덴도 어릴 적엔 제 형 손을 잡고 초를 들고 왔지. ……늙은이 말이 길었소.
justice.npc.scale-keeper.name: 저울 검사관 하임
justice.npc.scale-keeper.greet: 장터 저울을 검사하는 하임입니다. 빈 접시에서 바늘이 가운데 서는지, 그것부터 봅니다.
justice.npc.scale-keeper.name.t: 하임입니다. 셀레스 장터의 저울을 한 달에 한 번씩 검사합니다.
justice.npc.scale-keeper.job.t: 추를 올려 보고, 빈 접시도 봅니다. 기울어진 저울은 손님보다 장사꾼을 먼저 속입니다. 바늘이 틀어진 줄 모르고, 평생 정직하게 팔았다고 믿으니까요.
justice.npc.scale-keeper.fairness.t: 공정한 저울은 무거운 쪽을 미워하지 않습니다. 그저 무게를 말할 뿐이지요. 판결도 그래야 한다고 생각하지만, 저는 저울만 봅니다.
justice.npc.scale-keeper.law.t: 법정 벽에도 저울 그림이 걸려 있습니다. 그런데 그 그림 속 한쪽 접시에는 처음부터 추가 그려져 있지요. 아무도 그걸 이상하게 여기지 않습니다.
justice.npc.keener.name: 곡꾼 에다
justice.npc.keener.greet: 곡을 하던 사람이에요. 지금은 예배소 바닥을 닦아요. 소리를 안 내는 일이라서요.
justice.npc.keener.name.t: 에다예요. 장례 때 상주 대신 소리 내어 울어 주던 곡꾼이었어요.
justice.npc.keener.job.t: 울지 못하는 사람 대신 우는 게 제 일이었어요. 곡이 금지된 뒤로 목소리를 쓸 데가 없어요. 가끔 빈 예배소에서 입만 벌려 봐요. 소리는 안 나와요.
justice.npc.keener.punishment.t: 처음 금지됐을 때 저도 무릎을 꿇었어요. 무덤 앞에서, 소리 없이. 그때 알았어요. 소리를 막으면 울음은 목 안으로 내려가 버린다는 걸.
justice.npc.keener.graveyard.t: 곡은 죽은 이를 위한 게 아니었어요. 남은 사람이 혼자 울지 않게 하려는 거였죠. 지금 묘지에서는 다들 혼자 울어요.
justice.npc.lash-bearer.name: 매 집행인 보르
justice.npc.lash-bearer.greet: ……법정 일을 하는 사람이야. 내 손은 보지 마.
justice.npc.lash-bearer.name.t: 보르. 판결이 나면 매를 드는 사람이지.
justice.npc.lash-bearer.job.t: 사십 대를 세는 게 내 일이야. 소리 내서 세야 해. 난 천천히 세. 빨리 세면 맞는 사람이 숨 쉴 틈이 없거든.
justice.npc.lash-bearer.punishment.t: 지난달엔 여섯 명이었어. 그중 셋은 내가 어릴 때 업어 준 사람들이야. 법은 그런 걸 묻지 않지.
justice.npc.lash-bearer.judge.t: 재판관은 집행 때 꼭 와서 끝까지 서 있어. 눈도 안 돌려. 자기가 내린 벌은 자기가 봐야 한다고. ……그건 존경해.

# --- 셀레스 단서 ---
justice.word.fairness.label: 공정
justice.word.fairness.hint: 모든 이를 같은 저울에 올리는 일. 셀레스의 법은 벌을 먼저 내리고 무게를 잰다.
justice.word.law.label: 법
justice.word.law.hint: 관례에 뿌리를 둔 조문 금지와 형벌 조항. 감정이라는 항목은 없다.
justice.word.punishment.label: 형벌
justice.word.punishment.hint: 매질과 추방, 무덤 앞 무릎 꿇기. 관례를 기억시키는 불.
justice.word.compassion.label: 연민
justice.word.compassion.hint: 셀레스에서는 우는 이를 붙잡아 주는 일조차 조문을 어기는 것이 된다.
justice.fact.seles.judge.label: 재판관 할덴
justice.fact.seles.judge.hint: 삼십 년간 판결을 내려 온 셀레스의 재판관. 관례가 곧 정의라 믿는다.
justice.fact.seles.widow.label: 과부 하린
justice.fact.seles.widow.hint: 남편을 묻은 지 한 달. 밤마다 무덤 앞에서 금지된 자장가를 부른다.
justice.fact.seles.prisoner.label: 갇힌 청년 이렌
justice.fact.seles.prisoner.hint: 하린의 아들. 무덤에서 어머니의 목걸이를 찾았다가 도둑으로 몰렸다.
justice.fact.seles.witness.label: 목격자 카인
justice.fact.seles.witness.hint: 무덤에서 번득이는 것을 본 증인. 본 것을 말할 뿐, 판단은 법에 맡긴다.
justice.fact.seles.mason.label: 석공 두만
justice.fact.seles.mason.hint: 묘비와 집터의 돌을 다루는 사람. 요즘은 누가 조문을 어기면 그 한 줄을 죽은 이의 비석에 새긴다.
justice.fact.seles.court.label: 셀레스 법정
justice.fact.seles.court.hint: 벌이 기록보다 먼저 내려지는 곳. 판결문이 매일 세 장씩 쌓인다.
justice.fact.seles.graveyard.label: 공동묘지
justice.fact.seles.graveyard.hint: 밤마다 자장가가 울려 퍼지는 무덤. 벌을 두려워한 산 자가 죽은 자처럼 조용해졌다.
justice.fact.seles.mourning-lullaby.label: 상주 자장가
justice.fact.seles.mourning-lullaby.hint: 달은 무덤을 비추고, 나는 당신의 자장가를 부른다. 하린이 남편에게 남겨 둔 노래.
justice.fact.seles.mourning-duty.label: 잃어버린 백 일
justice.fact.seles.mourning-duty.hint: 옛 기록의 조문 백 일. 형벌이 아니라, 이웃이 밥을 가져다주고 함께 앉는 때였다.
justice.fact.seles.harsh-punishment.label: 가혹한 형벌
justice.fact.seles.harsh-punishment.hint: 노래 한 곡에 사십 대, 무덤에서 물건을 꺼내면 추방. 형벌 표의 숫자가 해마다 늘어난다.
justice.fact.seles.comfort-widow.label: 위로의 손길
justice.fact.seles.comfort-widow.hint: 무덤 앞에 함께 앉아 노래를 들어 주는 일. 벌보다 먼저 위로가 서면 저울이 균형을 찾는다.
justice.fact.creature.justice-mourner.label: 슬픔에 잠긴 조문객
justice.fact.creature.justice-mourner.hint: 악하지 않다. 낯선 이를 도둑으로 오인하는 것은 슬픔 때문이다. 애도에 잠긴 사람이다.

# --- 셀레스 추론·위기 ---
justice.deduction.justice.sentence: 정의는 {1}에 눈감은 형벌이 아니라, {2}의 저울에 {3}까지 함께 올리는 것이다
justice.deduction.justice.hint: 재판관의 형벌은 무엇에 눈을 감았는가. 셀레스의 저울은 본래 어떤 이름이었고, 그 접시에서 무엇이 빠져 있었는가. 감옥의 청년과 무덤가의 노래에서 찾으라.
justice.crisis.mourning.text: 법정 앞에 달빛이 서늘하다. 조문 기간에 노래를 부른 과부 하린과, 무덤에서 목걸이를 찾은 청년 이렌이 재판관 앞에 끌려 나왔다. 재판관이 판결문을 펼친다. 노래는 관례를 어겼고, 무덤은 도둑을 냈다. 벌은 정해져 있다. 관중은 숨을 죽인다. 아이가 고개를 숙이고, 묘지기가 무덤 쪽을 바라본다. 이제 그대가 나설 차례다.
justice.option.comfort-widow.label: 자장가를 불러 진실과 위로를 보인다
justice.option.comfort-widow.text: 그대가 법정 앞에서 떨리는 목소리로 자장가를 부른다. 달은 무덤을 비추고, 나는 당신의 자장가를 부른다. 관중이 숨을 멈춘다. 목격자가 고개를 숙이고, 사제가 옛 기록을 꺼내 읽는다. 조문의 백 일은 형벌이 아니라 함께 앉는 때였다. 재판관은 긴 침묵 끝에 판결문을 접는다. 셀레스의 저울이 처음으로 진실과 사랑을 올려놓고 균형을 찾는다. 형벌 대신 위로가 내려진다.
justice.option.strict-law.label: 형벌 조항을 낭독해 법대로 다스린다
justice.option.strict-law.text: 그대가 형벌 표를 펼쳐 법대로 읽는다. 노래는 사십 대, 무덤의 물건을 꺼낸 일은 추방. 재판관은 고개를 끄덕이고, 매질이 집행된다. 사람들은 더 조용해지지만, 어딘가에서 아이의 자장가가 낮게 이어진다. 셀레스는 관례를 지켰다. 그러나 무덤 앞에는 아무도 서지 않게 되었다.

# --- 셀레스 능력·생물 ---
justice.ability.eye.name: 정의의 눈
justice.creature.mourner.name: 슬픔에 잠긴 조문객

# --- 디오네 마을 (M4 Task 37) ---
town.dione.name: 디오네
sacrifice.music.title: 디오네의 제단

sacrifice.npc.altar-priest.name: 제단 사제 크레온
sacrifice.npc.altar-priest.greet: 어서 오너라. 제단 앞에 서면 모든 것이 덜어져 간다. 그대가 가진 것을 모두 내려놓아라.
sacrifice.npc.altar-priest.name.t: 나는 크레온. 디오네의 제단을 지키는 사제다. 이 제단은 오늘도 누군가의 것을 받아 삼킨다.
sacrifice.npc.altar-priest.job.t: 나는 사제이기 전에 이 제단의 심부름꾼이다. 사람들은 이곳에 와서 재산을, 몸을, 마지막 한 조각마저 바친다. 그것이 우리 마을의 사랑이다. 그대도 무엇이든 하나 덜어 놓고 가거라.
sacrifice.npc.altar-priest.devotion.t: 헌신은 자신을 모조리 비우는 일이다. 남기는 것이 있으면 그것은 헌신이 아니다. 욕심이다. 제단은 그 욕심을 태우는 불이다.
sacrifice.npc.altar-priest.love.t: 사랑은 아낌없이 주고, 또 주다가 자신이 사라지는 것이다. 그대처럼 아끼는 마음은 사랑이라 부르지 않는다.
sacrifice.npc.altar-priest.widow-song.t: 그 노래는 집착이다. 죽은 자를 붙잡는 미련일 뿐. 과부가 제단에서 풀어 놓지 못하는 것이 그 미련이다.
sacrifice.npc.altar-priest.penitent.t: 저 고행자 말이냐. 그가 그대가 가야 할 길을 보여 준다. 이제는 날마다 제단 앞에서 스스로 채찍을 드니, 그것이 참된 자세다.
sacrifice.npc.altar-priest.altar.t: 이 제단은 긴 겨울이 끝난 뒤에 세워졌다. 그해 내 어머니는 제 몫의 빵을 아이들 솥에 넣고 봄을 보지 못했다. 제단은 그런 이들을 잊지 않으려고 쌓은 돌이다.
sacrifice.npc.altar-priest.sanctuary.t: 성소 벽의 계율은 내가 젊을 때 손수 새겼다. 손이 떨려 한 글자가 비뚤어졌지. 그 글자를 볼 때마다 나는 아직 덜 비웠다는 것을 안다.
sacrifice.npc.altar-priest.widow.t: 레아의 남편은 작년 제단 날에 가장 큰 것을 바쳤다. 그 이름은 장부 맨 윗줄에 있다. 그런데도 그 아내는 아직 빵 반쪽을 쥐고 놓지 못하는구나.

sacrifice.npc.widow.name: 과부 레아
sacrifice.npc.widow.greet: ……제단에서 오셨어요? 아니면 노래 소문을 듣고 오셨어요?
sacrifice.npc.widow.name.t: 레아라고 해요. 남편은 제단에서 돌아오지 못했어요. 사람들은 저를 노래하는 과부라고 불러요.
sacrifice.npc.widow.job.t: 남편이 가고 나서는 저녁마다 빵을 반쪽 남겨 둬요. 그이 몫이었으니까요. 제단에서는 그것마저 바치라지만…… 그 반쪽하고 그이랑 부르던 노래가 제 하루를 지켜요.
sacrifice.npc.widow.love.t: 사랑은 남편이 새긴 상처가 아니라, 우리가 함께 앉아 나눈 저녁이었어요. 상처를 세고 있는 것은 사랑이 아니라 경쟁이에요.
sacrifice.npc.widow.widow-song.t: 그 노래는 이제 남편하고 저만 부르던 노래가 됐어요. 제단이 서기 전에는 이 마을 아낙들이 저녁 아궁이에 불을 붙이며 다 같이 불렀대요. 남편은 제단으로 걸어가면서도 그 노래를 불렀어요.
sacrifice.npc.widow.altar.t: 제단은 사람의 마지막 것을 달라고 해요. 남편은 사랑을 증명하려고 제단에 손을 올렸고, 그 상처 때문에 돌아오지 못했어요. ……더는 말하지 않을게요.
sacrifice.npc.widow.devotion.t: 헌신이라…… 그 말이 남편을 데려갔어요. 더 많이 바치려 하다, 결국 자신까지 바쳤지요. 제단은 받는 데만 익숙해요.
sacrifice.npc.widow.surgeon.t: 세인 선생님은 그 뒤로 저를 보면 먼저 고개를 숙이세요. 늦게 와서 미안하다고요. 늦은 건 선생님이 아니었는데.
sacrifice.npc.widow.courage.t: 용기요…… 다들 남편이 용감했다고 해요. 저는 그이가 제단 앞에서 무서워서 노래를 불렀다는 걸 알아요.

sacrifice.npc.child.name: 아이 노아
sacrifice.npc.child.greet: 낯선 사람이랑 말하면 저녁 굶는 벌이야. 괜찮아, 나 굶는 거 잘해.
sacrifice.npc.child.name.t: 나는 노아야. 여섯 살이고, 제단을 돌보는 아이가 되는 연습을 해. 사제님이 그러는데, 어릴 때 많이 덜어 내야 나중에 큰 희생을 할 수 있대.
sacrifice.npc.child.job.t: 내 일은 하루에 한 끼 거르고, 좋아하는 걸 하나도 안 고르는 거야. 사제님은 이걸 거룩한 짐이라고 하는데, 나는 왜 짐 지는 걸 배워야 하는지 모르겠어.
sacrifice.npc.child.burden.t: 짐? 사제님은 짐이 많을수록 거룩하대. 근데 내가 아는 짐은 세라 할머니 빵 상자야. 그건 무거워도 둘이 들면 가벼워져.
sacrifice.npc.child.widow-song.t: 레아 아주머니 노래! 나 밤마다 뒤뜰에서 몰래 불러. 사제님이 들으면 안 되는데, 아주머니가 같이 불러 주면 마음이 따뜻해져.
sacrifice.npc.child.widow.t: 레아 아주머니는 빵 반쪽을 꼭 나눠 줘. 제단에 바치지 말고 먹으래. 근데 그것도 희생…… 아니, 뭐라고 해야 하지. 나는 아직 어려서 그 말을 몰라.
sacrifice.npc.child.garden.t: 마노 할아버지 밭에서 무 먹은 거 비밀이야. 무는 흙 맛이 나는데 달아. 사제님한테 말하면 안 돼.
sacrifice.npc.child.altar.t: 제단 돌에 귀 대 보면 안에서 바람 소리가 나. 성소 언니는 그게 제단이 숨 쉬는 소리래. 나는 좀 무서워.
sacrifice.npc.child.love.t: 사랑? 레아 아주머니가 빵 반쪽 줄 때 하는 얼굴. 그거 말하는 거지?

sacrifice.npc.pilgrim.name: 순례자 이온
sacrifice.npc.pilgrim.greet: 나는 이곳저곳을 떠도는 순례자요. 디오네의 제단 소문을 듣고 삼 년을 걸어왔고, 여기 머문 지는 한 계절째요.
sacrifice.npc.pilgrim.name.t: 이온이라 하오. 지팡이 하나와 수첩 한 권이 내 전 재산이오. 가는 곳마다 듣고 본 참된 희생을 적어 왔소.
sacrifice.npc.pilgrim.job.t: 내 일은 증인이 되는 것이오. 제단 앞에서 벌어지는 일도, 마을 사람들이 눈감는 일도 치우침 없이 적어 두오. 여기 오기 전까지 나는 희생이 아름답다고 믿었소.
sacrifice.npc.pilgrim.witness.t: 증인이란 본 것을 끝까지 기억하는 사람이오. 나는 이 마을의 장부를 세 벌 베꼈소. 사제는 천으로 감은 손을 제단 위로 치켜들지만, 그 천이 한 번 풀렸을 때 내가 본 손은 온전했소.
sacrifice.npc.pilgrim.martyr-contest.t: 제단이라면 말이오, 이 마을은 제단 앞에서 누가 더 아프게 바쳤는지 겨루오. 상처의 길이를 재고 굶은 날을 세는데, 작년에는 스스로 손가락을 끊은 사람이 이겼소. 사제는 그것을 거룩한 겨룸이라 부르고, 나는 순교 경쟁이라 적었소.
sacrifice.npc.pilgrim.devotion.t: 헌신이 나를 여기까지 데려왔지만, 이제는 그 낱말이 무섭소. 모든 것을 바치라는 곳에는 반드시 받는 쪽이 있더이다. 나는 그 받는 쪽까지 적어 두려 하오.
sacrifice.npc.pilgrim.pilgrim.t: 삼백 년 전의 그 순례자 말이오? 그분은 무엇을 바치라 하지 않고, 제 몫을 나누어 먹고 떠났다고 들었소. 이 마을이 그 이야기를 어디서 거꾸로 읽었는지, 나는 그것을 알고 싶소.
sacrifice.npc.pilgrim.widow.t: 레아 부인은 내 수첩에 아무것도 적지 말라 했소. 그래서 그 집 앞을 지날 때는 수첩을 덮고 걷소. 저녁 노래만은 들리는 대로 외워 두었지만.

sacrifice.npc.surgeon.name: 외과의 세인
sacrifice.npc.surgeon.greet: 앉게. 상처를 보여 주게. ……멀쩡하군. 잘 됐어.
sacrifice.npc.surgeon.name.t: 세인이라네. 이 마을에서 칼과 실을 다루는 외과의는 나 하나뿐일세. 내 칼은 살을 가르는 데가 아니라, 벌어진 살을 잇는 데 쓰네.
sacrifice.npc.surgeon.job.t: 내 일은 상처를 꿰매는 것일세. 그런데 이 마을 상처는 대개 제단 앞에 서려고, 남보다 크게 지려고 스스로 낸 것이지. 그걸 날마다 꿰매다 보니 나도 모르게 증인이 되었네.
sacrifice.npc.surgeon.witness.t: 증인이라면 나만 한 사람도 없을 걸세. 어떤 상처가 칼에서 났고 어떤 상처가 제단 돌에서 났는지 손끝이 먼저 알지. 그런데 사제의 손만은 여러 해 동안 한 번도 내게 보여 준 적이 없네.
sacrifice.npc.surgeon.martyr-contest.t: 사제의 제단에서 벌어지는 상처 겨루기라. 줄잡이가 매듭을 세고 기록사가 그 수를 받아 적는 걸 보면 기가 막히지. 상처의 길이로 사랑을 재겠다는 걸세.
sacrifice.npc.surgeon.penitent.t: 저 고행자는 내 환자일세. 등을 채찍질하다 덧나서 찾아왔지. 고쳐 주어도 곧 다시 제단으로 갈 걸세. 내가 꿰매는 상처보다 마을이 내는 상처가 더 많다네.
sacrifice.npc.surgeon.courage.t: 용기는 상처를 하나 더 내는 게 아닐세. 아파할 사람의 얼굴을 끝까지 마주 보는 것이지. 이 마을에서는 그게 제일 어려운 일이네.
sacrifice.npc.surgeon.widow.t: 그 집 남편은 살릴 수 있었네. 사흘만 일렀어도. ……법을 지킨 건 나였으니, 내 손도 그 장부에 한 줄 올라 있는 셈이지.
sacrifice.npc.surgeon.altar.t: 제단 날이 다가오면 나는 실을 끓여 둔다네. 올해는 그 실을 한 올도 안 쓰고 넘기는 게 내 소원일세.

sacrifice.npc.scribe.name: 기록사 미르
sacrifice.npc.scribe.greet: 기록은 영원하다고들 합니다. ……제가 쓰는 기록이 저를 두렵게만 하지 않는다면 좋겠습니다.
sacrifice.npc.scribe.name.t: 미르입니다. 디오네의 기록사로, 제단에 바쳐진 것들의 목록을 옮겨 적는 사람이지요.
sacrifice.npc.scribe.job.t: 제단의 장부를 맡고 있습니다. 이름과 바친 것과 상처의 길이를 적는데, 숫자가 클수록 칭송을 받습니다. 어제는 작년 장부를 옮겨 적다가 한 칸에서 손이 멈췄습니다. 손가락 하나였습니다.
sacrifice.npc.scribe.martyr-contest.t: 헌신이라면, 순교 경쟁이라고 부르는 사람도 있지요. 저는 숫자를 적을 뿐입니다. 하지만 숫자는 거짓말을 하지 않습니다 — 남편의 손가락, 아이의 끼니, 노인의 무릎. 제단은 그 숫자를 거두어들이고 있습니다.
sacrifice.npc.scribe.burden.t: 짐은 지는 것이 아니라 함께 지는 것이라고, 옛 장부에는 적혀 있지요. 각자 자기 짐만 지고, 남의 짐을 지려 하지 않는 지금. 그것이 제단이 가르치는 것이라면, 나는 그 가르침을 기록하지 않겠습니다.
sacrifice.npc.scribe.widow.t: 레아 부인 댁 이름은 작년 장부 맨 윗줄에 있습니다. 가장 많이 바친 집이라고 합니다. 그 아래 제가 연필로만 적어 둔 줄이 하나 있는데 — 밤마다 빵 반쪽을 남겨 두는 과부 — 그 줄은 아직 어느 장부에도 옮기지 못했습니다.
sacrifice.npc.scribe.pilgrim.t: 순례자는 제 장부를 세 벌이나 베껴 갔습니다. 숫자 옆에 이름을 하나하나 다시 써 넣으면서 말입니다. 저는 그렇게 쓰는 법을 잊고 있었습니다.
sacrifice.npc.scribe.witness.t: 증인이라면 저는 자격이 없습니다. 저는 본 것을 적지 않고 잰 것만 적습니다. 줄이 닿지 않는 것은 장부에 들어오지 못합니다.

sacrifice.npc.mason.name: 석공 다멘
sacrifice.npc.mason.greet: 평생 돌을 만지며 살았네. 돌은 거짓말을 안 해서 좋지. 그런데 저 제단 돌만은…… 제 밑에 무엇이 있는지 입을 꾹 다물고 있네.
sacrifice.npc.mason.name.t: 다멘이라 하네. 이 마을 집들과 제단의 돌을 다루는 석공일세. 저 제단을 쌓은 석공의 손자이기도 하지.
sacrifice.npc.mason.job.t: 제단 돌을 보수하는 게 내 일일세. 망치로 두드리면 밑에서 빈 소리가 나네 — 옛 성소의 초석이 아직 땅속에 있고, 거기 새겨진 글은 제단의 계율과 다르지. 그걸 다시 드러낼 용기가 아직 내게 없을 뿐일세.
sacrifice.npc.mason.altar.t: 이 제단을 들어내면 그 밑에 옛 성소의 아궁이가 있네. 거기 새겨진 글은, 이 마을을 지킨 불은 제단이 아니라 저녁마다 다시 켜지는 아궁이였다는 뜻일세. 덜어 내는 자리가 아니라 채워 주는 자리였지.
sacrifice.npc.mason.courage.t: 용기라는 것은, 무너질 듯한 돌을 버티게 하는 것이 아니라, 무너질 사람을 받쳐 주는 돌이 되는 것이지. 나는 요즘 그런 돌을 만들고 싶어서 제단을 새로 다듬고 있네.
sacrifice.npc.mason.widow-song.t: 그 노래는 내 귀에도 익숙하지. 레아가 저녁에 부르면 아궁이 불이 따라 부르는 것 같다네. 제단이 덮어 버린 그 불 말일세.
sacrifice.npc.mason.sanctuary.t: 성소 문지방 돌은 할아버지가 놓은 걸세. 사람들 무릎에 닳아서 가운데가 움푹하지. 돌이 그만큼 닳았으면 사람은 얼마나 닳았겠나.
sacrifice.npc.mason.devotion.t: 할아버지는 헌신하는 마음으로 저 제단을 쌓았다네. 옛 아궁이를 덮으면서도 돌 하나는 일부러 헐겁게 놓았다고 하셨지. 언젠가 누가 다시 열 수 있게.

sacrifice.npc.baker.name: 빵 굽는 세라
sacrifice.npc.baker.greet: 갓 나온 빵이야. ……제단에 올릴 거면 다른 데로 가. 난 거기엔 빵 안 올려.
sacrifice.npc.baker.name.t: 세라야. 마을 빵집에서 아침마다 빵을 굽는 사람이고, 저녁에는 빵을 나누는 사람이야.
sacrifice.npc.baker.job.t: 내 일은 반죽하고, 불 지키고, 빵 내주는 거야. 사제는 나더러 희생할 줄 모르는 사람이래. 그 소리 들을 때마다 나는 불을 더 세게 때 — 내가 지키는 게 무슨 불인지 그 양반은 몰라.
sacrifice.npc.baker.living-love.t: 헌신이라면 말이지, 진짜 희생은 한 번에 목숨을 바치는 게 아니라, 매일 아침 불을 지피고 빵을 내어 주는 거라고 생각해. 제단이 받는 것은 순간이지만, 이 빵은 하루를 살려. 나눈다는 것, 그것이 내가 아는 사랑이야.
sacrifice.npc.baker.love.t: 사랑은 굽는 사람과 먹는 사람 사이에 있는 거지. 불에 타는 게 아니야. 반죽이 차오르듯, 함께 차오르는 것.
sacrifice.npc.baker.widow.t: 레아 몫 빵은 늘 조금 크게 잘라. 그 애는 반을 남겨 두니까. 그 반쪽이 어디로 가는지 나는 알아 — 노아 입으로 가.
sacrifice.npc.baker.garden.t: 마노 밭 무를 갈아 넣고 굽는 빵이 있어. 사제가 보면 배부른 빵이라고 하겠지. 애들은 그 빵을 제일 좋아해.

sacrifice.npc.healer.name: 치유사 노라
sacrifice.npc.healer.greet: 상처가 있으면 보여 주게. 상처 없는 사람이 이 마을에서는 제일 아픈 사람일지도 모르네.
sacrifice.npc.healer.name.t: 노라라네. 외과의 세인 곁에서 풀과 약을 다루는 치유사일세. 상처가 아물게 하는 게 내 몫이지.
sacrifice.npc.healer.job.t: 내 일은 세인이 꿰맨 자리에 약을 바르는 것이라네. 저 고행자 등의 상처도 내가 돌보지. 아무리 아물어도 제단에 다녀오면 다시 터지네 — 상처 내는 법 말고 상처를 안고 사는 법을 가르쳐야 할 텐데.
sacrifice.npc.healer.penitent.t: 그이는 악한 사람이 아닐세. 거룩함을 상처로 증명해야 한다고 배운 가여운 사람이지. 상처 없이도 거룩할 수 있다는 걸 그이가 언젠가 알게 되길 바라네.
sacrifice.npc.healer.burden.t: 짐을 가볍게 하는 것이 아니라, 짐을 나누는 법을 아는 것. 그것이 치유의 시작이지. 아프다고 말할 수 있는 상처는, 이미 반은 나은 상처야.
sacrifice.npc.healer.surgeon.t: 세인은 작년 가을부터 잠을 잘 못 자네. 밤마다 실을 끓이고 또 끓이지. 손이 바쁘면 생각이 덜 아프다나.
sacrifice.npc.healer.courage.t: 용기라…… 아프다고 말하는 데도 용기가 들지. 이 마을에서는 그 말을 하면 장부에서 이름이 내려가니까.

sacrifice.npc.gardener.name: 텃밭지기 마노
sacrifice.npc.gardener.greet: 밭은 다듬을수록 좋아지지. 누군가는 여기서 굶는 게 드높은 일이라지만…… 나는 땅이 손을 기다린다는 걸 알아.
sacrifice.npc.gardener.name.t: 마노야. 마을 뒤편 텃밭을 가꾸지. 호박, 당근, 무 — 제단 앞에서는 배부른 이름이라고 입에도 못 올리는 것들이야.
sacrifice.npc.gardener.job.t: 내 일은 씨를 뿌리고 잡초를 뽑고 물을 주는 일이야. 그리고 수확의 절반을 마을 사람들에게 나누어 주지. 사제는 그 절반까지도 바치라고 해.
sacrifice.npc.gardener.garden.t: 이 텃밭은 마을에서 가장 오래된 자리야. 제단보다 오래됐어. 굶는 것이 거룩하다고 배운 아이들이, 배고파서 이곳에 와서 무를 먹고 가. 짐이 아니라 양식이라고, 나는 그 아이들에게 가르쳐.
sacrifice.npc.gardener.martyr-contest.t: 사제님 얘기라면, 상처 겨루기라니. 장에 다녀오다 보면 제단 앞에서 다투는 것을 봐. 누가 더 굶었는지, 누가 더 아팠는지. 텃밭에서는 그런 건 자라지 않아. 그런 건 아무것도 심지 않으니까.
sacrifice.npc.gardener.altar.t: 긴 겨울 얘기는 우리 할머니한테 들었어. 그해 이 밭 무가 다 옛 성소 솥으로 갔대. 저녁마다 누가 불을 지피면, 다들 한 그릇씩 나눠 먹었다고.
sacrifice.npc.gardener.devotion.t: 헌신? 난 땅한테 헌신해. 땅은 받은 만큼 돌려줘. 제단은 받기만 하지.
sacrifice.npc.acolyte.name: 성소 시종 테사
sacrifice.npc.acolyte.greet: 성소에서는 발소리를 낮춰 주십시오. 사제님께서 기도 중이십니다.
sacrifice.npc.acolyte.name.t: 테사입니다. 노아가 오기 전까지는 제가 사제님 곁의 막내였습니다. 지금은 등잔 기름을 갈고 제단 돌을 닦습니다.
sacrifice.npc.acolyte.job.t: 새벽마다 제단을 닦습니다. 이상하게도 돌 틈을 쓸면 검댕이 묻어 나옵니다. 저 제단에서는 불을 피운 적이 한 번도 없는데요.
sacrifice.npc.acolyte.devotion.t: 사제님께서는 밤마다 손에 감은 천을 새로 감으십니다. 풀어 놓은 천은 언제나 하얗습니다. 저는 그것이 헌신이 깊으셔서라고 믿기로 했습니다.
sacrifice.npc.acolyte.sanctuary.t: 성소 벽의 계율 밑에는 덧칠한 자리가 있습니다. 비가 오는 날이면 그 밑으로 옛 글자가 비칩니다. 읽어 보려 했지만 다 번져 있었습니다.
sacrifice.npc.cord-keeper.name: 줄잡이 키로
sacrifice.npc.cord-keeper.greet: 상처 재러 오신 거면 다른 사람 찾으세요. 저는 올해 안 재요.
sacrifice.npc.cord-keeper.name.t: 키로예요. 제단 날마다 상처 길이를 재는 줄잡이였어요. 제 줄에는 한 치마다 매듭이 하나씩 있어요.
sacrifice.npc.cord-keeper.job.t: 기록사님이 적고, 저는 재요. 작년에 잰 것 중엔 손가락 하나가 제일 컸어요. 그 뒤로는 줄을 감아만 두고 있어요.
sacrifice.npc.cord-keeper.widow.t: 레아 씨 남편 손은 제가 쟀어요. 바친 상처에는 사흘 동안 아무도 손대면 안 된다는 게 제단 법이라서, 외과의 선생님이 문밖에서 기다리셨어요. 사흘째 밤에야 들어가셨는데…… 그다음은 저도 몰라요.
sacrifice.npc.cord-keeper.burden.t: 제 동생은 지금 남동쪽 골목에서 제 등을 때려요. 형이 잰 줄보다 길어지려고요. 짐이라면 그게 제 짐이에요.
sacrifice.npc.bandage-seller.name: 붕대 장수 니코
sacrifice.npc.bandage-seller.greet: 붕대 있어, 소금 있어, 갓 간 칼도 있어. 제단 날이 코앞이라 다들 미리 사 둬.
sacrifice.npc.bandage-seller.name.t: 니코야. 원래는 이웃 마을로 소금 지고 다니던 장사꾼이었는데, 여기선 붕대가 소금보다 잘 팔리더라고.
sacrifice.npc.bandage-seller.job.t: 깨끗한 칼을 파는 게 내 일이야. 어차피 그을 거면 녹슨 칼보단 낫잖아. ……나도 이게 좋은 장사인지는 모르겠어.
sacrifice.npc.bandage-seller.devotion.t: 헌신 덕에 먹고살지. 작년엔 붕대를 마흔 필이나 팔았어. 올해는 사람들이 덜 사 가는데, 이상하게 마음이 놓이네.
sacrifice.npc.bandage-seller.surgeon.t: 세인 선생은 내 붕대를 안 써. 자기가 끓여 말린 천만 쓰지. 나한테 이제 그만 팔라고 한 사람도 그 양반뿐이야.
sacrifice.npc.old-kneeler.name: 무릎 바친 노인 페로
sacrifice.npc.old-kneeler.greet: 앉은 채로 맞아서 미안하오. 이 무릎은 제단에 두고 왔다오.
sacrifice.npc.old-kneeler.name.t: 페로라 하오. 젊을 땐 이 마을에서 제일 먼 들까지 양을 몰던 사람이오.
sacrifice.npc.old-kneeler.job.t: 요즘은 여기 앉아 지나가는 발을 세는 게 일이오. 마흔 날을 제단 돌에 꿇었더니, 그 뒤로는 일어설 일이 없어졌소.
sacrifice.npc.old-kneeler.altar.t: 장부에는 내 무릎이 마흔 날로 적혀 있다더구려. 나는 마흔 날이 아니라, 그 뒤 열두 해를 앉아 있었는데 말이오.
sacrifice.npc.old-kneeler.love.t: 후회는 없소. 다만 손주를 한 번도 업어 주지 못한 게 마음에 걸리오. 사랑은 무릎으로도 하는 것이었는데.
sacrifice.npc.midwife.name: 산파 할라
sacrifice.npc.midwife.greet: 이리 와, 아가. 손 좀 보자. ……열 개 다 있네. 됐어.
sacrifice.npc.midwife.name.t: 할라야. 이 마을 사람 절반은 내 손으로 받았어. 받을 때는 다들 손가락이 열 개였지.
sacrifice.npc.midwife.job.t: 애 받는 게 내 일이었어. 요즘은 태어나는 애보다 장부에 오르는 손이 더 많아서, 나는 여기 앉아 그걸 세.
sacrifice.npc.midwife.widow.t: 레아 남편도 내가 받았어. 울음소리가 마을에서 제일 컸지. 그 애가 노래하면서 제단 쪽으로 걸어가던 날도 나는 여기서 보고 있었어.
sacrifice.npc.midwife.burden.t: 노아도 내가 받았지. 그 애 어미는 집을 다 바치고 빈손으로 떠났어. 애까지 짐으로 지고 갈 수는 없다면서.

# --- 디오네 단서 ---
sacrifice.word.devotion.label: 헌신
sacrifice.word.devotion.hint: 제단이 가르치는 낱말. 자신을 모조리 비우고 태우라는 이름. 순례자가 두려워하게 된 말.
sacrifice.word.burden.label: 짐
sacrifice.word.burden.hint: 제단은 짐이 많을수록 거룩하다고 가르친다. 그러나 치유사는 짐을 나누는 법을 가르친다.
sacrifice.word.witness.label: 증인
sacrifice.word.witness.hint: 본 것을 끝까지 기억하는 사람. 외과의의 손끝과 순례자의 수첩이 그 일을 한다.
sacrifice.fact.dione.altar-priest.label: 제단 사제 크레온
sacrifice.fact.dione.altar-priest.hint: 제단을 지키는 사제. 자신을 온전히 비우라 가르치며, 마을의 순교 경쟁을 부추긴다.
sacrifice.fact.dione.widow.label: 과부 레아
sacrifice.fact.dione.widow.hint: 제단에서 남편을 잃은 과부. 저녁마다 빵 반쪽과 옛 노래로 하루를 지킨다.
sacrifice.fact.dione.pilgrim.label: 순례자 이온
sacrifice.fact.dione.pilgrim.hint: "참된 희생을 찾아 삼 년을 걸어온 순례자. 제단의 기록을 세 벌 베꼈다."
sacrifice.fact.dione.surgeon.label: 외과의 세인
sacrifice.fact.dione.surgeon.hint: 상처를 봉합하는 유일한 외과의. 대부분의 상처가 스스로 만든 것임을 안다.
sacrifice.fact.dione.scribe.label: 기록사 미르
sacrifice.fact.dione.scribe.hint: 제단 장부를 옮겨 적는 기록사. 숫자마다 이름이 있음을 안다.
sacrifice.fact.dione.altar.label: 디오네의 제단
sacrifice.fact.dione.altar.hint: 마을 한가운데의 돌제단. 그 밑에는 더 오래된 아궁이의 초석이 남아 있다.
sacrifice.fact.dione.sanctuary.label: 성소
sacrifice.fact.dione.sanctuary.hint: 사제가 머무는 성소. 벽에 버림의 계율이 새겨져 있다.
sacrifice.fact.dione.garden.label: 뒤편 텃밭
sacrifice.fact.dione.garden.hint: 제단보다 오래된 텃밭. 굶는 아이들이 몰래 와서 무를 먹는 곳.
sacrifice.fact.dione.widow-song.label: 과부의 노래
sacrifice.fact.dione.widow-song.hint: 레아가 남편과 부르던 저녁 노래. 옛 아낙들이 아궁이에 불을 붙이며 부르던, 제단에 바쳐지지 않은 디오네의 마지막 노래.
sacrifice.fact.dione.martyr-contest.label: 순교 경쟁
sacrifice.fact.dione.martyr-contest.hint: 누가 더 아프게 바쳤는지 겨루는 제단의 습속. 상처의 길이와 굶은 날이 숫자로 적힌다.
sacrifice.fact.dione.renunciation-law.label: 버림의 계율
sacrifice.fact.dione.renunciation-law.hint: "제단이 명하는 법. 남기는 것은 욕심이고, 빈손이 되어야 참된 마음이라 부른다."
sacrifice.fact.dione.living-love.label: 아궁이의 사랑
sacrifice.fact.dione.living-love.hint: 옛 성소의 초석이 새긴 말. 덜어내는 자리가 아니라 매일 채워 주는 자리가 지킨 불.
sacrifice.fact.creature.sacrifice-penitent.label: 회개의 고행자
sacrifice.fact.creature.sacrifice-penitent.hint: 악하지 않다. 거룩함을 상처로 증명해야 한다고 배운 이. 제단 앞에서 등을 채찍질한다.

# --- 디오네 추론·위기 ---
sacrifice.deduction.sacrifice.sentence: 희생은 {1}(이)라는 이름으로 나를 지우는 것이 아니라, {2}(으)로 {3}을(를) 내는 것이다
sacrifice.deduction.sacrifice.hint: 제단은 그럴듯한 이름을 내세워 나를 태우라고 가르친다. 과부의 저녁 노래와 아궁이의 초석이 가리키는 희생은 사라지는 일이 아니라, 곁에 남아 견디는 일이다.
sacrifice.crisis.altar.text: 제단 앞에 마을 사람들이 모였다. 사제 크레온이 어린 노아의 손을 들어 올리며 외친다. 사랑은 아낌없이 바치는 것이며, 아이가 온전히 덜어 낼 때 그것이 참된 희생이라고. 노아는 겁먹은 얼굴로 무릎을 꿇는다. 과부 레아가 뒤에서 빵 반쪽을 감추고, 순례자 이온이 지팡이를 움켜쥔다. 외과의 세인은 고개를 숙이고, 기록사 미르는 장부를 펼친다. 이제 그대가 나설 차례다.
sacrifice.option.open-altar.label: 과부의 노래를 불러 사랑과 용기를 보인다
sacrifice.option.open-altar.text: 그대가 제단 앞에서 옛 노래를 부른다. 레아와 어린 노아가 목소리를 보탠다. 사제가 소리치지만, 석공 다멘이 제단 돌을 밀어 옛 아궁이를 드러낸다. 초석에는, 이 마을을 지킨 불은 제단이 아니라 저녁마다 다시 켜지는 아궁이였다고 새겨져 있다. 사제는 흔들리고, 마을 사람들은 상처의 길이를 재던 줄을 내려놓는다. 희생은 나를 지우는 헌신이 아니라 사랑으로 내는 용기임을 디오네가 깨닫는다. 그날 저녁, 제단 대신 빵집에 불이 켜진다.
sacrifice.option.exile-priest.label: 순교 경쟁의 기록을 낭독하고 제단을 닫는다
sacrifice.option.exile-priest.text: 그대가 순례자의 수첩과 기록사의 장부를 꺼내 낭독한다. 손가락 하나, 끼니 하나, 무릎 하나. 제단이 받은 것들의 숫자가 제단 앞에 쌓인다. 사제는 침묵하고, 마을 사람들은 하나둘 고개를 든다. 사제는 제단을 떠나고, 제단은 닫힌다. 그러나 아이는 여전히 매일 저녁 한 끼를 거른다. 디오네는 경쟁을 멈췄지만, 아직 사는 법을 배우지 못했다.

# --- 디오네 능력·생물 ---
sacrifice.ability.meaning.name: 희생의 의미
sacrifice.creature.penitent.name: 회개의 고행자

# --- 명예의 마을 아르곤 (M4 Task 38) ---
town.argon.name: 아르곤
honor.music.title: 아르곤의 가문가

honor.npc.elder.name: 원로 베론
honor.npc.elder.greet: 아르곤의 손님인가. 이름을 대거라. 누구의 줄에 속했는지, 어느 가문의 문장을 이고 있는지.
honor.npc.elder.name.t: 나는 베론. 삼 대째 이 가문의 서열을 지켜 온 원로다. 이 마을에서 이름이란 가문에서 온다. 가문이 없으면 이름도 없지.
honor.npc.elder.job.t: 내 일은 서열을 세고 체면을 지키는 것이다. 누가 위에 서고 누가 아래에 서는지, 그 순서가 흔들리면 마을 전체가 무너진다. 이름을 세는 장부가 곧 나의 법이다.
honor.npc.elder.honor.t: 명예는 가문의 얼굴이다. 그 얼굴에 금이 가면, 죽은 이든 산 이든 그 흠을 씻어 내야 한다. 명예를 지키는 일, 그것만이 이 마을의 질서다.
honor.npc.elder.shame.t: 수치를 아는 것이 곧 명예다. 모욕은 죽음보다 무겁다. 체면을 짓밟힌 자는 살아 있어도 이미 없는 이름이다.
honor.npc.elder.face.t: 체면은 깨지면 다시 붙지 못한다. 그러니 깨지기 전에 지금의 얼굴을 굳게 하라. 무릎은 한 번 꿇으면, 평생 꿇은 사람으로 불린다.
honor.npc.elder.heir.t: 후계자 시온? 그자는 가문을 욕되게 한 자다. 잃어버린 절이라며 지어낸 노래로 시조를 모독했다. 체면을 깨뜨린 자는 이름에서 지운다. 그것이 우리 법이다.
honor.npc.elder.manor.t: 저택 대청의 문장은 내 조부께서 거셨다. 그 뒤로 아르곤의 문은 한 번도 기운 적이 없다.
honor.npc.elder.widow.t: 세린의 남편은 꿇었다. 법대로라면 이름은 남았어야 했지. ……올봄 장부를 새로 베낄 때, 나는 그 이름을 부르지 않았다.
honor.npc.elder.swordmaster.t: 바르칸은 아이들에게 꿇는 법부터 가르친다지. 칼 쥔 손이 무릎부터 배우면, 이 마을은 무엇으로 서겠느냐.

honor.npc.heir.name: 후계자 시온
honor.npc.heir.greet: ……아직 나와 눈을 맞추는 사람이 있군. 이 마을은 지워질 이름과 눈을 맞추지 않는다. 그대는 피하지 않는가.
honor.npc.heir.name.t: 시온이라 한다. 이 가문의 후계자였던 자다. ……'였던'이라는 말이 아직 입에 붙지 않는구나.
honor.npc.heir.job.t: 후계자의 일은 말을 배우고 검을 배우고, 어느 날 가문을 이어받는 것이다. 그런데 나는 노래 한 절 때문에 그 모든 자리를 잃었다.
honor.npc.heir.song.t: 그 노래의 뒷절을 아는가. 우리 가문은 첫 절만 외운다. 꿇지 않은 영주라며. 그러나 뒷절은 다르게 부른다. 그는 꿇은 영주였다. 이름 높은 창을 든 자가 아니라, 모두를 살리기 위해 무릎을 꿇은 자였다.
honor.npc.heir.truth.t: 진실은 체면보다 아프다. 나는 광장에서 그 뒷절을 불렀다. 사람들은 시조가 겁이 나서 꿇었다는 노래로 들었지만, 뒷절은 마을을 살리려 꿇었다고 말한다.
honor.npc.heir.courage.t: 용기란 칼을 드는 것이라고 배웠다. 그러나 노래의 뒷절은 꿇는 것도 용기라고 말한다. 적의 칼날 앞에서 제 체면보다 마을 사람들의 목숨을 먼저 생각하는 것, 그것이 시조의 용기였다.
honor.npc.heir.elder.t: 할아버지는 내게 글자를 장부로 가르쳤다. 내 이름을 처음 써 준 것도 그분 손이었다. 이제 그 손이 내 이름을 지우려 한다.
honor.npc.heir.widow.t: 세린 아주머니 남편이 광장에서 꿇던 날, 나는 열 살이었다. 아무도 그를 일으켜 세우지 않았다. 나도.
honor.npc.heir.face.t: 체면이란 남이 보는 내 얼굴이라고 배웠다. 노래를 부르던 날, 처음으로 내 얼굴을 내가 보았다.

honor.npc.herald.name: 전령관 루카
honor.npc.herald.greet: 가문의 소리를 전하는 전령이다. 오늘 외칠 이름은 누구인가.
honor.npc.herald.name.t: 루카라 한다. 결투 전과 제례 때, 가문의 서열을 외치는 전령이다.
honor.npc.herald.job.t: 내 일은 이름을 부르는 것이다. 서열 순으로, 가문 순으로. 그런데 요즘은 지워야 할 이름을 외치는 일이 더 많다. 그 이름을 부를 때 사람들은 고개를 숙인다.
honor.npc.herald.song.t: 가문의 노래는 내가 보관하는 사본에 전부 있다. 첫 절부터 뒷절까지. ……그런데 제례에서는 늘 첫 절만 부른다. 뒷절을 부르지 않는 것이 이 가문의 법이다.
honor.npc.herald.honor.t: 명예를 내가 어찌 감히. 나는 부를 뿐이다. 위에 선 이름이 옳은 이름이라고. ……하지만 사본의 뒷장을 넘길 때마다, 이 마을이 부르지 않는 이름들이 있다는 것이 떠오른다.
honor.npc.herald.elder.t: 원로 베론은 서열의 주인이다. 이름을 올렸다 내렸다 하는 권한을 쥐고 있지. 그분이 세운 법이 하나 있다. 체면을 깨뜨린 자는 무릎 꿇고 사죄하거나 이름에서 지워진다. 모욕은 죽음보다 무겁다고. 그것이 이 마을의 수치의 법이다.
honor.npc.herald.heir.t: 시온의 이름은 내 목으로 백 번은 외쳤다. 내일 그 이름을 마지막으로 외치라 하면, 목이 따라 줄지 모르겠다.
honor.npc.herald.plaza.t: 광장 판석은 줄마다 색이 다르다. 나는 눈을 감고도 어느 줄이 어디에 서는지 안다. ……눈을 감고 싶은 날이 늘었다.

honor.npc.scribe.name: 가문 기록관 마델
honor.npc.scribe.greet: 가문 기록관이다. 장부를 펴기 전에, 혹시 이름을 올리러 왔는가, 아니면 지우러 왔는가.
honor.npc.scribe.name.t: 마델이라 한다. 이 가문의 이름을 쓰고 지우는 사람이다. 글자는 지워도 자국이 남는다. 그 자국이 자꾸 늘어난다.
honor.npc.scribe.job.t: 서열 장부를 정리하는 일이다. 누가 어떤 줄에서 태어났는지, 어느 이름이 올라가고 내려갔는지. ……그런데 원로는 이 장부에 직접 손을 댄다. 나는 그 부분만은 쓰지 못했다.
honor.npc.scribe.rank.t: 명예를 말하려면 가문 서열법부터다. 태어난 줄이 곧 이름의 순서가 되는 법이다. 그런데 서열 장부를 거슬러 올라가면, 지워진 줄이 하나 있다. 누가 그 줄을 지웠는지는 장부가 알고 있다.
honor.npc.scribe.truth.t: 진실을 쓰려 하면 장부가 무거워진다. 원로가 시온의 이름을 지우려 할 때, 나는 그 진실의 무게를 느꼈다. 이름을 지우는 순간까지 이기는 것은 항상 진실이 아니라 체면이었다.
honor.npc.scribe.heir.t: 시온은 노래 뒷절을 불렀다. 그게 무슨 죄인가. 그러나 이름 장부에서는 진실보다 서열이 먼저다. 원로는 내일 광장에서 시온을 무릎 꿇리고 사죄를 받아낼 것이다. 지우기 전에.
honor.npc.scribe.elder.t: 원로는 해마다 봄이면 장부를 새로 베끼게 한다. 원로가 이름을 부르고, 나는 받아 적는다. 베끼다 빠진 이름은 지운 자국조차 남지 않는다.
honor.npc.scribe.widow.t: 세린 남편의 이름은 지운 것이 아니다. 원로가 그 이름을 부르지 않았고, 나는 부르는 이름만 옮겨 적었을 뿐이다. ……그렇게 말하면 내 손이 깨끗해지는 줄 알았다.

honor.npc.swordmaster.name: 검술 사범 바르칸
honor.npc.swordmaster.greet: 칼을 뽑기 전에, 먼저 무엇을 지키려는지 말해 보게. 거기에 따라 검을 가르치지.
honor.npc.swordmaster.name.t: 바르칸일세. 이 마을에서 검을 가르치네. 하지만 이기는 법은 가르치지 않네. 이기고도 살지 못하는 검을 왜 배우겠나.
honor.npc.swordmaster.job.t: 검을 가르치네. 아이들이 칼 드는 법을 익히기 전에, 무릎 꿇는 법부터 가르치지. 꿇을 줄 모르는 자는 칼을 들어도 검객이 아닐세.
honor.npc.swordmaster.courage.t: 용기라…… 시조 이야기를 아는가. 평생 한 번도 꿇지 않은 영주로 외워지지. 그런데 진짜는 다르네. 그는 칼 앞에서 딱 한 번 꿇었다네, 마을 사람들을 살리려고. 꿇는 것이 칼을 드는 것보다 어렵다고, 나는 그렇게 가르치네.
honor.npc.swordmaster.honor.t: 명예를 체면으로 아는 자는 칼로도 체면만 지키지. 참된 명예는…… 칼날 앞에서 지킬 것과 내려놓을 것을 아는 데 있네.
honor.npc.swordmaster.song.t: 가문의 노래에는 이 마을 검술이 시작된 사연이 담겨 있지. 첫 절은 꿇지 않았다 하고, 뒷절은 꿇었다 하네. 같은 칼, 같은 영주, 다른 노래일세. 그대는 어느 쪽을 부르겠나.
honor.npc.swordmaster.face.t: 체면을 지키려다 칼을 잘못 드는 자를 많이 보았네. 체면은 등에 지면 방패가 되지만, 얼굴에 쓰면 가리개가 되지. 가리개 뒤에서는 싸움도 보이지 않네.
honor.npc.swordmaster.heir.t: 시온은 내 마당에서 칼을 배웠지. 무릎 꿇는 법을 가장 늦게 익힌 아이였네. 그런데 광장에서는 끝내 꿇지 않겠다더군. 이번에는 그게 맞는 걸세.
honor.npc.swordmaster.shame.t: 수치란 지고 나서 고개를 못 드는 마음이지. 나는 아이들에게 진 날일수록 먼저 고개를 들라 가르치네.

honor.npc.brewer.name: 술 빚는 무르
honor.npc.brewer.greet: 어서 오게, 술은 이름을 묻지 않네. 마시고 나면 모두 같은 얼굴이니.
honor.npc.brewer.name.t: 무르라 하네. 이 주막에서 삼십 년째 술을 빚고 있지. 이 마을에서 가장 낮은 줄에 속한 사람이기도 하고.
honor.npc.brewer.job.t: 술을 빚고 잔을 채우는 일이지. 광장에서 이름이 불린 날 밤이면, 윗줄은 자부심에 취하고 지워진 이름의 식구는 구석에서 조용히 잔을 비우네. 여기서는 서열도 가문도 다 술잔에 잠기지.
honor.npc.brewer.heir.t: 시온이 노래를 부르던 날, 나는 광장 끝에서 술잔을 들고 보았네. 그 아이는 모두가 보는 앞에서 뒷절을 끝까지 혼자 불렀지. 몇은 고개를 숙인 채 손뼉을 쳤지만, 대부분은 입을 닫고 윗줄 눈치만 살폈네. ……그 얼굴들이 잊히질 않네.
honor.npc.brewer.widow.t: 세린은 남편이 앉던 구석 자리를 비워 두라 하네. 그래서 나는 그 탁자에 잔 하나를 엎어 두지.
honor.npc.brewer.face.t: 체면 차리는 손님은 잔을 반만 비우고 가네. 남은 반은 내가 마시지. 그러니 이 마을에서 제일 체면 없는 사람이 나일세.
honor.npc.brewer.elder.t: 원로는 이 주막에 발을 들인 적이 없네. 윗줄은 아랫줄이 따른 잔을 받지 않는 법이니. 그 손자는 와서 마셨지만.

honor.npc.child.name: 마을 아이 아린
honor.npc.child.greet: 안녕! 너 혹시 노래 배울 사람? 나는 가문 노래의 뒷부분도 알고 있어!
honor.npc.child.name.t: 아린이야! 마을 아이인데, 다들 이름을 물어보지 않아. 내 줄이 낮아서 그래. 근데 나는 노래를 제일 잘 알아!
honor.npc.child.job.t: 내 일은 노래 부르기야! 광장에서, 주막에서, 제례에서. 어른들은 시조의 자랑노래를 부르는데, 나는 시조의 숨은 노래도 불러. 시조는 꿇은 영주래!
honor.npc.child.song.t: 첫 절은 꿇지 않은 영주를 부르고, 뒷절은 꿇은 영주를 불러. 나는 뒷절이 더 좋아. 자랑하는 노래보다, 진짜였던 노래가 더 재밌거든!
honor.npc.child.shame.t: 수치라면 광장에서 무릎 꿇는 거 알지? 어른들이 말하는 수치야. 근데 시조는 꿇고도 시조잖아. 그래서 나는 수치가 뭔지 잘 모르겠어.
honor.npc.child.widow.t: 세린 아주머니는 자주 울어. 남편 이름이 지워져서. 나는 그 이름도 노래로 기억해. 이름은 지울 수 있어도 노래는 못 지우니까!
honor.npc.child.elder.t: 원로 할아버지는 무서워. 근데 내가 뒷절을 부르면 멈춰 서서 들어. 그러고는 아무 말도 안 하고 가!
honor.npc.child.heir.t: 시온 형이 뒷절을 부를 때 나도 따라 불렀어! 근데 엄마가 내 입을 손으로 막았어. 엄마 손이 떨렸어.

honor.npc.widow.name: 과부 세린
honor.npc.widow.greet: ……노래를 부르러 오셨나요, 아니면 지워진 이름을 찾으러 오셨나요.
honor.npc.widow.name.t: 세린이라 합니다. 남편의 이름을 장부에서 잃은 과부지요. 남편은 광장에서 무릎을 꿇었는데, 그래도 이름이 지워졌어요.
honor.npc.widow.job.t: 제 일은 시장에서 천을 파는 것이에요. 남편이 살아 있을 때는 둘이서 함께 팔았지요. 지금은 그 이름 없이 혼자 서 있게 됐어요. 체면이 남편보다 컸던 마을에서.
honor.npc.widow.shame.t: 수치가 뭔지 아세요? 이 마을에서는 무릎 꿇는 것이요. 그런데 저는 생각해요. 남편이 꿇은 것은 수치가 아니라 사랑이었다고. 칼을 들었다면 그날 저를 두고 갔을 테니까요.
honor.npc.widow.song.t: 그 노래의 뒷절은 제례에서는 사라졌지만, 입에서 입으로 남았어요. 아이들이 부르고, 과부들이 부르고, 지워진 이름들이 부르는 노래. 시조는 꿇은 영주였어요. 도망친 것이 아니라, 살리고자 꿇은 것이지요.
honor.npc.widow.pride.t: 자부심은 칼로 세우는 것이 아니에요. 남편은 자부심 때문에 싸우려 했지만, 저 때문에 꿇었어요. 그 꿇는 순간이, 저는 자부심보다 더 대단했다고 생각해요.
honor.npc.widow.heir.t: 시온이 그 노래를 부르던 날, 저는 울었어요. 남편의 일이 떠올랐거든요. 그 아이는 진실을 부른 것뿐인데, 이 마을은 그 진실을 벌하려 해요. 원로는 내일 광장에서…….
honor.npc.widow.elder.t: 원로님을 원망하지 않으려 해요. 남편을 묻던 날, 그분이 저희 집 문 앞에 서 계신 걸 봤거든요. 끝내 들어오지는 않으셨지만요.
honor.npc.widow.plaza.t: 광장 판석에는 남편이 꿇었던 자리가 있어요. 거기는 아무도 밟지 않아요. 저도요.

honor.npc.mason.name: 석공 바스틴
honor.npc.mason.greet: 돌을 만지며 사는 사람일세. 문장을 다듬는 일을 하는데, 문장 밑에 가려진 돌이 더 오래되었지.
honor.npc.mason.name.t: 바스틴이라 하네. 이 마을 저택과 광장의 돌을 다루는 석공일세. 돌은 서열을 모르지.
honor.npc.mason.job.t: 저택의 문장을 다듬고, 광장의 판석을 까는 일을 하네. 그리고 어쩌다 보수할 때면, 옛 돌에 새겨진 글을 마주하게 되지. 사람들이 잊으려는 글을.
honor.npc.mason.manor.t: 가문의 저택 말인가. 문장에는 꿇지 않은 영주가 새겨져 있지. 그런데 옛 대청 벽돌에는 다른 그림이 남아 있네. 무릎 꿇은 영주일세. 누군가 그 돌 위에 문장을 덮어 걸었지.
honor.npc.mason.rank.t: 수치라면 말이지, 서열 장부는 원래 대청 돌기둥에 새겼다네. 그런데 맨 윗줄 하나가 정으로 긁혀 있지. 해 질 녘 빛이 비스듬히 들면, 긁힌 자국 사이로 글자 모양이 아직 비친다네.
honor.npc.mason.face.t: 돌은 체면이 없어서 좋네. 금이 가면 가는 대로 드러나지. 사람은 체면으로 금을 감추지만, 돌은 그러지 못하네. 그래서 나는 돌을 믿네.
honor.npc.mason.plaza.t: 광장 판석은 줄마다 돌이 다르네. 윗줄은 흰 돌, 아랫줄은 강돌일세. 그런데 다 같은 비에 같이 닳지.
honor.npc.mason.elder.t: 원로가 올해도 저택 문장을 닦으라 하더군. 해마다 하는 일인데, 이번에는 대청 벽을 더 두껍게 덮으라 했네.

honor.npc.seamstress.name: 바느질꾼 리안
honor.npc.seamstress.greet: 천은 이름을 묻지 않아요. 어떤 줄에 속했든, 옷감은 그저 몸을 감쌀 뿐이지요.
honor.npc.seamstress.name.t: 리안이라 해요. 이 마을의 옷을 짓는 바느질꾼이에요. 제례복도, 수치 의식 때 입는 옷조차도 제가 지었지요.
honor.npc.seamstress.job.t: 제례복의 금실을 매고, 문장을 옷깃에 새기지요. 그런데 수치 의식 때는 그 문장까지 가린 옷을 만들어요. 체면을 지키는 가문이, 체면을 버리라고 입히는 옷 말이지요.
honor.npc.seamstress.face.t: 체면을 지키려고 옷을 곧게 여미지만, 정작 무릎 꿇는 날에는 옷이 모두 구겨져요. 체면은 입는 옷이 아니라, 지키는 마음이어야 하는데요.
honor.npc.seamstress.widow.t: 세린 부인의 옷은 최근 제가 다 기웠어요. 이름이 지워진 남편의 옷까지도. 그 옷을 정성껏 기울 때마다, 지워진 이름을 대신해 꿰매는 마음이 들었어요.
honor.npc.seamstress.shame.t: 수치 의식 옷에는 소매가 없어요. 손을 감출 데가 없게요. 그 옷을 지을 때만은 바늘이 자꾸 제 손을 찔러요.
honor.npc.seamstress.heir.t: 시온 도련님은 제가 지은 제례복을 입고 그 노래를 불렀어요. 그 옷이 지금 제 방에 다시 와 있어요. 옷깃의 문장을 떼어 내라고요.
honor.npc.nurse.name: 늙은 유모 넬다
honor.npc.nurse.greet: 도련님을 찾아오신 손님인가요. 요즘 저택에서는 발소리도 낮추고 다녀요.
honor.npc.nurse.name.t: 넬다예요. 이 저택에서 두 대를 길렀어요. 원로 나리의 아드님, 그리고 그 아드님의 아드님 시온 도련님까지요.
honor.npc.nurse.job.t: 저택 살림을 보고, 밤이면 등잔을 끄러 다녀요. 옛 대청 등잔은 늘 제일 늦게 꺼요. 누가 늦게까지 거기 계시거든요.
honor.npc.nurse.elder.t: 원로 나리는 밤마다 등잔 하나 들고 옛 대청 문장 앞에 서 계세요. 무얼 보시는지는 여쭌 적이 없어요. 여쭐 일이 아니니까요.
honor.npc.nurse.heir.t: 도련님 어릴 적에 재울 때 부르던 노래가 있어요. 원로 나리 어머님께 배운 거예요. ……끝까지 불러 드려야 꼭 잠이 드셨지요.
honor.npc.drummer.name: 북잡이 게일
honor.npc.drummer.greet: 북채 밟지 마. 제례 앞이라 가죽을 말리는 중이야.
honor.npc.drummer.name.t: 게일. 제례 때 북을 쳐. 아버지도 쳤고, 할아버지도 쳤지.
honor.npc.drummer.job.t: 전령관이 이름을 외치기 전에 세 번, 노래를 시작할 때 한 번 쳐. 북은 줄을 안 가려. 누구 이름 앞에서든 같은 소리가 나.
honor.npc.drummer.plaza.t: 할아버지가 물려준 북보에는 노래가 끝난 뒤에도 장단이 한 절만큼 더 남아 있어. 할아버지는 그 장단까지 꼭 다 쳤대. 아무도 안 부르는데.
honor.npc.drummer.herald.t: 루카는 그 남은 장단이 오면 입술만 달싹거려. 소리는 안 내고. 나는 못 본 척 북만 쳐.
honor.npc.matchmaker.name: 중매쟁이 미샤
honor.npc.matchmaker.greet: 어머, 처음 보는 얼굴이네요. 어느 줄인지 모르니 누구랑 맞춰 드려야 할지 모르겠네요.
honor.npc.matchmaker.name.t: 미샤예요. 아르곤의 혼사는 거의 다 제 손을 거쳐요. 장부를 외우지 못하면 이 일은 못 해요.
honor.npc.matchmaker.job.t: 혼사는 장부에서 시작돼요. 한 줄 차이면 괜찮고, 두 줄이면 어른들 얼굴이 붉어지고, 세 줄이면 아무도 말을 꺼내지 않아요.
honor.npc.matchmaker.face.t: 체면 때문에 깨진 혼사가 제 손을 거친 것만 열둘이에요. 그 둘이 서로 잊었다는 소식은 아직 한 번도 못 들었어요.
honor.npc.matchmaker.heir.t: 시온 도련님 혼처로 줄을 선 집이 셋이나 있었어요. 그 노래 뒤로 다들 슬그머니 발을 뺐지요. 노래 한 절이 혼사 셋을 깬 셈이에요.
honor.npc.proxy.name: 대리 결투꾼 로크
honor.npc.proxy.greet: 칼 배우러 온 거면 사범한테 가. 나는 남의 체면을 대신 지켜 주고 돈 받는 사람이야.
honor.npc.proxy.name.t: 로크. 아랫줄 출신이라 내 이름 걸고 싸울 일은 없어. 늘 남의 이름을 걸고 싸우지.
honor.npc.proxy.job.t: 윗줄 집 아들이 모욕을 당하면 그 집이 나를 사. 내가 이기면 그 집 체면이 서고, 지면 내 팔이 부러지지. 어느 쪽이든 그 집 아들 얼굴엔 흠 하나 안 나.
honor.npc.proxy.pride.t: 자부심? 그건 나를 산 집 몫이야. 나한테 남는 건 흉터뿐이고.
honor.npc.proxy.swordmaster.t: 사범한테 처음 배운 게 무릎 꿇는 법이었어. 덕분에 지는 날에도 덜 다쳐. 사범이 그런 뜻으로 가르친 건 아니겠지만.
honor.npc.mourner.name: 곡비 실라
honor.npc.mourner.greet: 곡을 청하러 오셨소? 이 마을 높은 집 사람들은 제 손으로 울지 않으니.
honor.npc.mourner.name.t: 실라라 하오. 사십 년을 남의 장례에서 울었소. 정작 내 남편을 묻던 날에는 눈물이 나지 않더이다.
honor.npc.mourner.job.t: 윗줄 집에 상이 나면 내가 대신 운다오. 상주는 꼿꼿이 서 있어야 체면이 서니. 우는 값도 줄에 따라 다르오.
honor.npc.mourner.shame.t: 울음이 수치라니, 이상한 법이오. 내가 울면 그 집 사람들 어깨가 조금씩 내려가오. 내가 대신 우는 게 아니라, 그들이 내 소리 뒤에 숨어서 우는 거라오.
honor.npc.mourner.widow.t: 세린의 남편 장례에는 곡을 청한 이가 없었소. 광장에서 꿇은 사람은 곡도 받지 못하니. 그래서 그날 밤 나 혼자 가서 값 없이 울었소.

# --- 아르곤 단서 ---
honor.word.honor.label: 명예
honor.word.honor.hint: "이 마을이 체면과 가문 서열에 붙이는 이름. 그러나 노래의 뒷절은 같은 말을 다르게 부른다."
honor.word.shame.label: 수치
honor.word.shame.hint: 모욕은 죽음보다 무겁다. 그래서 있었던 일이 숨겨지고, 시조가 꿇었다는 사실이 노래에서 지워졌다.
honor.word.pride.label: 자부심
honor.word.pride.hint: 칼로 세우고, 광장에서 제 이름이 불릴 때 부푸는 마음. 과부 세린은 남편이 꿇던 순간이 그보다 컸다고 말한다.
honor.word.face.label: 체면
honor.word.face.hint: 깨지면 다시 붙지 못하는 가문의 얼굴. 이 마을은 그것을 목숨보다 무겁게 여긴다.
honor.fact.argon.elder.label: 원로 베론
honor.fact.argon.elder.hint: 삼 대째 서열을 지켜 온 원로. 이름을 올렸다 내렸다 하는 장부를 쥐고 있다.
honor.fact.argon.heir.label: 후계자 시온
honor.fact.argon.heir.hint: 노래의 잃어버린 뒷절을 부른 후계자. 가문의 체면에 금을 내, 이름이 지워질 위기에 섰다.
honor.fact.argon.herald.label: 전령관 루카
honor.fact.argon.herald.hint: 서열을 외치는 전령. 가문의 노래 사본을 전부 갖고 있지만, 제례에는 앞부분만 부른다.
honor.fact.argon.swordmaster.label: 검술 사범 바르칸
honor.fact.argon.swordmaster.hint: 이기게 가르치지 않는 사범. 칼 드는 법보다 무릎 꿇는 법을 먼저 가르친다.
honor.fact.argon.widow.label: 과부 세린
honor.fact.argon.widow.hint: 남편이 광장에서 무릎을 꿇고도 이름이 지워진 과부. 노래 뒷절을 아는 사람들 가운데 하나다.
honor.fact.argon.manor.label: 가문의 저택
honor.fact.argon.manor.hint: 서열이 새겨진 대문을 가진 저택. 문장에는 꿇지 않은 영주가 그려져 있지만, 옛 대청의 돌은 다르게 말한다.
honor.fact.argon.plaza.label: 광장
honor.fact.argon.plaza.hint: 이름이 외쳐지는 곳. 수치 의식이 열리고, 지워진 이름을 모두가 지켜보는 곳.
honor.fact.argon.lineage-song.label: 가문의 노래
honor.fact.argon.lineage-song.hint: 자랑스러운 옛 노래. 첫 절은 꿇지 않은 영주를 부르고, 잃어버린 뒷절은 꿇은 영주를 부른다.
honor.fact.argon.family-rank.label: 가문 서열법
honor.fact.argon.family-rank.hint: 태어난 줄이 이름의 순서가 되는 법. 장부에는 지워진 줄이 하나 남아 있다.
honor.fact.argon.humiliation-rule.label: 수치의 법
honor.fact.argon.humiliation-rule.hint: 체면을 깨뜨린 자는 무릎 꿇고 사죄하거나, 이름에서 지워진다. 모욕은 죽음보다 무겁다는 법.
honor.fact.argon.kneeling-lord.label: 무릎 꿇은 시조
honor.fact.argon.kneeling-lord.hint: 적의 칼날 앞에서 마을을 살리려 무릎을 꿇은 초대 영주. 후손들은 그것을 자랑으로 바꿔 부른다.
honor.fact.creature.honor-braggart.label: 자랑질하는 결투가
honor.fact.creature.honor-braggart.hint: "악하다. 체면을 걸고 싸움을 거는 자. 이기는 것이 곧 자랑이라 믿어, 누구든 칼자루를 내미는 자에게 덤벼든다."

# --- 아르곤 추론·위기 ---
honor.deduction.honor.sentence: 참된 {3}은(는) 체면을 지키는 굳은 얼굴이 아니라, {1}을 말하는 {2}(으)로 세우는 것이다
honor.deduction.honor.hint: "아르곤은 체면과 가문 서열을 한 이름으로 부른다. 노래의 뒷절과 검술 사범의 말을 끝까지 들어 보라."
honor.crisis.lineage.text: 광장에 마을 사람들이 가문 순으로 모였다. 원로 베론이 서열 장부를 높이 들고 외친다. 가문의 이름을 지키는 자리에, 가문을 욕되게 한 자가 있다. 후계자 시온은 노래를 지어내 시조를 모독했다. 체면을 깨뜨린 자는 무릎을 꿇고 사죄하거나, 이름에서 지워진다. 전령관 루카가 장부를 펼치고, 사람들은 숨을 죽인다. 후계자 시온은 무릎을 꿇지 않고 서서 고개를 든다. 이제 그대가 나설 차례다.
honor.option.truth-lineage.label: 가문의 노래 뒷절을 끝까지 불러 진실을 알린다
honor.option.truth-lineage.text: 그대가 침묵을 깨고 가문의 노래를 부르기 시작한다. 먼저 첫 절, 모두가 아는 꿇지 않은 영주. 그리고 잃어버린 뒷절, 꿇은 영주. 시조는 도망치지 않았다. 모두를 살리려, 적의 칼날 앞에 무릎을 꿇었다. 아이 아린이 따라 부르고, 과부 세린이 목소리를 보탠다. 검술 사범이 고개를 끄덕이고, 광장의 사람들이 하나둘 뒷절을 배워 간다. 원로의 장부는 내려지고, 시온은 사죄하지 않는다. 명예는 얼굴을 굳히는 데 있지 않고, 진실을 말하는 용기로 세우는 데 있음을 아르곤이 알았다.
honor.option.exile-elder.label: 서열 장부의 지워진 줄을 낭독하고 원로를 내친다
honor.option.exile-elder.text: 그대가 기록관 마델과 석공 바스틴의 말을 모아, 서열 장부의 지워진 줄을 낭독한다. 그 맨 윗줄에는 원래 시조가 마을을 살리려 무릎 꿇은 날이 적혀 있었고, 원로의 집안이 그 굴욕을 감추려 대대로 그 줄을 덮어 왔다. 원로 베론은 고개를 숙이고, 광장은 술렁인다. 원로는 이름에서 지워지고 마을을 떠난다. 그러나 서열 장부는 여전히 남아, 사람들은 다시 줄을 세우기 시작한다. 아르곤은 거짓된 얼굴을 벗었지만, 아직 참된 명예를 세우는 법은 배우지 못했다.

# --- 아르곤 능력·생물 ---
honor.ability.truth.name: 진실의 검
honor.creature.braggart.name: 자랑질하는 결투가

# --- 영성의 마을 엘리아 (M4 Task 39) ---
town.elia.name: 엘리아
spirituality.music.title: 엘리아의 숨결

spirituality.npc.monk.name: 주지 스님 다루
spirituality.npc.monk.greet: 엘리아에 온 이방인인가. 명상을 원한다면 면허부터 보여라. 고요는 값없이 주어지지 않는다.
spirituality.npc.monk.name.t: 다루다. 이 명상당을 스물여섯 해 지켰다. 새벽에 문을 가장 먼저 여는 것도, 밤에 가장 늦게 닫는 것도 나다.
spirituality.npc.monk.job.t: 마음의 질서를 지킨다. 선방에는 절차를 아는 자만 앉을 수 있고, 그것을 증명하는 것이 면허다. 면허 없이 앉는 것은 배교다.
spirituality.npc.monk.ritual.t: 의례는 형식이다. 새벽 예불, 오후 독경, 저녁 향—그 순서를 아는 자는 숨이 어디서 멈춰야 하는지도 안다. 그것을 모르고 홀로 앉은 자가 어떻게 되는지, 나는 보았다.
spirituality.npc.monk.prayer.t: 기도에는 단계가 있다. 따라 하는 기도, 함께하는 기도, 홀로 하는 기도. 단계마다 면허가 따로 있고, 서명은 모두 내가 한다.
spirituality.npc.monk.silent-chant.t: 성스러운 노래라…… 그런 것은 듣지 못했다. 명상당에는 그런 노래가 없다. 혹시 전해 듣는 노래가 있다면, 그것은 면허 없는 자들이 지어낸 것일 뿐이다.
spirituality.npc.monk.truth.t: 진실이라. 명상당에 필요한 것은 진실이 아니라 절차다. 절차만 지키면 누구든 거룩해진다. 진실을 찾아 헤매는 자는 제 숨부터 잃는다.
spirituality.npc.monk.hermit.t: 펠라라. ……내게 처음 숨 세는 법을 가르친 사람이다. 그 이름은 이제 장부에 없다. 그것으로 됐다.
spirituality.npc.monk.novice.t: 삼 년을 바닥만 닦은 아이다. 서두르지 않는 법부터 배워야 한다. 마음만 앞서 홀로 앉았던 아이를, 나는 새벽에 안고 나온 적이 있다.
spirituality.npc.monk.breath.t: 숨에도 끝이 있다. 그 끝이 어디인지 모르는 자를 선방에 들일 수는 없다.

spirituality.npc.novice.name: 견습 스님 이안
spirituality.npc.novice.greet: 아, 혹시 면허 시험을 보러 오셨나요? 저도 곧 시험을 봐요.
spirituality.npc.novice.name.t: 이안이라고 해요. 삼 년째 견습으로 지내고 있어요. 면허를 받으면 드디어 안쪽 선방에 앉을 수 있어요.
spirituality.npc.novice.job.t: 매일 아침 명상당 앞방 바닥을 닦아요. 안쪽 선방엔 아직 못 들어가지만, 앉으시는 분들 발밑은 닦을 수 있으니까요. 주지 스님은 이것도 수행이라시는데, 수행인지 시험인지 저는 아직 모르겠어요.
spirituality.npc.novice.prayer.t: 기도는 면허를 받고 나서야 배울 수 있다고 해요. 그런데 저는 은자의 노래를 들은 적이 있어요. 면허 없는 소리인데, 이상하게 제일 기도 같았어요.
spirituality.npc.novice.meditation-hall.t: 안쪽 선방 문은 늘 잠겨 있어요. 면허를 보여 드리면 열리고, 없으면 문 앞에 서 있어야 해요. 저는 삼 년째 그 문 앞에 서 있어요.
spirituality.npc.novice.silent-chant.t: 그 노래…… 저도 몰래 들었어요. 늙은 은자가 서고 뒤 담 밑에서 숨처럼 내쉬는 노래요. 주지 스님 귀에 들어가면 큰일 나지만, 듣고 나면 마음이 비워져요. 두려움까지요.
spirituality.npc.novice.monk.t: 주지 스님은 새벽마다 선방 문을 제일 먼저 여세요. 아무도 없는 방인데도, 한 자리 한 자리 손으로 짚어 보고 나오세요.
spirituality.npc.novice.widow.t: 이레 아주머니는 제가 바닥을 닦는 동안 뜰 건너편에 앉아 계세요. 걸레질 소리에 맞춰 숨을 세신대요.

spirituality.npc.scribe.name: 면허 서기관 세온
spirituality.npc.scribe.greet: 면허 발급 기록이다. 신청은 초하루, 갱신은 계절마다. 선방 자리는 장부에 적힌 순서대로 돈다.
spirituality.npc.scribe.name.t: 세온이라 한다. 명상당 서고에서 면허를 발급하고 기록하는 서기관이다.
spirituality.npc.scribe.job.t: 이 서고에는 삼백 년 치 장부가 있다. 이백구십칠 해 동안은 앉은 사람의 이름과 그날의 기도를 적었고, 마지막 세 해는 면허 번호와 갱신일을 적는다. 장부에 없는 자의 명상은 장부 밖의 영성이다.
spirituality.npc.scribe.ritual.t: 의례는 장부처럼 정확해야 한다. 절차가 어긋나면 면허가 거둬들여지고, 면허가 거둬들여지면 명상이 금지되지. 나는 그 거둬들임을 기록하는 사람이다.
spirituality.npc.scribe.prayer.t: 옛 장부는 어느 장을 펼쳐도 '기도'라는 낱말로 시작한다. 새 장부는 '면허'로 시작한다. 같은 서가의 같은 종이인데, 첫 낱말만 바뀌었다.
spirituality.npc.scribe.library.t: 이 서고가 명상당의 심장이다. 가장 오래된 장부는 종이가 얇아져서, 등잔에 비추면 삼백 년 동안 적힌 이름들이 한꺼번에 비친다.
spirituality.npc.scribe.hermit.t: 그런 이름은 장부에 없다. ……서고 등잔 기름이 달마다 조금씩 더 줄어드는 것도 장부에는 없지.
spirituality.npc.scribe.monk.t: 주지께서는 밤마다 그날 장부를 손가락으로 짚어 내려가신다. 들어간 이름마다 나온 시각이 적혔는지, 하나도 빠짐없이.
spirituality.npc.scribe.pilgrim.t: 맨 첫 장부의 첫 줄에는 이름이 없다. 순례자, 해 뜰 녘부터 질 녘까지 앉았다 감. 적힌 것은 그뿐이다.

spirituality.npc.healer.name: 치유사 루아
spirituality.npc.healer.greet: 숨이 먼저야, 자격이 나중이지. 아픈 사람에게 면허를 묻는 법은 없어.
spirituality.npc.healer.name.t: 루아라고 해. 이 마을의 아픈 사람들을 돌봐. 명상당 앞방 한구석을 빌려 환자를 눕히지만, 나한테 면허는 없어.
spirituality.npc.healer.job.t: 병든 사람은 면허를 내밀지 않아. 숨을 쉬지 못하는 사람, 불면에 시달리는 사람, 가슴이 답답한 사람. 나는 그들의 숨결을 먼저 들어. 그게 내 기도야.
spirituality.npc.healer.breath.t: 숨은 면허가 필요 없어. 들이쉬고 내쉬는 것, 그것만으로 마음은 비워져. 면허를 기다리는 동안 숨을 참으면, 마음은 더 옥죄일 뿐이야.
spirituality.npc.healer.breath-song.t: 예전엔 아픈 사람 곁에서 아이들과 숨 노래를 불렀어. '숨은 산다, 떨림은 쉰다.' 지금은 명상당에서 그 노래를 부르면 면허를 거둬 간대.
spirituality.npc.healer.courage.t: 용기는 면허를 내미는 일이 아니야. 아픈 사람의 손을 잡고, 금지된 노래 한 소절을 부르는 일이지. 나도 언젠가 그 한 소절을 부를 거야.
spirituality.npc.healer.widow.t: 지난겨울 이레 남편의 숨을 마지막까지 들은 게 나야. 그이는 끝까지 셋을 세고 내쉬었어. 이레는 아직도 그 셋을 세고 있고.
spirituality.npc.healer.ritual.t: 의례도 처음엔 약이었을 거야. 그런데 약도 양을 넘기면 독이 돼.

spirituality.npc.hermit.name: 은자 펠라
spirituality.npc.hermit.greet: ……쉿. 장부에서 내 이름은 내 손으로 지웠어. 그래도 말을 걸어 오는 사람에게는 조용한 대답 하나쯤 빚지고 있지.
spirituality.npc.hermit.name.t: 펠라. 한때는 이 명상당의 스님이었어. 면허가 아니라 노래로 기도하던 시절이 있었지. 지금은 서고 그늘에서 이름 없이 살아.
spirituality.npc.hermit.job.t: 나는 명상을 해. 면허도 예불도 없이, 숨을 세고 소리 없는 노래를 부르지. 소리를 내지 않아야 들리는 진실이 있거든.
spirituality.npc.hermit.spirit.t: 영은 붙잡는 게 아니야. 숨이 가늘어질 때 어느새 마음에 와 앉지. 면허는 그 자리를 맡아 두는 표였는데, 언제부턴가 표만 남고 영은 쫓겨났어.
spirituality.npc.hermit.silent-chant.t: 듣고 있구나. 이 노래는 입 밖으로 내지 않아. 진실도 사랑도 용기도, 소리 내어 외치면 흩어지고 마음속에서 함께 숨 쉴 때만 살아 있거든.
spirituality.npc.hermit.truth.t: 진실. 그 낱말을 입에 올리기도 이제는 조심스러워. 면허는 종이에 있지만 진실은 숨에 있어. 그리고 숨은 혼자 쉬는 게 아니야.
spirituality.npc.hermit.courage.t: 용기. 이 마을에서 제일 모자란 거야. 면허 없이는 앉지도 못하는 때에, 그 면허를 내려놓고 앉는 것. 내가 아는 용기는 그것뿐이야.
spirituality.npc.hermit.monk.t: 다루는 내 아우 같은 애야. 숨 세는 법을 처음 가르친 게 나지. 그 애가 장부를 만든 건 사람을 잃기 싫어서였어. 지키는 법을 잘못 골랐을 뿐이야.
spirituality.npc.hermit.breath.t: 숨은 셋이면 돼. 들이쉬고, 머물고, 내쉬고. 그 사이에 마음이 앉을 자리가 생겨.

spirituality.npc.gardener.name: 정원지기 호레
spirituality.npc.gardener.greet: 뜰에는 면허가 필요 없다네. 씨앗을 묻으면 면허 없이도 자라지.
spirituality.npc.gardener.name.t: 호레라네. 명상당 앞뜰에서 약초와 꽃을 가꾸지. 스님들이 마음을 비우는 동안, 나는 흙을 고른다네.
spirituality.npc.gardener.job.t: 이 뜰은 명상당보다 오래됐다네. 순례자가 약초를 심고 간 자리지. 숨이 가쁜 사람, 걱정에 잠 못 드는 사람을 달래는 풀들인데, 면허는 여기서 안 자란다네.
spirituality.npc.gardener.breath.t: 숨은 밭과 같다네. 가꾸면 깊어지고, 내버려 두면 메마르지. 나는 호미질 한 번에 숨 한 번을 고른다네. 그게 내 유일한 의례라네.
spirituality.npc.gardener.love.t: 사랑은 뜰의 물이지. 면허 번호에 물을 주는 사람은 없다네. 우리는 사람에게, 꽃에게, 가끔은 낯선 이방인에게도 물을 준다네.
spirituality.npc.gardener.courtyard.t: 이 뜰은 명상당 문 앞까지 이어져 있지. 면허를 사러 가는 사람도, 면허를 잃고 나오는 사람도 이 길을 지나간다네. 풀은 그 모두를 똑같이 바라본다네.
spirituality.npc.gardener.hermit.t: 펠라 말인가. 새벽마다 서고 뒤 담 밑에 앉아 있지. 그 자리 풀만 눌려 있어서 내가 안다네.
spirituality.npc.gardener.prayer.t: 기도라. 나는 씨앗을 묻을 때 흙을 세 번 두드린다네. 누가 가르쳐 준 건 아닌데, 그러고 나면 싹이 잘 트더군.

spirituality.npc.child.name: 아이 소미
spirituality.npc.child.greet: 쉿! ……휴, 스님인 줄 알았어. 나 노래하던 중이었거든.
spirituality.npc.child.name.t: 소미야! 기숙사에서 스님들이랑 살아. 스님들은 나더러 '작은 떠들썩함'이래. 근데 나는 노래할 때 제일 조용해.
spirituality.npc.child.job.t: 내 일은 노래하는 거야! 호레 할아버지가 풀을 뽑으면 나는 옆에서 소리 없는 노래를 불러. 입만 벙긋벙긋. 주지 스님한테 들키면 혼나지만, 그러고 나면 마음이 하늘하늘해져.
spirituality.npc.child.silent-chant.t: 그 노래가 내 노래야! 은자 할아버지가 서고 뒤 담 밑에서 부르는 걸, 나는 나무 뒤에 숨어서 따라 해. 소리 내면 안 된대서 입만 벙긋. 근데 진짜로 마음이 맑아져. 신기하지?
spirituality.npc.child.prayer.t: 기도는 배워 본 적 없어. 면허를 받아야 기도할 수 있대. 근데 나는 그 노래가 기도 같아. 면허 받는 법은 아직 몰라.
spirituality.npc.child.hermit.t: 은자 할아버지는 입만 벙긋해. 근데 할아버지가 벙긋하면 새들도 조용해져. 진짜야!
spirituality.npc.child.monk.t: 주지 스님은 무서워. 근데 저번에 내가 명상당 앞에서 깜빡 잠들었는데, 깨 보니까 스님 옷이 덮여 있었어. 비밀이야.

spirituality.npc.brewer.name: 찻집 주인 도란
spirituality.npc.brewer.greet: 명상당 축복을 받은 차 한 잔 하겠나? 농담일세. 내 주전자엔 축복도 면허도 안 붙어 있네.
spirituality.npc.brewer.name.t: 도란이라네. 공양간 한켠에서 보리차와 약주를 내는 찻집 주인이지. 이 마을에서 제일 거룩하지 않은 일을 하는 사람이 바로 날세.
spirituality.npc.brewer.job.t: 물을 끓이고, 차를 우리고, 이야기를 듣는 게 내 일이네. 삼 년 전까지는 누구나 뜰을 지나 명상당에 들어가 조용히 앉았다 나왔지. 지금은 면허값에 지친 사람들이 여기 와서야 숨을 돌린다네.
spirituality.npc.brewer.license-rule.t: 기도라…… 면허 제도 이야기겠지. 주지가 명상당 문 앞에서 면허를 팔기 시작한 지 삼 년일세. 그전엔 누구나 들어가 조용히 앉아 있었지. 지금은 그 조용한 앉음에 값이 붙었네.
spirituality.npc.brewer.ritual.t: 의례라. 새벽 예불에 면허 없는 자는 향도 피우지 못하지. 그런데 옛 기록에는, 순례자가 향 없이도 기도했다고 적혀 있다네.
spirituality.npc.brewer.monk.t: 다루 스님도 예전엔 저 자리에서 보리차를 마셨지. 삼 년 전 겨울 뒤로는 발을 끊었네. 따뜻한 걸 마시면 밤에 졸린다나.
spirituality.npc.brewer.novice.t: 이안은 시험비를 모은다고 여기서 장작을 패 주네. 한 짐에 동전 한 닢. 아직 반도 못 모았지.

spirituality.npc.gatekeeper.name: 수문장 구르
spirituality.npc.gatekeeper.greet: 선방 문지기일세. 면허 없이는 그 문을 지나지 못하네. ……물론 이 마을에 문이 하나뿐인 건 아니지만.
spirituality.npc.gatekeeper.name.t: 구르라 부르게. 마을 어귀와 선방 문을 지키는 수문장일세. 문은 둘인데, 면허로 막는 건 하나뿐이지.
spirituality.npc.gatekeeper.job.t: 선방 문은 면허로 막고, 마을 어귀는 열어 두지. 그런데 요즘 남동쪽 담 모퉁이에 가짜 스님이 숨어 있다가, 지나는 사람을 붙들고 명상을 판다네. 면허도 없이 말일세. 그자가 정말 위험하네.
spirituality.npc.gatekeeper.fake-monk.t: 그 가짜 스님 말인가. 두건을 쓰고 목탁을 두드리며 명상의 은혜를 헌납하라 하지. 지갑을 한 번 열면 또 헌납, 두 번 열면 이름까지 받아 적어 가네. 주지는 면허로 사람을 막지만, 그자는 사람을 털어 가는 걸세.
spirituality.npc.gatekeeper.courtyard.t: 명상당 뜰 말인가. 뜰 안은 여전히 조용한데, 뜰 밖이 시끄러워졌네. 면허 없이 앉아 숨만 고르던 사람들이 이제는 돈을 내고 시험을 봐야 하니.
spirituality.npc.gatekeeper.monk.t: 주지와는 같은 해에 이 마을에 왔네. 그때 그는 나더러 문을 지키라 하지 않고, 열어 두라 했지. 사람은 변하는 법일세.
spirituality.npc.gatekeeper.novice.t: 견습 아이가 밤마다 선방 문고리를 한 번씩 쥐어 보고 가더군. 잠긴 걸 알면서도. 나는 못 본 척하네.

spirituality.npc.widow.name: 과부 이레
spirituality.npc.widow.greet: 저는 면허가 없어서 선방에 들지 못해요. 그래서 뜰 건너 문이 보이는 이 자리에서, 그이가 가르쳐 준 대로 숨을 세요.
spirituality.npc.widow.name.t: 이레예요. 그이는 면허를 받을 수 있었는데, 저 혼자 문 밖에 남겨 두기 싫다고 마지막 시험을 보지 않았어요.
spirituality.npc.widow.job.t: 그이가 남긴 건 숨 노래 하나예요. 지난겨울 그이가 떠난 뒤로도, 저녁마다 둘 몫의 숨을 세요. 장부엔 그이 이름이 없으니 제가 세어 줄 수밖에요.
spirituality.npc.widow.breath-song.t: 숨 노래는 옛날부터 아낙네들이 부르던 노래예요. '숨은 산다, 떨림은 쉰다' 하고요. 면허 제도가 생기기 전에는 이것이 기도였어요. 우리는 이 노래로 명상을 했지요.
spirituality.npc.widow.love.t: 사랑은 면허를 내밀지 않아요. 그이가 시험을 그만둔 것도 저를 문 밖에 혼자 두지 않으려는 마음이었어요. 사랑은 명상이 아니어도, 명상보다 깊은 숨을 쉬게 해요.
spirituality.npc.widow.courage.t: 용기…… 요즘은 그 숨 노래를 명상당 문 앞에서 소리 내어 부르고 싶어요. 누가 나무라도 좋아요. 참된 명상은 두려움에서 놓여나는 거라고, 그이가 가르쳐 줬거든요.
spirituality.npc.widow.healer.t: 루아가 그이 곁을 끝까지 지켜 줬어요. 마지막 밤엔 둘이서 숨 노래를 낮게 불렀어요. 면허 없는 두 사람이요.
spirituality.npc.widow.monk.t: 주지 스님이 그이 장례에 오셨어요. 아무 말 없이, 제 자리 옆에 한참 앉았다 가셨어요.
spirituality.npc.cook.name: 공양주 오미
spirituality.npc.cook.greet: 배고프면 앉아요. 밥에는 면허가 없으니까.
spirituality.npc.cook.name.t: 오미예요. 이 공양간에서 스님들 밥을 지은 지 서른 해가 넘었어요. 누가 언제 밥을 남기는지, 나는 다 알아요.
spirituality.npc.cook.job.t: 새벽밥 짓고, 저녁 죽 쑤고, 그 사이엔 숭늉을 끓여요. 주지 스님은 삼 년째 밥을 반만 드세요. 배가 부르면 밤에 졸린다고요.
spirituality.npc.cook.monk.t: 삼 년 전 겨울 새벽, 주지 스님이 젊은 스님 하나를 제 가사로 싸안고 들어왔어요. 숭늉 한 솥이 다 나가도록 해가 중천에 뜰 때까지 그 곁에 앉아 있었지요. 그 봄부터 장부에 면허 번호가 붙었어요.
spirituality.npc.cook.novice.t: 이안이요? 그 아이는 밥을 남긴 적이 없어요. 예전에 그런 젊은 스님이 하나 더 있었는데, 선방에 홀로 앉은 사흘 동안 한술도 안 뜨더니 끝내 일어나지 못했지요. 몸을 추스르고는 엘리아를 떠났어요.
spirituality.npc.incense.name: 향 빚는 이 누리
spirituality.npc.incense.greet: 손에서 송진 냄새 나죠? 엘리아의 저녁 향은 다 제 손을 거쳐요.
spirituality.npc.incense.name.t: 누리예요. 송진이랑 마른 쑥을 개어 향을 빚어요. 저녁 향 때는 명상당에 들어가 불을 붙이는 데까지가 제 일이에요.
spirituality.npc.incense.job.t: 면허 있는 분들 몫으로 하루에 향 마흔 개를 빚어요. 그런데 주지 스님 몫은 삼 년째 한 개도 안 나가요. 스님은 향이 다 타고 모두 나간 뒤에야, 불 꺼진 향로 앞에 혼자 앉으시거든요.
spirituality.npc.incense.monk.t: 한번은 향로를 치우러 다시 들어갔다가 봤어요. 스님 입술이 소리 없이 움직이고 있었어요. 아이가 뜰에서 입을 벙긋거릴 때랑 똑같은 모양으로요.
spirituality.npc.incense.ritual.t: 향은 천천히 타야 좋은 향이에요. 그런데 요즘은 정해진 시간에 맞춰 빨리 타는 향만 찾으세요. 자리가 다음 사람에게 넘어가야 하니까요.
spirituality.npc.clock.name: 물시계지기 타오
spirituality.npc.clock.greet: 한 방울에 숨 열 번입니다. 면허 한 장이면 오백 방울을 앉으실 수 있습니다.
spirituality.npc.clock.name.t: 타오입니다. 명상당 물시계를 맡고 있습니다. 하루에 몇 방울이 떨어졌는지 저보다 정확히 아는 사람은 없습니다.
spirituality.npc.clock.job.t: 물이 다 떨어지면 종을 쳐서 자리를 비우게 합니다. 처음엔 너무 오래 앉은 분을 깨우려고 둔 시계였다고 들었습니다. 요즘은 다음 분을 들이려고 칩니다.
spirituality.npc.clock.breath.t: 숨을 재 보려고 한 적이 있습니다. 한 방울 동안 제 숨을 세어 보니 어떤 날은 여덟 번, 어떤 날은 열네 번이었습니다. 물은 늘 같은데 말입니다.
spirituality.npc.clock.prayer.t: 기도에도 방울 수가 정해져 있습니다. 따라 하는 기도는 백 방울, 함께하는 기도는 이백 방울. 홀로 하는 기도는 아직 아무도 끝까지 채우지 못했습니다.
spirituality.npc.carver.name: 목탁 깎는 이 케아
spirituality.npc.carver.greet: 두드려 봐. 속이 비어야 소리가 나.
spirituality.npc.carver.name.t: 케아. 기숙사 구석에서 목탁을 깎아. 면허 받은 스님한테만 하나씩 나가.
spirituality.npc.carver.job.t: 살구나무 토막 속을 사흘 동안 파내. 덜 파면 소리가 둔하고, 너무 파면 깨져. 요즘 스님들은 장부에 적힐 날짜에 맞춰 달라고 재촉하지만, 나무는 날짜를 몰라.
spirituality.npc.carver.hermit.t: 펠라 목탁은 내 스승이 깎은 거야. 지금도 서고 어딘가에 있겠지. 안 두드린 지 삼 년은 됐을 거야.
spirituality.npc.carver.ritual.t: 목탁은 박자를 맞추라고 있는 거야. 그런데 요즘은 목탁을 들었느냐로 스님인지 아닌지를 가려. 가짜 스님도 하나 들고 다니더라. 속이 꽉 막힌 걸로.
spirituality.npc.licensee.name: 면허 수행자 미온
spirituality.npc.licensee.greet: 열한 번째 갱신이 다음 달이오. 이번에도 도장은 받을 거요. 한 번도 절차를 어긴 적이 없으니.
spirituality.npc.licensee.name.t: 미온이오. 면허 번호 열하나. 엘리아에서 면허를 가장 먼저 받은 열두 사람 가운데 하나요.
spirituality.npc.licensee.job.t: 새벽 예불, 오후 독경, 저녁 향. 삼 년 동안 한 번도 빠지지 않고 앉았소. ……그런데 이상하지, 아직 아무것도 오지 않았소.
spirituality.npc.licensee.courtyard.t: 저 아이가 뜰에서 입을 벙긋거리는 걸 보았소. 무엇을 하는지는 모르겠으나, 그 아이 얼굴이 내가 선방에서 기다리던 얼굴이었소.
spirituality.npc.licensee.ritual.t: 절차는 내가 제일 잘 아오. 손 씻기 세 번, 절 세 번, 숨 세 번. 그런데 그 셋과 셋 사이에 무엇이 있어야 하는지는 아무도 적어 두지 않았소.

# --- 엘리아 단서 ---
spirituality.word.spirit.label: 영
spirituality.word.spirit.hint: 은자가 숨결 속에서 본 것. 면허는 그 영의 자리표였지만, 이제 자리표만 남고 영은 쫓겨났다.
spirituality.word.prayer.label: 기도
spirituality.word.prayer.hint: 면허 소지자만이 올릴 수 있다는 것. 그러나 옛 장부에는 면허 없이 기도하던 기록이 있다.
spirituality.word.breath.label: 숨
spirituality.word.breath.hint: 면허가 필요 없는 유일한 명상. 들이쉬고 내쉬는 것만으로 마음이 비워진다.
spirituality.word.ritual.label: 의례
spirituality.word.ritual.hint: 형식뿐인 새벽 예불과 독경. 절차가 어긋나면 면허가 거둬들여지는 마을의 법.
spirituality.fact.elia.monk.label: 주지 스님 다루
spirituality.fact.elia.monk.hint: 명상 면허를 발급하는 주지. 삼 년 전부터 명상은 자격의 일이 되었다.
spirituality.fact.elia.novice.label: 견습 스님 이안
spirituality.fact.elia.novice.hint: 삼 년째 면허 시험을 준비하는 견습. 명상당 앞방 바닥은 닦지만, 안쪽 선방에는 들어서지 못한다.
spirituality.fact.elia.hermit.label: 은자 펠라
spirituality.fact.elia.hermit.hint: 서고 그늘에 숨어 면허 없이 명상하는 옛 스님. 소리 없이 부르는 노래를 안다.
spirituality.fact.elia.healer.label: 치유사 루아
spirituality.fact.elia.healer.hint: 숨을 다스리는 법을 가르치는 치유사. 병든 사람에게 면허를 묻지 않는다.
spirituality.fact.elia.widow.label: 과부 이레
spirituality.fact.elia.widow.hint: 뜰 건너 명상당 문이 보이는 자리에서, 저녁마다 세상을 떠난 남편 몫까지 숨을 세는 과부. 옛 숨 노래를 기억한다.
spirituality.fact.elia.meditation-hall.label: 명상당
spirituality.fact.elia.meditation-hall.hint: 엘리아 북서쪽의 집. 앞방은 누구나 드나들지만, 안쪽 선방은 면허를 보여야만 열린다.
spirituality.fact.elia.library.label: 서고
spirituality.fact.elia.library.hint: 명상당의 서고. 삼백 년 치 장부가 쌓여 있고, 맨 첫 줄에는 이름 없는 순례자의 하루가 적혀 있다.
spirituality.fact.elia.courtyard.label: 명상당 뜰
spirituality.fact.elia.courtyard.hint: 명상당보다 오래된 약초 정원과 뜰. 면허 없이도 숨을 고르던 옛 자리.
spirituality.fact.elia.silent-chant.label: 소리 없는 노래
spirituality.fact.elia.silent-chant.hint: 새벽 숨 노래를 소리 없이 부르는 법. 은자가 서고 뒤 담 밑에서 부르고, 아이가 입만 벙긋거려 따라 한다.
spirituality.fact.elia.breath-song.label: 새벽의 숨 노래
spirituality.fact.elia.breath-song.hint: 숨은 산다, 떨림은 쉰다. 면허 제도 전에 아낙네들이 부르던 이른 새벽 노래.
spirituality.fact.elia.license-rule.label: 명상 면허법
spirituality.fact.elia.license-rule.hint: 삼 년 전부터 명상에는 면허가 필요하다. 면허 없는 자는 선방에 앉을 수도, 소리 내어 기도할 수도 없다.
spirituality.fact.creature.spirituality-fake-monk.label: 헌납을 요구하는 가짜 스님
spirituality.fact.creature.spirituality-fake-monk.hint: 악하다. 두건과 목탁으로 면허 없이 명상을 파는 자. 지갑을 열 때마다 더 큰 헌납을 요구한다.

# --- 엘리아 추론·위기 ---
spirituality.deduction.spirituality.sentence: 영성은 {1}을 듣고, {2}(으)로 품고, {3}(으)로 내딛는 것이다
spirituality.deduction.spirituality.hint: 주지의 면허는 의례만 남기고 마음을 잠갔다. 은자는 소리를 내지 않아야 들리는 것을, 정원지기는 사람에게 주는 물을, 치유사는 금지된 노래 한 소절을 말했다.
spirituality.crisis.license.text: 명상당 앞뜰에 마을 사람들이 모였다. 주지 다루가 면허 장부를 펼치며 외친다. 이 마을의 명상은 자격 있는 자의 것이며, 면허 없이 선방에 드는 것은 배교라고. 오늘은 견습 이안이 면허 시험을 치르는 날이지만, 그는 시험비를 내지 못해 문 앞에 서 있다. 서기관 세온은 장부를 펼치고, 치유사 루아는 손을 움켜쥐고, 은자 펠라는 서고 그늘에서 이 모든 것을 듣고 있다. 아이 소미가 숨을 죽이고, 정원지기 호레가 고개를 숙인다. 이제 그대가 나설 차례다.
spirituality.option.open-meditation.label: 은자의 소리 없는 노래를 불러 명상당의 문을 연다
spirituality.option.open-meditation.text: 그대가 앞으로 나서서, 은자에게 배운 노래를 소리 없이 부른다. 진실을 듣고, 사랑으로 품고, 용기로 내딛는 숨. 견습 이안이 숨을 보태고, 과부 이레가 그 숨을 잇는다. 정원지기 호레가 뜰의 약초를 문 앞에 놓고, 치유사 루아가 숨을 고른다. 서기관 세온이 맨 첫 장부를 꺼내, 이름 없는 순례자가 해 뜰 녘부터 질 녘까지 앉았다 간 줄을 읽는다. 참된 명상은 면허에 있지 않고, 진실과 사랑과 용기가 함께 숨 쉬는 데 있었다. 주지 다루가 장부를 내려놓고, 그의 입술이 소리 없이 움직인다. 선방 문이 처음으로 면허 없이 열린다. 그날부터 엘리아는 누구든 조용히 앉을 수 있는 마을이 된다.
spirituality.option.exile-monk.label: 면허 장부의 거둬들임 기록을 낭독하고 주지를 내친다
spirituality.option.exile-monk.text: 그대가 서기관 세온의 장부를 꺼내 낭독한다. 삼 년 사이 면허값은 세 배가 되었고, 면허 없는 자의 기도는 모두 금지되었다. 새 장부에는 이름과 서명과 갱신일만 남고, 그들이 올린 기도는 한 줄도 적혀 있지 않다. 주지 다루는 장부를 덮고 말없이 마을을 떠난다. 명상당의 문은 열리지만, 사람들은 여전히 노래를 두려워한다. 엘리아는 면허를 벗었지만, 아직 참된 영성을 세우는 법은 배우지 못했다.

# --- 엘리아 능력·생물 ---
spirituality.ability.mind.name: 고요한 마음
spirituality.creature.fake-monk.name: 헌납을 요구하는 가짜 스님

# --- 겸손의 마을 헤론 (M4 Task 40) ---
town.heron.name: 헤론
humility.music.title: 헤론의 숨결

humility.npc.silent-elder.name: 침묵하는 장로
humility.npc.silent-elder.greet: ……침묵.
humility.npc.silent-elder.name.t: 헤론에서는 이름을 묻지 않는다. ……내 이름은 오래전 이 예배당에 두고 왔다. 그대는 어떠한가, 제 이름을 마지막으로 소리 내어 말한 것이 언제였는가.
humility.npc.silent-elder.job.t: 이 예배당과 침묵의 법을 지킨다. 헤론에서는 누구도 제 이름을 입에 올리지 않는다.
humility.npc.silent-elder.silence.t: 침묵은 소리가 아닌 자리다.
humility.npc.silent-elder.wordname.t: 이름은 말하는 것이 아니라 지키는 것이다. ……그렇게 가르쳐 왔다.
humility.npc.silent-elder.chapel.t: 예배당이다. 말없이 세워진.
humility.npc.silent-elder.hermit.t: 같은 해에 이 예배당 문을 들어섰다. 그는 나갔고, 나는 남았다.
humility.npc.silent-elder.listening.t: 듣는 법을 가르친 적은 없다. ……가르쳤어야 했다.

humility.npc.listener.name: 듣는 이
humility.npc.listener.greet: ……듣겠다.
humility.npc.listener.name.t: 이름은 들은 적이 없다. 귀는 늘 열린 데, 불러 줄 이가 없구나.
humility.npc.listener.job.t: 듣는 일을 한다. 침묵 없이는 아무것도 들리지 않는다.
humility.npc.listener.listening.t: 듣는 것은 채우는 것이 아니라 비우는 것이다.
humility.npc.listener.three.t: 비우면 셋이 들린다.
humility.npc.listener.silence.t: 조용히.
humility.npc.listener.elder.t: 장로도 온다. 아무 말 없이 앉았다 간다.
humility.npc.listener.wordname.t: 이름은 아무도 들려주지 않는다.

humility.npc.wellkeeper.name: 우물지기
humility.npc.wellkeeper.greet: 우물은 말이 없다.
humility.npc.wellkeeper.name.t: 이름을 묻지 마라. 물은 이름 없이도 차오르니, 나도 그렇게 산다.
humility.npc.wellkeeper.job.t: 우물을 지킨다.
humility.npc.wellkeeper.wordname.t: 물에는 이름이 없다.
humility.npc.wellkeeper.silence-rule.t: 이름을 대지 못하는 규칙이다. 물이 이름을 몰라도 차오르듯.
humility.npc.wellkeeper.listening.t: 두레박이 물에 닿는 소리. 그것만은 법도 막지 못했다.
humility.npc.wellkeeper.silence.t: 우물 바닥은 늘 고요하다. 위에서 무슨 일이 있어도.

humility.npc.child.name: 마을 아이
humility.npc.child.greet: ……나도 조용히 하래요.
humility.npc.child.name.t: 엄마가 숨으로만 말해 줬는데…… 잘 못 들었어요. 그래서 없는 거 같아요.
humility.npc.child.job.t: 노래를 외워요. 소리는 안 내고 숨으로만요. 들이쉬고, 참고, 내쉬고.
humility.npc.child.listening.t: 귀를 기울이면 들려요.
humility.npc.child.silent-chant.t: 숨으로 부르는 노래요. 들리지 않아도 불려요.
humility.npc.child.wordname.t: 내 이름이요? 엄마가 귀에 대고 숨으로만 말해 줬어요. 그래서 잘 안 들렸어요.
humility.npc.child.hermit.t: 은자 할아버지는 숨을 세다가 가끔 졸아요. 그러면 처음부터 다시 세요.

humility.npc.librarian.name: 서고지기
humility.npc.librarian.greet: 책은 말이 없네. ……들어오게.
humility.npc.librarian.name.t: 서고에는 이름이 한 글자도 없다. 나도 그 책들처럼 비어 있네.
humility.npc.librarian.job.t: 빈 페이지를 모으네. 글자가 남은 건 단 한 장, 그것도 셋이라는 한 낱말뿐일세.
humility.npc.librarian.three.t: 무엇이 셋인지는 적혀 있지 않네. ……다른 마을들은 진실, 사랑, 용기라 읽는다더군. 이 마을은 그 셋을 비워 두는 쪽을 택했고.
humility.npc.librarian.listening.t: 읽기보다 듣기일세. 빈 종이는 귀로 읽는 것이니.
humility.npc.librarian.elder.t: 장로도 가끔 와서 그 한 장을 보고 가네. 오래, 아무 말 없이.
humility.npc.librarian.wordname.t: 이 서고에는 이름 적힌 책이 한 권도 없네. 지은이도, 빌려 간 이도.

humility.npc.gardener.name: 숲지기
humility.npc.gardener.greet: 나무는 이름을 부르지 않는다.
humility.npc.gardener.name.t: 숲은 이름을 부르지 않는다. 나도 나무처럼 말없이 서 있다.
humility.npc.gardener.job.t: 이름 없는 숲을 가꾼다.
humility.npc.gardener.listening.t: 숲의 말은 소리가 아니라 숨이다.
humility.npc.gardener.wordname.t: 이름을 붙이면 잎이 진다.
humility.npc.gardener.silence.t: 숲은 조용하지 않다. 사람이 조용할 뿐이다.
humility.npc.gardener.grove.t: 나무마다 심은 이가 있었다. 아무도 그 이름을 모른다.

humility.npc.cook.name: 밥하는 이
humility.npc.cook.greet: ……앉아라. 밥은 조용히 먹는 거다.
humility.npc.cook.name.t: 이름 부르면 밥 식는다. 여기서는 그릇 앞에 조용히 앉기만 한다.
humility.npc.cook.job.t: 밥을 짓는다. 이름을 부를 수 없으니, 그릇은 늘 앉던 자리에 놓아 둔다.
humility.npc.cook.silence.t: 솥이 끓기 전에 뚜껑을 연다. 여기서는 솥도 소리를 내면 안 되니까.
humility.npc.cook.wordname.t: 그릇 하나가 겨울부터 비어 있다. 그 자리는 아직 치우지 않았다.
humility.npc.cook.novice.t: 수련하는 애가 제일 늦게, 제일 조용히 먹는다. 배가 고파도.

humility.npc.novice.name: 수련 중인 이
humility.npc.novice.greet: ……아직 수련 중이라.
humility.npc.novice.name.t: 아직 이름을 잊지 못했다. 잊는 것이 끝나면 비로소 말할 수 있을 텐데.
humility.npc.novice.job.t: 예배당에서 침묵을 배운다. 바닥 닦는 소리까지 내지 않는 것이 첫 수련이다.
humility.npc.novice.silence.t: 입을 다물면 귀가 열린다.
humility.npc.novice.wordname.t: 이름을 잊어야 한다고 배웠다.
humility.npc.novice.hermit.t: 은자님도 예전에는 이 예배당에 계셨다고 들었다. 왜 나가셨는지는 아무도 말하지 않는다.
humility.npc.novice.listening.t: 아직은 듣는 것보다 참는 것이 더 많다.

humility.npc.hermit.name: 은자
humility.npc.hermit.greet: ……조용히. 그 소리, 들리지 않는가.
humility.npc.hermit.name.t: 이름은 예배당 안에 두고 나왔다. 밖에서 부르면 메아칠 뿐이다.
humility.npc.hermit.job.t: 숨어서 숨을 센다. 셀 때마다 소리 없는 노래가 한 소절씩 지나간다.
humility.npc.hermit.silence.t: 침묵은 공허가 아니라 자리다.
humility.npc.hermit.three.t: 셋이 다 비워진 것이 겸손이다.
humility.npc.hermit.listening.t: 숲 너머 남쪽 담 끝에 고요한 파수꾼이 있다. 악하지 않으나 소리를 막는다.
humility.npc.hermit.elder.t: 그 사람도 예전엔 웃음소리가 컸다. 자리가 사람을 조용하게 만든다.
humility.npc.hermit.chapel.t: 나도 그 안에 있었다. 침묵은 안에서보다 밖에서 더 잘 들린다.

humility.npc.widow.name: 과부
humility.npc.widow.greet: ……남편 이름이 자꾸 흐려진다.
humility.npc.widow.name.t: 남편 이름도 흐려지는데, 제 이름은 더 일러요.
humility.npc.widow.job.t: 잊어 가는 이름을 지킨다. 그 사람은 평생 제 이름을 입에 올리지 않았고, 나도 끝내 소리 내어 부르지 못했다.
humility.npc.widow.wordname.t: 이름은 무덤에 같이 묻었다. 비석은 비워 두는 법이라.
humility.npc.widow.listening.t: 들어 줄 이가 있다면, 한 번쯤은 소리 내어 불러 볼 텐데.
humility.npc.widow.chapel.t: 예배당 벽돌은 그 사람이 쌓았다. 한 장씩, 아무 말 없이.
humility.npc.widow.elder.t: 장로께 그 이름을 물었다. 그분도 모르셨다.
humility.npc.stonecutter.name: 비석장이
humility.npc.stonecutter.greet: 돌 깎는 소리는 괜찮대. 말이 아니니까.
humility.npc.stonecutter.name.t: 이름? 내가 깎는 돌에도 없는 걸 나한테 묻네.
humility.npc.stonecutter.job.t: 비석을 깎아. 반들반들하게, 아무것도 새기지 않고. 그게 여기 법이야.
humility.npc.stonecutter.wordname.t: 겨울에 과부가 와서 한 글자만 새겨 달라더라. 못 해 줬어. 지금도 그 돌을 보면 손이 근질거려.
humility.npc.stonecutter.elder.t: 봄밤에 장로가 그 무덤 앞에 오래 서 있더라. 지팡이로 비석을 한 번 짚고 갔어. 뭘 찾는 사람처럼.
humility.npc.lampkeeper.name: 등잔지기
humility.npc.lampkeeper.greet: 예배당 등잔이 꺼지지 않게 지키고 있습니다. 불은 소리 없이 타니, 이곳에 어울립니다.
humility.npc.lampkeeper.name.t: 이름은 받은 적이 없습니다. 등잔지기라고 하시면 됩니다.
humility.npc.lampkeeper.job.t: 밤새 심지를 자르고 기름을 붓습니다. 예배당이 어두워진 적은 한 번도 없습니다.
humility.npc.lampkeeper.elder.t: 겨울부터 장로님이 밤마다 제단 앞에 앉아 계십니다. 입술이 움직이는데, 기도문의 모양은 아닙니다.
humility.npc.lampkeeper.chapel.t: 이 예배당에는 말이 없지만, 저는 등잔 하나하나를 놓인 자리로 압니다. 이곳 사람들도 서로를 그렇게 압니다.
humility.npc.tagcarver.name: 자리패 깎는 이
humility.npc.tagcarver.greet: 자리패 하나 들이게. 여기선 이름 대신 이걸 목에 걸지.
humility.npc.tagcarver.name.t: 이름은 팔리지 않네. 자리는 팔리지.
humility.npc.tagcarver.job.t: 자리패를 깎네. 우물지기, 서고지기, 수련 중인 이…… 자리가 새로 날 때마다 일감이 늘지.
humility.npc.tagcarver.wordname.t: 이름이 돌아오면 내 장사도 끝이겠지. ……그래도 그날이 오면, 제일 먼저 내 이름부터 패에 새길 걸세.
humility.npc.tagcarver.silence.t: 조용한 마을이 장사하기는 좋네. 흥정이 없으니까. 다들 손가락으로 값을 치르니 말일세.
humility.npc.mother.name: 아이 어머니
humility.npc.mother.greet: ……해 질 녘이면 손뼉을 두 번 쳐요. 우리 애 부르는 소리예요.
humility.npc.mother.name.t: 제 이름은 아이도 몰라요. 저도 우리 엄마 이름을 몰랐고요.
humility.npc.mother.job.t: 아이를 키워요. 이름을 불러 줄 수 없는 아이를요.
humility.npc.mother.wordname.t: 아이가 태어난 밤에, 귀에 대고 숨으로만 이름을 말해 줬어요. 그 애가 기억하는지는 몰라요.
humility.npc.mother.listening.t: 다른 집 손뼉 소리랑 섞이면 애들이 엉뚱한 집으로 가요. 그래서 제 손뼉은 조금 느려요.
humility.npc.sweeper.name: 비질하는 이
humility.npc.sweeper.greet: 발소리로 알았소. 처음 듣는 걸음이구려.
humility.npc.sweeper.name.t: 이름은 모르오. 대신 이 마을 사람들 발소리는 다 아오.
humility.npc.sweeper.job.t: 광장을 쓰오. 비질 소리는 말이 아니라서 아무도 막지 않소.
humility.npc.sweeper.elder.t: 장로 걸음이 겨울부터 느려졌소. 지팡이 소리가 걸음보다 먼저 온다오.
humility.npc.sweeper.listener.t: 듣는 이 앞에 다녀온 사람은 걸음이 가벼워지오. 무엇을 내려놓고 오는지는 모르겠소.

# --- 헤론 단서 ---
humility.word.listening.label: 듣기
humility.word.listening.hint: "채우지 않고 비우는 일. 말이 멎은 자리에서 귀가 열릴 때 비로소 일어나는 것."
humility.word.three.label: 셋
humility.word.three.hint: "헤론 서고의 빈 페이지가 가리키는 것. 겸손은 그것들을 모두 비워 둔 자리에서 시작한다."
humility.word.name.label: 이름
humility.word.name.hint: 헤론이 입에 올리지 못하게 한 것. 오래 부르지 않으면 주인에게서도 흐려진다.
humility.fact.heron.silent-elder.label: 침묵하는 장로
humility.fact.heron.silent-elder.hint: 헤론의 말 없는 법을 지키는 장로. 이름을 묻지 않고, 이름을 요구한다.
humility.fact.heron.listener.label: 듣는 이
humility.fact.heron.listener.hint: 광장 우물가에 말없이 앉아 있는 이. 헤론에서 가장 오래 귀를 기울여 온 사람.
humility.fact.heron.novice.label: 수련 중인 이
humility.fact.heron.novice.hint: 말을 거두는 수련을 하는 젊은이. 이름을 잊는 법부터 배우고 있다.
humility.fact.heron.hermit.label: 은자
humility.fact.heron.hermit.hint: 광장 서쪽 나무 그늘에 숨듯 앉아 숨을 세는 은자. 말이 그친 곳을 '자리'라고 부른다.
humility.fact.heron.chapel-of-silence.label: 침묵 예배당
humility.fact.heron.chapel-of-silence.hint: 말없이 세워진 예배당. 장로가 지키는 헤론의 중심.
humility.fact.heron.library.label: 빈 서고
humility.fact.heron.library.hint: 빈 페이지만 모아 둔 서고. 글자가 남은 종이는 단 한 장뿐이다.
humility.fact.heron.well.label: 말없는 우물
humility.fact.heron.well.hint: 이름 없이도 차오르는 우물. 헤론 사람들은 이 물을 보며 사람도 이름 없이 살 수 있다고 믿었다.
humility.fact.heron.grove.label: 이름 없는 숲
humility.fact.heron.grove.hint: 이름을 붙이면 잎이 진다는 숲. 나무는 부르지 않아도 서로 안다.
humility.fact.heron.silent-chant.label: 숨의 노래
humility.fact.heron.silent-chant.hint: 소리 내지 않고 부르는 노래. 아이와 은자가 아는 유일한 노래.
humility.fact.heron.breathing-rhythm.label: 숨결의 박자
humility.fact.heron.breathing-rhythm.hint: 헤론이 세는 유일한 박자. 들이쉬고, 머무르고, 내쉰다.
humility.fact.heron.silence-rule.label: 침묵의 규칙
humility.fact.heron.silence-rule.hint: "헤론의 법. 아무도 자기 이름을 대지 못한다. 고요가 모든 말을 삼킨다."
humility.fact.heron.real-name.label: 잃어버린 내 이름
humility.fact.heron.real-name.hint: 장로가 되물은 것. 이방인으로만 불려 온 사이, 마지막으로 제 이름을 소리 내어 말한 게 언제였는지 떠오르지 않는다.
humility.fact.creature.humility-silencer.label: 침묵의 파수꾼
humility.fact.creature.humility-silencer.hint: "악하지 않다. 소리를 막는 존재일 뿐. 고요를 지키는 것이 그 일이다."

# --- 헤론 추론·위기 ---
humility.deduction.humility.sentence: 겸손은 {1} 앞에 자신을 비우고, {2}(으)로 {3}을 맞아들이는 자리다
humility.deduction.humility.hint: "헤론은 원리를 모두 비워 둔 마을. 말이 멎은 자리에서 무엇이 열리는가. 서고의 빈 페이지가 단서가 된다."
humility.crisis.name.text: 침묵 예배당 앞에 마을 사람들이 모였다. 장로가 새겨진 이름을 다 깎아 낸 지팡이를 짚고 선다. "이 마을에 남은 법 하나를 거두려 한다. 이름을 잠근 지 오래, 그러나 잠근 쪽이 우리를 더 가두었다. 그대, 이방인. 그대의 이름을 말하여라. 누군가 먼저 말해야 우리도 따라 말할 수 있다." 모두가 숨을 죽인다. 이제 그대가 입을 열 차례다.
humility.option.speak-name.label: 스스로의 이름을 말해 침묵의 법을 거둔다
humility.option.speak-name.text: 그대가 앞으로 나서 이름을 말한다. 예배당이 그 이름을 울린다. 사람들이 조용히 그 이름을 따라 부르고, 과부의 입술에서 처음으로 소리가 난다. 장로가 지팡이를 내려놓는다. "이름은 지키려고 있는 것이 아니라, 서로 부르라고 있는 것이다." 헤론의 침묵은 남의 말을 듣기 위한 예법으로 돌아간다. 겸손은 셋을 비워 두는 자리이되, 비워 둔 뒤 다시 이름을 부르는 자리다.
humility.option.stay-silent.label: 침묵을 지키며 이름을 삼킨다
humility.option.stay-silent.text: 그대는 이름을 삼키고 고개를 숙인다. 장로가 오래도록 그대를 바라본다. "……그대의 침묵도 거짓은 아니다. 그러나 그 침묵이 이름을 가두는 한, 헤론은 듣는 마을이 아니라 입 다문 마을로 남는다." 마을은 조용히 흩어진다. 법은 남지만, 은자의 숨의 노래만은 소리 없이 마을을 돈다.

