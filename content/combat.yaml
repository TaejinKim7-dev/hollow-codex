# 전투 규칙 수치(C-2). 규칙 설명은 docs/superpowers/plans/2026-10-29-combat-c2-terrain-chain.md.
direction:          # 대상이 바라보는 방향에 대한 공격 위치별 피해 배율
  front: 1
  side: 1.25
  back: 1.5
  vsAllies: false   # 아군도 방향 보정을 받는가(기본: 적만 측면·배후에 약하다)
chain:
  ratio: 0.5        # 연계 추가타 = 그 유닛의 정상 피해 × ratio
  enemies: false    # 적도 연계하는가(난이도는 C-5에서)
morale:             # 마음: 피해·옆/등 타격·고립으로 줄고, 비악 적은 최대치의 persuadeRatio 이하에서 설득할 수 있다(단서를 알면 언제나). 악한 적은 0이면 퇴각
  weakLoss: 1       # 옆·등 타격이면 추가로 잃는 마음
  isolationLoss: 1  # 라운드가 바뀔 때 주변 2칸 안에 다른 적이 없으면 잃는 마음
  persuadeRatio: 0.5
momentum:           # 기세: 아군이 약점(옆·등)을 치거나 연계·처치를 하면 쌓이고, 가득 차면 필살(special) 1회
  max: 6
  weak: 1           # 옆·등 타격 1회당
  chain: 1          # 연계 추가타 1회당
  defeat: 1         # 처치 1회당
  specialMultiplier: 2   # 필살 피해 = 정상 피해 × 이 값
  splashRatio: 0.5       # 대상 옆 다른 적이 받는 비율(필살 피해 기준)
terrain:            # 전투 격자 타일 글자 → 그 칸에 선 유닛이 받는 피해에서 뺄 값(최소 피해 1)
  h: { defense: 1 } # 큰 풀
