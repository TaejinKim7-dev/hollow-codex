# 타일 시트: Kenney Tiny Town/Tiny Dungeon (CC0), 192×176 → 16×16 타일 12열.
sheets:
  town: { file: kenney-tiny-town.png, columns: 12 }
  dungeon: { file: kenney-tiny-dungeon.png, columns: 12 }
  walls: { file: walls32.png, columns: 8, tile: 32 }   # 코드로 그린 32px 벽·문·서고 타일(scripts/assets/make-wall-sheet.py)
tiles:
  ".": { sprite: [town, 1], walk: 1 }
  ",": { sprite: [town, 4], walk: 2 }
  ":": { sprite: [walls, 4], walk: 1 }
  "=": { sprite: [town, 65], walk: 1 }
  "~": { sprite: [town, 77], walk: null }
  T: { sprite: [town, 5], walk: null }
  "^": { sprite: [walls, 6], walk: null }
  "#": { sprite: [walls, 0], walk: null }
  "+": { sprite: [walls, 1], walk: 1 }
  o: { sprite: [walls, 7], walk: null }
  L: { sprite: [town, 115], walk: null }
  S: { sprite: [walls, 7], walk: 1 }
  "_": { sprite: [walls, 3], walk: 1 }
  "%": { sprite: [walls, 2], walk: null }
  ">": { sprite: [walls, 5], walk: 1 }
  "<": { sprite: [walls, 5], walk: 1 }
# 새 그림 칸(땅 종류 + 물건). 옛 16px 칸과 한 지도에서 섞여 쓸 수 있다.
  g: { ground: grass, walk: 1 }
  h: { ground: grass, walk: 2 }
  s: { ground: grass, walk: 1 }
  t: { ground: grass, walk: null, object: obj.tree-oak }
  p: { ground: path, walk: 1 }
  w: { ground: water, walk: null }
  b: { ground: water, walk: 1 }
  c: { ground: stone, walk: 1 }
player: char.stranger-B-navy
